<script>
/* ═══════════════════════════════════════════════════════════════════════
   FALLEN MOON — a Stephens Arcade 3D adventure. Slice I: Brightharbor.
   three.js r147 (inlined above). Pi 5 target: 1280x720@60.
   The moon came apart; its eight phases fell. The sun is stuck at noon.
   Everything below is built in code — no assets.
   NOTE: the game spans several concatenated top-level <script> blocks —
   top-level const/let/function share the page scope across blocks.
   ═══════════════════════════════════════════════════════════════════════ */
const BOOT_T0 = performance.now();

/* ───────────────────────── config / flags ───────────────────────── */
const VW = 1280, VH = 720;
const DT = 1 / 60;

const QS = new URLSearchParams(location.search);
let LOWFX = false;
try {
  if (QS.get('fx') === 'low') { LOWFX = true; localStorage.setItem('arcade_lowfx', '1'); }
  else if (QS.get('fx') === 'full') { localStorage.setItem('arcade_lowfx', '0'); }
  else { LOWFX = localStorage.getItem('arcade_lowfx') === '1'; }
} catch (e) { LOWFX = false; }
// ?turbo=N (testing only): N real sim ticks per rAF. Same sim, same inputs.

const SAVE_KEY = 'fallenmoon_save_v1';

/* ───────────────────────── math utils ───────────────────────── */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const TAU = Math.PI * 2;
function angLerp(a, b, t) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU;
  return a + d * t;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(ix, iz) {
  let n = (ix * 374761393 + iz * 668265263 + 1013904223) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return (((n ^ (n >>> 16)) >>> 0) / 4294967295) * 2 - 1;
}
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz);
  const c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return lerp(lerp(a, b, sx), lerp(c, d, sx), sz);
}
function noise2(x, z) {
  return vnoise(x, z) + 0.5 * vnoise(x * 2.13 + 7.3, z * 2.13 - 3.1);
}
// color helpers — [r,g,b] 0..1 arrays
function col(hex) { return [((hex >> 16) & 255) / 255, ((hex >> 8) & 255) / 255, (hex & 255) / 255]; }
function mix3(a, b, t, out) {
  out = out || [0, 0, 0];
  out[0] = a[0] + (b[0] - a[0]) * t;
  out[1] = a[1] + (b[1] - a[1]) * t;
  out[2] = a[2] + (b[2] - a[2]) * t;
  return out;
}

/* ───────────────────────── DOM handles ───────────────────────── */
const el = id => document.getElementById(id);
const stage = el('stage');
const dlgBox = el('dlg'), dlgName = el('dlgName'), dlgText = el('dlgText');
const promptEl = el('prompt'), questEl = el('questLine');

/* letterbox scaler */
function fitStage() {
  const s = Math.min(window.innerWidth / VW, window.innerHeight / VH);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;

/* ───────────────────────── input layer ─────────────────────────
   Unified pad + keyboard. Edges are latched per rAF (gatherInput) and
   consumed by the FIRST sim tick that runs after the latch.            */
const keys = Object.create(null);
window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (!e.repeat) {
    keys[e.code] = 2;                 // 2 = fresh edge this frame
    kickAudio();
  } else if (!keys[e.code]) keys[e.code] = 1;
});
window.addEventListener('keyup', e => { keys[e.code] = 0; });
const kDown = c => !!keys[c];
function kEdge(c) { if (keys[c] === 2) { keys[c] = 1; return true; } return false; }

const IN = {
  mx: 0, my: 0,             // raw move vector (pre camera rotation), unit-ish
  cx: 0, cy: 0,             // camera orbit axes (right stick / arrows), per-frame
  atk: false, atkHeld: false,
  sprintHeld: false,        // v3: ○ / Shift held = SPRINT (dodge-roll removed)
  jump: false,              // v3: □ / Space edge = JUMP
  pulse: false, pause: false,
  up: false, down: false, confirm: false,
  back: false,              // v4: ○ edge / Escape — "no" in confirm modals
  any: false,
};
let prevLy = 0;
function gatherInput() {
  IN.mx = 0; IN.my = 0;
  IN.cx = 0; IN.cy = 0;
  IN.atkHeld = false; IN.sprintHeld = false;
  let lx = 0, ly = 0;
  // keyboard movement (WASD; arrows are the no-mouse CAMERA fallback)
  if (kDown('KeyA')) lx -= 1;
  if (kDown('KeyD')) lx += 1;
  if (kDown('KeyW')) ly -= 1;
  if (kDown('KeyS')) ly += 1;
  if (kDown('ArrowLeft')) IN.cx -= 1;
  if (kDown('ArrowRight')) IN.cx += 1;
  if (kDown('ArrowUp')) IN.cy -= 1;
  if (kDown('ArrowDown')) IN.cy += 1;
  if (kDown('KeyJ')) IN.atkHeld = true;
  // v3: Shift (or K) held = sprint; Space = jump
  if (kDown('ShiftLeft') || kDown('ShiftRight') || kDown('KeyK')) IN.sprintHeld = true;
  // keyboard edges
  if (kEdge('KeyJ')) { IN.atk = true; IN.confirm = true; IN.any = true; }
  if (kEdge('Space')) { IN.jump = true; IN.any = true; }
  if (kEdge('KeyL')) { IN.pulse = true; IN.any = true; }
  if (kEdge('Escape') || kEdge('KeyP')) { IN.pause = true; IN.back = true; IN.any = true; }
  if (kEdge('KeyW') || kEdge('ArrowUp')) { IN.up = true; IN.any = true; }
  if (kEdge('KeyS') || kEdge('ArrowDown')) { IN.down = true; IN.any = true; }
  if (kEdge('Enter')) { IN.confirm = true; IN.any = true; }
  // gamepad (logical slot 0) — guarded, house rules
  if (window.ArcadeController) {
    const p = ArcadeController.pad(0);
    if (p && p.connected) {
      const ax = p.axis('lx') || 0, ay = p.axis('ly') || 0;
      lx += ax; ly += ay;
      // right stick = camera orbit (deadzoned)
      const rx = p.axis('rx') || 0, ry = p.axis('ry') || 0;
      if (Math.abs(rx) > 0.16) IN.cx += rx;
      if (Math.abs(ry) > 0.16) IN.cy += ry;
      if (p.button('left')) lx -= 1;
      if (p.button('right')) lx += 1;
      if (p.button('up')) ly -= 1;
      if (p.button('down')) ly += 1;
      if (p.button('south')) IN.atkHeld = true;
      if (p.button('east')) IN.sprintHeld = true;            // v3: ○ hold = SPRINT
      if (p.justPressed('south')) { IN.atk = true; IN.confirm = true; IN.any = true; }
      if (p.justPressed('east')) { IN.back = true; IN.any = true; }   // v4: ○ edge = back
      if (p.justPressed('west')) { IN.jump = true; IN.any = true; }   // v3: □ = JUMP
      if (p.justPressed('north')) { IN.pulse = true; IN.any = true; }
      if (p.justPressed('start')) { IN.pause = true; IN.any = true; }
      if (p.justPressed('up') || (prevLy > -0.5 && ay <= -0.5)) { IN.up = true; IN.any = true; }
      if (p.justPressed('down') || (prevLy < 0.5 && ay >= 0.5)) { IN.down = true; IN.any = true; }
      prevLy = ay;
      if (IN.any) kickAudio();
    }
  }
  const m = Math.hypot(lx, ly);
  if (m > 0.001) {
    const s = m > 1 ? 1 / m : 1;
    IN.mx = lx * s; IN.my = ly * s;
  }
}
function clearEdges() {
  IN.atk = IN.jump = IN.pulse = IN.pause = false;
  IN.up = IN.down = IN.confirm = IN.back = IN.any = false;
}
// tap-to-advance-dialogue (direct manipulation — coexists with touchpad)
stage.addEventListener('pointerdown', () => {
  kickAudio();
  if (state === 'dialog' || state === 'tbc') IN.confirm = true;
});

/* ── free-look camera inputs (consumed by updateCamera in p5) ──
   mouse-look: pointer lock on click during play (Esc exits, as usual).
   touch: drag anywhere on the right 60% of the screen orbits the camera —
   a direct-manipulation gesture that coexists with the injected touchpad. */
const CAMIN = { mdx: 0, mdy: 0, tdx: 0, tdy: 0, touching: false };
const glCanvas = el('gl');
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement === glCanvas) {
    CAMIN.mdx += e.movementX || 0;
    CAMIN.mdy += e.movementY || 0;
  }
});
stage.addEventListener('click', () => {
  if (state === 'play' && document.pointerLockElement !== glCanvas) {
    try {
      const r = glCanvas.requestPointerLock();
      if (r && r.catch) r.catch(() => {});
    } catch (e) {}
  }
});
// touch camera drag — window-level so it works over HUD; skips the touchpad
// overlay's own controls (they handle their touches) and the left stick zone.
const camTouch = { id: -1, x: 0, y: 0 };
function touchpadOwns(t) {
  const n = t && t.target;
  return !!(n && n.closest && n.closest('#__arcade_touchpad'));
}
window.addEventListener('touchstart', e => {
  if (camTouch.id >= 0) return;
  for (const t of e.changedTouches) {
    if (touchpadOwns(t)) continue;
    if (t.clientX < window.innerWidth * 0.4) continue;   // right 60% only
    camTouch.id = t.identifier; camTouch.x = t.clientX; camTouch.y = t.clientY;
    CAMIN.touching = true;
    break;
  }
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (camTouch.id < 0) return;
  for (const t of e.changedTouches) {
    if (t.identifier !== camTouch.id) continue;
    CAMIN.tdx += t.clientX - camTouch.x;
    CAMIN.tdy += t.clientY - camTouch.y;
    camTouch.x = t.clientX; camTouch.y = t.clientY;
  }
}, { passive: true });
function endCamTouch(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === camTouch.id) { camTouch.id = -1; CAMIN.touching = false; }
  }
}
window.addEventListener('touchend', endCamTouch, { passive: true });
window.addEventListener('touchcancel', endCamTouch, { passive: true });
function rumble(opts) {
  if (window.ArcadeController && ArcadeController.rumble) {
    try { ArcadeController.rumble(0, opts); } catch (e) {}
  }
}

/* ───────────────────────── audio (all synth, lazy ctx) ───────────────────────── */
let AC = null, master = null, heatGain = null, shadeGain = null, heatLFO = null;
let musicBoxT = 0, padOsc = [];
function kickAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { return; }
  master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
  // heat hum: looped brown noise → lowpass, slow throb
  const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 0.4;
  heatGain = AC.createGain(); heatGain.gain.value = 0.0;
  src.connect(lp); lp.connect(heatGain); heatGain.connect(master);
  src.start();
  heatLFO = AC.createOscillator(); heatLFO.frequency.value = 0.13;
  const lg = AC.createGain(); lg.gain.value = 0.012;
  heatLFO.connect(lg); lg.connect(heatGain.gain); heatLFO.start();
  // shade pad: two soft detuned sines
  shadeGain = AC.createGain(); shadeGain.gain.value = 0.0; shadeGain.connect(master);
  [110, 164.8, 220.5].forEach((f, i) => {
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = AC.createGain(); g.gain.value = [0.028, 0.015, 0.009][i];
    o.connect(g); g.connect(shadeGain); o.start();
    padOsc.push(o);
  });
}
function tone(freq, t0, dur, vol, type, dest, glideTo) {
  const o = AC.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest || master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noiseBurst(t0, dur, vol, f0, f1, q, type) {
  const len = Math.max(1, (AC.sampleRate * dur) | 0), buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = type || 'bandpass'; f.Q.value = q || 1;
  f.frequency.setValueAtTime(f0, t0);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0); src.stop(t0 + dur + 0.02);
}
const SFX = {
  // the swoosh: filtered noise sweep + a faint glass chime (it's moonglass)
  sword() { if (!AC) return; const t = AC.currentTime;
    noiseBurst(t, 0.16, 0.22, 700, 3600, 1.6);
    noiseBurst(t + 0.015, 0.1, 0.08, 2200, 5200, 2.2);
    tone(1975, t + 0.03, 0.22, 0.028, 'sine');
    tone(2960, t + 0.05, 0.16, 0.014, 'sine'); },
  swing3() { if (!AC) return; const t = AC.currentTime;

    tone(1400, t + 0.02, 0.2, 0.05, 'sine', null, 2400);

  draw() { if (!AC) return; const t = AC.currentTime;

    tone(1319, t + 0.03, 0.5, 0.05, 'sine');
    tone(2637, t + 0.08, 0.4, 0.03, 'sine');
    tone(3951, t + 0.14, 0.3, 0.015, 'sine'); },
  chirp() { if (!AC) return; const t = AC.currentTime;
    tone(2400, t, 0.07, 0.06, 'square', null, 3300);
    tone(2900, t + 0.09, 0.06, 0.05, 'square', null, 3800); },
  chime(mul) { if (!AC) return; const t = AC.currentTime; const f = 880 * (mul || 1);
    tone(f, t, 0.7, 0.09, 'sine'); tone(f * 2.76, t, 0.5, 0.035, 'sine');
    tone(f * 4.1, t + 0.03, 0.35, 0.02, 'sine'); },
  glassPulse(str) { if (!AC) return; const t = AC.currentTime;
    const v = 0.05 + 0.11 * str;
    tone(660, t, 0.8, v, 'sine'); tone(1320, t + 0.05, 0.7, v * 0.5, 'sine');
    tone(1980, t + 0.1, 0.6, v * 0.25, 'sine'); },
  hit() { if (!AC) return; const t = AC.currentTime;
    // impact: spark crack + a CRUNCH layer (v3 — shell contact must be

    noiseBurst(t, 0.08, 0.22, 2400, 900, 1);
    noiseBurst(t + 0.008, 0.07, 0.2, 3400, 1100, 2.4);
    noiseBurst(t + 0.03, 0.05, 0.12, 900, 500, 1.6);
    tone(220, t, 0.1, 0.12, 'triangle');
    tone(88, t, 0.14, 0.16, 'sine', null, 55); },
  clawHit() { if (!AC) return; const t = AC.currentTime;
    noiseBurst(t, 0.12, 0.25, 1800, 500, 1); tone(150, t, 0.16, 0.16, 'triangle'); },
  hurt() { if (!AC) return; const t = AC.currentTime;
    tone(180, t, 0.25, 0.2, 'triangle', null, 90); noiseBurst(t, 0.12, 0.12, 500, 200, 1); },
  jump() { if (!AC) return; const t = AC.currentTime;
    noiseBurst(t, 0.14, 0.06, 420, 980, 0.9);
    tone(300, t, 0.14, 0.035, 'sine', null, 470); },
  land(hard) { if (!AC) return; const t = AC.currentTime;
    noiseBurst(t, 0.09, hard ? 0.09 : 0.05, 420, 240, 0.8, 'lowpass');
    tone(120, t, 0.09, hard ? 0.07 : 0.04, 'sine', null, 80); },
  step(sand) { if (!AC) return;
    noiseBurst(AC.currentTime, 0.045, sand ? 0.028 : 0.02, sand ? 500 : 900, sand ? 350 : 600, 0.7); },
  click() { if (!AC) return; const t = AC.currentTime;
    noiseBurst(t, 0.03, 0.1, 2600, 2000, 3); noiseBurst(t + 0.07, 0.03, 0.08, 3100, 2400, 3); },
  pop() { if (!AC) return; const t = AC.currentTime;
    tone(900, t, 0.12, 0.1, 'sine', null, 2400); noiseBurst(t, 0.1, 0.06, 3000, 5000, 1); },
  thump(big) { if (!AC) return; const t = AC.currentTime;
    tone(big ? 55 : 75, t, big ? 0.5 : 0.3, big ? 0.4 : 0.22, 'sine', null, 40);
    noiseBurst(t, 0.15, 0.1, 300, 120, 1, 'lowpass'); },
  burrow() { if (!AC) return; noiseBurst(AC.currentTime, 0.6, 0.14, 260, 100, 0.8, 'lowpass'); },
  kelpCut() { if (!AC) return; const t = AC.currentTime;
    noiseBurst(t, 0.14, 0.18, 1500, 700, 0.9); noiseBurst(t + 0.03, 0.12, 0.1, 800, 400, 0.9); },
  burn() { if (!AC) return; const t = AC.currentTime;
    for (let i = 0; i < 6; i++) noiseBurst(t + i * 0.14, 0.12, 0.08, 1800 + i * 300, 900, 1.5); },
  pickup() { if (!AC) return; const t = AC.currentTime;
    tone(1180, t, 0.14, 0.07); tone(1570, t + 0.07, 0.18, 0.07); },
  heart() { if (!AC) return; const t = AC.currentTime;
    [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.12, 0.4, 0.09, 'triangle')); },
  heal() { if (!AC) return; const t = AC.currentTime;
    tone(784, t, 0.3, 0.05, 'sine'); tone(1175, t + 0.08, 0.34, 0.04, 'sine'); },
  door() { if (!AC) return; const t = AC.currentTime;
    // a latch click, a low wooden swing, a soft shut
    noiseBurst(t, 0.04, 0.1, 2200, 1500, 2.5);
    tone(160, t + 0.03, 0.22, 0.06, 'triangle', null, 110);
    noiseBurst(t + 0.05, 0.16, 0.09, 420, 220, 1, 'lowpass');
    noiseBurst(t + 0.34, 0.06, 0.08, 600, 320, 1, 'lowpass'); },
  chestOpen() { if (!AC) return; const t = AC.currentTime;
    noiseBurst(t, 0.18, 0.1, 400, 900, 1);
    [392, 523, 659, 784].forEach((f, i) => tone(f, t + 0.2 + i * 0.09, 0.35, 0.07, 'triangle')); },
  bell() { if (!AC) return; const t = AC.currentTime;
    [[98, 4.5, 0.34], [147.2, 4.0, 0.2], [196.5, 3.2, 0.12], [261, 2.2, 0.07], [392.7, 1.4, 0.045]]
      .forEach(p => tone(p[0], t, p[1], p[2], 'sine'));
    noiseBurst(t, 0.06, 0.1, 800, 300, 1); },
  grind() { if (!AC) return; const t = AC.currentTime;
    for (let i = 0; i < 8; i++) noiseBurst(t + i * 0.16, 0.18, 0.1, 180 + hash2(i, 3) * 60, 120, 2, 'lowpass'); },
  night() { if (!AC) return; const t = AC.currentTime;
    [329.6, 392, 440, 493.9, 587.3].forEach((f, i) => {

    }); },
  yawn() { if (!AC) return; const t = AC.currentTime;
    tone(340, t, 1.1, 0.05, 'sine', null, 150); },
  splash() { if (!AC) return; const t = AC.currentTime;
    noiseBurst(t, 0.35, 0.16, 900, 300, 0.8, 'lowpass');
    noiseBurst(t + 0.25, 0.3, 0.08, 1400, 500, 0.8, 'lowpass'); },
  waterFill() { if (!AC) return; const t = AC.currentTime;
    noiseBurst(t, 1.8, 0.06, 500, 1200, 0.6, 'lowpass');
    tone(392, t + 0.9, 0.9, 0.03, 'sine', null, 523); },
  menu() { if (!AC) return; tone(880, AC.currentTime, 0.07, 0.04, 'sine'); },
  confirm() { if (!AC) return; const t = AC.currentTime;
    tone(659, t, 0.12, 0.06, 'sine'); tone(988, t + 0.06, 0.16, 0.05, 'sine'); },
  talk() { if (!AC) return; tone(740, AC.currentTime, 0.05, 0.035, 'sine'); },
  itemGet() { if (!AC) return; const t = AC.currentTime;
    [659, 784, 988, 1319].forEach((f, i) => tone(f, t + i * 0.14, 0.5, 0.08, 'triangle'));
    tone(2637, t + 0.56, 0.7, 0.03, 'sine'); },
};
// ambient crossfade + shade music box — called from the render loop
function audioAmbient(dt, inShade, dusk) {
  if (!AC || !heatGain) return;
  const heatTarget = (state === 'play' && !inShade) ? (dusk ? 0.035 : 0.055) : 0.0;
  const shadeTarget = (state === 'play' && inShade) ? 1.0 : 0.0;
  heatGain.gain.value += (heatTarget - heatGain.gain.value) * Math.min(1, dt * 2.2);
  shadeGain.gain.value += (shadeTarget - shadeGain.gain.value) * Math.min(1, dt * 2.0);
  if (inShade && state === 'play') {
    musicBoxT -= dt;
    if (musicBoxT <= 0) {
      musicBoxT = 6.5 + Math.random() * 3;
      const t = AC.currentTime;
      const notes = [1047, 1319, 1568, 1319, 1760];
      notes.forEach((f, i) => { if (Math.random() < 0.8) tone(f, t + i * 0.34, 1.1, 0.022, 'sine'); });
    }
  }
}

/* ───────────────────────── save ───────────────────────── */
function defaultSave() {
  return {
    v: 2, q: 0, ph: 0, mh: 5, sword: true, salt: 0,
    talked: { finn: 0, tock: 0, pearl: 0 },
    kelpDoor: false, doorChest: false, finnHeart: false,
    wreckChest: false, wallBurned: false,
    bossDone: false, sky: 0, tidepool: false,
    compassSeen: false,
    houseChest: false,        // v4: the harbor-house interior chest
    bossHint: false,          // v4: one-time "hit the CLAW" floatText shown
    lastShade: [8.2, 7.0],
  };
}
let SAVE = null;   // null = no save on disk (fresh page)
function loadSave() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (!s) return null;
    const v = JSON.parse(s);
    if (typeof v.q !== 'number') return null;
    const out = Object.assign(defaultSave(), v);
    if (!v.v) {
      // v1 → v2 migration: everyone starts armed now. Old q1 ("cut Finn's
      // door") folds into the started Crescent thread; Finn's heart container
      // stays claimable on the next chat.
      out.v = 2;
      out.sword = true;
      if (out.q === 1) out.q = 2;
      out.finnHeart = false;
      out.doorChest = false;
    }
    /* v3 defensive re-derivation (the Ben soft-lock): if the world flags
       imply a LATER stage than q claims, reconcile FORWARD — flags and
       quest must never disagree in a way that dead-ends the arc. */
    let qMin = 0;
    if (out.talked && out.talked.finn >= 1) qMin = 2;
    if (out.wallBurned) qMin = Math.max(qMin, 2);
    if (out.bossDone) qMin = Math.max(qMin, 3);
    if (out.sky >= 1 || out.ph >= 1) qMin = Math.max(qMin, 4);
    if (out.q < qMin) out.q = qMin;
    return out;
  } catch (e) { return null; }
}
function storeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {}
}
SAVE = loadSave();

/* game-wide state string — declared here, driven by p6 flow */
let state = 'boot';   // boot | title | play | dialog | pause | cine | tbc
</script>
