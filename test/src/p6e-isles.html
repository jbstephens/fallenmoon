<script>
/* ═══════════════════════════════════════════════════════════════════════
   PHASE 3, PART TWO — THE FOUNDRY, THE HOUR TORTOISE & THE HOUR RETURNED

   Owns: the Foundry dungeon under the Great Campanile (the three-verb
   puzzle: AIM a mirror-shell, STRIKE bells in the revealed order, HOLD a
   tone), the Hour Tortoise guardian, the GIBBOUS BELL, the payoff in which
   THE SUN MOVES, and both TO BE CONTINUED cards (the phase-2 retrofit and
   phase 3's own).

   Concatenated AFTER p6d-sea.html — every const it pins (ISLES, KILN_ISLE,
   FOUNDRY_DOOR, ...) is in scope here, as is its solid/ground authority.
   Everything p6d owns is FEATURE-DETECTED so this file builds even if the
   sea part is still in flight.

   ARCHITECTURE: extends by wrapping (the p6b/p6c pattern) — groundH,
   worldSolidAt, inShadeAt, nearestShadeSpot, areaAt, currentInteract,
   doInteract, tickPlayer, swingHits, cullChunks, objectivePoint,
   updateCamera, animateWick, startCine, tickCine, showTBC. ONE ground
   authority (makeMeshField; rendered == physics), ONE solid authority
   (the campanile knoll massif, marched by the same builder), and ONE
   save derivation pushed into window.__worldStateHooks — both ways.
   ═══════════════════════════════════════════════════════════════════════ */
window.__worldStateHooks = window.__worldStateHooks || [];
window.__telemetryHooks = window.__telemetryHooks || [];

/* ── what p6d pins (feature-detected so the build never hard-fails) ───── */
/* the isle itself is p6d's; the works only need its door and its waterline */
const FDOOR = (typeof FOUNDRY_DOOR !== 'undefined') ? FOUNDRY_DOOR : { x: -1520, z: -352 };
const FWL = (typeof WL === 'number') ? WL : -0.55;

/* ───────────────────── geography, all locked here ─────────────────────
   The works run north-east into the shoulder of the isle the Great
   Campanile stands on, DELIBERATELY clear of the tower's own footing so
   p6d's plaza, its shade circle and the door approach all stay walkable:
   throat → KILN FLOOR → CASTING HALL (+ the hidden MOULD ROOM) → the
   GREAT CASTING PIT, where the Hour Tortoise sleeps under its own bell. */
const FTHROAT = { ax: FDOOR.x, az: FDOOR.z + 2, bx: FDOOR.x, bz: FDOOR.z - 14, hw: 3.0 };
const FTHR2   = { ax: FDOOR.x, az: FDOOR.z - 14, bx: -1502, bz: -382, hw: 2.8 };
const F1      = { x: -1490, z: -390, r: 15 };     // THE KILN FLOOR
const FCOR12  = { ax: -1479, az: -397, bx: -1470, bz: -405, hw: 2.7 };
const F2      = { x: -1458, z: -414, r: 18 };     // THE CASTING HALL
const FCOR2B  = { ax: -1446, az: -424, bx: -1444, bz: -431, hw: 1.9 };
const F2B     = { x: -1440, z: -436, r: 6.3 };    // THE MOULD ROOM (Ben bait)
const FCOR23  = { ax: -1462, az: -430, bx: -1468, bz: -442, hw: 2.9 };
const FGLYPH3 = { x: -1465, z: -436, r: 3.0 };    // THE RESONANCE DOOR
const F3      = { x: -1472, z: -454, r: 19 };     // THE GREAT CASTING PIT
/* the bronze doors hang INSIDE p6d's portal, on this span of the throat */
const FGATE_T = [0.28, 0.52];
const FGATE   = { x: FDOOR.x, z: FDOOR.z - 2.8 };   // where the leaves hang

const F_ANCHOR = { x: FDOOR.x, z: FDOOR.z - 10 };  // sunstruck wake spot (throat)
const FMIR   = { x: -1470, z: -406 };             // the mirror-shell (AIM)
const FCEND  = { x: -1452, z: -410 };             // the casting channel's far end
const FBELLS = [                                  // the three hanging bells (STRIKE)
  { x: -1444, z: -407, col: [1.00, 0.72, 0.26], tone: 523.25, name: 'amber' },
  { x: -1441, z: -413, col: [0.34, 0.86, 0.82], tone: 659.25, name: 'teal'  },
  { x: -1444, z: -419, col: [0.98, 0.48, 0.60], tone: 783.99, name: 'rose'  },
];
const FORDER = [1, 2, 0];                         // teal → rose → amber
const GBELL  = { x: -1448, z: -422 };             // THE GREAT BELL (HOLD)
const FMOULD = { x: -1435.2, z: -438.4 };         // the lowering carving (mould room)
const FCHEST = { x: -1442.6, z: -439.2 };         // the mould-room heart chest
const FNEST1 = [[-1484, -385], [-1480, -394]];    // gull nest one (kiln floor)
const FNEST2 = [[-1466, -406], [-1463, -426]];    // gull nest two (casting hall)
/* the kilns, pinned here because the ground colorer reads them */
const FKILNS = [
  [-1498, -384, 3.4], [-1490, -379, 3.0], [-1482, -384, 3.2], [-1498, -396, 2.7],
];

/* floor heights. Each room is dug DOWN FROM ITS OWN PATCH OF ISLE, never
   from one global datum, so no vault can break the surface wherever p6d's
   island slopes — and every floor stays above the waterline, so no ocean
   plane can ever reach in. */
const _seaGroundH = groundH;                      // the previous ground authority
const F_DOOR_Y = _seaGroundH(FDOOR.x, FDOOR.z);
const F_LO = FWL + 1.2;
const F1Y  = Math.max(F_LO, Math.min(F_DOOR_Y - 4.5, _seaGroundH(F1.x, F1.z) - 9.2));
const F2Y  = Math.max(F_LO, Math.min(F1Y - 1.8, _seaGroundH(F2.x, F2.z) - 11.4));
const F2BY = Math.max(F_LO, Math.min(F2Y + 0.8, _seaGroundH(F2B.x, F2B.z) - 6.8));
const F3Y  = Math.max(F_LO, Math.min(F2Y - 2.0, _seaGroundH(F3.x, F3.z) - 12.2));
const F_MID_Y = lerp(F_DOOR_Y, F1Y, 0.42);        // where the throat's two legs meet

/* the field the foundry owns (floor + a wall-base margin) */
const FBOX = { x0: -1536, z0: -486, x1: -1414, z1: -338 };
function fInBox(x, z) { return x > FBOX.x0 && x < FBOX.x1 && z > FBOX.z0 && z < FBOX.z1; }

const FSEGS = [FTHROAT, FTHR2, FCOR12, FCOR2B, FCOR23];
const FCHAMBERS = [[F1, F1Y], [F2, F2Y], [F2B, F2BY], [F3, F3Y]];
/* p6d's portal is a metre and a half to each jamb; the throat must not cut
   a slot through the bluff beside its own doorway */
function fPortalW(t) { return lerp(1.5, FTHROAT.hw, smoothstep(clamp((t - 0.08) / 0.22, 0, 1))); }

/* the always-carved air (doors plug separately) */
function foundryOpenCore(x, z) {
  for (let i = 0; i < FCHAMBERS.length; i++) {
    const c = FCHAMBERS[i][0];
    if (Math.hypot(x - c.x, z - c.z) < c.r + 0.8) return true;
  }
  {
    const t = segT(x, z, FTHROAT);
    if (t[0] > -0.04 && t[0] < 1.04 && t[1] < fPortalW(t[0])) return true;
  }
  for (let i = 1; i < FSEGS.length; i++) {
    const s = FSEGS[i];
    const t = segT(x, z, s);
    if (t[0] > -0.04 && t[0] < 1.04 && t[1] < s.hw) return true;
  }
  return false;
}
/* membership with margin: open air + 3.3 m of wall base. The throat's first
   metres belong to p6d's bluff, so the field starts INSIDE the doorway — no
   coplanar sheet fighting the island's own ground outside the portal. */
function inFoundryFieldQ(x, z) {
  for (let i = 0; i < FCHAMBERS.length; i++) {
    const c = FCHAMBERS[i][0];
    if (Math.hypot(x - c.x, z - c.z) < c.r + 3.3) return true;
  }
  {
    const t = segT(x, z, FTHROAT);
    if (t[0] > 0.10 && t[0] < 1.06 && t[1] < fPortalW(t[0]) + 2.4) return true;
  }
  for (let i = 1; i < FSEGS.length; i++) {
    const s = FSEGS[i];
    const t = segT(x, z, s);
    if (t[0] > -0.06 && t[0] < 1.06 && t[1] < s.hw + 2.5) return true;
  }
  return false;
}

/* ── live gate state (derived from SAVE in the world-state hook) ─────── */
let fGateOpenNow = false;      // the bronze doors — SAVE.watchBell
let fResOpenNow = false;       // the resonance door — sustained tone, or done
function foundryPlugAt(x, z) {
  if (!fGateOpenNow) {
    const t = segT(x, z, FTHROAT);
    if (t[0] > FGATE_T[0] && t[0] < FGATE_T[1] && t[1] < FTHROAT.hw + 0.4) return true;
  }
  if (!fResOpenNow && Math.hypot(x - FGLYPH3.x, z - FGLYPH3.z) < FGLYPH3.r) return true;
  return false;
}

/* ── THE MASSIF: the rock the works are cut into. One solid footprint; the
   only walkable air inside it is foundryOpenCore minus the door plugs — and
   the rendered wall rocks are MARCHED along that very boundary, so geometry
   and collision can never disagree (the v4 grotto law). The throat's
   footprint tapers to nothing at the portal, so nobody ever meets an
   invisible wall standing on p6d's own threshold. ── */
const FMASS_DISC = [
  [F1.x, F1.z, F1.r + 5.2], [F2.x, F2.z, F2.r + 5.2],
  [F2B.x, F2B.z, F2B.r + 5.2], [F3.x, F3.z, F3.r + 5.2],
];
const FMASS_SEG = [
  { ax: FTHR2.ax, az: FTHR2.az, bx: FTHR2.bx, bz: FTHR2.bz, hw: FTHR2.hw + 5.2 },
  { ax: FCOR12.ax, az: FCOR12.az, bx: FCOR12.bx, bz: FCOR12.bz, hw: FCOR12.hw + 5.2 },
  { ax: FCOR2B.ax, az: FCOR2B.az, bx: FCOR2B.bx, bz: FCOR2B.bz, hw: FCOR2B.hw + 5.2 },
  { ax: FCOR23.ax, az: FCOR23.az, bx: FCOR23.bx, bz: FCOR23.bz, hw: FCOR23.hw + 5.2 },
];
function fMassifAt(x, z) {
  if (!fInBox(x, z)) return false;
  for (let i = 0; i < FMASS_DISC.length; i++) {
    const c = FMASS_DISC[i];
    const dx = x - c[0], dz = z - c[1];
    if (dx * dx + dz * dz < c[2] * c[2]) return true;
  }
  {
    const t = segT(x, z, FTHROAT);
    if (t[0] > 0.02 && t[0] < 1.06 &&
        t[1] < lerp(0.6, FTHROAT.hw + 5.2, smoothstep(clamp((t[0] - 0.05) / 0.35, 0, 1)))) return true;
  }
  for (let i = 0; i < FMASS_SEG.length; i++) {
    const s = FMASS_SEG[i];
    const t = segT(x, z, s);
    const tt = clamp(t[0], 0, 1);
    const px = s.ax + (s.bx - s.ax) * tt, pz = s.az + (s.bz - s.az) * tt;
    if (Math.hypot(x - px, z - pz) < s.hw) return true;
  }
  return false;
}
function inFoundryAt(x, z) {
  return fInBox(x, z) && (foundryOpenCore(x, z) || foundryPlugAt(x, z));
}
const _seaWorldSolid = worldSolidAt;
worldSolidAt = function (x, z) {
  if (fMassifAt(x, z)) {
    if (foundryPlugAt(x, z)) return true;
    return !foundryOpenCore(x, z);
  }
  return _seaWorldSolid(x, z);
};

/* ── the foundry floor field (ONE ground authority; mesh == physics) ── */
function foundryFloorRaw(x, z) {
  let wSum = 0, hSum = 0;
  const add = (w, h) => { if (w > 0) { wSum += w; hSum += h * w; } };
  for (let i = 0; i < FCHAMBERS.length; i++) {
    const c = FCHAMBERS[i][0], floor = FCHAMBERS[i][1];
    const d = Math.hypot(x - c.x, z - c.z);
    if (d < c.r + 3.3) {
      const w = smoothstep(clamp((c.r + 1.5 - d) / 3.0 + 1, 0, 1));
      add(Math.max(w, 0.001), floor - 0.55 * smoothstep(1 - d / c.r));
    }
  }
  const corr = (s, ya, yb, wm) => {
    const t = segT(x, z, s);
    if (t[0] > -0.06 && t[0] < 1.06 && t[1] < s.hw + 3.0) {
      const w = smoothstep(clamp((s.hw + 1.0 - t[1]) / 2.6 + 1, 0, 1));
      add(Math.max(w, 0.001) * wm, lerp(ya, yb, smoothstep(clamp(t[0], 0, 1))));
    }
  };
  /* the throat starts ON whatever ground p6d gives the door and ramps down;
     the second leg finishes the descent into the kiln floor */
  {
    const t = segT(x, z, FTHROAT);
    if (t[0] > -0.06 && t[0] < 1.06 && t[1] < FTHROAT.hw + 3.0) {
      const w = smoothstep(clamp((FTHROAT.hw + 1.0 - t[1]) / 2.6 + 1, 0, 1));
      add(Math.max(w, 0.001) * 1.7, lerp(_seaGroundH(x, z), F_MID_Y, smoothstep(clamp(t[0], 0, 1))));
    }
  }
  corr(FTHR2, F_MID_Y, F1Y, 1.7);
  corr(FCOR12, F1Y, F2Y, 1.35);
  corr(FCOR2B, F2Y, F2BY, 1.35);
  corr(FCOR23, F2Y, F3Y, 1.35);
  if (wSum <= 0) return _seaGroundH(x, z);
  let h = hSum / wSum;
  /* worn brick and spilled casting sand */
  h += vnoise(x * 0.34, z * 0.34) * 0.075;
  /* the CASTING CHANNEL: a runner groove cut from the shell to the bells */
  {
    const ch = segT(x, z, { ax: FMIR.x, az: FMIR.z, bx: FCEND.x, bz: FCEND.z });
    if (ch[0] > 0.04 && ch[0] < 1.0 && ch[1] < 0.85) h -= 0.30 * smoothstep((0.85 - ch[1]) / 0.55);
  }
  /* the hall's main casting pit, under the great bell */
  {
    const dp = Math.hypot(x - GBELL.x, z - GBELL.z);
    if (dp < 5.6) h -= 0.70 * smoothstep((5.6 - dp) / 2.4);
  }
  /* THE GREAT CASTING PIT: a broad shallow sand dish — flat where the
     Tortoise fights (a boss floor is a promise), rippled at the rim */
  {
    const d3 = Math.hypot(x - F3.x, z - F3.z);
    if (d3 < F3.r + 2) {
      const m = smoothstep((F3.r + 2 - d3) / 3.5);
      h -= 0.85 * smoothstep(clamp((F3.r - 4 - d3) / 6 + 1, 0, 1)) * m;
      if (d3 > F3.r - 7) h += vnoise(x * 0.55 + 9, z * 0.55) * 0.11 * m;
    }
  }
  return h;
}
const foundryHMesh = makeMeshField(foundryFloorRaw, FBOX.x0, FBOX.z0, FBOX.x1, FBOX.z1, 4, () => true);
groundH = function (x, z) {
  if (fInBox(x, z) && inFoundryFieldQ(x, z)) return foundryHMesh(x, z);
  return _seaGroundH(x, z);
};

/* ── shade / areas ── */
const _seaInShadeAt = inShadeAt;
inShadeAt = function (x, z) {
  if (inFoundryAt(x, z)) return true;        // the works are deep cool dark
  return _seaInShadeAt(x, z);
};
const _seaNearestShade = nearestShadeSpot;
nearestShadeSpot = function (x, z) {
  if (inFoundryAt(x, z)) return { x: F_ANCHOR.x, z: F_ANCHOR.z };
  return _seaNearestShade(x, z);
};
const _seaAreaAt = areaAt;
areaAt = function (x, z) {
  if (inFoundryAt(x, z)) return 'foundry';
  return _seaAreaAt(x, z);
};
</script>
<script>
/* ═══════════ p6e/2 — BUILDING THE FOUNDRY ═══════════
   Curved brick kilns, casting pits, cooling channels, half-finished bells
   hanging in the dark. Verdigris and salt-white, gull-streaked. Five merged
   meshes (floor / walls / vaults / props / glow) so the whole works costs a
   handful of draw calls, plus the dynamic pieces the puzzle needs.        */
const C_BRICK  = col(0x6b4436), C_BRICK2 = col(0x472e25), C_SOOT = col(0x211c19);
const C_VERD   = col(0x4e8b78), C_VERD2  = col(0x2d5a4d);
const C_BRONZE = col(0x8f6c33), C_BRONZE2 = col(0x5c4420);
const C_SALTW  = col(0xd8d2c0), C_SALTW2 = col(0xa79f8a);
const C_SANDF  = col(0x9a8a6c), C_SANDF2 = col(0x7a6c53);
const C_FSTONE = col(0x4c483f), C_FSTONE2 = col(0x35322c), C_FDARK = col(0x211f1c);
const C_GULLW  = col(0xd9d6c8);
const C_EMBER  = [1, 0.5, 0.18];
/* the works are baked WARM. The standard bake cools deep shade toward blue
   — right for sea stone under an open sky, wrong for brick, soot and iron in
   a cellar, where it turned the pit frame navy (John's blue-pine bug, indoors). */
function boxF(md, o) { o.warm = true; boxW(md, o); }
function latheF(md, prof, o) { o.warm = true; latheW(md, prof, o); }

const _fgc = [0, 0, 0];
function foundryColor(x, z, y) {
  const n = vnoise(x * 0.3, z * 0.3), f = vnoise(x * 0.9 + 7, z * 0.9);

  /* the works floor: fired brick laid in courses, scuffed with casting sand */
  mix3(C_BRICK, C_BRICK2, clamp(0.5 + n * 0.7 + f * 0.2, 0, 1), _fgc);
  const course = (x * 0.62 + n * 1.4) % 1;
  if (course < 0.10) mix3(_fgc, C_SOOT, 0.55, _fgc);                 // the mortar
  else if (((z * 0.62 + f) % 1) < 0.09) mix3(_fgc, C_SOOT, 0.4, _fgc);
  if (f > 0.28) mix3(_fgc, C_SANDF, 0.5, _fgc);
  if (f < -0.34) mix3(_fgc, C_SOOT, 0.45, _fgc);                      // trodden black
  /* soot rings out from the kilns */
  for (let i = 0; i < FKILNS.length; i++) {
    const d = Math.hypot(x - FKILNS[i][0], z - FKILNS[i][1]);
    if (d < 5.4) mix3(_fgc, C_SOOT, 0.5 * smoothstep((5.4 - d) / 3.2), _fgc);
  }
  /* the casting channel + the cooling runners read as cut stone */
  {
    const ch = segT(x, z, { ax: FMIR.x, az: FMIR.z, bx: FCEND.x, bz: FCEND.z });
    if (ch[0] > 0.0 && ch[0] < 1.05 && ch[1] < 1.15) {
      const m = smoothstep((1.15 - ch[1]) / 0.55);
      mix3(_fgc, ch[1] < 0.8 ? C_SOOT : C_SALTW, 0.85 * m, _fgc);     // cut stone, sooted groove
    }
  }
  /* THE GREAT CASTING PIT: sand, raked, with salt bloom at the rim */
  const d3 = Math.hypot(x - F3.x, z - F3.z);
  if (d3 < F3.r + 1.5) {
    const m = smoothstep((F3.r + 1.5 - d3) / 2.5);
    mix3(_fgc, f > 0.15 ? C_SANDF : C_SANDF2, m * 0.92, _fgc);
    if (Math.abs(vnoise(x * 1.5, z * 1.5)) < 0.055) mix3(_fgc, C_SALTW2, 0.45 * m, _fgc);
  }
  /* the hall's pit floor: fused by a century of poured bronze — near black */
  const dp = Math.hypot(x - GBELL.x, z - GBELL.z);
  if (dp < 5.4) {
    const m = smoothstep((5.4 - dp) / 2.2);
    mix3(_fgc, C_SOOT, 0.9 * m, _fgc);
    if (f > 0.3) mix3(_fgc, C_BRONZE2, 0.35 * m, _fgc);               // metal still in it
  }
  /* mould room: pale clay dust */
  const db = Math.hypot(x - F2B.x, z - F2B.z);
  if (db < F2B.r + 1) mix3(_fgc, C_SALTW, 0.5 * smoothstep((F2B.r + 1 - db) / 2.4), _fgc);
  /* salt-white efflorescence creeping up from the sea */
  if (Math.abs(Math.sin(y * 1.9 + n * 2)) > 0.9) mix3(_fgc, C_SALTW, 0.35, _fgc);
  /* the throat DARKENS as it descends — daylight dies behind you, the works
     glow ahead. Without this the ramp read as one flat pale plane. */
  {
    const tt = segT(x, z, FTHROAT);
    if (tt[0] > 0 && tt[0] < 1.1 && tt[1] < FTHROAT.hw + 2.5) {
      mix3(_fgc, C_SOOT, 0.42 * smoothstep(clamp(tt[0], 0, 1)), _fgc);
    }
  }
  return _fgc;
}

/* ── the floor sheet: same lattice, same split, same diagonal as the field ── */
let fFloorMesh = null;
(function buildFoundryFloor() {
  const md = MD();
  const gc = (x, z) => {
    const y = foundryHMesh(x, z);
    const c = foundryColor(x, z, y);
    return [c[0], c[1], c[2], y];
  };
  const cell = (x, z, s) => {
    const c00 = gc(x, z), c10 = gc(x + s, z), c01 = gc(x, z + s), c11 = gc(x + s, z + s);
    pushTriWV(md, x, c00[3], z, x, c01[3], z + s, x + s, c11[3], z + s, c00, c01, c11);
    pushTriWV(md, x, c00[3], z, x + s, c11[3], z + s, x + s, c10[3], z, c00, c11, c10);
  };
  for (let x = FBOX.x0; x < FBOX.x1; x += 4) {
    for (let z = FBOX.z0; z < FBOX.z1; z += 4) {
      if (!(inFoundryFieldQ(x, z) || inFoundryFieldQ(x + 4, z) ||
            inFoundryFieldQ(x, z + 4) || inFoundryFieldQ(x + 4, z + 4))) continue;
      /* the coplanar sliver at the throat mouth belongs to the isle sheet */
      const t = segT(x + 2, z + 2, FTHROAT);
      if (t[0] < 0.02 && Math.hypot(x + 2 - F1.x, z + 2 - F1.z) > F1.r + 4) continue;
      cell(x, z, 2); cell(x + 2, z, 2); cell(x, z + 2, 2); cell(x + 2, z + 2, 2);
    }
  }
  fFloorMesh = mdMesh(md, WORLD_MAT, false);
  fFloorMesh.matrixAutoUpdate = false; fFloorMesh.updateMatrix();
  fFloorMesh.visible = false;
  scene.add(fFloorMesh);
})();

/* ── walls marched along the SAME boundary the collision answers ── */
let fWallMesh = null, fDomeMesh = null;
(function buildFoundryShell() {
  const md = MD();
  const wallRock = (x, z, R0, seedv) => {
    const y = groundH(x, z) - 1.5;
    latheF(md, [[R0, 0], [R0 * 1.08, 3.4], [R0 * 0.5, 8.2], [0, 10.5]],
      { seg: 6, ex: 0.9, x, y, z, ry: seedv * 2.13, flat: true, segJitter: 0.13,
        col: C_FSTONE2, cols: [C_FSTONE, C_FSTONE2, C_FDARK] });
  };

  /* the founder's bench + tools */
  {
    const x = F2B.x - 3.2, z = F2B.z + 2.2, y = groundH(x, z);
    boxF(md, { x, y: y + 0.62, z, w: 1.3, d: 0.4, h: 0.1, col: mix3(C_BRICK2, C_SOOT, 0.35) });
    for (const ox of [-1.1, 1.1]) boxF(md, { x: x + ox, y, z, w: 0.09, d: 0.09, h: 0.62, col: C_FSTONE2 });
    for (let i = 0; i < 4; i++) {
      boxF(md, { x: x - 0.8 + i * 0.55, y: y + 0.72, z, w: 0.05, d: 0.05, h: 0.34, rz: 0.2 + i * 0.1, col: C_BRONZE2 });
    }
  }

  /* ═══ THE CARVING: THE MOON, LOWERED — the Falls Hollow mural from the
     OTHER side. There, figures stood on a shore and watched it go down.
     Here they are ABOVE it, at the winches, letting it down themselves.
     Still nobody says why. ═══ */
  {
    const wx = FMOULD.x, wz = FMOULD.z, fy = F2BY;
    const C_OCRE = col(0xb39a6a), C_OCRE2 = col(0x8a744c),
          C_MOONPALE = col(0xd2d5c6), C_DEEP = col(0x3d5566);
    /* the sea, carved along the BOTTOM this time — we look down with them */
    for (let i = 0; i < 7; i++) {
      const w2 = 3.0 - i * 0.14;
      boxF(md, { x: wx + 0.13, y: fy + 1.05 - i * 0.2, z: wz + (i % 2 ? 0.16 : -0.16),
        w: 0.05, d: w2 * 0.5, h: 0.13,
        col: i % 2 ? C_DEEP : mix3(C_DEEP, [0, 0, 0], 0.35) });
    }
    /* and the waterline itself, one cut line right across the moon's belly */
    boxF(md, { x: wx + 0.1, y: fy + 1.18, z: wz, w: 0.05, d: 1.7, h: 0.1,
      col: mix3(C_DEEP, C_OCRE, 0.35) });
    /* the moon, HALF INTO the water — a disc standing IN the wall's plane,
       its lower limb cut off by the carved waves */
    {
      const mR = 1.45, my = fy + 1.18, n = 18;   // its belly sits IN the carved sea
      for (let i = 0; i < n; i++) {
        const a0 = 0.12 + i / n * (Math.PI - 0.24), a1 = 0.12 + (i + 1) / n * (Math.PI - 0.24);
        const cc = C_MOONPALE;                     // a moon is not striped
        pushQuad(md, [wx + 0.12, my, wz], [wx + 0.12, my, wz],
          [wx + 0.12, my + Math.sin(a0) * mR, wz + Math.cos(a0) * mR],
          [wx + 0.12, my + Math.sin(a1) * mR, wz + Math.cos(a1) * mR], cc);
        /* a raised rim, so the relief has an edge to catch the light */
        pushQuad(md,
          [wx + 0.12, my + Math.sin(a0) * mR, wz + Math.cos(a0) * mR],
          [wx + 0.12, my + Math.sin(a1) * mR, wz + Math.cos(a1) * mR],
          [wx + 0.02, my + Math.sin(a1) * mR * 1.06, wz + Math.cos(a1) * mR * 1.06],
          [wx + 0.02, my + Math.sin(a0) * mR * 1.06, wz + Math.cos(a0) * mR * 1.06], C_OCRE);
      }
      /* the crack across it — the same break the whole game is about */
      boxF(md, { x: wx + 0.06, y: my + 0.1, z: wz - 0.6, w: 0.05, d: 1.5, h: 0.09,
        ry: Math.PI / 2, rz: 0.4, col: C_OCRE2 });
    }
    /* four chains running UP out of frame — we are on the winch side */
    for (const so of [-1.05, -0.35, 0.35, 1.05]) {
      for (let i = 0; i < 8; i++) {
        latheF(md, [[0.2, 0], [0.14, 0.06], [0.2, 0.12]],
          { seg: 6, ex: 0.5, flat: true, x: wx + 0.16, y: fy + 1.7 + i * 0.34, z: wz + so, col: C_OCRE2 });
      }
    }
    /* the winch drums and the figures leaning on them, high up */
    for (const so of [-1.5, 1.5]) {
      latheF(md, [[0.34, 0], [0.34, 0.5]],
        { seg: 8, ex: 0.4, flat: true, x: wx + 0.16, y: fy + 4.1, z: wz + so, ry: Math.PI / 2, col: C_OCRE2 });
      boxF(md, { x: wx + 0.14, y: fy + 3.3, z: wz + so + 0.5, w: 0.07, d: 0.16, h: 0.6, col: C_OCRE });
      boxF(md, { x: wx + 0.14, y: fy + 3.85, z: wz + so + 0.5, w: 0.05, d: 0.1, h: 0.13, col: C_OCRE });
    }
  }

  /* ── the cressets the braziers burn in: an iron bowl on a tripod ── */
  const cresset = (bx, bz) => {
    const by = groundH(bx, bz);
    for (let k = 0; k < 3; k++) {
      const a = k / 3 * TAU;
      boxF(md, { x: bx + Math.cos(a) * 0.24, y: by, z: bz + Math.sin(a) * 0.24,
        w: 0.06, d: 0.06, h: 1.12, rx: Math.sin(a) * 0.2, rz: -Math.cos(a) * 0.2,
        col: C_FSTONE2 });
    }
    latheF(md, [[0.44, 1.05], [0.5, 1.22], [0.42, 1.3]],
      { seg: 8, x: bx, y: 0, z: bz, flat: true, col: C_BRONZE2 });
  };
  for (let i = 0; i < 5; i++) {
    const a = 0.5 + i * 1.25;
    cresset(F2.x + Math.cos(a) * (F2.r - 2.4), F2.z + Math.sin(a) * (F2.r - 2.4));
  }
  for (let i = 0; i < 5; i++) {
    const a = 1.1 + i * 1.25;
    cresset(F3.x + Math.cos(a) * (F3.r - 2.6), F3.z + Math.sin(a) * (F3.r - 2.6));
  }
  for (const s2 of [FCOR12, FCOR23, FTHR2]) {
    for (const t of [0.35, 0.75]) cresset(lerp(s2.ax, s2.bx, t) + 0.9, lerp(s2.az, s2.bz, t) + 0.9);
  }

  /* ── the finished bells, never delivered, ranked along the hall wall ── */
  for (let i = 0; i < 6; i++) {
    const a = 3.5 + i * 0.34;
    const x = F2.x + Math.cos(a) * (F2.r - 3.2), z = F2.z + Math.sin(a) * (F2.r - 3.2);
    const y = groundH(x, z);
    const R = 0.85 + (i % 3) * 0.22;
    latheF(md, [[R, 0], [R * 0.95, R * 0.3], [R * 0.72, R * 1.1], [R * 0.5, R * 1.9],
                [R * 0.3, R * 2.4], [R * 0.26, R * 2.6]],
      { seg: 9, x, y, z, flat: true, segJitter: 0.06,
        col: C_VERD, cols: [C_VERD2, C_VERD, mix3(C_VERD, C_BRONZE, 0.4), C_BRONZE2, C_BRONZE2] });
    boxF(md, { x, y: y + R * 2.6, z, w: 0.09, d: 0.09, h: 0.26, col: C_BRONZE2 });
    addColl(x, z, R * 0.95);
  }
  /* the pit's buttress piers: something for the eye to measure the arena by */
  for (let i = 0; i < 6; i++) {
    const a = 0.4 + i / 6 * TAU;
    const x = F3.x + Math.cos(a) * (F3.r - 1.4), z = F3.z + Math.sin(a) * (F3.r - 1.4);
    const y = groundH(x, z);
    boxF(md, { x, y, z, w: 1.1, d: 1.1, h: 4.6, tw: 0.8, td: 0.8, ry: -a,
      col: C_FSTONE, colB: C_FSTONE2 });
    boxF(md, { x, y: y + 4.6, z, w: 1.3, d: 1.3, h: 0.4, ry: -a, col: C_FSTONE2 });
    addColl(x, z, 1.15);
  }

  /* ── paving: score lines of set kerb, laid across every chamber floor ── */
  const paving = (c, step, ang) => {
    const ux = Math.cos(ang), uz = Math.sin(ang);
    const px = -uz, pz = ux;
    for (let k = -Math.ceil(c.r / step); k <= Math.ceil(c.r / step); k++) {
      const off = k * step;
      const half = Math.sqrt(Math.max(0, c.r * c.r - off * off)) - 0.6;
      if (half < 1.2) continue;
      const segs = Math.max(2, Math.ceil(half * 2 / 4));
      for (let i = 0; i < segs; i++) {
        const t0 = -half + (i / segs) * half * 2, t1 = -half + ((i + 1) / segs) * half * 2;
        const mx = c.x + ux * (t0 + t1) / 2 + px * off, mz = c.z + uz * (t0 + t1) / 2 + pz * off;
        boxF(md, { x: mx, y: groundH(mx, mz) - 0.045, z: mz,
          w: (t1 - t0) / 2, d: 0.075, h: 0.055, ry: -ang,
          col: (k % 3 === 0) ? mix3(C_SOOT, C_SALTW2, 0.3) : mix3(C_SOOT, C_BRICK2, 0.25) });
      }
    }
  };
  paving(F1, 3.6, 0.35);
  paving(F1, 3.6, 0.35 + Math.PI / 2);
  paving(F2, 3.8, 1.05);
  paving(F2, 3.8, 1.05 + Math.PI / 2);
  paving(F2B, 2.4, 0.6);
  /* the pit's floor is RAKED sand, not paving: long shallow furrows */
  for (let k = -5; k <= 5; k++) {
    const off = k * 3.4;
    const half = Math.sqrt(Math.max(0, (F3.r - 2) * (F3.r - 2) - off * off));
    if (half < 1.5) continue;
    for (let i = 0; i < 5; i++) {
      const t0 = -half + (i / 5) * half * 2, t1 = -half + ((i + 1) / 5) * half * 2;
      const mx = F3.x + (t0 + t1) / 2, mz = F3.z + off;
      boxF(md, { x: mx, y: groundH(mx, mz) - 0.035, z: mz,
        w: (t1 - t0) / 2, d: 0.10, h: 0.05, col: mix3(C_SOOT, C_SANDF2, 0.32) });
    }
  }

  /* ── the pit's litter: burst mould rings and cold spills of bronze ── */
  for (let i = 0; i < 9; i++) {
    const a = rnd() * TAU, d = 4 + rnd() * (F3.r - 8);
    const x = F3.x + Math.cos(a) * d, z = F3.z + Math.sin(a) * d;
    const y = groundH(x, z);
    const R = 1.1 + rnd() * 1.5;
    const a0 = rnd() * TAU, sweep = 1.6 + rnd() * 2.6;
    latheF(md, [[R, 0], [R * 1.06, 0.22], [R * 0.98, 0.3]],
      { seg: 9, a0, a1: a0 + sweep, x, y, z, flat: true, segJitter: 0.16,
        col: rnd() > 0.5 ? C_SALTW2 : mix3(C_SANDF2, C_SOOT, 0.35) });
    if (rnd() > 0.55) {
      latheF(md, [[0, 0], [R * 0.5, 0.03]], { seg: 7, x, y: y + 0.01, z, flat: true, col: C_BRONZE2 });
    }
  }
  /* ── gull nests on the ledges (the works has been theirs a long while) ── */
  for (const [nx, nz] of FNEST1.concat(FNEST2)) {
    const y = groundH(nx, nz);
    latheF(md, [[0.7, 0], [0.55, 0.26], [0.6, 0.3]],
      { seg: 7, x: nx, y, z: nz, flat: true, segJitter: 0.2, col: mix3(C_SANDF2, C_SOOT, 0.35) });
    for (let i = 0; i < 4; i++) {
      const a = rnd() * TAU;
      boxF(md, { x: nx + Math.cos(a) * 0.5, y: y + 0.2, z: nz + Math.sin(a) * 0.5,
        w: 0.03, d: 0.3, h: 0.03, ry: a, rz: 0.2, col: C_SANDF2 });
    }
  }
  /* salt bloom and gull streaks down the wall bases */
  for (let i = 0; i < 26; i++) {
    const c = FCHAMBERS[i % FCHAMBERS.length];
    const a = rnd() * TAU, d = c[0].r - 0.7;
    const x = c[0].x + Math.cos(a) * d, z = c[0].z + Math.sin(a) * d;
    boxF(md, { x, y: groundH(x, z) + 0.02, z, w: 0.5 + rnd() * 0.5, d: 0.5, h: 0.05, ry: a,
      col: i % 3 ? C_SALTW : C_GULLW });
  }
  fPropMesh = mdMesh(md, WORLD_MAT, false);
  fPropMesh.matrixAutoUpdate = false; fPropMesh.updateMatrix();
  fPropMesh.visible = false;
  scene.add(fPropMesh);

  /* ── the glow tier: the roof crack's shaft, kiln embers, the shell's pool ── */
  const mdG = MD();
  const warm = [1, 0.95, 0.78];
  const crackA = 2.55;
  const cx2 = F2.x + Math.cos(crackA) * F2.r * 0.52, cz2 = F2.z + Math.sin(crackA) * F2.r * 0.52;
  for (const off of [[-0.42, 0], [0, 0.42]]) {
    pushQuad(mdG, [cx2 - off[0], F2Y + 9.6, cz2 - off[1]], [cx2 + off[0], F2Y + 9.6, cz2 + off[1]],
      [FMIR.x + off[0] * 0.6, F2Y + 0.4, FMIR.z + off[1] * 0.6],
      [FMIR.x - off[0] * 0.6, F2Y + 0.4, FMIR.z - off[1] * 0.6], warm);
  }
  lathe(mdG, [[0, 0.1], [1.7, 0.02]], { seg: 9, x: FMIR.x, y: F2Y, z: FMIR.z, col: warm });
  /* one thin cold shaft on the carving, from a crack over the mould room */
  pushQuad(mdG, [FMOULD.x - 2.4, F2BY + 5.4, FMOULD.z - 0.6], [FMOULD.x - 2.4, F2BY + 5.4, FMOULD.z + 0.6],
    [FMOULD.x - 0.5, F2BY + 3.0, FMOULD.z + 0.8], [FMOULD.x - 0.5, F2BY + 3.0, FMOULD.z - 0.8], [0.74, 0.82, 0.9]);
  /* banked embers still alive in every kiln — a foundry never fully goes out */
  for (let i = 0; i < FKILNS.length; i++) {
    const kx = FKILNS[i][0], kz = FKILNS[i][1], kr = FKILNS[i][2];
    const fa = Math.atan2(F1.z - kz, F1.x - kx);
    const ex = kx + Math.cos(fa) * kr * 0.86, ez = kz + Math.sin(fa) * kr * 0.86;
    const ey = groundH(kx, kz);
    lathe(mdG, [[0, 0.06], [0.62, 0.02]], { seg: 9, x: ex, y: ey + 0.06, z: ez, col: [0.75, 0.32, 0.1] });
    lathe(mdG, [[0, 0.8], [0.38, 0.05]], { seg: 8, x: ex, y: ey, z: ez, col: [0.5, 0.19, 0.05] });
  }
  /* wall braziers down the corridors and round the pit: the only light that
     ever kept this place working, and the reason the dark reads as warm */
  const braz = (bx, bz, by) => {
    /* an iron cresset on a spike, its coals still just alive: a small hot
       core, a soft pool on the floor under it, nothing bonfire-shaped */
    lathe(mdG, [[0.26, 0], [0.13, 0.2], [0, 0.3]], { seg: 7, x: bx, y: by + 1.18, z: bz, col: C_EMBER });
    lathe(mdG, [[0, 0.02], [1.15, 0.0]], { seg: 9, x: bx, y: by + 0.04, z: bz, col: [0.19, 0.075, 0.02] });
    lathe(mdG, [[0.34, 0], [0.4, 0.06]], { seg: 8, x: bx, y: by + 1.12, z: bz, col: [0.4, 0.15, 0.04] });
  };
  for (let i = 0; i < 5; i++) {
    const a = 0.5 + i * 1.25;
    braz(F2.x + Math.cos(a) * (F2.r - 2.4), F2.z + Math.sin(a) * (F2.r - 2.4),
      groundH(F2.x + Math.cos(a) * (F2.r - 2.4), F2.z + Math.sin(a) * (F2.r - 2.4)));
  }
  for (let i = 0; i < 5; i++) {
    const a = 1.1 + i * 1.25;
    braz(F3.x + Math.cos(a) * (F3.r - 2.6), F3.z + Math.sin(a) * (F3.r - 2.6),
      groundH(F3.x + Math.cos(a) * (F3.r - 2.6), F3.z + Math.sin(a) * (F3.r - 2.6)));
  }
  for (const s2 of [FCOR12, FCOR23, FTHR2]) {
    for (const t of [0.35, 0.75]) {
      const bx = lerp(s2.ax, s2.bx, t) + 0.9, bz = lerp(s2.az, s2.bz, t) + 0.9;
      braz(bx, bz, groundH(bx, bz));
    }
  }
  fGlowMesh = mdMesh(mdG, F_GLOW_MAT, false);
  fGlowMesh.matrixAutoUpdate = false; fGlowMesh.updateMatrix();
  fGlowMesh.visible = false;
  scene.add(fGlowMesh);
})();
</script>
<script>
/* ═══════════ p6e/4 — the works' voice, and the three verbs ═══════════
   AIM a mirror-shell down the casting channel → the channel shows an ORDER
   → STRIKE the hanging bells in it → the great bell wakes → HOLD ✕ to
   SUSTAIN a tone and walk the resonance door before it dies. Colour, sound
   and a door visibly opening: no reading anywhere in it.               */

/* ── the foundry's voice ── */
SFX.bellTone = function (f, vol) {
  if (!AC) return; const t = AC.currentTime;
  tone(f, t, 2.4, (vol || 1) * 0.075, 'sine');
  tone(f * 2.01, t + 0.005, 1.5, (vol || 1) * 0.028, 'sine');
  tone(f * 2.98, t + 0.01, 0.9, (vol || 1) * 0.014, 'triangle');
  noiseBurst(t, 0.06, 0.05, 2600, 1200, 2.4);
};
SFX.bellDull = function () {
  if (!AC) return; const t = AC.currentTime;
  noiseBurst(t, 0.22, 0.11, 300, 120, 1.2, 'lowpass');
  tone(146, t, 0.28, 0.05, 'triangle', null, 96);
};
SFX.greatBell = function () {
  if (!AC) return; const t = AC.currentTime;
  tone(98, t, 7.6, 0.10, 'sine');
  tone(196, t + 0.01, 5.4, 0.055, 'sine');
  tone(293, t + 0.02, 3.4, 0.03, 'sine');
  tone(392, t + 0.03, 2.0, 0.016, 'triangle');
  noiseBurst(t, 0.2, 0.12, 1800, 500, 1.8);
};
SFX.hourToll = function () {
  if (!AC) return; const t = AC.currentTime;
  [0, 0.02, 0.05].forEach((d, i) => tone([110, 220, 330][i], t + d, 9.0 - i * 2.4, 0.11 - i * 0.03, 'sine'));
  tone(659, t + 0.06, 2.4, 0.02, 'sine');
  noiseBurst(t, 0.3, 0.16, 2200, 400, 1.4);
};
SFX.tortRoll = function () {
  if (!AC) return; const t = AC.currentTime;
  noiseBurst(t, 0.9, 0.13, 220, 90, 0.9, 'lowpass');
  tone(174, t, 0.85, 0.06, 'triangle', null, 132);
  tone(349, t + 0.05, 0.6, 0.03, 'sine', null, 300);
};
SFX.tortCry = function () {
  if (!AC) return; const t = AC.currentTime;
  tone(126, t, 1.2, 0.10, 'sawtooth', null, 84);
  tone(253, t + 0.08, 0.9, 0.045, 'triangle', null, 190);
  noiseBurst(t, 0.5, 0.08, 700, 260, 1.3);
};
SFX.shockRing = function () {
  if (!AC) return; const t = AC.currentTime;
  noiseBurst(t, 0.55, 0.16, 900, 180, 0.8, 'lowpass');
  tone(72, t, 0.6, 0.12, 'sine', null, 46);
};
if (!SFX.gullCry) SFX.gullCry = function () {
  if (!AC) return; const t = AC.currentTime;
  tone(1180, t, 0.16, 0.05, 'sawtooth', null, 760);
  tone(1560, t + 0.12, 0.14, 0.03, 'sawtooth', null, 980);
  noiseBurst(t, 0.14, 0.05, 2600, 1400, 2.0);
};
SFX.sunSwell = function () {
  if (!AC) return; const t = AC.currentTime;
  [131, 165, 196, 262].forEach((f, i) => tone(f, t + i * 0.22, 5.2 - i * 0.5, 0.05, 'sine'));
  noiseBurst(t + 0.3, 2.2, 0.035, 300, 900, 0.6, 'lowpass');
};

/* ── THE BRONZE DOORS: shut until Watchstone's bell has rung ──
   p6d builds the portal, the jambs, the lintel and the bell in relief; the
   only thing missing from its doorway is the thing that shuts it. These two
   leaves hang inside that opening and swing back against the passage walls
   once a bell has been rung somewhere out on the water. */
let fGateGroup = null, fGateL = null, fGateR = null;
(function buildFoundryGate() {
  const g = new THREE.Group();
  const gy = groundH(FGATE.x, FGATE.z);
  const leaf = (sgn) => {
    const n = new THREE.Group();
    const md = MD();
    const cx = -sgn * 0.72;                       // the leaf's centre, from its hinge
    for (let i = 0; i < 5; i++) {
      boxF(md, { x: cx, y: 0.06 + i * 0.85, z: 0, w: 0.7, d: 0.12, h: 0.8,
        col: i % 2 ? C_VERD : C_VERD2, colB: C_VERD2 });
    }
    boxF(md, { x: 0, y: 0, z: 0, w: 0.11, d: 0.17, h: 4.3, col: C_BRONZE2 });   // the hinge stile
    /* a raised hour-ring boss, one on each leaf: eight marks, none of them lit */
    latheF(md, [[0.46, 0], [0.4, 0.08], [0, 0.12]],
      { seg: 10, x: cx, y: 2.05, z: -0.2, col: C_BRONZE, cols: [C_BRONZE, C_BRONZE2] });
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU;
      boxF(md, { x: cx + Math.cos(a) * 0.33, y: 2.02, z: -0.22 + Math.sin(a) * 0.33 * 0.35,
        w: 0.05, d: 0.05, h: 0.1, col: C_VERD2 });
    }
    const m = mdMesh(md, WORLD_MAT, false);
    m.frustumCulled = false;
    n.add(m);
    n.position.set(sgn * 1.42, 0, 0);
    g.add(n);
    return n;
  };
  fGateL = leaf(-1); fGateR = leaf(1);
  g.position.set(FGATE.x, gy, FGATE.z);
  g.visible = false;
  scene.add(g);
  fGateGroup = g;
  /* p6d hangs a permanent collider in its own doorway to keep the player out
     before the Foundry exists. The SEAL is mine now, and save-derived, so
     that collider is retired here and replaced by the two jambs it should
     have been. (Noted for p6d: gate it on !SAVE.watchBell instead.) */

const FPZ = {
  delta: 9, litT: 0, seq: [], seqIdx: 0, blinkT: 0, wrongT: 0,

};
function fResPermanent() { return !!(SAVE && SAVE.fGlyph3); }

function tickFoundryShell(ctx) {
  if (SAVE && SAVE.fGlyph1) { FPZ.delta = 0; return; }
  const nearM = ctx && ctx.id === 'foundryShell';
  if (nearM && IN.atkHeld && state === 'play') {
    fShell.angle += 0.75 * DT;
    if (fShell.angle > TAU) fShell.angle -= TAU;
    fShell.group.rotation.y = -fShell.angle;

  let da = fShell.angle - fShell.target;
  da = ((da % TAU) + TAU) % TAU; if (da > Math.PI) da -= TAU;
  if (!(nearM && IN.atkHeld) && Math.abs(da) < 0.4) {
    fShell.angle = angLerp(fShell.angle, fShell.target, 0.05);
    fShell.group.rotation.y = -fShell.angle;
    da = fShell.angle - fShell.target;
    da = ((da % TAU) + TAU) % TAU; if (da > Math.PI) da -= TAU;
  }
  FPZ.delta = da;
  const lit = Math.abs(da) < 0.17;
  if (lit) {
    FPZ.litT += DT;
    if (FPZ.litT > 0.3 && Math.random() < 0.3) {
      burst(psSpark, FCEND.x, groundH(FCEND.x, FCEND.z) + 0.4, FCEND.z, 3, 0.9, 1.2, 0.5);

/* ── the STRIKE verb ── */
function fRingBell(i, hard) {

}

  burst(psSpark, fHang[i].root.position.x, fHang[i].root.position.y - 1.4, fHang[i].root.position.z,
    8, 1.6, 1.2, 0.4);

    /* unlit, the bells are just cold metal in the dark */

  if (SAVE.fGlyph2) {

}

/* ── the HOLD verb ── */
function fTollGreatBell() {
  /* 15s, not 9. The walk to the door is ~23m (~5.4s at a run) and a nine
     second tone left barely three seconds of slack — fine for a bot that
     turns instantly, mean to a seven-year-old who fumbles the stick, looks
     at the pretty door, or walks instead of runs. Tune for the cold player.
     The door also latches open once you are through, so the tone only ever
     has to get you there ONCE. */
  FPZ.toneT = 15.0;
  FPZ.charge = 0;
  fGreat.swingV = 1.5;
  SFX.greatBell();
  CAM.shake = 0.3;
  rumble({ duration: 900, strong: 0.85, weak: 0.9 });
  burst(psSparkle, GBELL.x, groundH(GBELL.x, GBELL.z) + 1.4, GBELL.z, 24, 2.2, 1.6, 1.2);
}
function tickFoundryTone(ctx) {
  const nearG = ctx && ctx.id === 'foundryGreat';
  if (nearG && IN.atkHeld && state === 'play' && FPZ.toneT <= 0) {
    FPZ.charge += DT / 1.15;
    fGreat.swingV += DT * 0.9;
    if ((simTick % 9) === 0) SFX.chime(0.4 + FPZ.charge * 0.5);
    if (FPZ.charge >= 1) fTollGreatBell();
  } else if (FPZ.charge > 0) {
    FPZ.charge = Math.max(0, FPZ.charge - DT * 1.6);
  }
  if (FPZ.toneT > 0) {
    FPZ.toneT -= DT;
    if (FPZ.toneT <= 0) { FPZ.toneT = 0; SFX.chime(0.35); }
  }
  /* the door: open while the tone lives, or forever once you are through.
     While the player stands IN the doorway it never re-arms — a closing
     door may never trap anybody in stone. */
  const perm = fResPermanent();
  const inDoorway = Math.hypot(P.x - FGLYPH3.x, P.z - FGLYPH3.z) < FGLYPH3.r + 0.9;
  /* anti-trap only: the door may not RE-ARM around a body standing in it,
     but 'standing near a shut door' must not open it — as written it was an
     unconditional open-on-proximity that ghosted players into the boss pit
     with the tone never rung. */
  fResOpenNow = perm || FPZ.toneT > 0 || (fResOpenNow && inDoorway);
  const wantK = (perm || FPZ.toneT > 0) ? 1 : 0;
  FPZ.doorK += (wantK - FPZ.doorK) * Math.min(1, DT * 3.4);
  /* through it: the way to the pit stays open for good */
  if (!perm && FPZ.toneT > 0 && SAVE) {
    const t = segT(P.x, P.z, FCOR23);
    if (t[0] > 0.58 && t[1] < FCOR23.hw + 1.5) {
      SAVE.fGlyph3 = true; storeSave();
      SFX.chime(1.5);
      rumble({ duration: 300, strong: 0.3, weak: 0.6 });
    }
  }
}

<script>
/* ═══════════ p6e/5 — the gulls, and THE HOUR TORTOISE ═══════════ */

/* ── SUN GULLS in the works: the flier lineage, indoors, sun-mad ──
   They keep their own array so the foundry's nests and the Tortoise's
   called gulls never disturb the bay's imps (which fizz in shade — and
   the whole Foundry is shade). */
const FGULLS = [];
function mkFGull(x, z, summoned) {
  const g = {
    m: buildSunImp(), sx: x, sz: z, x, z, y: groundH(x, z) + 2.2, face: 0,
    st: 'drift', t: Math.random() * 2, dir: [0, 0, 0], dead: false, summoned: !!summoned,
  };
  g.m.root.position.set(g.x, g.y, g.z);
  g.m.root.visible = false;
  scene.add(g.m.root);
  FGULLS.push(g);
  return g;
}
for (const [x, z] of FNEST1) mkFGull(x, z, false);
for (const [x, z] of FNEST2) mkFGull(x, z, false);
const FGULL_NEST_N = FGULLS.length;
for (let i = 0; i < 3; i++) mkFGull(F3.x, F3.z, true);   // the Tortoise's called gulls

function popFGull(g) {
  g.dead = true;
  g.m.root.visible = false;
  burst(psSpark, g.x, g.y, g.z, 16, 1.9, 1.0, 0.7);
  burst(psSparkle, g.x, g.y, g.z, 12, 1.3, 0.7, 0.8);
  SFX.pop();
  rumble({ duration: 60, strong: 0.25, weak: 0.35 });
}
function tickFGull(g) {
  if (g.dead) return;
  g.t += DT;
  const gy = groundH(g.x, g.z);
  const d2p = Math.hypot(P.x - g.x, P.z - g.z);
  if (d2p > 42) { g.y = gy + 2.2; return; }
  const faceP = () => { g.face = Math.atan2(P.x - g.x, P.z - g.z); };
  if (g.st === 'drift') {
    g.y = gy + 2.0 + Math.sin(g.t * 2.2) * 0.28;
    const home = g.summoned ? 26 : 15;
    const dHome = Math.hypot(g.x - g.sx, g.z - g.sz);
    if (dHome > home) {
      g.x += (g.sx - g.x) / dHome * 2.4 * DT;
      g.z += (g.sz - g.z) / dHome * 2.4 * DT;
      return;
    }
    if (d2p > 1.5 && d2p < 18) {
      const d = d2p || 1;
      g.x += (P.x - g.x) / d * 1.45 * DT;
      g.z += (P.z - g.z) / d * 1.45 * DT;
      faceP();
    }
    if (d2p < 4.8) { g.st = 'tele'; g.t = 0; SFX.gullCry(); }
  } else if (g.st === 'tele') {
    faceP();
    g.y = gy + 2.4 + Math.sin(g.t * 18) * 0.07;
    if (g.t > 0.55) {
      g.st = 'dive'; g.t = 0;
      const ty = groundH(P.x, P.z) + 0.8;
      const dx = P.x - g.x, dy = ty - g.y, dz = P.z - g.z;
      const l = Math.hypot(dx, dy, dz) || 1;
      g.dir = [dx / l * 9, dy / l * 9, dz / l * 9];
      SFX.pop();
    }
  } else if (g.st === 'dive') {
    g.x += g.dir[0] * DT; g.y += g.dir[1] * DT; g.z += g.dir[2] * DT;
    if (Math.hypot(P.x - g.x, P.z - g.z) < 0.9 && Math.abs(g.y - (groundH(P.x, P.z) + 1.0)) < 1.1) {
      hurtPlayer(1, g.x, g.z, g.m.root);
      g.st = 'drift'; g.t = 0;
    }
    if (g.y < gy + 0.25 || g.t > 1.1) { g.st = 'drift'; g.t = 0; }
  }
}
function fGullSwingHits() {
  let any = false;
  for (const g of FGULLS) {
    if (g.dead) continue;
    if (inSwingArc(g.x, g.z, 2.2) && g.y < P.fy + 2.4) { popFGull(g); any = true; }
  }
  return any;
}
function fCallGull() {
  const free = FGULLS.filter(g => g.summoned && g.dead);
  const alive = FGULLS.filter(g => g.summoned && !g.dead).length;
  if (!free.length || alive >= 2) return;
  const g = free[0];
  const a = Math.random() * TAU;
  g.x = g.sx = F3.x + Math.cos(a) * (F3.r - 5);
  g.z = g.sz = F3.z + Math.sin(a) * (F3.r - 5);
  g.y = groundH(g.x, g.z) + 2.6;
  g.dead = false; g.st = 'drift'; g.t = 0;
  g.m.root.visible = true;
  g.m.root.scale.setScalar(1);
  SFX.gullCry();
}

/* ═══════════ THE GIBBOUS BELL — the phase the guardian wears ═══════════ */
function buildGibbousBellItem() {
  const g = new THREE.Group();
  const md = MD();
  const C_MG = [0.9, 0.93, 0.95], C_MG2 = [0.72, 0.8, 0.86], C_BITE = [0.3, 0.36, 0.44];
  const R = 0.62;
  /* THE FACE: a moon more than half full, with one bite of dark still
     missing — drawn as a filled disc minus an offset circle, both sides */
  const n = 22;
  for (let i = 0; i < n; i++) {
    const a0 = i / n * TAU, a1 = (i + 1) / n * TAU;
    for (const zz of [0.055, -0.055]) {
      const c = mix3(C_MG2, C_MG, clamp(0.5 + 0.55 * Math.cos(a0 - 0.5), 0, 1));
      pushQuad(md, [0, 0, zz], [0, 0, zz],
        [Math.cos(a0) * R, Math.sin(a0) * R, zz], [Math.cos(a1) * R, Math.sin(a1) * R, zz], c);
    }
  }
  /* the bite: a dark lens set into the western limb */
  for (let i = 0; i < 14; i++) {
    const a0 = Math.PI / 2 + i / 14 * Math.PI, a1 = Math.PI / 2 + (i + 1) / 14 * Math.PI;
    for (const zz of [0.062, -0.062]) {
      pushQuad(md, [-R * 0.52, 0, zz], [-R * 0.52, 0, zz],
        [-R * 0.52 + Math.cos(a0) * R * 0.62, Math.sin(a0) * R * 0.98, zz],
        [-R * 0.52 + Math.cos(a1) * R * 0.62, Math.sin(a1) * R * 0.98, zz], C_BITE);
    }
  }
  /* the broken rim, bright, where it came away from the whole moon */
  for (let i = 0; i < 10; i++) {
    const a = -0.9 + i / 10 * 1.9;
    box(md, { x: Math.cos(a) * R, y: Math.sin(a) * R, z: 0, w: 0.03, d: 0.075, h: 0.1,
      rz: a, col: [0.98, 1, 1] });
  }
  /* it is a BELL as well as a moon: a bronze headstock, canon and clapper */
  box(md, { x: 0, y: R + 0.1, z: 0, w: 0.3, d: 0.09, h: 0.09, col: [0.55, 0.42, 0.2] });
  lathe(md, [[0.07, R + 0.19], [0.12, R + 0.3], [0.07, R + 0.38]], { seg: 7, col: [0.62, 0.48, 0.24] });
  lathe(md, [[0.04, -R + 0.06], [0.1, -R - 0.14], [0.03, -R - 0.22]], { seg: 6, col: [0.95, 0.97, 1.0] });
  const m = mdMesh(md, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  m.frustumCulled = false;
  g.add(m);
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 2.1), new THREE.MeshBasicMaterial({
    map: DOT_TEX, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  halo.frustumCulled = false;
  g.add(halo);
  g.userData.halo = halo;
  return g;
}
const gibbousItem = buildGibbousBellItem();
gibbousItem.visible = false;
scene.add(gibbousItem);

/* ═══════════ THE HOUR TORTOISE ═══════════
   Its shell IS the Gibbous Bell. It withdraws and ROLLS, ringing, loudly
   telegraphed — sidestep and it wobbles to a dizzy stop with the bell's
   open mouth facing you. Body hits ALWAYS chip. Proximity ALWAYS wakes. */
function buildHourTortoise() {
  const root = new THREE.Group();
  const mat = TOON.clone();
  const hide = [0.62, 0.63, 0.48], hide2 = [0.48, 0.5, 0.38], claw = [0.3, 0.29, 0.25],
        plast = [0.82, 0.79, 0.64];

  /* the body: stumpy legs, a long slow neck, a blunt kind face */
  const bodyN = new THREE.Group();
  const mdB = MD();
  for (const [ox, oz] of [[-1.35, 1.15], [1.35, 1.15], [-1.35, -1.15], [1.35, -1.15]]) {
    lathe(mdB, [[0.58, 0], [0.66, 0.4], [0.55, 1.2]], { seg: 7, x: ox, y: 0, z: oz, col: hide });
    for (let i = 0; i < 3; i++) {
      box(mdB, { x: ox + (i - 1) * 0.26, y: 0.03, z: oz + (oz > 0 ? 0.44 : -0.44),
        w: 0.09, d: 0.2, h: 0.13, col: claw });
    }
  }
  /* the plastron: pale, so the animal separates from the bronze it wears */
  lathe(mdB, [[1.15, 0.35], [1.35, 0.78], [1.2, 1.18]], { seg: 9, ex: 1.2, col: plast });
  lathe(mdB, [[1.35, 0.78], [1.44, 0.98]], { seg: 9, ex: 1.2, col: hide2 });
  lathe(mdB, [[0.26, 0.6], [0.34, 0.8], [0.06, 1.2]], { seg: 6, x: 0, y: 0, z: -1.7, col: hide2 });  // tail
  const bodyM = mdMesh(mdB, mat);
  bodyM.frustumCulled = false;
  bodyN.add(bodyM);
  /* the neck + head on their own node so the withdrawal is one number */
  const headN = new THREE.Group();
  headN.position.set(0, 0.78, 1.35);
  const mdH = MD();
  lathe(mdH, [[0.44, -0.3], [0.5, 0.5], [0.44, 1.0]], { seg: 8, col: hide });          // the long slow neck
  lathe(mdH, [[0.38, 0.95], [0.66, 1.25], [0.58, 1.65], [0.26, 1.88], [0, 1.95]],
    { seg: 9, ex: 1.4, col: hide, cols: [hide, hide, hide2, hide2] });                  // skull
  box(mdH, { x: 0, y: 1.2, z: 0.62, w: 0.24, d: 0.2, h: 0.2, rx: 0.4, col: claw });     // beak
  const headM = mdMesh(mdH, mat);
  headM.frustumCulled = false;
  headN.add(headM);
  const mdE = MD();
  for (const s of [-1, 1]) box(mdE, { x: s * 0.36, y: 1.45, z: 0.44, w: 0.12, d: 0.06, h: 0.11, col: [1, 0.62, 0.2] });
  const eyeGlow = mdMesh(mdE, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false,
  }), false);
  eyeGlow.frustumCulled = false;
  headN.add(eyeGlow);
  bodyN.add(headN);
  root.add(bodyN);

  /* THE SHELL, which is THE BELL. rollN spins it; tipN lays it on its side. */
  const rollN = new THREE.Group();
  rollN.position.y = 1.24;
  const tipN = new THREE.Group();
  rollN.add(tipN);
  const shellN = new THREE.Group();
  tipN.add(shellN);
  const R = 2.2;
  const mdS = MD();
  latheF(mdS, [[R, 0], [R * 0.94, 0.3], [R * 0.74, 0.98], [R * 0.6, 1.72],
               [R * 0.47, 2.32], [R * 0.3, 2.82], [R * 0.16, 3.08], [R * 0.14, 3.32]],
    { seg: 14, flat: true, segJitter: 0.05, col: C_VERD,
      cols: [C_VERD, C_VERD2, mix3(C_VERD, C_BRONZE, 0.35), C_VERD2, C_VERD, C_BRONZE2, C_BRONZE2] });
  /* the hour ring: eight bosses, and the shell's scute lines under them */
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU;
    latheF(mdS, [[0.24, 0], [0.19, 0.12], [0, 0.17]],
      { seg: 6, x: Math.cos(a) * R * 0.66, y: 1.9, z: Math.sin(a) * R * 0.66, col: C_BRONZE });
    latheF(mdS, [[0.09, 0], [0.09, 1.6]],
      { seg: 4, x: Math.cos(a + 0.4) * R * 0.85, y: 0.15, z: Math.sin(a + 0.4) * R * 0.85, col: C_VERD2 });
  }
  latheF(mdS, [[0.3, 3.32], [0.46, 3.55], [0.28, 3.7]], { seg: 8, col: C_BRONZE2 });   // the canon
  const shellM = mdMesh(mdS, WORLD_MAT, false);
  shellM.frustumCulled = false;
  shellN.add(shellM);
  /* the clapper, deep inside */
  const mdCl = MD();
  lathe(mdCl, [[0.14, 2.4], [0.44, 1.0], [0.16, 0.5]], { seg: 7, col: [0.34, 0.29, 0.23] });
  const clapM = mdMesh(mdCl, TOON);
  clapM.frustumCulled = false;
  shellN.add(clapM);
  /* THE WEAK POINT: the bell's open mouth. Dark until it is dizzy, then it
     blazes — the whole telegraph is "the hole is pointing at you". */
  const mdM = MD();
  lathe(mdM, [[0, 0.06], [R * 0.9, 0.02]], { seg: 14, col: [1, 0.88, 0.55] });
  lathe(mdM, [[R * 0.86, 0.04], [R * 0.99, 0.5]], { seg: 14, col: [1, 0.78, 0.4] });
  const mouthGlow = mdMesh(mdM, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false,
  }), false);
  mouthGlow.frustumCulled = false;
  shellN.add(mouthGlow);
  /* THE PHASE IT WEARS: the Gibbous Bell, set into the shell's shoulder */
  const phase = buildGibbousBellItem();
  phase.scale.setScalar(1.5);
  phase.position.set(0, 2.35, R * 0.5);
  phase.rotation.x = -0.55;
  shellN.add(phase);
  /* hit flash */
  const mdF = MD();
  lathe(mdF, [[R * 1.03, 0], [R * 0.62, 1.8], [0, 3.4]], { seg: 10, col: [1, 1, 1] });
  const flashM = mdMesh(mdF, new THREE.MeshBasicMaterial({
    color: 0xfff2dc, transparent: true, opacity: 0.6, depthWrite: false, side: THREE.DoubleSide,
  }), false);
  flashM.frustumCulled = false; flashM.visible = false;
  shellN.add(flashM);
  root.add(rollN);
  const shadow = blobShadow(2.0);
  root.add(shadow);
  root.visible = false;
  scene.add(root);

  /* THE SHOCKWAVE RING (phase two): one pooled ring, scaled every frame */
  const mdR = MD();
  for (let i = 0; i < 22; i++) {
    const a0 = i / 22 * TAU, a1 = (i + 1) / 22 * TAU;
    pushQuad(mdR, [Math.cos(a0), 0, Math.sin(a0)], [Math.cos(a1), 0, Math.sin(a1)],
      [Math.cos(a1) * 1.24, 0.5, Math.sin(a1) * 1.24], [Math.cos(a0) * 1.24, 0.5, Math.sin(a0) * 1.24],
      i % 2 ? [1, 0.9, 0.62] : [1, 0.72, 0.4]);
  }
  const ring = mdMesh(mdR, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false,
  }), false);
  ring.frustumCulled = false;
  ring.visible = false;
  scene.add(ring);
  return { root, bodyN, headN, rollN, tipN, shellN, mouthGlow, phase, eyeGlow, flashM, shadow, ring, mat, R };
}

const TORT_HP = 84;
const TORT = {
  c: null, active: false, defeated: false, bellTaken: false,
  phase: 0, st: 'sleep', t: 0, hp: TORT_HP, hpMax: TORT_HP,
  x: F3.x + 3, z: F3.z - 4, ang: 1.2, flash: 0,
  bodyHits: 0, mouthHits: 0, tip: 0, rollPh: 0, rollDir: [0, 1],
  ringOn: false, ringR: 0, ringHit: false, toneCD: 0, slamAlt: 0,
  barShown: false, bellX: F3.x, bellZ: F3.z, bellDown: false, wokeAt: 0,
};
TORT.c = buildHourTortoise();
function tortPhaseHp(ph) { return ph <= 1 ? TORT_HP : ph === 2 ? 56 : 28; }

/* the standing boss bar — the notches at 33.3% / 66.7% already line up
   with 28 / 56 of 84, exactly as they do for the crab and the wyrm */
let tortBarW = -1, tortFlashTimer = 0;
function refreshTortBar(hitFlash) {
  const want = TORT.active && !TORT.defeated;
  if (want !== TORT.barShown) {
    TORT.barShown = want;
    bossBarEl.classList.toggle('on', want);
    if (want) bossNameEl.textContent = 'THE HOUR TORTOISE';
    if (!want) bossBarEl.classList.remove('hit');
    tortBarW = -1;
  }
  if (!want) return;
  const w = Math.round(clamp(TORT.hp / TORT.hpMax, 0, 1) * 1000) / 10;
  if (w !== tortBarW) {
    tortBarW = w;
    bossFillEl.style.width = `calc((100% - 4px) * ${w / 100})`;
  }
  if (hitFlash) {
    bossBarEl.classList.add('hit');
    clearTimeout(tortFlashTimer);
    tortFlashTimer = setTimeout(() => bossBarEl.classList.remove('hit'), 130);
  }
}
function calmTortEyes(t) {
  const colA = TORT.c.eyeGlow.geometry.attributes.color;
  for (let i = 0; i < colA.count; i++) {
    colA.setXYZ(i, lerp(1.0, 0.35, t), lerp(0.62, 0.72, t), lerp(0.2, 0.55, t));
  }
  colA.needsUpdate = true;
}
function keepInPit(o, margin) {
  const dx = o.x - F3.x, dz = o.z - F3.z;
  const d = Math.hypot(dx, dz);
  const mx = F3.r - margin;
  if (d > mx) { o.x = F3.x + dx / d * mx; o.z = F3.z + dz / d * mx; return true; }
  return false;
}
/* the bell's mouth points along the root's local -X once it is tipped */
function tortMouthDir() {
  const a = TORT.ang;
  return [-Math.cos(a), Math.sin(a)];
}
function faceMouthAtPlayer() {
  const dx = P.x - TORT.x, dz = P.z - TORT.z;
  const l = Math.hypot(dx, dz) || 1;
  return Math.atan2(dz / l, -dx / l);
}
function dealTortDamage(n) {
  const T = TORT;
  if (!T.active || T.defeated) return;
  T.hp = Math.max(0, T.hp - n);
  refreshTortBar(true);
  if (T.hp <= 0) { startCine('tortCure'); return; }
  const thr = T.phase === 1 ? 56 : T.phase === 2 ? 28 : 0;
  if (T.phase < 3 && T.hp <= thr && T.st !== 'roar') {
    T.st = 'roar'; T.t = 0;
    SFX.tortCry(); CAM.shake = 0.35;
  }
}
function hitTortBody() {
  const T = TORT;
  T.bodyHits++;
  T.flash = 0.18;
  SFX.hit();
  P.hitstop = 3;
  CAM.shake = 0.12;
  rumble({ duration: 80, strong: 0.4, weak: 0.3 });
  const d = Math.hypot(P.x - T.x, P.z - T.z) || 1;
  const ex = T.x + (P.x - T.x) / d * 2.1, ez = T.z + (P.z - T.z) / d * 2.1;
  burst(psSpark, ex, groundH(ex, ez) + 1.4, ez, 11, 2.0, 1.5, 0.45);
  if (SAVE && !SAVE.bossHint3) {
    SAVE.bossHint3 = true; storeSave();
    showCaption('When it stops spinning — hit the MOUTH of the bell!', 3600);
  }
  dealTortDamage(3);
}
function hitTortMouth() {
  const T = TORT;
  T.mouthHits++;
  T.flash = 0.24;
  SFX.clawHit();
  SFX.bellTone(392, 1.1);
  P.hitstop = 5;
  CAM.shake = 0.24;
  rumble({ duration: 140, strong: 0.7, weak: 0.45 });
  burst(psSpark, T.x, groundH(T.x, T.z) + 1.8, T.z, 18, 2.5, 2.0, 0.5);
  burst(psSparkle, T.x, groundH(T.x, T.z) + 2.0, T.z, 12, 1.4, 1.2, 0.85);
  if (T.st === 'dizzy') T.t = Math.min(T.t, 1.5);
  dealTortDamage(15);
}
function tortSwingHits() {
  const T = TORT;
  if (!T.active || T.defeated || T.st === 'gone') return false;
  if (!inSwingArc(T.x, T.z, 4.3, 1.45)) return false;
  if (T.st === 'dizzy') {
    const md = tortMouthDir();
    const dx = P.x - T.x, dz = P.z - T.z, l = Math.hypot(dx, dz) || 1;
    if ((dx / l) * md[0] + (dz / l) * md[1] > -0.25) { hitTortMouth(); return true; }
  }
  hitTortBody();
  return true;
}
function tickTortoise() {
  const T = TORT;
  if (!T.c || T.defeated) return;
  const inPit = Math.hypot(P.x - F3.x, P.z - F3.z) < F3.r + 1;
  if (!T.active) {
    if (inPit) {
      /* proximity ALWAYS wakes a reachable guardian — the v4 law */
      T.active = true;
      if (T.phase === 0) T.phase = 1;
      T.hp = tortPhaseHp(T.phase);
      T.st = 'wake'; T.t = 0; T.wokeAt = simTick;
      SFX.tortCry(); SFX.bellTone(196, 1.2);
      CAM.shake = 0.32;
      rumble({ duration: 420, strong: 0.7, weak: 0.7 });
      refreshTortBar(false);
    }
    return;
  }
  if (!inPit && Math.hypot(P.x - F3.x, P.z - F3.z) > F3.r + 22) {
    /* left the pit entirely: it settles, at the phase you left it on */
    T.active = false; T.st = 'sleep'; T.t = 0;
    T.hp = tortPhaseHp(T.phase);
    T.x = F3.x + 3; T.z = F3.z - 4; T.tip = 0; T.ringOn = false;
    for (const g of FGULLS) if (g.summoned && !g.dead) { g.dead = true; g.m.root.visible = false; }
    refreshTortBar(false);
    return;
  }
  T.t += DT;
  if (T.flash > 0) T.flash -= DT;
  if (T.toneCD > 0) T.toneCD -= DT;
  const d2p = Math.hypot(P.x - T.x, P.z - T.z);
  const faceP = () => { T.ang = angLerp(T.ang, Math.atan2(P.x - T.x, P.z - T.z), 0.05); };
  switch (T.st) {
    case 'wake':
      T.tip = Math.max(0, T.tip - DT * 2);
      if (T.t > 1.6) { T.st = 'track'; T.t = 0; }
      break;
    case 'track': {
      faceP();
      T.tip = Math.max(0, T.tip - DT * 2.4);
      const d = d2p || 1;
      const sp = T.phase === 3 ? 1.5 : 1.2;
      T.x += (P.x - T.x) / d * sp * DT; T.z += (P.z - T.z) / d * sp * DT;
      keepInPit(T, 3.0);
      if (T.t > (T.phase === 3 ? 1.5 : 2.0)) {
        if (T.phase >= 2 && (T.slamAlt++ & 1) === 0 && d2p < 12) { T.st = 'slamTele'; T.t = 0; SFX.click(); }
        else { T.st = 'rollTele'; T.t = 0; SFX.tortCry(); }
      }
      break;
    }
    case 'rollTele':
      /* it withdraws: head and legs in, the bell tips over, ringing */
      faceP();
      T.tip = Math.min(1, T.tip + DT / 0.6);
      if ((simTick % 12) === 0) SFX.bellTone(261 + Math.random() * 30, 0.45);
      if ((simTick % 4) === 0) {
        psDust.spawn(T.x + (Math.random() - 0.5) * 3, groundH(T.x, T.z) + 0.3, T.z + (Math.random() - 0.5) * 3,
          0, 0.6, 0, 0.5);
      }
      if (T.t > 0.9) {
        const d = d2p || 1;
        T.rollDir = [(P.x - T.x) / d, (P.z - T.z) / d];
        T.ang = Math.atan2(T.rollDir[0], T.rollDir[1]);
        T.st = 'roll'; T.t = 0;
        SFX.tortRoll();
        rumble({ duration: 240, strong: 0.6, weak: 0.75 });
      }
      break;
    case 'roll': {
      T.tip = 1;
      const sp = T.phase === 3 ? 10.5 : 9.0;
      T.x += T.rollDir[0] * sp * DT; T.z += T.rollDir[1] * sp * DT;
      T.rollPh += sp / T.c.R * DT;
      if ((simTick % 7) === 0) {
        SFX.bellTone(196 + Math.random() * 40, 0.35);
        psDust.spawn(T.x, groundH(T.x, T.z) + 0.3, T.z, (Math.random() - 0.5) * 2, 0.9, (Math.random() - 0.5) * 2, 0.5);
      }
      if (Math.hypot(P.x - T.x, P.z - T.z) < 2.4 && P.fy - groundH(P.x, P.z) < 1.1) {
        hurtPlayer(1, T.x, T.z, T.c.root);
      }
      if ((keepInPit(T, 3.0) && T.t > 0.45) || T.t > 2.4) {
        T.st = 'dizzy'; T.t = 0;
        T.ang = faceMouthAtPlayer();
        CAM.shake = 0.5;
        SFX.thump(true); SFX.bellTone(147, 1.3);
        burst(psDust, T.x, groundH(T.x, T.z) + 0.6, T.z, 26, 3.0, 2.4, 0.9);
        rumble({ duration: 320, strong: 0.9, weak: 0.55 });
      }
      break;
    }
    case 'dizzy':
      /* wobbling to a stop, the open mouth toward you: the weak point */
      T.tip = 1;
      T.rollPh += Math.sin(T.t * 9) * 0.02;
      T.ang = angLerp(T.ang, faceMouthAtPlayer(), 0.012);
      if (T.t > 2.9) { T.st = 'stand'; T.t = 0; }
      break;
    case 'stand':
      T.tip = Math.max(0, 1 - T.t / 0.7);
      if (T.t > 0.7) { T.st = 'track'; T.t = 0; }
      break;
    case 'slamTele':
      faceP();
      T.tip = 0;
      if (T.t > 0.75) {
        T.st = 'slam'; T.t = 0;
        T.ringOn = true; T.ringR = 1.6; T.ringHit = false;
        SFX.thump(true); SFX.shockRing(); SFX.bellTone(110, 1.4);
        CAM.shake = 0.5;
        rumble({ duration: 300, strong: 0.95, weak: 0.6 });
        burst(psDust, T.x, groundH(T.x, T.z) + 0.4, T.z, 30, 3.2, 2.2, 0.9);
      }
      break;
    case 'slam':
      if (T.t > 1.9) { T.st = 'track'; T.t = 0; }
      break;
    case 'roar':
      T.tip = Math.max(0, T.tip - DT * 2.4);
      if (T.t > 1.5) {
        T.phase++;
        T.hp = tortPhaseHp(T.phase);
        refreshTortBar(false);
        T.st = 'track'; T.t = 0;
        if (T.phase === 3) { SFX.tortCry(); T.toneCD = 2.0; }
      }
      break;
  }
  /* THE SHOCKWAVE RING — JUMP it (the wyrm's tail sweep, reused verb) */
  if (T.ringOn) {
    T.ringR += 8.5 * DT;
    const dr = Math.abs(d2p - T.ringR);
    if (!T.ringHit && dr < 1.7 && P.fy - groundH(P.x, P.z) < 0.62) {
      T.ringHit = true;
      hurtPlayer(1, T.x, T.z, T.c.root);
    }
    if (T.ringR > F3.r + 4) T.ringOn = false;
  }
  /* PHASE THREE: it rings a tone, and gulls answer it */
  if (T.phase === 3 && T.st !== 'roar' && T.toneCD <= 0) {
    T.toneCD = 9.0;
    SFX.bellTone(659, 1.3); SFX.bellTone(880, 0.7);
    fCallGull(); fCallGull();
  }
}

<script>
/* ═══════════ p6e/6 — sky step three, the THIRD star, and THE SUN MOVES ═══════════
   The sun has been pinned at noon since the first frame of the game. From
   here it travels: a slow partial arc, noon → low gold → back, about six
   real minutes. SAFETY RAIL: this only ever ADDS shade. Springs, canopy,
   every authored shade circle, grottos, interiors and the Foundry stay
   permanently safe at any sun angle — the swelter rules are untouched.  */
const SKY3 = { zen: col(0x5f7ab4), hor: col(0xe2a173), fog: col(0xd6b291),
               world: [0.845, 0.79, 0.80], hemi: 0.26, sunI: 0.58 };
const SKYGOLD = { zen: col(0x3f66a6), hor: col(0xf2a659), fog: col(0xe0aa76),
                  world: [1.0, 0.86, 0.70], hemi: 0.22, sunI: 0.70 };
const SUN_NOON = [158, 238, 12], SUN_LOW = [34, 82, 288];
const SUN_L_NOON = [18, 60, 10], SUN_L_LOW = [7, 17, 58];
const SUN_DIR_NOON = [0.94, 0.34];       // the authored noon shadow direction
const SUN_DIR_A0 = Math.atan2(SUN_DIR_NOON[1], SUN_DIR_NOON[0]);
const SUN_PERIOD = 360;                   // seconds, noon → low gold → noon

let fSkyK = 0;        // 0..1 blend from the step-2 palette into step 3
let fSunK = 0;        // 0..1 noon → low gold
let fSunPhase = 0;    // the free-running arc
let fSunLive = false; // SAVE.sunArc
let fDomeK = -1, fPoolK = -1;

/* THE THIRD STAR */
let starMesh3 = null, star3CoreMat = null, star3FlareMat = null, star3Op = 0;
(function buildStar3() {
  starMesh3 = new THREE.Group();
  star3CoreMat = new THREE.MeshBasicMaterial({
    map: DOT_TEX, transparent: true, opacity: 0, fog: false,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const core = new THREE.Mesh(new THREE.PlaneGeometry(6.6, 6.6), star3CoreMat);
  core.frustumCulled = false;
  starMesh3.add(core);
  star3FlareMat = new THREE.MeshBasicMaterial({
    map: DOT_TEX, transparent: true, opacity: 0, fog: false,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const flare = new THREE.Mesh(new THREE.PlaneGeometry(14, 2.0), star3FlareMat);
  flare.frustumCulled = false;
  starMesh3.add(flare);
  starMesh3.position.set(-142, 128, 118);   // high and west, over the isles
  starMesh3.lookAt(0, 0, 0);
  starMesh3.visible = false;
  skyGrp.add(starMesh3);
  window.starMesh3 = starMesh3;
})();
function setStarOp3(v) {
  star3Op = v;
  star3CoreMat.opacity = v;
  star3FlareMat.opacity = v * 0.26;
  starMesh3.visible = v > 0.01;
}

const _fz = [0, 0, 0], _fh = [0, 0, 0], _fsun = [0, 0, 0];
const _fzB = [0, 0, 0], _fhB = [0, 0, 0], _ffB = [0, 0, 0], _fwB = [0, 0, 0], _fw2 = [0, 0, 0], _ffT = [0, 0, 0];
/* recolour the dome only when the light has actually moved — 252 verts is
   cheap but not free, and the arc takes three minutes to cross the sky */
function fApplySky(force) {
  if (!SAVE || SAVE.sky < 2) return;
  const zenB = mix3(SKY2.zen, SKY3.zen, fSkyK, _fzB);
  const horB = mix3(SKY2.hor, SKY3.hor, fSkyK, _fhB);
  const worB = mix3(SKY2.world, SKY3.world, fSkyK, _fwB);
  SKY.t = 2 + fSkyK;
  mix3(zenB, SKYGOLD.zen, fSunK * 0.85, _fz);
  mix3(horB, SKYGOLD.hor, fSunK, _fh);
  const k = fSkyK * 0.5 + fSunK;
  if (force || Math.abs(k - fDomeK) > 0.012) {
    fDomeK = k;
    const pos = skyDome.geometry.attributes.position, colA = skyDome.geometry.attributes.color;
    for (let i = 0; i < pos.count; i++) {
      const vy = pos.getY(i) / 430;
      const kk = Math.pow(clamp(1 - Math.max(0, vy), 0, 1), 2.1);
      colA.setXYZ(i, _fz[0] + (_fh[0] - _fz[0]) * kk,
        _fz[1] + (_fh[1] - _fz[1]) * kk, _fz[2] + (_fh[2] - _fz[2]) * kk);
    }
    colA.needsUpdate = true;
  }
  /* the world tint goes gold — held back a little so nothing turns orange */
  const w = mix3(worB, SKYGOLD.world, fSunK * 0.62, _fw2);
  WORLD_MAT.color.setRGB(w[0], w[1], w[2]);
  hemiLight.intensity = lerp(lerp(SKY2.hemi, SKY3.hemi, fSkyK), SKYGOLD.hemi, fSunK);
  sunLight.intensity = lerp(lerp(SKY2.sunI, SKY3.sunI, fSkyK), SKYGOLD.sunI, fSunK);
  sunLight.color.setRGB(1, lerp(0.78, 0.66, fSunK), lerp(0.58, 0.34, fSunK));
  /* THE SUN ITSELF */
  for (let i = 0; i < 3; i++) _fsun[i] = lerp(SUN_NOON[i], SUN_LOW[i], fSunK);
  sunDisc.position.set(_fsun[0], _fsun[1], _fsun[2]);
  if (sunDisc.children.length >= 2) {
    const halo = sunDisc.children[0].material, core = sunDisc.children[1].material;
    core.color.setRGB(1, lerp(1, 0.90, fSunK), lerp(1, 0.70, fSunK));
    halo.color.setRGB(1, lerp(1, 0.80, fSunK), lerp(1, 0.48, fSunK));
    halo.opacity = 0.35 + 0.40 * fSunK;
    sunDisc.scale.setScalar(1 + 0.5 * fSunK);        // low sun reads bigger
  }
  sunLight.position.set(lerp(SUN_L_NOON[0], SUN_L_LOW[0], fSunK),
    lerp(SUN_L_NOON[1], SUN_L_LOW[1], fSunK), lerp(SUN_L_NOON[2], SUN_L_LOW[2], fSunK));
  /* EVERY SHADOW SWINGS. SHADOW_DIR is the one direction the whole world's
     shade capsules, ground pools and Wick's own shadow are drawn from — and
     because a capsule always contains its own base circle, swinging and
     lengthening it can only ever ADD shade. Never a new way to die. */
  const a = SUN_DIR_A0 - 1.75 * fSunK;
  const mag = 1 + 0.55 * fSunK;
  SHADOW_DIR[0] = Math.cos(a) * mag;
  SHADOW_DIR[1] = Math.sin(a) * mag;
  /* a rebuild every ~5s is invisible on a 6-minute arc; every ~1.2s was a
     steady GC hitch on the Pi, forever, once the arc went live */
  if (force || Math.abs(fSunK - fPoolK) > 0.04) { fPoolK = fSunK; rebuildShadePools(); }
}
function fSunTargetFog() {
  mix3(SKY2.fog, SKY3.fog, fSkyK, _ffB);
  return mix3(_ffB, SKYGOLD.fog, fSunK * 0.8, _ffT);
}
function fSunReset() {
  fSunK = 0; fSunPhase = 0; fDomeK = -1; fPoolK = -1;
  SHADOW_DIR[0] = SUN_DIR_NOON[0]; SHADOW_DIR[1] = SUN_DIR_NOON[1];
  /* the sun's own materials are shared with every earlier phase: put them
     back exactly as they were built, or a NEW GAME keeps a gold noon */
  if (sunDisc && sunDisc.children.length >= 2) {
    sunDisc.children[0].material.color.setRGB(1, 1, 1);
    sunDisc.children[0].material.opacity = 0.35;
    sunDisc.children[1].material.color.setRGB(1, 1, 1);
    sunDisc.scale.setScalar(1);
  }
}

<script>
/* ═══════════ p6e/7 — the cure, the payoff, and both end cards ═══════════ */

/* the cure's rest spot, so a reloaded save always finds the bell where it
   was set down (nothing about the fight leaks into where the world is) */
const F_BELL_REST = { x: F3.x + 2.5, z: F3.z + 1.5 };
function fBellDetach(on) {
  const c = TORT.c;
  if (on) {
    if (c.rollN.parent !== scene) scene.add(c.rollN);
    c.rollN.position.set(F_BELL_REST.x, groundH(F_BELL_REST.x, F_BELL_REST.z), F_BELL_REST.z);
    c.rollN.rotation.set(0, 0.6, 0);
    c.tipN.rotation.z = 0;
  } else if (c.rollN.parent !== c.root) {
    c.root.add(c.rollN);
    c.rollN.position.set(0, 1.24, 0);
    c.rollN.rotation.set(0, 0, 0);
  }
}
function finishTortCure() {
  const T = TORT;
  T.defeated = true; T.active = false; T.st = 'gone';
  T.tip = 0; T.rollPh = 0; T.ringOn = false;
  T.c.root.visible = false;
  T.c.ring.visible = false;
  T.c.mouthGlow.material.opacity = 0;
  calmTortEyes(1);
  fBellDetach(true);
  T.c.rollN.visible = true;
  T.c.phase.visible = !T.bellTaken;
  for (const g of FGULLS) if (g.summoned) { g.dead = true; g.m.root.visible = false; }
  refreshTortBar(false);
  if (SAVE && !SAVE.tortoiseDone) { SAVE.tortoiseDone = true; storeSave(); }
  markCineSeen('tortCure');
}
/* THE CURE — it stops, sets the bell down gently, and the bell TOLLS BY
   ITSELF: the first hour struck in a year. Then it goes to the sea.
   Nothing dies. */
function tickTortCure(t) {
  const T = TORT, c = T.c;
  if (cineSeen('tortCure') && t > 0.9 && IN.confirm) {
    finishTortCure();
    endCine();
    return;
  }
  const gy = groundH(F_BELL_REST.x, F_BELL_REST.z);
  if (CINE.step === 0) {
    CINE.step = 1;
    T.defeated = true;
    if (SAVE) { SAVE.tortoiseDone = true; storeSave(); }
    T.ringOn = false;
    T.c.ring.visible = false;
    for (const g of FGULLS) if (g.summoned && !g.dead) popFGull(g);
    refreshTortBar(false);
    SFX.tortCry();
  }
  calmTortEyes(clamp(t / 1.6, 0, 1));
  /* it walks the bell to the middle of the pit and lowers it */
  if (t < 2.2) {
    const k = smoothstep(clamp(t / 2.2, 0, 1));
    T.x = lerp(T.x, F_BELL_REST.x, 0.03);
    T.z = lerp(T.z, F_BELL_REST.z, 0.03);
    T.tip = Math.max(0, T.tip - DT * 2.4);
    T.rollPh = angLerp(T.rollPh, 0, 0.09);      // the spin settles as it rights
    c.rollN.position.y = lerp(1.24, 0.55, k);
  } else if (t < 4.0) {
    const k = smoothstep(clamp((t - 2.2) / 1.8, 0, 1));
    c.rollN.position.y = lerp(0.55, 0.02, k);
    c.bodyN.position.z = k * 2.9;            // it steps out from under it
    if (CINE.step === 1 && t > 3.1) {
      CINE.step = 2;
      SFX.thump(false);
      burst(psDust, T.x, gy + 0.3, T.z, 20, 2.0, 1.2, 0.8);
    }
  } else {
    if (CINE.step === 2) {
      CINE.step = 3;
      /* THE BELL TOLLS BY ITSELF — nobody rang it */
      fBellDetach(true);
      c.rollN.position.y = groundH(F_BELL_REST.x, F_BELL_REST.z);
      c.root.position.set(T.x, groundH(T.x, T.z), T.z);
      SFX.hourToll();
      CAM.shake = 0.32;
      rumble({ duration: 1200, strong: 0.7, weak: 0.95 });
      showCaption('The first hour struck in a year.', 4200);
    }
    /* the toll: light rings breathing out of the mouth */
    const tk = t - 4.0;
    c.mouthGlow.material.opacity = Math.max(0, 0.7 * Math.exp(-tk * 0.42) * (0.6 + 0.4 * Math.sin(tk * 7)));
    if ((simTick % 5) === 0 && tk < 5) {
      burst(psSparkle, F_BELL_REST.x + (Math.random() - 0.5) * 4, gy + 0.5 + Math.random() * 3,
        F_BELL_REST.z + (Math.random() - 0.5) * 4, 3, 1.2, 1.0, 1.0);
    }
    /* and it trundles away, out through the works, toward the sea */
    if (tk > 1.2) {
      const wk = clamp((tk - 1.2) / 5.4, 0, 1);
      const tx = lerp(F_BELL_REST.x, FCOR23.ax, wk), tz = lerp(F_BELL_REST.z, FCOR23.az, wk);
      T.x = tx; T.z = tz;
      T.ang = angLerp(T.ang, Math.atan2(FCOR23.ax - F_BELL_REST.x, FCOR23.az - F_BELL_REST.z), 0.04);
      c.root.position.set(T.x, groundH(T.x, T.z), T.z);
      c.root.rotation.y = T.ang;
      c.root.visible = wk < 0.97;
    }
  }
  /* ONE slow continuous arc: the bell in frame the whole way, the tortoise
     leaving through it */
  const k2 = smoothstep(clamp(t / 11.4, 0, 1));
  const aa = lerp(T.ang + Math.PI + 0.5, T.ang + Math.PI - 1.1, k2);
  const rr = lerp(9.0, 7.4, k2);
  cineCam(F_BELL_REST.x + Math.sin(aa) * rr, gy + lerp(3.2, 2.2, k2), F_BELL_REST.z + Math.cos(aa) * rr,
    F_BELL_REST.x, gy + lerp(2.4, 1.5, k2), F_BELL_REST.z);
  if (t > 11.8) {
    finishTortCure();
    endCine();
  }
}

/* ═══ THE PAYOFF — THE SUN MOVES ═══ */
function fWheelSeat(ang) {
  const wy = _seaGroundH(WHEEL_POS.x, WHEEL_POS.z) + 4.2;
  return [WHEEL_POS.x + Math.cos(ang) * 3.1 * Math.cos(wheelRing.rotation.y),
          wy + Math.sin(ang) * 3.1,
          WHEEL_POS.z - Math.cos(ang) * 3.1 * Math.sin(wheelRing.rotation.y)];
}
function fSeatRelics(k) {
  /* k = 0 at the start of the third notch, 1 when it has turned */
  wheelRing.rotation.z = -(Math.PI / 2) - k * (Math.PI / 4);
  const b = fWheelSeat(Math.PI / 2 - k * Math.PI / 4);
  gibbousItem.visible = true;
  gibbousItem.scale.setScalar(0.9);
  gibbousItem.position.set(b[0], b[1], b[2]);
  gibbousItem.rotation.set(0, wheelRing.rotation.y, 0);
  const s = fWheelSeat(Math.PI / 4 - k * Math.PI / 4);
  if (typeof shieldItem !== 'undefined' && shieldItem) {
    shieldItem.visible = true;
    shieldItem.scale.setScalar(0.9);
    shieldItem.position.set(s[0], s[1], s[2]);
    shieldItem.rotation.set(0, wheelRing.rotation.y + Math.PI / 2, 0);
  }
  const cr = fWheelSeat(-k * Math.PI / 4);
  crescentItem.visible = true;
  crescentItem.scale.setScalar(0.8);
  crescentItem.position.set(cr[0], cr[1], cr[2]);
}
function fPayoffFlags() {
  QUEST.phases = 3;
  if (SAVE) {
    SAVE.ph = 3; SAVE.sky = 3; SAVE.sunArc = true;
    storeSave();
  }
  fSkyK = 1; fSunLive = true;
  setQuest(12);
  markCineSeen('bellWheel');
}
function tickBellWheel(t) {
  const wx = WHEEL_POS.x, wz = WHEEL_POS.z;
  const wy = _seaGroundH(wx, wz) + 4.2;
  if (cineSeen('bellWheel') && t > 0.9 && IN.confirm) {
    fPayoffFlags();
    fSeatRelics(1);
    setStarOp3(0.95);
    fSunK = 0.55; fSunPhase = Math.acos(1 - 2 * 0.55) / TAU;
    fApplySky(true);
    P.carryBell = false;
    endCine();
    fShowTBC(3);
    return;
  }
  if (t < 1.8) {
    /* the Gibbous Bell leaves Wick's hands and seats in the top socket */
    if (CINE.step === 0) {
      CINE.step = 1;
      P.carryBell = false;
      gibbousItem.visible = true;
      SFX.chime(0.7);
    }
    const k = smoothstep(clamp(t / 1.7, 0, 1));
    const s2 = fWheelSeat(Math.PI / 2);
    const sy = groundH(P.x, P.z) + 1.6;
    gibbousItem.scale.setScalar(lerp(0.62, 0.9, k));
    gibbousItem.position.set(lerp(P.x, s2[0], k), lerp(sy, s2[1], k) + Math.sin(k * Math.PI) * 1.5, lerp(P.z, s2[2], k));
    gibbousItem.rotation.set(0, lerp(0, wheelRing.rotation.y, k), (1 - k) * 2.0);
    cineCam(wx + 5.0, wy + 1.0, wz + 6.2, wx, wy + 2.6, wz);
    if (t > 1.65 && CINE.step === 1) {
      CINE.step = 2;
      SFX.chime(1.4);
      burst(psSparkle, s2[0], s2[1], s2[2], 20, 1.6, 1.0, 1.2);
    }
  } else if (t < 3.8) {
    /* the third notch */
    if (CINE.step === 2) { CINE.step = 3; SFX.grind(); rumble({ duration: 600, strong: 0.5, weak: 0.8 }); }
    const k = smoothstep(clamp((t - 1.9) / 1.7, 0, 1));
    fSeatRelics(k);
    CAM.shake = 0.05;
    cineCam(lerp(wx + 5.0, wx + 7.2, k), lerp(wy + 1.0, wy + 0.6, k), lerp(wz + 6.2, wz + 9.0, k),
      wx, lerp(wy + 2.6, wy + 1.5, k), wz);
    if (t > 3.55 && CINE.step === 3) {
      CINE.step = 4;
      SFX.bell(); SFX.hourToll();
      rumble({ duration: 900, strong: 0.9, weak: 0.9 });
      CAM.shake = 0.3;
    }
  } else if (t < 5.6) {
    /* the sky takes its third eighth; the THIRD star arrives */
    const k = smoothstep(clamp((t - 3.8) / 1.6, 0, 1));
    fSkyK = k;
    fApplySky(true);
    setStarOp3(clamp((t - 4.4) / 1.1, 0, 1) * 0.95);
    if (CINE.step === 4 && t > 4.6) { CINE.step = 5; SFX.night(); }
    const ck = smoothstep(clamp((t - 3.8) / 1.8, 0, 1));
    cineCam(lerp(wx + 7.2, wx - 3.0, ck), lerp(wy + 0.6, wy + 2.6, ck), lerp(wz + 9.0, wz + 8.0, ck),
      lerp(wx, wx + 26, ck), lerp(wy + 1.5, wy - 3.0, ck), lerp(wz, wz + 44, ck));
  } else {
    /* ═══ AND THEN THE SUN MOVES ═══
       Pinned at noon for the whole game. Now it slides, and every shadow in
       the world swings and lengthens under it. The light goes gold. */
    if (CINE.step === 5) {
      CINE.step = 6;
      fPayoffFlags();
      SFX.sunSwell();
      rumble({ duration: 1400, strong: 0.2, weak: 0.5 });
    }
    const k = smoothstep(clamp((t - 5.6) / 6.2, 0, 1));
    fSunK = k * 0.62;
    fSunPhase = Math.acos(clamp(1 - 2 * fSunK, -1, 1)) / TAU;
    fApplySky(false);
    if (CINE.step === 6 && t > 10.2) {
      CINE.step = 7;
      floatEl.textContent = '“...it MOVED. My clocks. My clocks might mean something.” — Granny Tock, below';
      floatEl.classList.add('on');
      SFX.yawn();
    }
    /* the shot: from the wheel hill, the sun and the whole of Brightharbor
       in one frame, the shadows reaching across the town as it falls */
    const ck = smoothstep(clamp((t - 5.6) / 6.4, 0, 1));
    cineCam(lerp(wx - 3.0, wx - 9.5, ck), lerp(wy + 2.6, wy + 4.0, ck), lerp(wz + 8.0, wz + 3.0, ck),
      lerp(wx + 26, wx + 30, ck), lerp(wy - 3.0, wy - 4.4, ck), lerp(wz + 44, wz + 54, ck));
    if (t > 12.0) {
      floatEl.classList.remove('on');
      endCine();
      fShowTBC(3);
    }
  }
}

/* ═══ THE END CARDS — phase two's, retrofitted, and phase three's own ═══ */
const TBC1_SUB = el('tbcSub').textContent;
const TBC_SUB = {
  2: 'Beyond the bay the sea has no other side. They say a keel worth it lies drowned in your own water.',
  3: 'A cool wind off the sea, and something green in the Parched Forest. The WAXING SLIVER is out there.',
};
/* the mending moon, painted honestly: n of eight lit, the rest a held outline */
function tbcMoon(g, cx, cy, R, n) {
  g.strokeStyle = 'rgba(214,224,220,0.30)'; g.lineWidth = 1.6;
  g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.stroke();
  const p = n / 8;
  g.save();
  g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.clip();
  g.fillStyle = '#e9efe6';
  g.beginPath(); g.arc(cx, cy, R, -Math.PI / 2, Math.PI / 2); g.fill();   // the lit limb
  /* the terminator ERASES back to sky — a painted band reads as a smudge */
  g.globalCompositeOperation = 'destination-out';
  g.beginPath(); g.ellipse(cx, cy, R * Math.abs(1 - 2 * p), R, 0, 0, TAU); g.fill();
  g.globalCompositeOperation = 'source-over';
  /* the faint ash-light on the dark side, so it still reads as a sphere */
  g.fillStyle = 'rgba(150,168,180,0.10)';
  g.beginPath(); g.arc(cx, cy, R, Math.PI / 2, -Math.PI / 2); g.fill();
  g.restore();
  /* the seam where it broke, faint across the disc */
  g.strokeStyle = 'rgba(120,140,150,0.35)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(cx - R * 0.7, cy - R * 0.5); g.lineTo(cx + R * 0.6, cy + R * 0.65); g.stroke();
}
function tbcStar(g, x, y, r) {
  const gr = g.createRadialGradient(x, y, 0.4, x, y, r * 7);
  gr.addColorStop(0, 'rgba(255,255,252,1)');
  gr.addColorStop(0.1, 'rgba(255,253,244,0.85)');
  gr.addColorStop(0.34, 'rgba(230,240,255,0.18)');
  gr.addColorStop(1, 'rgba(210,230,255,0)');
  g.fillStyle = gr;

      return {
        doorY: +F_DOOR_Y.toFixed(2), f1: +F1Y.toFixed(2), f2: +F2Y.toFixed(2),
        f2b: +F2BY.toFixed(2), f3: +F3Y.toFixed(2), mid: +F_MID_Y.toFixed(2),
        gate: fGateOpenNow, res: fResOpenNow, doorK: +FPZ.doorK.toFixed(2),
        glyphs: [!!(SAVE && SAVE.fGlyph1), !!(SAVE && SAVE.fGlyph2), !!(SAVE && SAVE.fGlyph3)],
        seq: FPZ.seq.slice(), order: FORDER.slice(), toneT: +FPZ.toneT.toFixed(2),
        tort: { st: TORT.st, phase: TORT.phase, hp: TORT.hp, active: TORT.active, done: TORT.defeated },
        gulls: FGULLS.filter(g => !g.dead).length,
      };
    },
    sunInfo() {
      return {
        live: fSunLive, k: +fSunK.toFixed(3), phase: +fSunPhase.toFixed(4),
        skyStep3: +fSkyK.toFixed(3), period: SUN_PERIOD,
        sun: [+sunDisc.position.x.toFixed(1), +sunDisc.position.y.toFixed(1), +sunDisc.position.z.toFixed(1)],
        light: [+sunLight.position.x.toFixed(1), +sunLight.position.y.toFixed(1), +sunLight.position.z.toFixed(1)],
        shadowDir: [+SHADOW_DIR[0].toFixed(3), +SHADOW_DIR[1].toFixed(3)],
        star3: +star3Op.toFixed(2),
      };
    },
    /* setup helpers (never used to fake a mechanic — only to reach one) */
    sunSet(k) {
      fSunLive = true;
      fSunK = clamp(k, 0, 1);
      fSunPhase = Math.acos(clamp(1 - 2 * fSunK, -1, 1)) / TAU;
      fApplySky(true);
      return window.__fmDebug.sunInfo();
    },
    openFoundry() { if (SAVE) { SAVE.watchBell = true; storeSave(); } applyWorldState(); return fGateOpenNow; },
    /* the magenta-void wall probe must hide the THIRD star too, or a phase-
       three save leaves one additive sprite burning through the orbit */
    skyProbe(on) {
      _isleSkyProbe(on);
      if (starMesh3) starMesh3.visible = !on && star3Op > 0.01;
    },
    tortSet(hp, phase) {
      TORT.phase = phase || TORT.phase || 1;
      TORT.hp = hp;
      refreshTortBar(false);
      return { hp: TORT.hp, phase: TORT.phase };
    },
  });
}
</script>
