<script>
/* ═══════════════════════════════════════════════════════════════════════
   PHASE 5, PART ONE — THE RIVER'S MOUTH (p6i-mouth)

   Owns: the SLUICE (three ancient gates opened IN TIME with the river's
   surge — the bell/organ lineage: keep time with the river, no text),
   THE RIVER FALLS cinematic, the RAPIDS terrain + water connecting the
   Silverrun's dead end to the bay, the carved bay channel + MOUTH POOL,
   and the boat REFIT MECHANICS (swing keel + stern paddlewheel — the
   flags are p6j's story beat; the physics and the metal are here).

   Concatenated AFTER p6h-green.html: RUN / runNear / riverSurfaceAt /
   riverDepthAt / riverWet / LANDINGS / FORDS are in scope, as are the
   boat (BOAT / tickSailing / poseBoatOnSwell / waterDepthAt) and every
   earlier authority. p6j-night loads after this file and consumes ONLY
   the interface below, by feature detection.

   ── INTERFACE (consumed by p6j; stable) ──────────────────────────────
   SLUICE               {x,z}         where p6h's river dies (surface 4.77)
   S_GATES              [{x,z,need}]  the three gates, river → bay order
   MOUTH_POOL           {x,z,r}       the rapids' mouth pool in the bay
   ANCHORAGE            {x,z}         deep-bay flotilla wait (depth ≥ 2m,
                                      nothing registered there)
   FIRST_FORD_D         150           p6h run-distance of the boat's limit
   window.__mouthOpenNow()            true once the river runs to the bay
   window.__lowerRiverAt(x,z)         water surface y of the lower river
                                      (sluice reaches, rapids, pool,
                                      carved channel) or null
   window.__lowerRiverDepth(x,z)      depth ≥ 0 of that water (0 = dry)
   window.__riverSpineLower           ordered [{x,z,y}] SLUICE → … →
                                      MOUTH_POOL → bay
   window.__sluicePulseK()            the river's pulse, 0..1 (1 = surge
                                      window open; period 4 s, window
                                      1.3 s) — p6j keeps this time
   window.__refitCine5()              plays the refit beat; SETS
                                      swingKeel + paddleWheel itself
                                      (idempotent) and applies them live
   window.__mouthGroundQ(x,z)         true where this part owns ground
                                      (harness sweep consults it)
   Save flags owned here (p2-core): mouthOpen, sluiceG (0-3), swingKeel,
   paddleWheel  (+ the rest of the phase-5 schema for p6j: poleFound,
   braziers[], marketOpen, sliver5, pennant, spyglass, fireworks,
   marketHeart, tbc5Seen).
   Quest staging owned here: q18 (→ ANCHORAGE via the shore path) and
   q19 (→ the next gate via the pass path). q20-22 pass through to p6j.
   ─────────────────────────────────────────────────────────────────────── */
window.__worldStateHooks = window.__worldStateHooks || [];
window.__telemetryHooks = window.__telemetryHooks || [];

/* ── pinned geography (authoritative; p6j mirrors these) ── */
const SLUICE = { x: 269, z: 62 };            // p6h's river dies here (4.77 m)
const MOUTH_POOL = { x: 118, z: 40, r: 14 };
const ANCHORAGE = { x: 70, z: 30 };
const FIRST_FORD_D = 150;                    // p6h run-distance; FORDS[0]

/* ── the LOWER RIVER SPINE — authored nodes, SLUICE → bay ──
   zone: head (the river standing against gate 1) · r1/r2 (the built
   sluice reaches, berm-banked) · rap (the stepped white-water descent)
   · glide (the wadeable bar the walk route crosses — depth ~0.5, which
   is exactly why the SWING KEEL exists) · pool · chan (carved bay
   channel, joins the bay ≥ 1.3 m deep). Surfaces drop 4.77 → −0.55:
   the pinned 5.3 m over ~170 m. */
const LRN = [
  { x: 268.9, z: 61.6, y: 4.77, zone: 'head' },
  { x: 266.5, z: 57.0, y: 4.77, zone: 'head' },   // ← GATE 1 (the head wall)
  { x: 261.5, z: 51.0, y: 3.20, zone: 'r1' },
  { x: 256.0, z: 47.5, y: 3.20, zone: 'r1' },
  { x: 250.0, z: 45.0, y: 3.20, zone: 'r1' },     // ← GATE 2
  { x: 243.0, z: 43.2, y: 2.35, zone: 'r2' },
  { x: 236.0, z: 41.0, y: 2.35, zone: 'r2' },
  { x: 226.0, z: 40.4, y: 2.35, zone: 'r2' },     // ← GATE 3
  { x: 217.0, z: 39.6, y: 1.70, zone: 'rap' },
  { x: 209.0, z: 39.0, y: 1.32, zone: 'rap' },
  { x: 197.0, z: 37.6, y: 0.98, zone: 'rap' },
  { x: 184.5, z: 36.4, y: 0.60, zone: 'rap' },    // the pine narrows
  { x: 172.0, z: 35.3, y: 0.30, zone: 'rap' },
  { x: 159.0, z: 35.1, y: 0.02, zone: 'rap' },
  { x: 147.0, z: 36.3, y: -0.28, zone: 'glide' },
  { x: 137.0, z: 37.9, y: -0.44, zone: 'glide' },
  { x: 128.0, z: 39.3, y: -0.55, zone: 'glide' },
  { x: 118.0, z: 45.5, y: -0.55, zone: 'pool' },
  { x: 107.0, z: 41.3, y: -0.55, zone: 'chan' },
  { x: 97.0, z: 41.3, y: -0.55, zone: 'chan' },
  { x: 87.0, z: 40.3, y: -0.55, zone: 'chan' },
];
const LR_GATE_I = [1, 4, 7];                 // node index of each gate
/* arc-length + per-node frames */
(function lrFrames() {
  let s = 0;
  for (let i = 0; i < LRN.length; i++) {
    const a = LRN[i], b = LRN[Math.min(i + 1, LRN.length - 1)];
    const p = LRN[Math.max(i - 1, 0)];
    let fx = b.x - p.x, fz = b.z - p.z;
    const L = Math.hypot(fx, fz) || 1;
    a.fx = fx / L; a.fz = fz / L;            // bayward (downstream) +
    a.nx = -a.fz; a.nz = a.fx;               // left-hand perp
    a.s = s;
    if (i < LRN.length - 1) s += Math.hypot(b.x - a.x, b.z - a.z);
  }
})();
const LR_LEN = LRN[LRN.length - 1].s;
const S_GATES = LR_GATE_I.map((gi, k) => {
  const n = LRN[gi];
  return { x: n.x, z: n.z, s: n.s, i: gi, need: k + 1,
           fx: n.fx, fz: n.fz, nx: n.nx, nz: n.nz,
           hi: n.y, lo: LRN[gi + 1].y };
});
/* zone widths: [flat-bottom half, wetted half, carve-blend half] */
const LR_W = {
  head: [3.4, 5.2, 0],       // no carve under the standing river
  r1: [2.6, 4.0, 6.6], r2: [2.6, 4.0, 6.6],
  rap: [3.0, 4.2, 7.0],
  glide: [4.5, 6.0, 9.0],
  pool: [0, 0, 0],           // the pool carves as its own disc
  chan: [3.2, 5.0, 8.0],
};
const LR_NAVD = { head: 0, r1: 1.15, r2: 1.1, rap: 0.95, glide: 0.5, pool: 0, chan: 1.6 };

/* THE HEAD SPILL — the lane the falling river cuts from the upper reach
   into the head pool. The old dead-end bank stands across the corridor
   with a hand's depth of water over it: the ONE pinch that made
   "sailable from the mouth pool to the first ford" untrue (the refit
   boat grinds to a halt on it; measured 0.15 m over the bar). A year of
   the river pouring through the gates cuts its own spill channel — carve
   it like every other lane: analytic here, measured + boosted below, cut
   into the rendered sheets by the same pass. The shape fades out east of
   x≈281 so it lives entirely inside the mouth mask. */
const HEAD_SPILL = [282.5, 67.6, 278.2, 65.2, 273.6, 63.2];
let HS_BOOST = 0;
function headSpillDist(x, z) {
  let bd2 = 1e18;
  for (let i = 0; i + 3 < HEAD_SPILL.length; i += 2) {
    const ax = HEAD_SPILL[i], az = HEAD_SPILL[i + 1];
    const bx = HEAD_SPILL[i + 2], bz = HEAD_SPILL[i + 3];
    const dx = bx - ax, dz = bz - az;
    const t = clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz), 0, 1);
    const px = ax + dx * t, pz = az + dz * t;
    const d2 = (x - px) * (x - px) + (z - pz) * (z - pz);
    if (d2 < bd2) bd2 = d2;
  }
  return Math.sqrt(bd2);
}
/* the spill's standing surface: the head pool's level at the pool end,
   easing up to meet the river's own sheet at the east hand-off */
function moSpillSurfY(x) { return lerp(4.77, 4.90, clamp((x - 273.6) / 8.9, 0, 1)); }
function headSpillCut(x, z, h) {
  const d = headSpillDist(x, z);
  if (d >= 6.0) return h;
  const bed = 3.92 - HS_BOOST;
  let t = d <= 2.2 ? 1 : 1 - smoothstep((d - 2.2) / 3.8);
  /* fade to NOTHING before x=282 — the rendered-sheet cut pass only
     touches x<282, and rendered must equal authority everywhere. The
     river's own bed is already boat-deep by x≈280 on this line. */
  t *= 1 - smoothstep(clamp((x - 279.0) / 2.4, 0, 1));
  return lerp(h, Math.min(h, bed), t);
}

/* nearest point on the spine: {i, t, d (unsigned), off (signed), s, surf} */
function lrNear(x, z) {
  let bi = 0, bt = 0, bd2 = 1e18;
  for (let i = 0; i < LRN.length - 1; i++) {
    const a = LRN[i], b = LRN[i + 1];
    const dx = b.x - a.x, dz = b.z - a.z;
    const L2 = dx * dx + dz * dz || 1;
    const t = clamp(((x - a.x) * dx + (z - a.z) * dz) / L2, 0, 1);
    const px = a.x + dx * t, pz = a.z + dz * t;
    const d2 = (x - px) * (x - px) + (z - pz) * (z - pz);
    if (d2 < bd2) { bd2 = d2; bi = i; bt = t; }
  }
  const a = LRN[bi], b = LRN[bi + 1];
  const segL = Math.hypot(b.x - a.x, b.z - a.z) || 1;
  const px = a.x + (b.x - a.x) * bt, pz = a.z + (b.z - a.z) * bt;
  const fx = (b.x - a.x) / segL, fz = (b.z - a.z) / segL;
  const off = (x - px) * -fz + (z - pz) * fx;
  return { i: bi, t: bt, d: Math.sqrt(bd2), off,
           s: a.s + segL * bt, surf: lerp(a.y, b.y, bt),
           zone: bt < 0.5 ? a.zone : b.zone, fx, fz, px, pz };
}
function lrZoneW(zone) { return LR_W[zone] || LR_W.rap; }

/* ── the coarse near-mask (the groundH wrap must reject cheaply) ── */
const MOM_X0 = 80, MOM_Z0 = 18, MOM_S = 4;
const MOM_W = Math.ceil((284 - MOM_X0) / MOM_S), MOM_H = Math.ceil((78 - MOM_Z0) / MOM_S);
const MOMASK = new Uint8Array(MOM_W * MOM_H);
function mouthNearQ(x, z) {
  if (x < MOM_X0 || z < MOM_Z0) return false;
  const ix = (x - MOM_X0) / MOM_S | 0, iz = (z - MOM_Z0) / MOM_S | 0;
  if (ix >= MOM_W || iz >= MOM_H) return false;
  return MOMASK[iz * MOM_W + ix] === 1;
}
window.__mouthGroundQ = mouthNearQ;
window.__mouthCorridorQ = mouthNearQ;

/* ── the CARVE — one analytic pass over the pre-existing chain ──
   Lowers a bed under the authored surfaces, raises the sluice berms and
   the head wall, digs the pool bowl (deep north lane, wadeable south
   shelf — the foot road to the forest crosses there) and the bay
   channel. Where it does nothing it returns base EXACTLY, so the two
   lattice fields below equal the pre-existing fields outside it. */
const _moGroundH = groundH;                  // the pre-phase-5 chain
/* per-node carve deepening, tuned by MEASUREMENT below: the lattice
   under-carves a narrow profile wherever its nearest vertex falls on the
   wall slope, so the analytic target is deepened until the INTERPOLATED
   lane actually holds the water the zone promises */
const LR_BOOST = new Float32Array(LRN.length);
function moPoolDepth(x, z) {
  /* deep lane north (z ≥ 41), shelf south (z ≤ 36.5); never carved
     north of z 51 (the pass wall owns z > 53) */
  const zz = clamp(z, 24, 51);
  const k = smoothstep(clamp((zz - 38) / 10, 0, 1));
  return lerp(0.35, 2.3, k);
}
function moCarveRaw(x, z, base) {
  let h = base;
  /* the pool disc */
  {
    const dp = Math.hypot(x - MOUTH_POOL.x, z - MOUTH_POOL.z);
    if (dp < MOUTH_POOL.r + 3 && z < 51.5) {
      const w = smoothstep(clamp((MOUTH_POOL.r + 2.5 - dp) / 4.5, 0, 1));
      const bed = -0.55 - moPoolDepth(x, z);
      h = lerp(h, Math.min(h, bed), w);
    }
  }
  const r = lrNear(x, z);
  const zw = lrZoneW(r.zone);
  const ad = Math.abs(r.off);
  if (r.zone !== 'head' && r.zone !== 'pool' && zw[2] > 0 && ad < zw[2]) {
    const boost = Math.max(LR_BOOST[r.i], LR_BOOST[Math.min(r.i + 1, LRN.length - 1)]);
    const nav = (LR_NAVD[r.zone] || 0.9) + boost;
    const bed = r.surf - nav;
    let t;
    if (ad <= zw[0]) t = 1;
    else t = 1 - smoothstep((ad - zw[0]) / (zw[2] - zw[0]));
    h = lerp(h, Math.min(h, bed), t);
    /* the sluice berms: the raceway rides the pass floor, banked */
    if (r.zone === 'r1' || r.zone === 'r2') {
      const bermY = r.surf + (r.zone === 'r1' ? 0.55 : 0.55);
      if (ad > zw[1] && ad < zw[1] + 2.6) {
        const bw = Math.sin(Math.PI * clamp((ad - zw[1]) / 2.6, 0, 1));
        h = Math.max(h, lerp(h, bermY, bw * 0.9));
      }
    }
  }
  /* THE HEAD WALL: a stone weir across the river's dead-end pool, gate 1
     in the middle — it is why the pool never poured down the pass, and
     it is now the dry way across the river head */
  {
    const g = S_GATES[0];
    const alo = (x - g.x) * g.fx + (z - g.z) * g.fz;    // along flow
    const off = (x - g.x) * g.nx + (z - g.z) * g.nz;
    const aw = 1 - smoothstep(clamp((Math.abs(alo) - 1.1) / 1.5, 0, 1));
    if (aw > 0 && Math.abs(off) > 2.3 && Math.abs(off) < 13) {
      const ow = 1 - smoothstep(clamp((Math.abs(off) - 10.5) / 2.5, 0, 1));
      h = Math.max(h, lerp(h, 5.3, aw * ow));
    }
  }
  /* the gate notches: through every opening the bed carries the LOWER
     reach's draft, so a hull crosses the sill instead of striking it */
  for (let k = 0; k < S_GATES.length; k++) {
    const g = S_GATES[k];
    const alo = (x - g.x) * g.fx + (z - g.z) * g.fz;
    const off = (x - g.x) * g.nx + (z - g.z) * g.nz;
    if (Math.abs(alo) < 3.0 && Math.abs(off) < 2.3) {
      const bed = g.lo - 1.05 - LR_BOOST[g.i];
      const w = (1 - smoothstep(clamp((Math.abs(alo) - 1.2) / 1.8, 0, 1)))
              * (1 - smoothstep(clamp((Math.abs(off) - 1.4) / 0.9, 0, 1)));
      h = lerp(h, Math.min(h, bed), w);
    }
  }
  /* the head spill lane (upper reach ↔ head pool) */
  h = headSpillCut(x, z, h);
  /* THE FOOT ROAD KEEPS ITS CROSSING: the family's walk line bay ↔ pass
     crosses this water exactly once — over the glide and the pool's
     south shelf. Whatever the shapes above carved, the walk band wades:
     bed clamped to half a metre under the LOCAL surface, never deeper. */
  {
    let bd = 1e9;
    for (let i = 0; i < MO_WALK.length - 1; i++) {
      const a = MO_WALK[i], b = MO_WALK[i + 1];
      const dx = b[0] - a[0], dz = b[1] - a[1];
      const L2 = dx * dx + dz * dz || 1;
      const t = clamp(((x - a[0]) * dx + (z - a[1]) * dz) / L2, 0, 1);
      const d = Math.hypot(x - (a[0] + dx * t), z - (a[1] + dz * t));
      if (d < bd) bd = d;
    }
    const full = x >= 111 ? 5.0 : 2.6, fade = x >= 111 ? 2.2 : 1.6;
    if (bd < full + fade) {
      const w = 1 - smoothstep(clamp((bd - full) / fade, 0, 1));
      const floor = r.surf - 0.52;
      h = lerp(h, Math.max(h, floor), w);
    }
  }
  return h;
}
const MO_WALK = [[95, 34], [108, 35.2], [120, 36.3], [132, 37.4], [146, 38.6]];
/* fill the near-mask: a cell is NEAR if the carve could touch it */
(function bakeMouthMask() {
  for (let iz = 0; iz < MOM_H; iz++) {
    for (let ix = 0; ix < MOM_W; ix++) {
      const x = MOM_X0 + ix * MOM_S + MOM_S / 2, z = MOM_Z0 + iz * MOM_S + MOM_S / 2;
      const r = lrNear(x, z);
      const dp = Math.hypot(x - MOUTH_POOL.x, z - MOUTH_POOL.z);
      if (r.d < 16 || dp < MOUTH_POOL.r + 6 || headSpillDist(x, z) < 12) MOMASK[iz * MOM_W + ix] = 1;
    }
  }
})();
/* the two lattice fields — Brightharbor's lattice west of 110, the
   forest's east of it: makeMeshField discipline, rendered == physics */
let moBayField = null, moForestField = null;
function moRebuildFields() {
  moBayField = makeMeshField((x, z) => moCarveRaw(x, z, _moGroundH(x, z)),
    -110, -110, 110, 186, 2.2, BAY_FINE);
  moForestField = makeMeshField((x, z) => moCarveRaw(x, z, _moGroundH(x, z)),
    110, -38, 2182, 1402, 8, FOREST_FINE);
}
moRebuildFields();
function mouthGroundAt(x, z) {
  return x >= 110 ? moForestField(x, z) : moBayField(x, z);
}
/* MEASURE, THEN CARVE DEEPER: the lane the water promises is sampled
   against the interpolated field, and every deficit deepens its nodes'
   analytic target until the promise measures true. Runs BEFORE the
   sheets are cut, so rendered == physics == the tuned field. */
/* the promises the probe asserts: everything ABOVE the glide is
   swing-keel water (she grounds at 0.28 there), so 0.6-odd is honest;
   the glide itself is the keel's whole reason (≈ 0.5, wadeable) */
const LR_LANE_MIN = { r1: 0.7, r2: 0.7, rap: 0.62, glide: 0.45, chan: 1.3 };
(function tuneLane() {
  for (let it = 0; it < 18; it++) {
    let deficits = 0;
    const add = new Float32Array(LRN.length);      // per-pass deltas ACCUMULATE
    for (let s = S_GATES[0].s + 3; s < LR_LEN - 2; s += 0.5) {
      let i = 0;
      while (i < LRN.length - 2 && LRN[i + 1].s < s) i++;
      const a = LRN[i], b = LRN[i + 1];
      const t = clamp((s - a.s) / ((b.s - a.s) || 1), 0, 1);
      const zone = t < 0.5 ? a.zone : b.zone;
      const want = LR_LANE_MIN[zone];
      if (want === undefined) continue;
      const x = lerp(a.x, b.x, t), z = lerp(a.z, b.z, t);
      const nx = -(b.z - a.z), nz = b.x - a.x;
      const nl = Math.hypot(nx, nz) || 1;
      const surf = lerp(a.y, b.y, t);
      /* the lane is a boat wide, not a line: sample across it */
      let dep = 1e9;
      for (const u of [-1.1, 0, 1.1]) {
        dep = Math.min(dep, surf - mouthGroundAt(x + nx / nl * u, z + nz / nl * u));
      }
      if (dep < want) {
        const need = (want - dep) + 0.16;
        add[i] = Math.max(add[i], need);
        add[i + 1] = Math.max(add[i + 1], need);
        deficits++;
      }
    }
    if (!deficits) break;
    for (let i = 0; i < LRN.length; i++) LR_BOOST[i] += add[i];
    moRebuildFields();
  }
})();
/* the head spill measures like every lane: keel-water (0.62) across a
   boat-width on the INTERPOLATED field, or the pinch is still the pinch */
(function tuneSpill() {
  const N = HEAD_SPILL.length / 2 - 1;
  for (let it = 0; it < 8; it++) {
    let worst = 9;
    for (let seg = 0; seg < N; seg++) {
      const ax = HEAD_SPILL[seg * 2], az = HEAD_SPILL[seg * 2 + 1];
      const bx = HEAD_SPILL[seg * 2 + 2], bz = HEAD_SPILL[seg * 2 + 3];
      const L = Math.hypot(bx - ax, bz - az);
      const nx = -(bz - az) / L, nz = (bx - ax) / L;
      for (let t = 0; t <= 1.0001; t += 0.12) {
        const x = lerp(ax, bx, t), z = lerp(az, bz, t);
        if (x > 278.6) continue;                       // the east fade is the river's own deep water
        for (const u of [-1.1, 0, 1.1]) {
          worst = Math.min(worst, 4.77 - mouthGroundAt(x + nx * u, z + nz * u));
        }
      }
    }
    if (worst >= 0.62) break;
    HS_BOOST += (0.62 - worst) + 0.14;
    moRebuildFields();
  }
})();
groundH = function (x, z) {
  if (mouthNearQ(x, z)) return mouthGroundAt(x, z);
  return _moGroundH(x, z);
};
</script>
<script>
/* ═══════════ p6i/2 — the carve, cut into the sheets that render it ═══════════
   p6d's harbour-gap pattern: the ground was finalised long ago, so the
   channel is cut by moving the rendered sheets' OWN vertices onto the
   new fields and re-baking their colours. Trees riding the changed
   ground TRANSLATE with it whole (registry-true: bases stay on groundH,
   trunks keep colliding, canopies keep shading — the trees suite stays
   green by construction). */
/* NEAR-ACHROMATIC on purpose: p6h's re-green relerps every forest ground
   vertex it snapshots, and it snapshots AFTER this carve — grey (sat <
   0.055) is what its greenify() leaves untouched. A green riverbed is
   worse than a grey one. */
const C_MOBED = col(0x787672), C_MOBED2 = col(0x5c5a57), C_MOWET = col(0x6c6b66),
      C_MOCUT = col(0x86847e), C_MOCUT2 = col(0xa3a09a), C_MOGRAVEL = col(0x98958e),
      C_MOSTONE = col(0x8f8d86), C_MOSTONE2 = col(0x6e6c66);
const _moc = [0, 0, 0], _mbc = [0, 0, 0];
function moGroundColor(x, z, y) {
  const n = vnoise(x * 0.11, z * 0.11), n2 = vnoise(x * 0.31 + 5, z * 0.31);
  const r = lrNear(x, z);
  const dep = clamp((r.surf - y) / 2.2, 0, 1);

/* ── THE REFIT BEAT — p6j calls __refitCine5(); the flags are set HERE

      lerp(bx, moCine0.lx, k), lerp(by + 0.4, moCine0.ly, k), lerp(bz, moCine0.lz, k));

<script>
/* ═══════════ p6i/8 — wiring: derive, interact, compass, frame, telemetry ═══════════ */

/* the one derivation — everything phase-5-part-one, from the save, both
   ways: gates snap to their state, sheets to theirs, the refit to its */
function moDeriveWorld(S) {
  const open = S ? clamp(S.sluiceG | 0, 0, 3) : 0;
  for (let k = 0; k < MOGATES.length; k++) {
    const G = MOGATES[k];
    G.giving = false;
    G.slabK = open > k ? 1 : 0;
    G.progress = 0;
    G.grp.position.y = G.sillY - G.slabK * 4.15;
  }
  moFill[0] = open >= 1 ? 1 : 0;
  moFill[1] = open >= 2 ? 1 : 0;
  moFill[2] = (S && S.mouthOpen) ? 1 : 0;
  moRunFrontS = -1;
  moRunDrawFront(-1);
  moBoatDy = 0;
  moKeel.foldK = 0;
  if (moKeel.ok && !moSwingKeel()) moKeel.pivot.rotation.x = 0;
  if (moPaddleGrp) moPaddleGrp.visible = !!(S && S.paddleWheel);
  moPaddleK = 0;
  MOP.engaged = -1;
  for (const R of moRings) { R.t = -1; R.m.visible = false; }
}
window.__worldStateHooks.push(function (S) { moDeriveWorld(S); });

/* ── interactions: the wheel prompt (label only — the rhythm tick owns
   the button), and going ashore up the reaches ── */
const _moInteract = currentInteract;
currentInteract = function () {
  if (P.sailing && !VOYAGE.active && BOAT.spd < 2.4 && moBoatDy > 0.02) {
    const s = moAshoreSpot();
    if (s) return { id: 'moAshore', label: '✕ COME ASHORE' };
  }
  if (!P.sailing && !P.skiffing && moSluiceReady()) {
    const G = moActiveGate();
    if (G && Math.hypot(P.x - G.wx, P.z - G.wz) < 3.2) {
      return { id: 'moWheel', label: '✕ THE GATE WHEEL' };
    }
  }
  return _moInteract();
};
const _moDoInteract = doInteract;
doInteract = function (ctx) {
  if (ctx.id === 'moWheel') return;              // the rhythm tick owns ✕ here
  if (ctx.id === 'moAshore') {
    const s = moAshoreSpot();
    if (!s) return;
    P.sailing = false;
    P.x = s.x; P.z = s.z; P.fy = s.y; P.air = false;
    P.vx = 0; P.vz = 0; P.st = 'idle';
    sailboatColl.off = false;
    sailboatColl.x = BOAT.x; sailboatColl.z = BOAT.z;
    if (SAVE) { SAVE.boatX = BOAT.x; SAVE.boatZ = BOAT.z; SAVE.boatAng = BOAT.ang; storeSave(); }
    SFX.splashSm ? SFX.splashSm() : SFX.splash();
    return;

};

/* ── the compass follows paths (q18 / q19 are staged; q20+ are p6j's) ──
   The shore road bay ↔ pass camp is the same line the family walks; the
   pointer walks it node by node in either direction. */
const MO_PATH = [
  { x: 88, z: 33 }, { x: 95, z: 34 }, { x: 108, z: 35 }, { x: 120, z: 36.5 },
  { x: 138, z: 38 }, { x: 170, z: 41 }, { x: 200, z: 44 }, { x: 226, z: 50 },
  { x: 243, z: 57 },
];
function moPathNext(toEast) {
  const ch = toEast ? MO_PATH : MO_PATH.slice().reverse();
  let ni = 0, nd = 1e9;
  for (let i = 0; i < ch.length; i++) {
    const d = Math.hypot(P.x - ch[i].x, P.z - ch[i].z);
    if (d < nd) { nd = d; ni = i; }

}
const _moObjPoint = objectivePoint;
objectivePoint = function () {
  if (SAVE) {

      /* the lights on the water: afloat, straight to them; ashore, down
         the shore road to the water's edge nearest the anchorage */
      if (P.sailing || P.skiffing) return { x: ANCHORAGE.x, z: ANCHORAGE.z };
      if (P.x > 100) return moPathNext(false);
      return { x: ANCHORAGE.x, z: ANCHORAGE.z };
    }
    if (QUEST.q === 19 && SAVE.mouthOpen) {
      /* the mouth is OPEN and the next step is the TRADER — without this
         the finished order fell through to the Moonwheel idle-drift while
         the banner still read 'open the river's mouth' (John, night one) */
      if (P.sailing || P.skiffing) return { x: ANCHORAGE.x, z: ANCHORAGE.z };
      if (P.x > 100) return moPathNext(false);
      return { x: ANCHORAGE.x, z: ANCHORAGE.z };
    }
    if (QUEST.q === 19 && !SAVE.mouthOpen) {
      const G = moActiveGate();
      const tgt = G ? { x: G.wx, z: G.wz } : { x: SLUICE.x, z: SLUICE.z };
      if (P.sailing || P.skiffing) return tgt;
      /* west of the works: up the shore road first; at the works: the
         next wheel */
      if (P.x < 118) return moPathNext(true);
      return tgt;
    }
  }
  return _moObjPoint();
};

/* ── the sim: the sluice rhythm runs with the player tick ── */
const _moTickPlayer = tickPlayer;
tickPlayer = function () {
  tickSluice();
  _moTickPlayer();
};

/* ── the render frame ── */
let moClock = performance.now(), moDbgDone = false, moColF = 0;
function moAnimGate(G, dtv) {
  if (G.giving && G.slabK < 1) {
    G.slabK = Math.min(1, G.slabK + dtv / 1.8);
    if (G.slabK >= 0.7 && SAVE && (SAVE.sluiceG | 0) <= MOGATES.indexOf(G)) {
      SAVE.sluiceG = MOGATES.indexOf(G) + 1;
      storeSave();
      SFX.waterFill();
    }
    if (G.slabK >= 1) G.giving = false;
  }
  const k = MOGATES.indexOf(G);
  const fillI = k === 0 ? 0 : k === 1 ? 1 : 2;
  if (k < 2 && moGatesOpen() > k && moFill[fillI] < 1) {
    moFill[fillI] = Math.min(1, moFill[fillI] + dtv / 2.6);
  }
  G.grp.position.y = G.sillY - G.slabK * 4.15;
  G.spin += G.spinV * dtv;
  G.spinV *= Math.pow(0.02, dtv);
  if (G.wheelSpin) G.wheelSpin.rotation.z = G.spin;
}
function moWaterMod(sheet, tsec, deep) {
  const colA = sheet.mesh.geometry.attributes.color;
  const arr = colA.array, base = sheet.base;
  for (let v = 0; v < arr.length; v += 3) {
    const f = 1 + 0.07 * Math.sin(v * 0.11 - tsec * 2.4) + 0.03 * Math.sin(v * 0.31 + tsec * 1.2);
    arr[v] = base[v] * f;
    arr[v + 1] = base[v + 1] * f;
    arr[v + 2] = base[v + 2] * (2 - f);
  }
  colA.needsUpdate = true;
}
const _moCullChunks = cullChunks;
cullChunks = function (ccx, ccz) {
  _moCullChunks(ccx, ccz);
  const now = performance.now();
  const dtv = Math.min(0.1, (now - moClock) / 1000);
  moClock = now;
  const d2 = (x, z) => (x - ccx) * (x - ccx) + (z - ccz) * (z - ccz);
  const nearWorks = d2(246, 48) < 300 * 300;
  const worksClose = d2(246, 48) < 100 * 100;
  const nearMouth = d2(MOUTH_POOL.x, MOUTH_POOL.z) < 300 * 300;
  const wet = !!(SAVE && SAVE.sky >= 2);
  /* sheets — the small reach sheets only matter within sight of the works */
  moWaterHead.mesh.visible = riverWet() && worksClose;
  moWaterSpill.mesh.visible = riverWet() && worksClose;
  moWaterR1.mesh.visible = riverWet() && moFill[0] > 0 && worksClose;
  moWaterR2.mesh.visible = riverWet() && moFill[1] > 0 && worksClose;
  moWaterRun.mesh.visible = (window.__mouthOpenNow() || moRunFrontS >= 0) && moFill[2] > 0 && (nearWorks || nearMouth);
  moWaterTide.visible = wet && nearMouth;
  /* rising reaches ride their fill */
  moWaterR1.mesh.position.y = -(1 - moFill[0]) * 1.3;
  moWaterR1.mesh.updateMatrix();
  moWaterR2.mesh.position.y = -(1 - moFill[1]) * 1.3;
  moWaterR2.mesh.updateMatrix();
  /* the works */
  moPropMesh.visible = d2(246, 48) < 130 * 130 || d2(160, 38) < 130 * 130;
  for (const G of MOGATES) {
    const dg = d2(G.g.x, G.g.z);
    G.grp.visible = dg < 80 * 80 && G.slabK < 0.98;   // a sunk slab is a buried draw call
    G.wheel.visible = dg < 55 * 55;
    G.glow.visible = dg < 80 * 80 && moSluiceReady() && moActiveGate() === G;
    moAnimGate(G, SIM_FREEZE ? 0 : dtv);
  }
  /* the surge, seen and heard: the band runs at the active gate */
  const G = moActiveGate();
  if (moSluiceReady() && G && d2(G.g.x, G.g.z) < 130 * 130) {
    const ph = moSurgePh();
    const W = MO_SURGE_W / MO_SURGE_T;
    let bandS, op;
    if (ph >= W) {
      const k = (ph - W) / (1 - W);
      bandS = G.g.s - 30 * (1 - k);
      op = 0.14 + k * 0.5;
    } else {
      bandS = G.g.s;
      op = 0.75 * (1 - ph / W * 0.6);
    }
    const p = lrPointAt(Math.max(0, bandS));
    /* the swell runs down the STANDING water above the works */
    const y = bandS <= S_GATES[0].s ? 4.77 :
      (lowerSurfaceAt(p.x, p.z) !== null ? lowerSurfaceAt(p.x, p.z) : p.y);
    moSurgeMesh.position.set(p.x, y + 0.07, p.z);
    moSurgeMesh.rotation.y = Math.atan2(p.fx, p.fz) + Math.PI / 2;
    moSurgeMat.opacity = op;
    moSurgeMesh.visible = true;
    if (G.glowMat) G.glowMat.opacity = 0.1 + window.__sluicePulseK() * 0.3;
  } else {
    moSurgeMesh.visible = false;
  }
  /* water colour flow — the visible sheets only, every other frame */
  if ((++moColF % 2) === 0 && !SIM_FREEZE) {
    const tsec = now / 1000;
    if (moWaterR1.mesh.visible) moWaterMod(moWaterR1, tsec);
    if (moWaterR2.mesh.visible) moWaterMod(moWaterR2, tsec);
    if (moWaterRun.mesh.visible) moWaterMod(moWaterRun, tsec);
    if (moWaterHead.mesh.visible) moWaterMod(moWaterHead, tsec);
    if (moWaterSpill.mesh.visible) moWaterMod(moWaterSpill, tsec);
    if (moWaterTide.visible) {
      const colA = moWaterTide.geometry.attributes.color;
      const arr = colA.array;

        const f = 1 + 0.05 * Math.sin(v * 0.07 - tsec * 1.7);
        arr[v] = moTideBase[v] * f;
        arr[v + 1] = moTideBase[v + 1] * f;
        arr[v + 2] = moTideBase[v + 2] * (2 - f);
      }

  }
  /* the mouth rings (cine + the first minute after) */
  for (const R of moRings) {
    if (R.t < 0 && !R.m.visible) continue;
    R.t += dtv;
    if (R.t < 0) continue;
    const k = R.t / 3.2;

  /* down in the corridor the gorge frames the view: the distant far tier
     is a call apiece for ridges the banks mostly hide. The far system
     re-derives visibility every frame, so this is a per-frame trim, not
     a state change. */
  if (mouthNearQ(ccx, ccz) && typeof farTiles !== 'undefined') {
    for (let i = 0; i < farTiles.length; i++) {
      const t = farTiles[i];
      if (!t.mesh || !t.mesh.visible) continue;
      if (t.__moC === undefined) {
        const g = t.mesh.geometry;
        if (!g.boundingSphere) g.computeBoundingSphere();
        t.__moC = [g.boundingSphere.center.x, g.boundingSphere.center.z];

/* ── debug (setup helpers reach states; they never fake the mechanic) ── */
