<script>
/* ═══════════════════ p5 — entities, player, camera, combat feel ═══════════════════ */

/* ── particles (pooled Float32Array, one Points per system) ── */
const DOT_TEX = (() => {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 32;
  const g = cv.getContext('2d');
  const gr = g.createRadialGradient(16, 16, 2, 16, 16, 15);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.55, 'rgba(255,255,255,0.5)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(cv);
})();
function makePS(n, size, hex, additive, gravity) {
  if (LOWFX) n = Math.max(8, n >> 1);
  const pos = new Float32Array(n * 3);
  const vel = new Float32Array(n * 3);
  const life = new Float32Array(n);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: hex, size, transparent: true, opacity: additive ? 0.8 : 0.72,
    depthWrite: false, sizeAttenuation: true, map: DOT_TEX,
  });
  if (additive) mat.blending = THREE.AdditiveBlending;
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);
  let head = 0;
  for (let i = 0; i < n; i++) { pos[i * 3 + 1] = -999; }
  return {
    pts,
    spawn(x, y, z, vx, vy, vz, l) {
      const i = head; head = (head + 1) % n;
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
      vel[i * 3] = vx; vel[i * 3 + 1] = vy; vel[i * 3 + 2] = vz;
      life[i] = l;
    },
    update(dt) {
      let live = 0;
      for (let i = 0; i < n; i++) {
        if (life[i] <= 0) continue;
        life[i] -= dt;
        if (life[i] <= 0) { pos[i * 3 + 1] = -999; continue; }
        live++;
        pos[i * 3] += vel[i * 3] * dt;
        pos[i * 3 + 1] += vel[i * 3 + 1] * dt;
        pos[i * 3 + 2] += vel[i * 3 + 2] * dt;
        if (gravity) vel[i * 3 + 1] -= 7 * dt;
      }
      geo.attributes.position.needsUpdate = true;
      pts.visible = live > 0;         // an empty system costs no draw call
      return live;
    },
  };
}
const psSpark = makePS(160, 0.14, 0xffe9b0, true, true);      // sword hits, wisp pops
const psDust = makePS(140, 0.2, 0xcbb694, false, true);       // rolls, crabs, slams
const psSparkle = makePS(120, 0.12, 0xbfe8ff, true, false);   // shade healing, moonglass
const psShimmer = LOWFX ? null : makePS(70, 0.55, 0xfff4d8, true, false);  // heat haze motes
function burst(ps, x, y, z, n, spd, up, l) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, r = Math.random() * spd;
    ps.spawn(x, y, z, Math.cos(a) * r, up + Math.random() * up, Math.sin(a) * r, l * (0.6 + Math.random() * 0.7));
  }
}

/* ── objective beacon: a floating moon-mote above the current goal.
   Appears only after the Crescent thread is started by TALKING to Finn —
   the open loop spawns with no markers at all (v2 addendum). ── */
const beacon = (() => {
  // one mesh, two quads: bright core + dim halo via vertex color (additive
  // blending makes color intensity read as opacity)
  const geo = new THREE.BufferGeometry();
  const quads = [[0.3, 1.0], [0.85, 0.27]];   // [half-size, brightness]
  const posA = [], uvA = [], colA = [], idxA = [];
  quads.forEach(([h, b], qi) => {
    const o = qi * 4;
    posA.push(-h, -h, 0, h, -h, 0, h, h, 0, -h, h, 0);
    uvA.push(0, 0, 1, 0, 1, 1, 0, 1);
    for (let i = 0; i < 4; i++) colA.push(0.85 * b, 0.93 * b, 1.0 * b);
    idxA.push(o, o + 1, o + 2, o, o + 2, o + 3);
  });
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(posA), 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvA), 2));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colA), 3));
  geo.setIndex(idxA);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    map: DOT_TEX, vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, fog: false,
  }));
  m.frustumCulled = false;
  m.renderOrder = 8;
  m.visible = false;
  scene.add(m);
  return m;
})();
/* ── THE TELEGRAPH LEDGER ──────────────────────────────────────────────
   Every hostile windup, measured in SIM TICKS on the real path (a frame is
   not game time). House law: ≥54 ticks — 0.9 s — of visible warning before
   anything may touch her. Suites read `window.__fmTele` and assert it; the
   entity carries its own start tick so nothing here is a test hook that
   could disagree with the mechanic it measures. */
window.__fmTele = [];
function fmTeleStart(o) { o.teleTick = simTick; }
function fmTeleFire(who, o) {
  if (o.teleTick === undefined || o.teleTick === null) return;
  if (window.__fmTele.length < 3000) window.__fmTele.push({ who, ticks: simTick - o.teleTick });
  o.teleTick = undefined;
}
/* boss arenas register here: inside one, the guardian IS the answer and a
   bobbing orb over its head reads as a phantom will-o'-wisp. The compass
   (△ pulse + objBearing) keeps pointing — only the marker hides. */
window.__BEACON_MUTE = window.__BEACON_MUTE || [];
function beaconMutedHere() {
  for (const a of window.__BEACON_MUTE) {
    if (a.live && !a.live()) continue;
    if (Math.hypot(P.x - a.x, P.z - a.z) < a.r) return true;
  }
  return false;
}
function updateBeacon(now) {
  const inWorld = state === 'play' || state === 'dialog' || state === 'pause';
  const o = (inWorld && QUEST.q >= 2) ? objectivePoint() : null;
  if (!o || beaconMutedHere()) { beacon.visible = false; return; }
  beacon.visible = true;
  const bob = Math.sin(now / 520) * 0.28;
  beacon.position.set(o.x, groundH(o.x, o.z) + 3.6 + bob, o.z);
  beacon.quaternion.copy(camera.quaternion);
  beacon.scale.setScalar(1 + Math.sin(now / 300) * 0.09);
  if (!LOWFX && Math.random() < 0.05) {
    psSparkle.spawn(o.x + (Math.random() - 0.5) * 0.4, beacon.position.y - 0.25, o.z + (Math.random() - 0.5) * 0.4, 0, -0.9, 0, 0.9);
  }
}

/* ── cast placement ── */
const wick = buildWick();
scene.add(wick.root);
const wickShadow = blobShadow(0.34);
scene.add(wickShadow);

function placeNPC(builder, x, z, heading, yOff) {
  const c = builder();
  const baseY = groundH(x, z) + (yOff || 0);
  c.root.position.set(x, baseY, z);
  c.root.rotation.y = heading;
  scene.add(c.root);
  return { char: c, x, z, home: heading, headT: 0, baseY };
}
// v2: Finn is outside from the start, far enough from the kelp door that ✕
// near the kelp always CUTS (his talk radius must not reach the door)
const finn = placeNPC(buildFinn, 39.2, -13.6, -Math.PI / 2 + 0.9, 0);
const tock = placeNPC(buildTock, TOCK_POS.x, TOCK_POS.z, 2.3, 0);
const pearl = placeNPC(buildPearl, -21.9, -9.0, 0.4, 1.42);

/* ── the player ── */
const P = {
  x: SPAWN_POS.x, z: SPAWN_POS.z, y: 0, heading: Math.PI,
  vx: 0, vz: 0, speed: 4.3,
  st: 'idle',                 // idle walk atk hit locked
  atkN: 0, atkT: 0, atkTotal: 0.3, queued: false, hitDone: false,
  // v3 movement: sprint (○ held) + real jump (□)
  sprint: false, sprintT: 0, lunge: false,
  fy: 0, jvy: 0, air: false, landT: 0, jumps: 0,
  iframes: 0, hitstop: 0, hitT: 0,
  hearts: 5, maxHearts: 5,
  healT: 0, healTicks: 0,
  shade: true, prevShade: true, everSun: false,
  sword: true, drawn: false, salt: 0,   // v2: armed from the first frame
  pulseT: 0,
  area: 'village',
  sunstruckCount: 0,
  carryCrescent: false,
};
P.fy = groundH(P.x, P.z);
function playerPos() { P.y = P.fy; return P; }

/* ── camera: full two-stick control (v2 — Minecraft/modern-Zelda standard) ──
   Right stick orbits: yaw free 360°, pitch clamped -25°..+60°. Mouse-look
   under pointer lock and touch-drag on the right of the screen feed the same
   orbit. NO autonomous movement while the player has touched the camera in
   the last 3 s; after that, only a gentle drift behind the walk direction —
   and never while standing still. */
const CAM = {
  yaw: Math.PI, pitch: 0.44, dist: 3.3, shake: 0,
  x: 0, y: 0, z: 0, ready: false, mode: 'follow',
  stickAge: 99,
};
const PITCH_MIN = -0.436, PITCH_MAX = 1.047;   // -25°..+60°
const _cv = new THREE.Vector3();
function updateCamera(dtv) {
  if (CAM.mode !== 'follow') return;
  const inG = inGrottoAt(P.x, P.z);
  const inR = roomAt(P.x, P.z);   // v4: camera pulls close indoors (v4.5: any room)
  const wantDist = inR ? 2.15 : inG ? 2.55 : 3.3;
  CAM.dist += (wantDist - CAM.dist) * Math.min(1, dtv * 3);
  // manual orbit inputs (stick/arrows are rates; mouse/touch are deltas)
  let manual = false;
  if (state === 'play') {
    const sx = clamp(IN.cx, -1, 1), sy = clamp(IN.cy, -1, 1);
    if (sx || sy) {
      CAM.yaw -= sx * 3.1 * dtv;
      CAM.pitch += sy * 2.0 * dtv;
      manual = true;
    }
    if (CAMIN.mdx || CAMIN.mdy) {
      CAM.yaw -= CAMIN.mdx * 0.0034;
      CAM.pitch += CAMIN.mdy * 0.0026;
      manual = true;
    }
    if (CAMIN.tdx || CAMIN.tdy) {
      CAM.yaw -= CAMIN.tdx * 0.0085;
      CAM.pitch += CAMIN.tdy * 0.0065;
      manual = true;
    }
  }
  CAMIN.mdx = CAMIN.mdy = CAMIN.tdx = CAMIN.tdy = 0;
  if (manual || CAMIN.touching) CAM.stickAge = 0; else CAM.stickAge += dtv;
  CAM.pitch = clamp(CAM.pitch, PITCH_MIN, PITCH_MAX);
  // gentle drift behind the walk — hands-off for 3 s AND walking, never idle
  const moving = Math.hypot(P.vx, P.vz) > 0.4 && state === 'play' && P.st === 'walk';
  if (CAM.stickAge > 3 && moving) {
    CAM.yaw = angLerp(CAM.yaw, Math.atan2(P.vx, P.vz) + Math.PI, Math.min(1, dtv * 0.8));
  }
  const py = P.fy;
  const tx = P.x + Math.sin(P.heading) * 0.35, tz = P.z + Math.cos(P.heading) * 0.35;
  const ty = py + (inR ? 1.05 : inG ? 1.15 : 1.25);
  const cp = Math.cos(CAM.pitch), spv = Math.sin(CAM.pitch);
  const dx = Math.sin(CAM.yaw) * cp, dz = Math.cos(CAM.yaw) * cp, dyv = spv;
  let dist = CAM.dist;
  // sphere-cast pullback: terrain + solid grotto rock + interior walls
  // (rect rooms clamp on the rect; the lighthouse clamps on its circle)
  const outsideRoom = (sx2, sz2) => inR && (inR.r
    ? Math.hypot(sx2 - inR.x, sz2 - inR.z) > inR.r - 0.15
    : (Math.abs(sx2 - inR.x) > inR.w - 0.15 || Math.abs(sz2 - inR.z) > inR.d - 0.15));
  for (let s = 0.2; s <= 1.0; s += 0.1) {
    const sx2 = tx + dx * dist * s, sz2 = tz + dz * dist * s;
    const sy2 = ty + dyv * dist * s;
    if (groundH(sx2, sz2) + 0.42 > sy2 || worldSolidAt(sx2, sz2) || outsideRoom(sx2, sz2)) {
      dist = Math.max(0.9, dist * (s - 0.1)); break;
    }
  }
  const cx = tx + dx * dist, cz = tz + dz * dist;
  let cy = ty + dyv * dist;
  cy = Math.max(cy, groundH(cx, cz) + 0.4);
  if (inG) cy = Math.min(cy, py + 3.4);
  if (inR) cy = Math.min(cy, inR.wallH - 0.3);
  const k = CAM.ready ? Math.min(1, dtv * (manual ? 15 : 6.5)) : 1;
  CAM.x += (cx - CAM.x) * k; CAM.y += (cy - CAM.y) * k; CAM.z += (cz - CAM.z) * k;
  CAM.ready = true;
  camera.position.set(
    CAM.x + (Math.random() - 0.5) * CAM.shake,
    CAM.y + (Math.random() - 0.5) * CAM.shake * 0.6,
    CAM.z + (Math.random() - 0.5) * CAM.shake);
  CAM.shake = Math.max(0, CAM.shake - dtv * 1.6);
  _cv.set(tx, ty, tz);
  camera.lookAt(_cv);
}

/* ── swing hit arc helper (v3: optional wider arc for low scuttlers) ── */
function inSwingArc(tx, tz, range, halfArc) {
  const dx = tx - P.x, dz = tz - P.z;
  const d = Math.hypot(dx, dz);
  if (d > range) return false;
  let da = Math.atan2(dx, dz) - P.heading;
  da = ((da % TAU) + TAU) % TAU; if (da > Math.PI) da -= TAU;
  return Math.abs(da) < (halfArc || 1.15);
}

/* ── kelp interaction ── */
let kelpDoorCut = SAVE && SAVE.kelpDoor;
function trySwingKelp() {
  let cutAny = false;
  for (const patch of kelpPatches) {
    if (patch.tag === 'wall') continue;          // the wall burns, never cuts
    let dirty = false;
    for (const s of patch.stalks) {
      if (s.cut) continue;
      if (inSwingArc(s.x, s.z, 1.9)) {
        s.cut = true; dirty = true; cutAny = true;
        const y = groundH(s.x, s.z);
        burst(psDust, s.x, y + 0.8, s.z, 8, 1.6, 1.4, 0.5);
        burst(psSpark, s.x, y + 0.9, s.z, 4, 1.2, 1.2, 0.35);
      }
    }
    if (dirty) {
      rebuildKelpPatch(patch);
      SFX.kelpCut();
      if (patch.tag === 'door' && patch.stalks.every(s => s.cut) && !kelpDoorCut) {
        kelpDoorCut = true;
        SAVE.kelpDoor = true; storeSave();
        // the kelp beard falls away — there was a chest under it all along
        SFX.chime(0.8);
        burst(psSparkle, doorChest.x, groundH(doorChest.x, doorChest.z) + 0.8, doorChest.z, 12, 1.0, 1.2, 0.9);
      }
    }
  }
  return cutAny;
}

/* ── damage to the player ── */
/* v7 damage-visibility invariant (John's field mystery: hits landing with
   "no enemy anywhere" on screen). A SOURCED hit only lands if its source is
   actually rendered this frame: visible flag chain true AND bounding sphere
   inside the camera frustum. Otherwise the hit is suppressed — no damage,
   no knockback. Swelter is exempt by design (it never calls hurtPlayer and
   carries its own full feedback package). */
const _dmgFrustum = new THREE.Frustum();
const _dmgMat = new THREE.Matrix4();
const _dmgSphere = new THREE.Sphere();
let dmgSuppressed = 0;
const lastDmgCheck = { vis: null, frus: null };
function damageSourceRendered(root) {
  let o = root, vis = true;
  while (o) { if (!o.visible) { vis = false; break; } o = o.parent; }
  lastDmgCheck.vis = vis;
  if (!vis) { lastDmgCheck.frus = null; return false; }
  _dmgMat.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  _dmgFrustum.setFromProjectionMatrix(_dmgMat);
  _dmgSphere.center.setFromMatrixPosition(root.matrixWorld);
  _dmgSphere.radius = 1.4;   // the source's BODY — generous enough for edge-of-screen, tight enough that behind-the-camera stays unseen
  lastDmgCheck.frus = _dmgFrustum.intersectsSphere(_dmgSphere);
  return lastDmgCheck.frus;
}
function hurtPlayer(n, fromX, fromZ, srcRoot) {
  if (P.iframes > 0 || state !== 'play') return;
  if (srcRoot && !damageSourceRendered(srcRoot)) { dmgSuppressed++; return; }
  P.hearts = Math.max(0, P.hearts - n);
  P.iframes = 85;
  P.hitT = 0.34; P.st = 'hit';
  const dx = P.x - fromX, dz = P.z - fromZ, d = Math.hypot(dx, dz) || 1;
  P.vx = dx / d * 7.5; P.vz = dz / d * 7.5;
  CAM.shake = 0.22;
  SFX.hurt();
  rumble({ duration: 200, strong: 0.8, weak: 0.5 });
  flashGlare(0.22, 0.35);
  if (P.hearts <= 0) startSunstruck();            // p6
}

/* ── the moonglass pulse (△): the sword is a compass ── */
function objectivePoint() {
  // v2: no objective exists until Finn starts the thread (q0 = open loop)
  if (QUEST.q === 2) {
    if (BOSS.crescentGiven) return null;
    if (!inGrottoAt(P.x, P.z)) return { x: GROTTO_ENT.x, z: GROTTO_ENT.z };
    if (!wallBurned()) return { x: MIRROR_POS.x, z: MIRROR_POS.z };
    return { x: GROTTO_B.x, z: GROTTO_B.z };
  }
  if (QUEST.q === 3) return { x: WHEEL_POS.x, z: WHEEL_POS.z };
  return null;
}
/* v3 rename: this is the MOON COMPASS everywhere the player can read.
   Same mechanic as ever — the clarity layer is a longer SILVER MOTE STREAM
   arcing toward the objective, a Moonwheel-drift when no quest is live
   (it tugs toward moon-stuff), and a one-time caption on first use. */
let compassMotes = 0;
function doPulse() {
  P.pulseT = 1.0;
  const o = objectivePoint();
  let str = 0.25;
  const y = P.fy + 1.2;
  // no objective? the moonglass tugs toward moon-stuff — and the nearest
  // moon-stuff is the keel-stone of a boat left far behind (post-arc,
  // "I can't find my boat" is the recurring family question)
  let idle = { x: WHEEL_POS.x, z: WHEEL_POS.z };
  if (!o && typeof BOAT !== 'undefined' && typeof FLOODLIVE !== 'undefined' &&
      FLOODLIVE.boatDone && !P.sailing &&
      Math.hypot(BOAT.x - P.x, BOAT.z - P.z) > 120) {
    idle = { x: BOAT.x, z: BOAT.z };
  }
  const tgt = o || idle;
  const d = Math.hypot(tgt.x - P.x, tgt.z - P.z);
  if (o) str = clamp(1 - d / 160, 0.15, 1);
  const dx = (tgt.x - P.x) / (d || 1), dz = (tgt.z - P.z) / (d || 1);
  const n = o ? 13 : 10, spd = o ? 3.4 : 2.2;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const swirl = o ? 0 : Math.sin(i * 2.4) * 0.5;         // pre-quest: looser drift
    psSparkle.spawn(
      P.x + dx * (0.5 + t * 2.6) - dz * swirl * 0.4,
      y + Math.sin(t * Math.PI) * (0.55 + t * 0.4) + t * 0.3,   // the arc
      P.z + dz * (0.5 + t * 2.6) + dx * swirl * 0.4,
      dx * spd, 0.45 - t * 0.5, dz * spd, 0.75 + t * 0.55);
  }
  compassMotes += n;
  if (SAVE && !SAVE.compassSeen) {
    SAVE.compassSeen = true; storeSave();
    showCaption('The moonglass tugs toward moon-stuff.', 3400);
  }
  SFX.glassPulse(str);
  rumble({ duration: 90, strong: 0.1 + str * 0.3, weak: 0.2 });
}

/* ── shared horizontal move step: circle colliders + grotto solid rock ── */
function moveWithCollision(nx, nz) {
  const R = roomAt(P.x, P.z);
  if (R) {                                // v4.5: inside any interior room
    const r = interiorResolve(R, nx, nz);
    P.x = r[0]; P.z = r[1];
    return;
  }
  const ox = P.x, oz = P.z;
  const c = collide(nx, nz, 0.42, P.fy);
  const r = resolveSolid(ox, oz, c[0], c[1]);
  P.x = r[0]; P.z = r[1];
}
/* ── player sim tick (runs in state 'play') ── */
function tickPlayer() {
  const inShade = inShadeAt(P.x, P.z);
  P.prevShade = P.shade; P.shade = inShade;
  if (!inShade && P.prevShade) {
    // stepping into the glare — Crescent-era feedback teaching SUN = DANGER.
    // Once the swelter retires (the Sliver payoff, sky 4), sun exposure means
    // nothing anywhere, so the flash retires WITH it: walking the re-greened
    // canopy crossed a shade edge every few strides and flashed each time
    // (John, live report). World-changes are permanent — including this one.
    if (!(typeof swelterRetired !== 'undefined' && swelterRetired)) {
      flashGlare(P.everSun ? 0.14 : 0.6, P.everSun ? 0.5 : 1.3);
    }
    P.everSun = true;
  }
  if (P.iframes > 0) P.iframes--;
  // shade heals: 1 heart / 4 s
  if (inShade && P.hearts < P.maxHearts && (P.st === 'idle' || P.st === 'walk')) {
    P.healT++;
    if (P.healT >= 240) {
      P.healT = 0; P.hearts++; P.healTicks++;
      SFX.heal();
      burst(psSparkle, P.x, P.fy + 1.0, P.z, 12, 0.9, 1.3, 0.9);
    }
  } else if (!inShade) P.healT = 0;
  if (P.pulseT > 0) P.pulseT -= DT;
  if (P.landT > 0) P.landT -= DT;

  /* ── vertical: real jump physics (v3). Runs every tick, whatever the
     state — attacks and knockback fall/land naturally. ── */
  const support = supportYAt(P.x, P.z, P.fy);
  if (P.air) {
    P.jvy -= 22 * DT;
    P.fy += P.jvy * DT;
    if (P.jvy <= 0 && P.fy <= support) {
      P.fy = support; P.air = false; P.jvy = 0;
      P.landT = 0.2;                       // landing squash window
      SFX.land(false);
      burst(psDust, P.x, P.fy + 0.08, P.z, 7, 1.5, 0.9, 0.4);
    }
  } else if (P.fy > support + 0.28) {
    P.air = true; P.jvy = 0;               // walked off an edge
  } else {
    P.fy = support;
  }

  if (P.st === 'hit') {
    P.hitT -= DT;
    // v8: a swing pressed during the stun BUFFERS instead of vanishing —
    // hornet pressure was eating honest button presses (kid-hostile)
    if (IN.atk && P.sword) P.queued = true;
    moveWithCollision(P.x + P.vx * DT, P.z + P.vz * DT);
    P.vx *= 0.86; P.vz *= 0.86;
    if (P.hitT <= 0) {
      P.st = 'idle';
      if (P.queued && P.sword) { P.queued = false; startAttack(1); }
    }
    return;
  }
  if (P.st === 'atk') {
    P.atkT -= DT;

function poseHumanoid(c, st, t, speed, opts) {
  opts = opts || {};

  a.t += t;
  const w = a.t;
  const brth = Math.sin(w * 2.1) * 0.012;
  c.torso.scale.y = 1 + brth;

     decays to EXACTLY zero at rest (John: "feet walk while standing").
     Breathing and head-look are exempt — everything cyclic below is not. */
  const locoTarget = st === 'walk' ? 1 : 0;
  if (a.loco === undefined) a.loco = locoTarget;
  a.loco += (locoTarget - a.loco) * Math.min(1, t * 10);
  if (!locoTarget && a.loco < 0.035) a.loco = 0;

       hips, a subtle head bob. Sprint deepens everything and leans in. */
    /* v5 sprint feel: POWER, not patter — longer stride at lower cadence,
       hip sway nearly killed (sway reads sashay at speed), harder lean,
       bigger arm drive, steadier head. */
    const f = w * (7.2 + speed * 1.1 + spr * 1.3);
    legA = Math.sin(f) * (0.62 + spr * 0.36) * loco;
    armA = -Math.sin(f) * (0.42 + spr * 0.46) * loco;
    bob = Math.abs(Math.cos(f)) * (0.05 + spr * 0.035) * loco;
    lean = (0.1 + spr * 0.5) * loco;               // sprint: driving lean-in
    sway = Math.sin(f) * (0.05 - spr * 0.032) * loco;     // hip sway (walk only)
    twist = Math.sin(f) * (0.09 + spr * 0.08) * loco;     // shoulder counter-rotation
    headBob = Math.sin(f * 2) * 0.025 * (1 - spr * 0.6) * loco;

  // push-off — a quarter-phase lag against the hip, plus a toe-off kick.
  // The kick is locomotion too: it must be dead still at rest (v4).
  const f2 = w * (7.2 + speed * 1.1 + spr * 2.4) - 0.55;

      c.shR.rotation.x = -armA * 0.9 - 0.15; c.shR.rotation.z = -0.16;
      c.elL.rotation.x = -1.15 - Math.max(0, armA) * 0.4;
      c.elR.rotation.x = -1.15 - Math.max(0, -armA) * 0.4;
    } else {

      c.shR.rotation.x = -armA + 0.06; c.shR.rotation.z = -0.1;
      c.elL.rotation.x = -0.25 - Math.max(0, armA) * 0.55;
      c.elR.rotation.x = -0.25 - Math.max(0, -armA) * 0.55;

    }
    poseHumanoid(c, 'idle', dtv, 0, {
      lookAt: look,
      stoop: (npc === finn || npc === tock) ? 0.1 : 0,
    });
    if (npc === tock) {
      // knitting: tiny alternating hand bobs + the counting sway
      const w = c.anim.t;
      c.shL.rotation.x = -0.85 + Math.sin(w * 6) * 0.07;
      c.shR.rotation.x = -0.8 - Math.sin(w * 6) * 0.07;
      c.elL.rotation.x = -0.9; c.elR.rotation.x = -0.95;
      c.torso.rotation.z = Math.sin(w * 1.1) * 0.03;
    }
    if (npc === pearl) {
      // hands clasped behind, up on her toes now and then, watching the sky
      const w = c.anim.t;
      c.shL.rotation.x = 0.35; c.shR.rotation.x = 0.35;
      c.shL.rotation.z = 0.3; c.shR.rotation.z = -0.3;
      c.head.rotation.x = -0.25 + Math.sin(w * 0.5) * 0.08;
      c.root.position.y = npc.baseY + Math.max(0, Math.sin(w * 0.9)) * 0.02;
    }
    if (npc === finn) {
      c.shL.rotation.x = 0.12; c.shR.rotation.x = 0.12;
      c.elL.rotation.x = -0.5; c.elR.rotation.x = -0.55;
    }
  }
}
</script>
