})();

/* ── the climbs' colliders (plat = support, never wall) ── */
const skPlatColls = [];
(function skBuildClimbColls() {

    }

    c.plat = true;

  const D2 = SK_DECK[2];
  {
    /* the lamp floor: a complete inner room disc, an outer skirt with one

    const headA = ((T2.doorAng + 2.5 + 26 * 0.2) % TAU + TAU) % TAU;
    const cc = addColl(D2.x, D2.z, 1.7, D2.y);

    for (let w = 0; w < 12; w++) {

      const c = addColl(D2.x + Math.sin(a) * 3.9, D2.z + Math.cos(a) * 3.9, 1.1, D2.y + Math.sin(a) * 0.14);
      c.plat = true; skPlatColls.push(c);

/* ── rescue anchors: a dunked or downed player wakes on the islet's own

ISLE_ANCHORS.push(
  { x: -190, z: 96, sx: -189, sz: 98, id: 'harborstar' },

/* ── the swell yields to the islets: shoal the amp (and pull the color
   band in) around each footprint, calm inside the drowned hall — the
   same law every charted isle already obeys ── */
const _skSeaShoal = seaShoalAt;
seaShoalAt = function (x, z) {
  const s = _skSeaShoal(x, z);
  for (let i = 0; i < 4; i++) {
    const B = SK_B[i];
    const dx = x - B.x, dz = z - B.z;
    const d2 = dx * dx + dz * dz;
    const rOut = B.r + 58;
    if (d2 > rOut * rOut) continue;
    const d = Math.sqrt(d2);
    s.amp *= clamp((d - B.r * 0.94) / 58, 0, 1);
    s.off = Math.min(s.off, smoothstep(clamp((d - B.r * 0.98) / 160, 0, 1)));
  }
  return s;
};

/* ═══ RULES registrations: the ground owner + all four thresholds ═══ */
window.__WORLD_REG.push({

window.__PORTALS.push(
  { name: 'harbor-star-door',

<script>
/* ═══════════ p6k/5 — islet dynamics: THE PUNT and THE REEF WASH ═══════════ */

/* ── the tower punt: a waterlogged flat-bottom tender that has ridden
   inside the drowned tower for a year. Stick to drift, ✕ to pole (the
   ferry-pole verb, hers); □ steps off at the landing or the spit. She
   is a registered hull — the hall's water yields to her (Rule 4). ── */
const SK_PUNT = {
  on: false, x: -1243, z: 245, ang: 2.2, spd: 0, vx: 0, vz: 0,
  moorX: -1243, moorZ: 245, moorAng: 2.2, bobPh: 0, shoves: 0, shoves2: 0,
};
let skPuntGrp = null, skPuntColl = null, skPuntPoleT = 0, skPuntPole2T = 0;
(function skBuildPunt() {
  const md = MD();
  const C_P = col(0x6e5a3e), C_P2 = col(0x4c3d28), C_BILGE = col(0x8a7856);
  boxW(md, { x: 0, y: 0, z: 0, w: 0.58, d: 1.35, h: 0.46, tw: 0.66, td: 1.62, col: C_P, colB: C_P2 });
  boxW(md, { x: 0, y: 0.16, z: 1.75, w: 0.34, d: 0.45, h: 0.3, tw: 0.18, td: 0.26, rx: -0.26, col: C_P });
  boxW(md, { x: 0, y: 0.16, z: -1.75, w: 0.34, d: 0.45, h: 0.3, tw: 0.18, td: 0.26, rx: 0.26, col: C_P2 });
  boxW(md, { x: 0, y: 0.27, z: 0, w: 0.55, d: 1.6, h: 0.07, col: C_BILGE });
  boxW(md, { x: 0, y: 0.44, z: -0.5, w: 0.55, d: 0.13, h: 0.06, col: C_P2 });
  /* her own pole, shipped along the gunwale */
  boxW(md, { x: 0.44, y: 0.5, z: -0.8, w: 0.03, d: 0.03, h: 2.3, rx: -0.55, ry: 0.2, col: C_P2 });
  /* green waterline stain: a year in a flooded hall */
  for (const s of [-1, 1]) {
    boxW(md, { x: 0.6 * s, y: 0.1, z: 0, w: 0.045, d: 1.55, h: 0.14, col: col(0x59695c) });
  }
  const puntMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
  SK_NIGHT_MATS.push(puntMat);
  const hull = mdMesh(md, puntMat, false);
  hull.frustumCulled = false;
  skPuntGrp = new THREE.Group();
  skPuntGrp.add(hull);
  skPuntGrp.visible = false;
  scene.add(skPuntGrp);
  skPuntColl = addColl(SK_PUNT.x, SK_PUNT.z, 1.0);
})();
window.__HULLS.push({
  name: 'star-punt', r: 2.0,
  afloat: () => true,
  underway: () => SK_PUNT.on,
  x: () => SK_PUNT.x, z: () => SK_PUNT.z,
  waterlineY: () => skPuntY() + 0.16,
  depthOk: () => true,
  rescue: () => skPuntMoor(),
});
function skPuntY() {
  return SK_WL + (typeof swellAt === 'function' ? swellAt(SK_PUNT.x, SK_PUNT.z) * 0.5 : 0);
}
function skPuntMoor() {
  SK_PUNT.on = false;
  SK_PUNT.x = SK_PUNT.moorX; SK_PUNT.z = SK_PUNT.moorZ; SK_PUNT.ang = SK_PUNT.moorAng;
  SK_PUNT.spd = 0; SK_PUNT.vx = 0; SK_PUNT.vz = 0;
  skPuntColl.off = false;
  skPuntColl.x = SK_PUNT.x; skPuntColl.z = SK_PUNT.z;
}
/* punt water: afloat inside the drowned islet's shoal + hall, never on
   the spit, never through a wall (the mouth is the one way in) */
function skPuntWaterOk(x, z) {
  if (skIsleIdx(x, z) !== 2) return false;
  if (skSolidAt(x, z)) return false;
  return SK_WL - skGroundAt(x, z) > 0.28;
}
function skPuntFooting() {
  /* dry or platform footing within a step of the gunwale, walk-connected */
  for (let r = 1.6; r <= 5.2; r += 0.6) {
    for (let i = 0; i < 12; i++) {
      const a = SK_PUNT.ang + i * (TAU / 12);
      const px = SK_PUNT.x + Math.sin(a) * r, pz = SK_PUNT.z + Math.cos(a) * r;
      if (worldSolidAt(px, pz)) continue;
      let blocked = false;
      for (let s = 1; s <= 3; s++) {
        const mx = SK_PUNT.x + (px - SK_PUNT.x) * s / 4, mz = SK_PUNT.z + (pz - SK_PUNT.z) * s / 4;
        if (worldSolidAt(mx, mz)) { blocked = true; break; }
      }
      if (blocked) continue;
      const sy = supportYAt(px, pz, SK_WL + 2.0);
      if (sy > SK_WL - 0.3 && sy < SK_WL + 2.0) return { x: px, z: pz, y: sy };
    }
  }
  return null;
}
function skBoardPunt() {
  SK_PUNT.on = true;
  P.skPunting = true;
  P.x = SK_PUNT.x; P.z = SK_PUNT.z; P.fy = skPuntY() + 0.44; P.air = false; P.jvy = 0;
  P.vx = 0; P.vz = 0; P.st = 'idle'; P.sprint = false;
  SK_PUNT.spd = 0;
  skPuntColl.off = true;
  SFX.creakBoat ? SFX.creakBoat() : SFX.creak();
  SFX.splashSm ? SFX.splashSm() : SFX.splash();
  rumble({ duration: 90, strong: 0.15, weak: 0.3 });
}
function skLeavePunt() {
  const s = skPuntFooting();
  if (!s) return false;
  SK_PUNT.on = false;
  P.skPunting = false;
  P.x = s.x; P.z = s.z; P.fy = s.y; P.air = false; P.jvy = 0;
  P.vx = 0; P.vz = 0; P.st = 'idle';
  skPuntColl.off = false;
  skPuntColl.x = SK_PUNT.x; skPuntColl.z = SK_PUNT.z;
  SFX.splashSm ? SFX.splashSm() : SFX.splash();
  return true;
}
function skPuntShove(fromP2) {
  if (fromP2) { if (skPuntPole2T > 0) return; skPuntPole2T = 0.5; SK_PUNT.shoves2++; }
  else { if (skPuntPoleT > 0) return; skPuntPoleT = 0.5; SK_PUNT.shoves++; }
  SK_PUNT.spd = Math.min(4.8, SK_PUNT.spd + 2.6);
  SFX.thump(false);
  SFX.splashSm ? SFX.splashSm() : SFX.splash();
  rumble({ duration: 70, strong: 0.12, weak: 0.3 });
  /* the pole answers the stair's snappers */
  let hit = false;
  for (const sn of SK_SNAPS) {
    if (sn.gone || sn.st === 'leave') continue;
    if (Math.hypot(sn.x - SK_PUNT.x, sn.z - SK_PUNT.z) < 3.4 && Math.abs(sn.y - SK_WL) < 2.4) {
      if (skHitSnapper(sn)) hit = true;
    }
  }
  if (hit) SFX.hit();
}
let skP2AtkWas = false;
function skTickPunt() {
  if (IN.atk) {
    const ctx = currentInteract();
    if (ctx && ctx.id === 'skPuntOff') { doInteract(ctx); IN.atk = false; return; }
    skPuntShove(false);
    IN.atk = false;
  }
  if (IN.jump) {
    const ctx = currentInteract();
    if (ctx && ctx.id === 'skPuntOff') { doInteract(ctx); IN.jump = false; return; }
  }
  /* P2's pole (drop-in: any second pad, south button) */
  if (window.ArcadeController) {
    try {
      const p2 = ArcadeController.pad(1);
      const dn = !!(p2 && p2.connected && p2.button('south'));
      if (dn && !skP2AtkWas) skPuntShove(true);
      skP2AtkWas = dn;
    } catch (e) {}
  }
  if (skPuntPoleT > 0) skPuntPoleT -= DT;
  if (skPuntPole2T > 0) skPuntPole2T -= DT;
  const mag = moveVec();
  if (mag > 0.1) {
    SK_PUNT.ang = angLerp(SK_PUNT.ang, Math.atan2(_mv[0], _mv[1]), 0.1);
    SK_PUNT.spd += (2.3 - SK_PUNT.spd) * 0.035;
  }
  SK_PUNT.spd *= 0.985;
  const nx = SK_PUNT.x + Math.sin(SK_PUNT.ang) * SK_PUNT.spd * DT;
  const nz = SK_PUNT.z + Math.cos(SK_PUNT.ang) * SK_PUNT.spd * DT;
  if (skPuntWaterOk(nx, SK_PUNT.z)) SK_PUNT.x = nx; else SK_PUNT.spd *= 0.7;
  if (skPuntWaterOk(SK_PUNT.x, nz)) SK_PUNT.z = nz; else SK_PUNT.spd *= 0.7;
  P.x = SK_PUNT.x; P.z = SK_PUNT.z;
  P.fy = skPuntY() + 0.44;
  P.heading = SK_PUNT.ang;
}

/* ── THE REEF WASH: the phase-3 sea language ashore — a telegraphed set
   sweeps the low shelf; the cost is a knockdown toward the water, never
   hearts. Timing is kid-fair: 3 s of white warning, 2.2 s of wash,
   9.8 s of clear climbing between. ── */
const SK_WASH = { period: 15, tele: 3.0, dur: 2.2, t: 7, hitThisWash: false, saidOnce: false, n: 0, shoveT: 0, shX: 0, shZ: 0 };
let skWashRing = null, skWashLine = null;
(function skBuildWash() {
  /* the wash: a foam ring around the stack's low shelf */
  const md = MD(), uvs = [];
  const B = SK_B[1];
  for (let s = 0; s < 18; s++) {
    const a0 = s / 18 * TAU, a1 = (s + 1) / 18 * TAU;
    const r0 = 6.5, r1 = 14.5;
    const uv = [[0, 0], [1, 0], [1, 1], [0, 1]];
    const q = [
      [Math.sin(a0) * r0, Math.cos(a0) * r0], [Math.sin(a1) * r0, Math.cos(a1) * r0],
      [Math.sin(a1) * r1, Math.cos(a1) * r1], [Math.sin(a0) * r1, Math.cos(a0) * r1],
    ];
    for (const i of [0, 1, 2, 0, 2, 3]) {
      md.p.push(q[i][0], 0, q[i][1]);
      md.c.push(0.85, 0.92, 0.95);
      uvs.push(uv[i][0], uv[i][1]);
    }
  }
  skWashRing = skGlowMesh(md, uvs, 0);
  skWashRing.position.set(B.x, SK_WL + 0.32, B.z);
  skWashRing.renderOrder = 3;
  skWashRing.visible = false;
  scene.add(skWashRing);
  /* the telegraph: a hard white swell line standing off the rock */
  const md2 = MD(), uvs2 = [];
  skFlatQuad(md2, 0, 0, 0, 0, 1, 26, 2.2, [0.9, 0.96, 1.0], uvs2);
  skWashLine = skGlowMesh(md2, uvs2, 0);
  skWashLine.position.set(B.x - 30, SK_WL + 0.5, B.z);
  skWashLine.visible = false;
  scene.add(skWashLine);
})();
function skWashPhase() {
  const t = SK_WASH.t % SK_WASH.period;
  if (t < SK_WASH.tele) return { ph: 'tele', k: t / SK_WASH.tele };
  if (t < SK_WASH.tele + SK_WASH.dur) return { ph: 'wash', k: (t - SK_WASH.tele) / SK_WASH.dur };
  return { ph: 'clear', k: 0 };
}
function skTickWash() {
  const B = SK_B[1];
  if (SK_WASH.shoveT > 0 && state === 'play' && !P.sailing && !P.skPunting) {
    SK_WASH.shoveT -= DT;
    const k2 = SK_WASH.shoveT / 0.55;
    const nx2 = P.x + SK_WASH.shX * 9 * k2 * DT, nz2 = P.z + SK_WASH.shZ * 9 * k2 * DT;
    if (!worldSolidAt(nx2, nz2)) {
      P.x = nx2; P.z = nz2;
      P.fy = Math.max(P.fy - 3 * DT, supportYAt(P.x, P.z, P.fy + 0.3));
    }
  }
  const d2p = Math.hypot(P.x - B.x, P.z - B.z);
  if (d2p > 160) { skWashRing.visible = false; skWashLine.visible = false; return; }
  const was = skWashPhase().ph;
  SK_WASH.t += DT;
  const now = skWashPhase();
  if (was !== 'tele' && now.ph === 'tele') {
    SK_WASH.hitThisWash = false;
    if (d2p < 90) { SFX.splash(); SFX.gullCry && SFX.gullCry(); }
  }
  if (was === 'tele' && now.ph === 'wash') {
    SK_WASH.n++;
    if (d2p < 90) { SFX.thump(true); rumble({ duration: 200, strong: 0.3, weak: 0.5 }, 'wash'); }
  }
  /* the telegraph line rolls in from the west, the ring floods on the wash */
  if (now.ph === 'tele') {
    skWashLine.visible = true;
    skWashLine.material.opacity = 0.25 + now.k * 0.5;
    skWashLine.position.x = B.x - 46 + now.k * 32;
    skWashRing.visible = false;
  } else if (now.ph === 'wash') {
    skWashLine.visible = false;
    skWashRing.visible = true;
    skWashRing.material.opacity = 0.75 * Math.sin(clamp(now.k, 0, 1) * Math.PI);
    skWashRing.scale.setScalar(0.85 + now.k * 0.35);
    if ((simTick % 8) === 0) {
      const a = Math.random() * TAU;
      psSpray.spawn(B.x + Math.sin(a) * 10, SK_WL + 0.6, B.z + Math.cos(a) * 10,
        -Math.sin(a) * 1.4, 1.2, -Math.cos(a) * 1.4, 0.6);
    }
    /* the knockdown: on the low shelf when the set arrives = swept toward
       the sea. A stagger and a soaking — never hearts (the dunk-bounce
       catches whoever goes all the way in). */
    if (!SK_WASH.hitThisWash && !P.sailing && !P.skPunting && !P.air &&
        d2p < 15.5 && P.fy < SK_WL + 1.7 && state === 'play') {
      SK_WASH.hitThisWash = true;
      const dx = (P.x - B.x) / (d2p || 1), dz = (P.z - B.z) / (d2p || 1);
      SK_WASH.shoveT = 0.55; SK_WASH.shX = dx; SK_WASH.shZ = dz;
      P.hitstop = 4;
      CAM.shake = Math.max(CAM.shake, 0.3);
      SFX.splash();
      burst(psSpray, P.x, SK_WL + 0.5, P.z, 22, 2.4, 2.0, 0.8);
      rumble({ duration: 320, strong: 0.6, weak: 0.7 }, 'wash-hit');
      if (!SK_WASH.saidOnce) {
        SK_WASH.saidOnce = true;
        showCaption('The sets sweep the low shelf. Climb between the washes.', 3600);
      }
    }
  } else {
    skWashRing.visible = false;
    skWashLine.visible = false;
  }
}

<script>
/* ═══════════ p6k/6 — the hostile pockets: MOTH-WISPS, NIGHT GULLS, SNAPPERS ═══════════ */

/* ── MOTH-WISPS — ash-grey dusk moths that keep the dead towers. They
   dive at your lantern; two slashes and they fizz into silver mist.
   NOT sun imps: nothing here pops them for standing in the dark — they
   are viable in every light their pockets see (the shade-fizzle law). ── */
function skBuildWisp() {
  const root = new THREE.Group();
  const mdB = MD();
  const grey = [0.42, 0.43, 0.47], grey2 = [0.3, 0.3, 0.34], pale = [0.75, 0.78, 0.85];

<script>
/* ═══════════ p6k/7 — THE STAR ROAD: sighting, glitter lanes, beacon light ═══════════ */

/* ── the sky-look: the orbit camera can only raise its eye ~25°, and the
   constellations stand at 30–55°. With the spyglass RAISED this pass
   re-aims the view from the same eye point, stretching the stick's
   up-range so the dusk sky is actually reachable — from boat or shore.
   (Position untouched: Rule 5's cull anchor still follows the camera.) */
const _skPrevUpdateCamera = updateCamera;
const _skLook = new THREE.Vector3();
let skLookPitch = 0, skLookYaw = 0, skGlassUp = false;
updateCamera = function (dtv) {
  _skPrevUpdateCamera(dtv);

  skGlassUp = gk > 0.7 && state === 'play' && CAM.mode === 'follow';
  if (gk > 0.05 && state === 'play' && CAM.mode === 'follow') {
    skLookYaw = CAM.yaw + Math.PI;

        camera.position.y + Math.sin(skLookPitch * k) * 50,

    }

/* ── the sighting: sweep the raised glass across an incomplete

/* ── the lantern trues the helm: the masthead hums and brightens as the

  T.skSnapLogN = window.__skSnapLog.length;
  T.skHookErr = skHookErr; T.skHookRuns = skHookRuns;
});

/* ═══ debug ═══ */
function skExtendDebugOnce() {
  if (skDbgDone || !window.__fmDebug) return;
  skDbgDone = true;
  const D = window.__fmDebug;
  /* the pinned warp entries: __fmDebug.warp.beacon1..4 / .farstar */
  const spots = [[-189, 98], [-902, 307], [-1236, 252], [-2288, -993]];
  for (let i = 0; i < 4; i++) {
    D.warp['beacon' + (i + 1)] = () => { D.warp(spots[i][0], spots[i][1]); return D.skInfo(); };
  }
  D.warp.farstar = () => { D.warp(-2288, -993, 0); return D.skInfo(); };
  Object.assign(D, {
    skInfo() {
      return {
        beacons: skBeaconLit().slice(), stars: skStarMesh.visible, dusk: +skDuskK().toFixed(2),
        lane: skLaneT > 0 ? { i: skLaneI, t: +skLaneT.toFixed(1) } : null,
        wisps: SK_WISPS.filter(w => !w.dead).length,
        snaps: SK_SNAPS.filter(s => !s.gone).length,
        punt: [+SK_PUNT.x.toFixed(1), +SK_PUNT.z.toFixed(1), P.skPunting ? 'aboard' : 'moored'],
        wash: skWashPhase().ph,
        lamps: SK_LAMP.map(L => [+L.x.toFixed(1), +L.y.toFixed(1), +L.z.toFixed(1)]),
      };
    },
    warpBeacon(i) {
      const s = spots[clamp(i | 0, 0, 3)];
      D.warp(s[0], s[1]);
      return D.skInfo();
    },
    /* setup only — forces a lane, never the lighting */
    sightNow(i) {
      skLayLane(clamp(i | 0, 0, 3));
      return D.skInfo();
    },
  });
}
