function buildSiltWyrm() {
  const root = new THREE.Group();
  const mat = TOON.clone();
  const silt = [0.66, 0.6, 0.47], silt2 = [0.55, 0.49, 0.38], plate = [0.48, 0.45, 0.4],
        jaw = [0.42, 0.38, 0.32];
  // HEAD: a river-worn boulder skull with a stone jaw and the brow mount
  const head = new THREE.Group();
  const mdH = MD();
  lathe(mdH, [[0, -0.9], [0.85, -0.4], [1.0, 0.35], [0.75, 0.95], [0, 1.25]], { seg: 7, ex: 1.15, col: silt });
  box(mdH, { x: 0, y: -0.25, z: 1.05, w: 0.55, d: 0.5, h: 0.35, tw: 0.35, td: 0.3, rx: 0.25, col: jaw });   // jaw
  for (const s of [-1, 1]) {
    box(mdH, { x: s * 0.55, y: 0.45, z: 0.55, w: 0.16, d: 0.22, h: 0.3, rz: s * 0.4, col: plate });          // brow ridges
    box(mdH, { x: s * 0.8, y: -0.1, z: 0.1, w: 0.2, d: 0.34, h: 0.5, rz: s * 0.9, col: silt2 });             // cheek fins
  }
  const headM = mdMesh(mdH, mat); headM.frustumCulled = false;
  head.add(headM);
  // ember eyes (calm at the cure)
  const mdE = MD();
  for (const s of [-1, 1]) box(mdE, { x: s * 0.34, y: 0.28, z: 0.86, w: 0.11, d: 0.05, h: 0.09, col: [1, 0.62, 0.2] });
  const eyeGlow = mdMesh(mdE, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false,
  }), false);
  eyeGlow.frustumCulled = false;
  head.add(eyeGlow);
  // THE HALF SHIELD as a brow-plate
  const brow = buildHalfShieldItem();
  brow.scale.setScalar(1.15);
  brow.position.set(0, 0.95, 0.55);
  brow.rotation.x = -0.7;
  head.add(brow);
  root.add(head);
  // SEGMENTS: tumbled stone vertebrae with silt frills
  const segs = [];
  for (let i = 0; i < 6; i++) {
    const sg = new THREE.Group();
    const mdS = MD();
    const r = 0.85 - i * 0.09;
    lathe(mdS, [[0, -r * 1.1], [r, 0], [0, r * 1.1]], { seg: 6, ex: 1.25, col: i % 2 ? silt : silt2 });
    box(mdS, { x: 0, y: r * 0.8, z: 0, w: 0.34 - i * 0.03, d: 0.1, h: 0.5 - i * 0.05, rx: -0.3, col: plate });  // dorsal plate
    const m = mdMesh(mdS, mat); m.frustumCulled = false;
    sg.add(m);
    sg.visible = false;
    root.add(sg);
    segs.push(sg);
  }
  // hit flash ghost on the head
  const mdF = MD();
  lathe(mdF, [[0, -1.0], [1.05, 0], [0, 1.3]], { seg: 7, ex: 1.15, col: [1, 1, 1] });
  const flashM = mdMesh(mdF, new THREE.MeshBasicMaterial({ color: 0xfff2dc, transparent: true, opacity: 0.6, depthWrite: false }), false);
  flashM.frustumCulled = false; flashM.visible = false;
  head.add(flashM);
  const shadow = blobShadow(1.1);
  root.add(shadow);
  root.visible = false;
  scene.add(root);
  /* THE WAKE: the visibility contract while it swims — a travelling silt
     hump + dust. Its own root so the damage-visibility check has a source. */
  const wakeRoot = new THREE.Group();
  const mdW = MD();
  lathe(mdW, [[1.7, -0.25], [1.1, 0.42], [0, 0.62]], { seg: 8, ex: 1.5, flat: true, col: [0.74, 0.68, 0.54] });
  lathe(mdW, [[0.5, 0.55], [0.2, 0.95], [0, 1.0]], { seg: 5, flat: true, col: [0.6, 0.55, 0.44] });   // the dorsal plate cutting the silt
  const wakeM = mdMesh(mdW, new THREE.MeshBasicMaterial({ vertexColors: true }));
  wakeM.frustumCulled = false;
  wakeRoot.add(wakeM);
  wakeRoot.visible = false;
  scene.add(wakeRoot);
  return { root, head, headM, eyeGlow, brow, segs, flashM, shadow, mat, wakeRoot };
}

/* dust devils — phase 3's wandering hazards (always plainly visible) */
function buildDustDevil() {
  const root = new THREE.Group();
  const md = MD();
  for (let i = 0; i < 5; i++) {
    const y = i * 0.55, r = 0.25 + i * 0.16;
    lathe(md, [[r * 0.8, y], [r, y + 0.3], [r * 0.85, y + 0.55]], { seg: 6, flat: true, col: [0.8, 0.74, 0.6] });
  }
  const m = mdMesh(md, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide,
  }), false);
  m.frustumCulled = false;
  root.add(m);
  const shadow = blobShadow(0.5);
  root.add(shadow);
  root.visible = false;
  scene.add(root);
  return { root, m };
}

function wyrmPhaseHp(ph) { return ph <= 1 ? WYRM_HP : ph === 2 ? 48 : 24; }

/* the wyrm's own HP bar — the standing boss convention, shared DOM */
let wyrmBarW = -1, wyrmFlashTimer = 0;
function refreshWyrmBar(hitFlash) {

  if (want !== WYRM.barShown) {

function calmWyrmEyes(t) {

function keepInWyrmArena(o, margin) {
  const dx = o.x - H3.x, dz = o.z - H3.z;

/* the wyrm cannot swim through stone: hump movement respects the slabs */
function wyrmSwimStep(tx, tz, sp) {
  const W = WYRM;
  const d = Math.hypot(tx - W.x, tz - W.z) || 1;
  let nx = W.x + (tx - W.x) / d * sp * DT, nz = W.z + (tz - W.z) / d * sp * DT;
  if (onSlabAt(nx, nz)) {
    // slide around the slab edge
    const a = Math.atan2(nz - W.z, nx - W.x) + 0.9;
    nx = W.x + Math.cos(a) * sp * DT; nz = W.z + Math.sin(a) * sp * DT;
    if (onSlabAt(nx, nz)) return;
  }
  W.x = nx; W.z = nz;
  keepInWyrmArena(W, 2.0);
  W.ang = Math.atan2(tx - W.x, tz - W.z);
}
function dealWyrmDamage(n) {

function tickWyrm() {
  const W = WYRM;
  if (!W.c || W.defeated) return;
  const inArena = Math.hypot(P.x - H3.x, P.z - H3.z) < H3.r + 1;
  if (!W.active) {
    if (inArena) {
      // proximity ALWAYS wakes a reachable guardian — the v4 law
      W.active = true;
      if (W.phase === 0) W.phase = 1;
      W.hp = wyrmPhaseHp(W.phase);
      W.st = 'wakeup'; W.t = 0;
      W.trail.length = 0;
      SFX.wyrmCry(); SFX.wyrmRumble();
      CAM.shake = 0.32;
      rumble({ duration: 420, strong: 0.7, weak: 0.7 });
      refreshWyrmBar(false);
    }
    return;
  }
  W.t += DT;
  if (W.flash > 0) W.flash -= DT;
  const d2p = Math.hypot(P.x - W.x, P.z - W.z);
  const pOnSlab = onSlabAt(P.x, P.z) && !P.air;
  switch (W.st) {
    case 'wakeup':
      if (W.t > 1.7) { W.st = 'dive'; W.t = 0; }
      break;
    case 'dive':      // slides under the silt
      if (W.t > 0.7) { W.st = 'swim'; W.t = 0; W.slabT = 0; SFX.burrow(); }
      break;
    case 'swim': {
      // the signature: it swims the dry silt like water. Wake = the contract.
      wyrmSwimStep(P.x, P.z, W.phase === 3 ? 5.6 : 4.6);
      if ((simTick & 3) === 0) {
        W.trail.push([W.x, W.z]);
        if (W.trail.length > 26) W.trail.shift();
      }
      if ((simTick % 5) === 0) {
        psDust.spawn(W.x, groundH(W.x, W.z) + 0.5, W.z, (Math.random() - 0.5) * 1.2, 1.1, (Math.random() - 0.5) * 1.2, 0.55);
      }
      if ((simTick % 50) === 0) SFX.wyrmRumble();
      if (pOnSlab) {
        W.slabT += DT;
        if (W.slabT > 2.2 && d2p < 5.5) {
          // it strikes the STONE — reels, brow bare. Terrain-reading pays.
          W.st = 'slamRock'; W.t = 0;
          W.eruptX = P.x; W.eruptZ = P.z;
          SFX.wyrmErupt();
        }
      } else {
        W.slabT = 0;
        if (d2p < 1.7 && W.t > 1.1) {
          W.st = 'erupt'; W.t = 0;
          W.eruptX = P.x; W.eruptZ = P.z;
          SFX.wyrmRumble();
          rumble({ duration: 200, strong: 0.5, weak: 0.7 });
        }
      }
      if (W.t > 7 && d2p > 3) W.t = 1.0;   // keep hunting
      break;
    }
    case 'erupt':
      // the swirl converges — HALF A SECOND to move or jump
      if ((simTick & 1) === 0) {
        const a = Math.random() * TAU;
        psDust.spawn(W.eruptX + Math.cos(a) * 1.4, groundH(W.eruptX, W.eruptZ) + 0.3, W.eruptZ + Math.sin(a) * 1.4,
          -Math.cos(a) * 1.6, 0.8, -Math.sin(a) * 1.6, 0.4);
      }
      if (W.t > 0.52) {
        W.x = W.eruptX; W.z = W.eruptZ;
        // the wake IS the contract: it stands at the strike point, on screen,
        // before any damage may land (matrixWorld fresh for the frustum test)
        W.c.wakeRoot.position.set(W.x, groundH(W.x, W.z) - 0.12, W.z);
        W.c.wakeRoot.visible = true;
        W.c.wakeRoot.updateMatrixWorld(true);
        SFX.wyrmErupt();
        CAM.shake = 0.4;
        rumble({ duration: 260, strong: 0.85, weak: 0.5 });
        burst(psDust, W.x, groundH(W.x, W.z) + 0.6, W.z, 26, 3.0, 2.6, 0.9);
        const hitD = Math.hypot(P.x - W.x, P.z - W.z);
        if (hitD < 2.1 && P.fy - groundH(P.x, P.z) < 0.8 && !onSlabAt(P.x, P.z)) {
          hurtPlayer(1, W.x, W.z, W.c.wakeRoot);
          W.missStreak = 0;
        } else W.missStreak++;
        W.st = 'surface'; W.t = 0;
      }
      break;
    case 'slamRock':
      if (W.t > 0.4) {
        W.x = W.eruptX + 1.6; W.z = W.eruptZ + 1.2;
        keepInWyrmArena(W, 2.0);
        SFX.thump(true);
        CAM.shake = 0.5;
        rumble({ duration: 300, strong: 0.9, weak: 0.6 });
        burst(psDust, W.x, groundH(W.x, W.z) + 0.8, W.z, 30, 3.2, 2.6, 0.9);
        burst(psSpark, W.x, groundH(W.x, W.z) + 1.6, W.z, 12, 2.2, 1.8, 0.5);
        W.st = 'daze'; W.t = 0;   // the long window
        SFX.wyrmCry();
      }
      break;
    case 'surface': {
      // body out of the silt, slithering — ALWAYS chippable
      if (W.t > (W.missStreak >= 2 ? 0.3 : 2.0)) {
        if (W.missStreak >= 2) { W.st = 'daze'; W.t = 0; W.missStreak = 0; SFX.wyrmCry(); }
        else if (W.phase >= 2 && !W.sweepDone && d2p < 6) { W.st = 'sweepTele'; W.t = 0; SFX.click(); }
        else { W.st = 'dive'; W.t = 0; W.sweepDone = false; }

    case 'sweepTele':

        W.sweepA = 0; W.sweepDone = true;
        SFX.wyrmErupt();
        rumble({ duration: 220, strong: 0.6, weak: 0.5 });
      }
      break;
    case 'sweep': {
      // the tail scythes a ring — JUMP it
      W.sweepA = W.t / 0.85 * TAU;
      if (W.t > 0.12 && W.t < 0.8) {

    for (const dv of W.devils) {
      if (!dv.on) {
        dv.on = true; dv.t = 0;
        const a = Math.random() * TAU;

        dv.tx = H3.x + (Math.random() - 0.5) * 18; dv.tz = H3.z + (Math.random() - 0.5) * 18;
      }
      dv.t += DT;
      const dd = Math.hypot(dv.tx - dv.x, dv.tz - dv.z);
      if (dd < 1) { dv.tx = H3.x + (Math.random() - 0.5) * 20; dv.tz = H3.z + (Math.random() - 0.5) * 20; }
      else { dv.x += (dv.tx - dv.x) / dd * 2.3 * DT; dv.z += (dv.tz - dv.z) / dd * 2.3 * DT; }
      keepInWyrmArena(dv, 1.4);
      if (Math.hypot(P.x - dv.x, P.z - dv.z) < 1.15 && P.fy - groundH(P.x, P.z) < 1.2) {
        hurtPlayer(1, dv.x, dv.z, dv.m.root);
      }
    }
  } else {
    for (const dv of W.devils) dv.on = false;
  }
}
/* what the sword can reach — wired into the master swing chain below */
function wyrmSwingHits() {
  const W = WYRM;

  const exposed = W.st === 'surface' || W.st === 'daze' || W.st === 'sweep' || W.st === 'sweepTele' ||

/* render-frame animation */
function animateWyrm(dtv, now) {
  const W = WYRM;
  if (!W.c) return;
  const near = Math.hypot(camera.position.x - H3.x, camera.position.z - H3.z) < 70;
  const gy = groundH(W.x, W.z);
  const w = now / 1000;
  const swimming = W.st === 'swim' || W.st === 'dive' || W.st === 'erupt' || W.st === 'slamRock';
  // the wake (the visibility contract): hump + shadow while it swims
  const wakeOn = near && W.active && !W.defeated && (W.st === 'swim' || W.st === 'erupt' || W.st === 'slamRock');
  W.c.wakeRoot.visible = wakeOn;

    } else {

    }
    W.c.wakeRoot.rotation.y = W.ang;
  }
  // the body: hidden under the silt while swimming, arcs out when exposed
  const bodyOn = near && !( swimming && W.active && !W.defeated ) && W.st !== 'gone' && W.st !== 'cure';
  W.c.root.visible = bodyOn && (W.active || W.st === 'sleep');
  if (state === 'cine' && CINE.id === 'wyrmCure') W.c.root.visible = near && W.st !== 'gone';
  if (W.c.root.visible) animateWyrmBody(now);
  // the brow-plate glow through the daze window
  const vulnB = W.active && !W.defeated && W.st === 'daze';
  W.c.brow.userData.halo.material.opacity = vulnB ? 0.55 + 0.3 * Math.sin(now / 90) : 0.18 + 0.08 * Math.sin(now / 480);
  W.c.flashM.visible = W.flash > 0 && W.c.root.visible;
  if (W.flash > 0) W.c.flashM.material.opacity = 0.35 + Math.sin(now / 26) * 0.25;
  // dust devils
  for (const dv of W.devils) {
    const on = dv.on && near;
    dv.m.root.visible = on;
    if (on) {
      dv.m.root.position.set(dv.x, groundH(dv.x, dv.z), dv.z);
      dv.m.m.rotation.y = now / 90;
      if (!LOWFX && Math.random() < 0.3) {
        psDust.spawn(dv.x, groundH(dv.x, dv.z) + 0.4 + Math.random() * 1.6, dv.z,
          (Math.random() - 0.5) * 1.4, 0.6, (Math.random() - 0.5) * 1.4, 0.4);
      }
    }
  }
  refreshWyrmBar(false);
}
function animateWyrmBody(now) {
  const W = WYRM;

/* ── AUTORUN: the authored run that is secretly the player's own ── */

<script>
/* ═══════════ p6c/6 — SAILING v1, the maiden voyage, and all the wiring ═══════════ */
SFX.splashSm = function () { if (!AC) return;

SFX.creakBoat = function () { if (!AC) return; const t = AC.currentTime;

const psSpray = makePS(90, 0.16, 0xeaf6fa, false, true);   // bow spray + wakes

DLG.pearlBeg = { name: 'PEARL', lines: [

const VOYAGE = { active: false, aboard: false, idx: 0, saidA: false, saidB: false };

}

function disembarkSpot() {
  // a dry (or platform) footing within stepping reach of the hull

      const a = BOAT.ang + i * (TAU / 12);

}

}
let seaEdgeCd = 0, seaEdgeHits = 0;
function tickSailing() {

    const ctx = currentInteract();

  let tgt = 0, full = false;
  if (VOYAGE.active) {
    // the guided lap: gentle autopilot; ✕ skips to the mooring
    const wp = VOYAGE_PATH[VOYAGE.idx];
    if (IN.confirm && VOYAGE.idx > 0) {
      const last = VOYAGE_PATH[VOYAGE_PATH.length - 1];
      B.x = last[0]; B.z = last[1]; B.spd = 0;
      VOYAGE.idx = VOYAGE_PATH.length;

      const d = Math.hypot(wp[0] - B.x, wp[1] - B.z);

    const c = collide(nx, nz, 1.15, WL);

    nx = r[0]; nz = r[1];

      nx -= (nx - SEA_EDGE.x) / de * push * 0.25;
      nz -= (nz - SEA_EDGE.z) / de * push * 0.25;

    psSpray.spawn(bx + (Math.random() - 0.5) * 0.7, WL + 0.25, bz + (Math.random() - 0.5) * 0.7,
      Math.sin(B.ang) * 1.2 + (Math.random() - 0.5) * 1.6, 1.4 + Math.random(), Math.cos(B.ang) * 1.2 + (Math.random() - 0.5) * 1.6, 0.5);

/* ── the flood joy-beat (playable, no fail state) ── */

/* ── hollow puzzles: the mirrors, the glyph doors ── */

  if (SAVE && !SAVE.basinOpen && QUEST.q >= 2 && !P.sailing) {

        slabs: SLABS.length, open: basinOpenNow,
      };
    },
  });
}
</script>
