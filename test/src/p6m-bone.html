<script>
/* ═══════════ p6m/2 — THE GROUND: one analytic field, rendered == physics ═══════════ */
const _obGroundH = groundH;

/* base badland (pools NOT cut yet — pool levels derive from this) */
function obBaseH(x, z) {
  /* the shore climb, z −974 → −1000 */
  const sN = smoothstep(clamp((-974 - z) / 26, 0, 1));
  let h = lerp(-4.8, 1.2, sN);
  /* the badland rise beyond, and the southern ridge wall */
  h += smoothstep(clamp((-1002 - z) / 200, 0, 1)) * 10.0;
  if (z < -1228) h += smoothstep(clamp((-1228 - z) / 14, 0, 1)) * 14.0;
  /* crust character: long swells + ribs (spared on the beach) */
  const beachK = clamp((h - 0.4) / 1.4, 0, 1);
  h += ((vnoise(x * 0.02, z * 0.02) - 0.5) * 5.2 +
        (vnoise(x * 0.055 + 7, z * 0.055 - 3) - 0.5) * 2.4) * beachK;
  /* the badland floor never dips under the beach line: a below-sea pit
     inland bakes as a teal "lake" that reads as water (screenshot law) */
  if (z < -1004) h = Math.max(h, 0.9);
  /* the landing beach (smooth sand, wins by max): a WIDE strand — a kid
     sails at a 1.4 km glowing coastline and must be able to land on it,
     not thread a needle. Steep at the waterline so the hull noses close
     enough for COME ASHORE's 4 m footing search. */
  const dL = Math.hypot(x - OB_LAND.x, z - OB_LAND.z);
  const dL2 = Math.hypot(x - (OB_LAND.x - 16), z - (OB_LAND.z + 3));
  const dL3 = Math.hypot(x - (OB_LAND.x + 15), z - (OB_LAND.z + 2));
  let padH = Math.max(0.45 - Math.max(0, dL - 9) * 0.26,
    0.4 - Math.max(0, dL2 - 8) * 0.26,
    0.4 - Math.max(0, dL3 - 8) * 0.26);
  /* one-sided: the strand faces the sea with a FACE, not a radial shoal —
     a submarine tongue 12 m out beached the hull before COME ASHORE could
     ever reach footing (the probe caught the grounding) */
  padH -= Math.max(0, z - (OB_LAND.z + 3)) * 0.6;
  h = Math.max(h, padH);
  /* the caldera: bowl, crest, and the north gate saddle */
  const dK = Math.hypot(x - OB_KILN.x, z - OB_KILN.z);
  if (dK < 26) {
    const rimH = 13.8, bowl = OB_KILN_FLOOR;
    let kh;
    if (dK <= 12.5) kh = bowl;
    else if (dK <= 16.2) kh = lerp(bowl, rimH, smoothstep((dK - 12.5) / 3.7));
    else kh = lerp(rimH, h, smoothstep((dK - 16.2) / 9.8));
    const ad = skAngDiff(skAngTo(OB_KILN.x, OB_KILN.z, x, z), 0);
    if (ad < 0.42 && dK > 12.5 && dK < 20) {
      kh = Math.min(kh, lerp(bowl + 0.25, h, smoothstep(clamp((dK - 13.5) / 6.5, 0, 1))));
    }

}
/* pool surfaces: each an authored flat basin 0.75 m under its own crust */
for (const p of OB_POOLS) p.y = obBaseH(p.x, p.z) - 0.75;
function obLavaEdgeDist(x, z) {
  /* metres OUTSIDE the nearest glow (negative = inside) */
  let best = 1e9;
  for (let i = 0; i < OB_POOLS.length; i++) {
    const p = OB_POOLS[i];
    const d = Math.hypot(x - p.x, z - p.z) - p.r;
    if (d < best) best = d;
  }
  return best;
}
function obRaw(x, z) {
  const base = _obGroundH(x, z);
  const t = obRegionT(x, z);
  if (t >= 1) return base;
  let h = obBaseH(x, z);
  /* the melt basins cut in, with a crust lip around each */
  for (let i = 0; i < OB_POOLS.length; i++) {
    const p = OB_POOLS[i];
    const d = Math.hypot(x - p.x, z - p.z);
    if (d < p.r + 3.2) {
      h += clamp(1 - Math.abs(d - (p.r + 1.6)) / 1.6, 0, 1) * 0.5;
      h = lerp(h, p.y, smoothstep(clamp((p.r - d) / 2.2, 0, 1)));

  const k = smoothstep(clamp((1 - t) / 0.10, 0, 1));

const obField = makeMeshField(obRaw, OB_C.x - OB_HX, OB_C.z - OB_HZ,
  OB_C.x + OB_HX, OB_C.z + OB_HZ, 3, () => false);
function obGroundAt(x, z) { return obInRegion(x, z) ? obField(x, z) : _obGroundH(x, z); }
groundH = function (x, z) {
  if (obInRegion(x, z)) return obField(x, z);
  return _obGroundH(x, z);
};

/* ── solidity: the caldera ring (minus its gate) + the south ridge ── */
function obSolidAt(x, z) {
  if (z < OB_C.z + 0) {
    const dK = Math.hypot(x - OB_KILN.x, z - OB_KILN.z);
    if (dK > 14.6 && dK < 17.2 &&
        skAngDiff(skAngTo(OB_KILN.x, OB_KILN.z, x, z), 0) > 0.42) return true;
    if (z < -1237) return true;                     // the ridge wall band
  }

}
worldSolidAt = function (x, z) {
  if (obInRegion(x, z)) return obSolidAt(x, z);
  return _obWorldSolid(x, z);
};
/* movement studs along the crest, the gate arc left open */
(function obRimColls() {
  const rm = 15.9, n = Math.round(rm * 4.2);
  for (let k = 0; k < n; k++) {
    const a = k / n * TAU;
    if (skAngDiff(a, 0) < 0.42 + 0.55 / rm) continue;
    addColl(OB_KILN.x + Math.sin(a) * rm, OB_KILN.z + Math.cos(a) * rm, 1.35);
  }

/* ── the rendered sheets: SAME field, badland palette, 2×2 chunks — and
   the lava verts remember BOTH lives (melt now, obsidian after) ── */
const OB_CRUST = col(0x5c574f), OB_CRUST2 = col(0x49453e), OB_BASALT = col(0x38352f),
      OB_ASHC = col(0x8a8178), OB_ASH2 = col(0xa39a8c), OB_SAND = col(0xcdb896),
      OB_CINDER = col(0x6e4a3c);
const OB_MELT_HI = [1.0, 0.46, 0.10], OB_MELT = [0.88, 0.26, 0.06], OB_MELT_LO = [0.52, 0.13, 0.05];
const OB_OBS = [0.085, 0.088, 0.115], OB_OBS2 = [0.13, 0.135, 0.175];
function obTrailDist(x, z) {
  let best = 1e9;
  for (let i = 0; i + 1 < OB_TRAIL.length; i++) {
    const [ax, az] = OB_TRAIL[i], [bx, bz] = OB_TRAIL[i + 1];
    const vx = bx - ax, vz = bz - az;
    const tt = clamp(((x - ax) * vx + (z - az) * vz) / (vx * vx + vz * vz), 0, 1);
    const d = Math.hypot(x - (ax + vx * tt), z - (az + vz * tt));
    if (d < best) best = d;
  }
  return best;
}
const _obc = [0, 0, 0];
function obSheetColor(x, z, y) {
  const ed = obLavaEdgeDist(x, z);
  if (ed < 0) {
    /* inside a pool: the MELT (hot core → cooler edge). These verts get
       swapped to obsidian by the cooling. */
    const k = clamp(-ed / 6, 0, 1);
    mix3(OB_MELT, OB_MELT_HI, k, _obc);
    if (vnoise(x * 0.3, z * 0.3) > 0.72) mix3(_obc, OB_MELT_LO, 0.65, _obc);
    return _obc;
  }
  const n = vnoise(x * 0.06, z * 0.06);
  const n2 = vnoise(x * 0.017 + 5, z * 0.017 - 9);
  if (y < OB_WL - 0.9) { mix3(S_IDEEP, S_IWET, clamp((y - (OB_WL - 5.5)) / 4.6, 0, 1), _obc); return _obc; }
  if (y < OB_WL + 0.6) { mix3(S_IWET, OB_SAND, clamp((y - (OB_WL - 0.9)) / 1.5, 0, 1), _obc); return _obc; }
  /* dark crust, ash drifts, a cinder blush near the melt */
  mix3(OB_CRUST, OB_CRUST2, clamp(n * 1.1 + 0.1, 0, 1), _obc);
  mix3(_obc, OB_ASH2, clamp(n2 * 1.1 - 0.25, 0, 0.75), _obc);
  if (n2 < 0.32) mix3(_obc, OB_BASALT, 0.55, _obc);
  const sx = (obField(x + 2, z) - obField(x - 2, z)) / 4;
  const sz = (obField(x, z + 2) - obField(x, z - 2)) / 4;
  const slope = Math.hypot(sx, sz);
  if (slope > 0.45) mix3(_obc, OB_BASALT, clamp((slope - 0.45) / 0.5, 0, 0.85), _obc);
  if (ed < 8) mix3(_obc, OB_CINDER, (1 - ed / 8) * 0.7, _obc);
  /* the worn-ash road: the walkable line reads at a glance */
  const td = obTrailDist(x, z);
  if (td < 3.2) mix3(_obc, OB_ASH2, (1 - td / 3.2) * 0.5, _obc);
  /* the beach */
  if (y < 1.6 && Math.hypot(x - OB_LAND.x, z - OB_LAND.z) < 16) {
    mix3(_obc, OB_SAND, clamp((1.6 - y) / 1.6, 0, 1) * 0.8, _obc);
  }

}
/* chunks with lava-vert bookkeeping: {mesh, lavaIdx[], hot[], cold[]} */
const OB_CHUNKS = [];
let obCooledK = -1;
(function obBuildSheets() {
  const x0 = OB_C.x - OB_HX, z0 = OB_C.z - OB_HZ;
  const S = 3;
  for (let cxk = 0; cxk < 1; cxk++) {
    for (let czk = 0; czk < 1; czk++) {
      const md = MD();
      const lavaIdx = [], hot = [], cold = [];
      const gx0 = x0, gz0 = z0;
      const gx1 = gx0 + OB_HX * 2, gz1 = gz0 + OB_HZ * 2;
      const gcv = (x, z) => {
        const y = obField(x, z);
        const c = obSheetColor(x, z, y);
        return [c[0], c[1], c[2], y, obLavaEdgeDist(x, z) < 0];
      };
      for (let x = gx0; x < gx1; x += S) {
        for (let z = gz0; z < gz1; z += S) {
          if (obRegionT(x + S / 2, z + S / 2) >= 1.02) continue;
          const c00 = gcv(x, z), c10 = gcv(x + S, z), c01 = gcv(x, z + S), c11 = gcv(x + S, z + S);
          const v0 = md.p.length / 3;
          pushTriIsle(md, x, c00[3], z, x, c01[3], z + S, x + S, c11[3], z + S, c00, c01, c11);
          pushTriIsle(md, x, c00[3], z, x + S, c11[3], z + S, x + S, c10[3], z, c00, c11, c10);
          const corner = [c00, c01, c11, c00, c11, c10];
          for (let k = 0; k < 6; k++) {
            if (corner[k][4]) lavaIdx.push(v0 + k);

        }

      m.matrixAutoUpdate = false; m.updateMatrix();
      m.frustumCulled = false;
      m.visible = false;

      /* remember both palettes for every melt vertex (post-bake colors) */
      const colA = m.geometry.attributes.color;
      const rnd = mulberry32(707 + cxk * 2 + czk);
      for (const vi of lavaIdx) {
        hot.push(colA.getX(vi), colA.getY(vi), colA.getZ(vi));
        const g = rnd();
        cold.push(OB_OBS[0] + g * (OB_OBS2[0] - OB_OBS[0]),
                  OB_OBS[1] + g * (OB_OBS2[1] - OB_OBS[1]),

    const colA = ch.mesh.geometry.attributes.color;

  }
}

/* ═══════════ p6m/3 — glow, glints, props, portal, registries ═══════════ */

/* the melt's own light: crossed soft quads per pool (additive, fog-free —
   never a THREE light; the night pass must not dim it) */
let obGlowMesh = null;
(function obBuildGlow() {
  const md = MD(), uvs = [];
  const rnd = mulberry32(727);
  for (const p of OB_POOLS) {
    /* the surface sheets (read from above) */
    skFlatQuad(md, p.x, p.y + 0.4, p.z, 1, 0, p.r * 1.25, p.r * 1.25, [1.0, 0.42, 0.12], uvs);
    skFlatQuad(md, p.x, p.y + 0.44, p.z, 0, 1, p.r * 0.7, p.r * 0.7, [1.0, 0.62, 0.2], uvs);
    /* the HAZE COLUMN (read from eye height and from the sea): crossed
       vertical sheets of ember light standing in the melt */
    skGlowQuad(md, p.x, p.y + 0.8 + p.r * 0.16, p.z, p.r * 0.8, 1.4 + p.r * 0.18, [1.0, 0.34, 0.08], uvs);
    skGlowQuad(md, p.x, p.y + 0.5, p.z, p.r * 0.45, 0.9, [1.0, 0.58, 0.16], uvs);
    /* rim embers: banked coals glinting in the crust cracks */
    const n = Math.round(p.r * 0.55);
    for (let i = 0; i < n; i++) {
      const a = rnd() * TAU, rr = p.r + 0.6 + rnd() * 2.2;
      const ex = p.x + Math.cos(a) * rr, ez = p.z + Math.sin(a) * rr;
      skGlowQuad(md, ex, obBaseH(ex, ez) + 0.22, ez, 0.28 + rnd() * 0.3, 0.2 + rnd() * 0.2, [1.0, 0.4 + rnd() * 0.2, 0.1], uvs);
    }
  }
  obGlowMesh = skGlowMesh(md, uvs, 0.62);
  obGlowMesh.renderOrder = 3;
  obGlowMesh.visible = false;
  scene.add(obGlowMesh);
})();
/* the obsidian glints — dark twin of the star-field: tiny bright quads
   scattered over the cooled fields, lit only once the melt has crusted */
let obGlintMesh = null;
(function obBuildGlints() {
  const md = MD(), uvs = [];
  const rnd = mulberry32(717);
  for (const p of OB_POOLS) {
    const n = Math.round(p.r * 1.1);
    for (let i = 0; i < n; i++) {
      const a = rnd() * TAU, rr = Math.sqrt(rnd()) * (p.r - 1);
      const gx = p.x + Math.cos(a) * rr, gz = p.z + Math.sin(a) * rr;
      const s = 0.16 + rnd() * 0.3;
      const cc = rnd() < 0.25 ? [0.85, 0.9, 1.0] : [0.6, 0.68, 0.9];
      skFlatQuad(md, gx, p.y + 0.06, gz, Math.cos(a), Math.sin(a), s, s, cc, uvs);
    }
  }
  obGlintMesh = skGlowMesh(md, uvs, 0.0);
  obGlintMesh.renderOrder = 3;
  obGlintMesh.visible = false;
  scene.add(obGlintMesh);

    const sp = d > 14 ? 7.2 : d > 6 ? 5.2 : 3.1;
    obHoundStep(Math.sin(H.ang) * sp * DT, Math.cos(H.ang) * sp * DT);

    H.spd = 0;

  }

function obChainNext(pts, finalPt, reach, adv) {
  const chain = pts.concat([finalPt]);
  const px = P.sailing ? BOAT.x : P.x, pz = P.sailing ? BOAT.z : P.z;

<script>
/* ═══════════ p6m/12 — the render frame, the derivation, telemetry, debug ═══════════ */

let obClock = performance.now(), obDbgDone = false;
const _obPrevCull = cullChunks;
cullChunks = function (ccx, ccz) {
  _obPrevCull(ccx, ccz);
  const now = performance.now();

  obClock = now;
  for (const m of OB_NIGHT_MATS) m.color.copy(WORLD_MAT.color);
  /* the region, chunk by chunk */
  const dR2 = (OB_C.x - ccx) * (OB_C.x - ccx) + (OB_C.z - ccz) * (OB_C.z - ccz);
  const nearRegion = dR2 < 900 * 900;
  for (const ch of OB_CHUNKS) {
    const d2 = (ch.cx - ccx) * (ch.cx - ccx) + (ch.cz - ccz) * (ch.cz - ccz);
    ch.mesh.visible = d2 < 780 * 780;
  }
  const cooled = obCooledK > 0.6;
  obGlowMesh.visible = nearRegion && obCooledK < 0.98;
  if (obGlowMesh.visible) {
    obGlowMesh.material.opacity = (0.5 + 0.18 * Math.sin(now / 140) + 0.06 * Math.sin(now / 47)) * (1 - obCooledK);
  }
  obGlintMesh.visible = nearRegion && cooled;
  if (obGlintMesh.visible && CINE.id !== 'obWheel7') {
    obGlintMesh.material.opacity = 0.55 + 0.22 * Math.sin(now / 640);
  }
  /* mid-fight the bowl walls occlude the badland: park the pocket draws */
  const fightHide = HOUND.mode === 'guardian' && HOUND.active && !HOUND.defeated;
  obPropMesh.visible = nearRegion;
  obGateGlow.visible = !LOWFX && nearRegion && (OB_KILN.x - ccx) * (OB_KILN.x - ccx) + (OB_KILN.z - ccz) * (OB_KILN.z - ccz) < 320 * 320;
  /* pockets */
  for (const sp of OB_SPRITES) {
    const d2 = (sp.x - ccx) * (sp.x - ccx) + (sp.z - ccz) * (sp.z - ccz);
    sp.c.root.visible = !sp.dead && !fightHide && d2 < 92 * 92;
    if (sp.c.root.visible) {
      const hop = (sp.st === 'idle') ? Math.abs(Math.sin(sp.hopPh)) * 0.12 : 0;
      sp.c.root.position.set(sp.x, sp.y + hop, sp.z);
      sp.c.root.rotation.y = sp.ang;
      const rattle = sp.st === 'tele' ? Math.sin(now / 26) * 0.07 : 0;

    h.c.root.visible = !h.dead && !fightHide && d2 < 78 * 78;
    if (h.c.root.visible) {
      h.c.root.position.set(h.x, h.y, h.z);
      h.c.root.rotation.y = h.ang;
      h.c.body.rotation.z = Math.sin(now / (h.st === 'dart' ? 22 : 40) + h.i) * 0.18;
      h.c.wings.visible = !LOWFX || h.st === 'tele' || h.st === 'dart';
      h.c.wings.material.opacity = 0.3 + 0.2 * Math.abs(Math.sin(now / 18 + h.i));

    } else H.c.root.scale.setScalar(1);
    c.shadow.visible = H.st !== 'bow' && !LOWFX;
    c.glow.visible = H.mode === 'guardian';   // the embers bank once she is home
    
  }
  /* ── THE OLD BONE, in all its lives ── */
  if (SAVE) {
    if (!SAVE.boneDone) {
      if (CINE.id !== 'obCure') {
        obBone.visible = houndVis;
        if (houndVis) obBoneToJaws();
      }
    } else if (obBoneCarry() && state === 'play') {
      obBone.visible = true;
      obBone.scale.setScalar(0.6);
      obBoneGlow.material.opacity = 0.4;
      obBone.position.set(P.x - Math.sin(P.heading) * 0.32, groundH(P.x, P.z) + 1.05, P.z - Math.cos(P.heading) * 0.32);
      obBone.rotation.set(0, P.heading + Math.PI / 2, 0.1);
    } else if (SAVE.sky >= 7 && !(SAVE.sky >= 8 && typeof cnSeat8 === 'function')) {
      /* the wheel keeps seven once it has seven (eight is the sibling's) */
      const nw = (WHEEL_POS.x - ccx) * (WHEEL_POS.x - ccx) + (WHEEL_POS.z - ccz) * (WHEEL_POS.z - ccz) < 150 * 150;
      if (CINE.id !== 'obWheel7') {
        if (nw && (!obSeat7Shown || (simTick % 90) === 0)) obSeat7(1);
        if (!nw && obSeat7Shown) obBone.visible = false;
        obSeat7Shown = nw;
      } else if (obSeatK >= 0) obSeat7(obSeatK);
    } else if (state === 'play' && CINE.id !== 'obCure' && CINE.id !== 'obWheel7') {
      obBone.visible = false;
    }
  }
  obExtendDebugOnce();
};

/* ═══ THE ONE DERIVATION — phase seven part one, from the save, both ways ═══ */
let obHookErr = null, obHookRuns = 0;
function obDeriveWorld(S) {
  obSetCooled(S.sky >= 7 ? 1 : 0);
  obGlintMesh.material.opacity = S.sky >= 7 ? 0.65 : 0;
  obGlowMesh.visible = false;
  obGlintMesh.visible = false;
  /* hazard state rests */
  obHeatShown = 0; obHeatEl.style.opacity = '0';
  obDipEl.style.opacity = '0';
  obNeedRelief = false; obPuffCapT = 0;
  obLastCrust[0] = OB_LAND.x; obLastCrust[1] = OB_LAND.z; obLastCrust[2] = 0;
  /* pockets reset (the Zelda-pocket law: nothing here persists) */
  for (const sp of OB_SPRITES) obSpriteReset(sp);
  for (const h of OB_HORNETS) obHornetReset(h);
  for (const s of obSalt) { s.got = false; s.mesh.visible = false; }
  /* chests derive open OR closed */
  obChestAnims = [];
  for (const e of obChests) {
    e.ch.opened = !!S[e.key];
    e.ch.lid.rotation.x = e.ch.opened ? -1.9 : 0;
    if (e.ch.heart) e.ch.heart.visible = false;
  }
  /* the guardian / the companion */
  obClearFurniture();
  const H = HOUND;
  H.hop = null; H.aboard = false; H.dozeT = 0; H.wagK = 0; H.petT = 0;
  obPrevSailing = false;
  if (S.boneDone || S.houndHome) {
    H.defeated = true;
    H.active = false;
    H.mode = 'companion';
    obHoundWarmK(1);
    const s = obHoundSafeSpot(P.x + 1.8, P.z + 1.4);
    H.x = s.x; H.z = s.z; H.y = groundH(H.x, H.z);
    obSetCompSt('follow');
  } else {
    H.defeated = false;
    H.mode = 'guardian';
    H.warmShown = -1;
    obHoundWarmK(0);
    obResetFight(false);
  }
  H.c.root.visible = false;
  obRefreshBar(false);
  obBone.visible = false;
  obSeat7Shown = false;
  obSeatK = -1;
  /* the end card belongs to its moment */
  if (S.sky >= 7 && !S.tbc7Seen) { S.tbc7Seen = true; storeSave(); }
}
window.__worldStateHooks.push(function (S) {
  obHookRuns++;
  try { obDeriveWorld(S); obHookErr = null; }
  catch (e) { obHookErr = String(e && e.message || e); throw e; }
});

/* ═══ telemetry ═══ */
window.__telemetryHooks.push(function (T) {
  T.emberSeen = obEmberSeen();
  T.boneDone = obBoneDone();
  T.houndHome = obHoundHome();
  T.tbc7Seen = !!(SAVE && SAVE.tbc7Seen);
  T.obCooledK = +obCooledK.toFixed(2);
  T.obInRegion = obInRegion(P.x, P.z);
  T.obInKiln = obInKiln(P.x, P.z);
  T.obLavaEd = obInRegion(P.x, P.z) ? +obLavaEdgeDist(P.x, P.z).toFixed(2) : 999;
  T.obPuffN = obPuffN;
  T.obReliefN = obReliefN;
  T.kilnActive = HOUND.mode === 'guardian' && HOUND.active;
  T.kilnHp = HOUND.hp;
  T.kilnPhase = HOUND.phase;
  T.kilnSt = HOUND.st;
  T.kilnBody = HOUND.bodyHits;
  T.kilnPounceN = HOUND.pounceN;
  T.kilnTailN = HOUND.tailN;
  T.kilnShakeN = HOUND.shakeN;
  T.kilnDigN = HOUND.digN;
  T.obMoteN = obMoteAlive();
  T.houndMode = HOUND.mode;
  T.houndSt = HOUND.st;
  T.houndX = +HOUND.x.toFixed(1);
  T.houndZ = +HOUND.z.toFixed(1);
  T.houndWarm = HOUND.warmShown;
  T.obPetN = HOUND.petN || 0;
  T.obSpriteAlive = OB_SPRITES.filter(s => !s.dead).length;
  T.obHornetAlive = OB_HORNETS.filter(h => !h.dead).length;
  T.obStLogN = window.__obStLog.length;
  T.obHookErr = obHookErr; T.obHookRuns = obHookRuns;
});

/* ═══ debug ═══ */
function obExtendDebugOnce() {
  if (obDbgDone || !window.__fmDebug) return;
  obDbgDone = true;
  const D = window.__fmDebug;
  D.warp.ember = () => { D.warp(OB_LAND.x, OB_LAND.z); return D.obInfo(); };
  D.warp.kilnarena = () => { D.warp(OB_KILN.x, OB_KILN.z - 6); return D.obInfo(); };
  Object.assign(D, {
    obInfo() {
      return {
        emberSeen: obEmberSeen(), boneDone: obBoneDone(), houndHome: obHoundHome(),
        cooled: +obCooledK.toFixed(2), q: SAVE ? SAVE.q : -1, sky: SAVE ? SAVE.sky : -1,
        lavaEd: obInRegion(P.x, P.z) ? +obLavaEdgeDist(P.x, P.z).toFixed(2) : null,
        puffs: obPuffN,
        sprites: OB_SPRITES.filter(s => !s.dead).length,
        hornets: OB_HORNETS.filter(h => !h.dead).length,
      };
    },
    houndInfo() {
      return {
        mode: HOUND.mode, st: HOUND.st, hp: HOUND.hp, phase: HOUND.phase,
        active: HOUND.active, defeated: HOUND.defeated,
        x: +HOUND.x.toFixed(1), z: +HOUND.z.toFixed(1), warm: HOUND.warmShown,
        body: HOUND.bodyHits, pounces: HOUND.pounceN, tails: HOUND.tailN,
        shakes: HOUND.shakeN, digs: HOUND.digN,
      };
    },
    /* setup only — never a mechanic under test */
    coolNow(k) { obSetCooled(k === undefined ? 1 : k); return +obCooledK.toFixed(2); },
    houndCome() {
      const s = obHoundSafeSpot(P.x + 2, P.z + 1.5);
      HOUND.x = s.x; HOUND.z = s.z; HOUND.y = groundH(s.x, s.z);
      return D.houndInfo();
    },
  });
}

/* name-tag every p6m scene object (perf forensics read these) */
(function obNameAll() {
  const tag = (root, n) => { if (root) root.traverse ? root.traverse(o => { if (!o.name) o.name = n; }) : 0; };
  for (const ch of OB_CHUNKS) tag(ch.mesh, 'obChunk');
  tag(obGlowMesh, 'obGlow'); tag(obGlintMesh, 'obGlint');
  tag(obPropMesh, 'obProps'); tag(obGateGlow, 'obGateGlow');
  for (const sp of OB_SPRITES) tag(sp.c.root, 'obSprite');
  for (const h of OB_HORNETS) tag(h.c.root, 'obHornet');
  for (const sd of obSalt) tag(sd.mesh, 'obSalt');
  for (const e of obChests) { tag(e.ch.group, 'obChest'); tag(e.ch.heart, 'obHeart'); }
  tag(HOUND.c.root, 'obHound');
  tag(obBone, 'obBone');
  tag(obRing, 'obRing'); tag(obMark, 'obMark');
  for (const mo of OB_MOTES) tag(mo.g, 'obMote');
  for (const cl of OB_CLODS) { tag(cl.m, 'obClod'); tag(cl.sh, 'obClodShadow'); }
})();

/* ═══ the pinned interface (the sibling p6n consumes this) ═══ */
window.__p6m = window.__p6m || {};
window.__p6m.houndAt = function () { return { x: HOUND.x, z: HOUND.z }; };
window.__p6m.houndRecall = function (x, z) {
  const s = obHoundSafeSpot(x, z);
  HOUND.x = s.x; HOUND.z = s.z; HOUND.y = groundH(s.x, s.z);
  if (HOUND.mode === 'companion') obSetCompSt('follow');
  return true;
};
window.__p6m.emberCooled = () => obCooled();
window.__p6m.boneItem = obBone;                      // the sibling seats it at 8/8
window.__p6m.region = { x: OB_C.x, z: OB_C.z };      // the end-flight waypoint
window.__p6m.land = OB_LAND;
window.__p6m.kiln = { x: OB_KILN.x, z: OB_KILN.z, r: OB_KILN.r };
</script>
