<script>
/* ═══════════════════ p6 — enemies, boss, dialogue, quests, cinematics ═══════════════════ */

/* ── quest state ──
   v2 OPEN LOOP: q0 is free play — NO banner, NO beacon, no directive text.
   The Crescent thread (q2) starts only when the player chooses to talk to
   Finn. q1 (v1's door-cut fetch) no longer exists; old saves migrate. */
const QUEST = { q: 0, phases: 0 };
const QUEST_TEXT = {
  0: '',
  2: 'RECOVER THE CRESCENT HORN — 0/8 PHASES RESTORED',
  3: 'CARRY THE CRESCENT TO THE MOONWHEEL',
  4: '1/8 PHASES RESTORED',
  5: 'CARRY THE HALF SHIELD TO THE MOONWHEEL',
  6: '2/8 PHASES RESTORED',
  /* PHASE 3 — THE CROSSING & THE HOURLESS ISLES */
  7:  'SALVAGE A KEEL WORTH THE OPEN SEA',
  8:  'CARRY THE KEEL TO THE BEACH',
  9:  'SAIL WEST — THE OPEN SEA IS OPEN',
  10: 'RECOVER THE GIBBOUS BELL',
  11: 'CARRY THE BELL TO THE MOONWHEEL',
  12: '3/8 PHASES RESTORED',
  /* PHASE 4 — THE CROWN & THE WIND'S RETURN */
  13: 'FOLLOW THE GOLD LIGHT',
  14: 'CLIMB THE FALLS STAIR',
  15: 'RECOVER THE WAXING SLIVER',
  16: 'CARRY THE SLIVER TO THE MOONWHEEL',
  17: '4/8 PHASES RESTORED',
  /* PHASE 5 — THE RIVER'S MOUTH & THE NIGHT MARKET */
  18: 'LIGHTS ON THE WATER',
  19: 'OPEN THE RIVER\'S MOUTH',
  20: 'LIGHT THE WAY UP THE SILVERRUN',
  21: 'THE NIGHT MARKET',
  22: '5/8 PHASES RESTORED',
};
function setQuest(q) {
  QUEST.q = q;
  SAVE.q = q; storeSave();
  const t = QUEST_TEXT[q] || '';
  questEl.textContent = t;
  questEl.classList.toggle('on', !!t);
  if (q === 4 || q === 6) setTimeout(() => questEl.classList.remove('on'), 9000);
}

/* ── glare overlay ── */
let glareA = 0, glareDecay = 1;
function flashGlare(op, dur) { glareA = Math.max(glareA, op); glareDecay = op / Math.max(0.15, dur); }

/* ── dialogue — v2: every beat ≤2 short lines, all skippable, all optional ── */
const DLG = {
  finn1: { name: 'KEEPER FINN', lines: [
    'A lighthouse in endless day is just... stairs. But that glass on your back still listens.',
    'The CRESCENT fell in the dry bay — press △ and the sword points. Here. I kept this for you.',
  ], onDone: () => { grantFinnHeart(); setQuest(2); } },
  finnWait: { name: 'KEEPER FINN', lines: [
    'Shade heals. Sun doesn’t. That’s the whole trick to the bay.',
  ], onDone: () => grantFinnHeart() },
  finnCarry: { name: 'KEEPER FINN', lines: [
    'That’s IT. That’s a piece of the moon. Up the hill — the wheel’s waited a year.',
  ], onDone: () => grantFinnHeart() },
  finn3: { name: 'KEEPER FINN', lines: [
    'One notch. Listen — the whole hill is humming.',
    'The Half Shield fell past the Parched Forest. Rest first. Or don’t — it’s not like it gets dark.',
  ], onDone: () => showTBC() },
  finnPost: { name: 'KEEPER FINN', lines: [
    'Seven to go. The tide follows them home, they say.',
  ], onDone: () => grantFinnHeart() },
  tock1: { name: 'GRANNY TOCK', lines: [
    '...four thousand and two. Counting seconds, dear — somebody has to remember what time was.',
    'Sleep? When it’s dark. So — never.',
  ] },
  tock2: { name: 'GRANNY TOCK', lines: ['...four thousand and nine. Don’t tangle my wool, dear.'] },
  tockDusk: { name: 'GRANNY TOCK', lines: [
    '...one... two... my my. Would you look at that colour.',
    'First yawn in a year. Off you go, dear. Seven more.',
  ] },
  pearl1: { name: 'PEARL', lines: [
    'Grown-ups say lights used to live in the night sky. Stars.',
    'They made that up. ...right?',
  ] },
  pearl2: { name: 'PEARL', lines: ['The sea was RIGHT here. Dad says I paddled in it.'] },
  pearlStar: { name: 'PEARL', lines: [
    'It’s real. It’s REAL, and it’s looking at me.',
    'Get the others, Wick. Get ALL of them.',
  ] },
};
const DS = { id: null, line: 0, chars: 0, npc: null };
function startDialog(id, npc) {
  DS.id = id; DS.line = 0; DS.chars = 0; DS.npc = npc || null;
  setState('dialog');
  dlgName.textContent = DLG[id].name;
  dlgText.textContent = '';
  el('dlgMore').innerHTML = kbdMode() ? 'J' : PADG['✕'];
  SFX.talk();
}
function tickDialog() {
  const d = DLG[DS.id];
  /* button glyphs in spoken lines become key names on a keyboard */
  const full = padGlyphs(d.lines[DS.line]);
  if (DS.chars < full.length) {
    DS.chars = Math.min(full.length, DS.chars + 2);
    /* glyphs are single chars, so the reveal can never cut one in half —
       the diamond swap happens after the slice */
    dlgText.innerHTML = glyphRender(full.slice(0, DS.chars));
  }
  if (IN.confirm) {
    if (DS.chars < full.length) {
      DS.chars = full.length;
      dlgText.innerHTML = glyphRender(full);
    } else if (DS.line < d.lines.length - 1) {
      DS.line++; DS.chars = 0; dlgText.textContent = '';
      SFX.talk();
    } else {
      const id = DS.id;
      DS.id = null;
      setState('play');
      if (d.onDone) d.onDone();
      markTalked(id);
    }
  }
}
function markTalked(id) {
  if (id === 'finn1') { SAVE.talked.finn = Math.max(SAVE.talked.finn, 1); }
  if (id === 'tock1') SAVE.talked.tock = 1;
  if (id === 'pearl1') SAVE.talked.pearl = 1;
  storeSave();
}

/* ── item toast ── */
function itemToast(big, small) {
  const t = el('itemToast');
  t.querySelector('.it1').innerHTML = glyphHTML(big);
  t.querySelector('.it2').innerHTML = glyphHTML(small);
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
}

/* ── Finn's heart container (v2: his beat is flavor + tutorial + this gift;
   granted from whichever chat happens first — migration-safe) ── */
function grantFinnHeart() {
  if (SAVE.finnHeart) return;
  SAVE.finnHeart = true;
  gainHeart('HEART CONTAINER', 'Finn kept it safe through the long noon.', groundH(P.x, P.z) + 1.4);
}

/* ── interactions — v2: nothing is quest-gated; prompts appear only when
   the player walks up (story is a thing you WALK UP TO) ── */
function currentInteract() {
  if (!P) return null;
  const near = (x, z, r) => Math.hypot(P.x - x, P.z - z) < r;
  // v4.5: inside ANY room — each one its own little world of interactions
  const R = roomAt(P.x, P.z);
  if (R) {
    if (R.id === 'harbor') {
      if (!homeChest.opened && near(homeChest.x, homeChest.z, 1.5))
        return { id: 'homeChest', label: '✕ OPEN' };
      if (near(328.25, -61.75, 1.25)) return { id: 'benchSit', label: '✕ SIT' };
    } else if (R.id === 'tock') {
      if (!tockChest.opened && near(tockChest.x, tockChest.z, 1.5))
        return { id: 'tockChest', label: '✕ OPEN' };
      if (tockClock.ticksLeft <= 0 && near(R.clockPos.x, R.clockPos.z, 1.45))
        return { id: 'windClock', label: '✕ WIND THE CLOCK' };
    } else if (R.id === 'pearl') {
      if (!pearlChest.opened && near(pearlChest.x, pearlChest.z, 1.4))
        return { id: 'pearlChest', label: '✕ OPEN' };
      if (!SAVE.boatWindow && pearlBoatAnimT < 0 && near(R.boatRug.x, R.boatRug.z, 1.3))
        return { id: 'toyBoat', label: '✕ PLACE THE BOAT' };
      if (near(R.chart.x, R.chart.z, 1.45)) return { id: 'starChart', label: '✕ LOOK' };
    } else if (R.id === 'light') {
      if (!lightChest.opened && near(lightChest.x, lightChest.z, 1.5))
        return { id: 'lightChest', label: '✕ OPEN' };
      if (near(R.desk.x, R.desk.z, 1.35)) return { id: 'logbook', label: '✕ READ THE LOGBOOK' };
      if (near(R.stairs.x, R.stairs.z, 1.35)) return { id: 'crates', label: '✕ LOOK' };
    } else if (R.id === 'cart') {
      if (!cartChest.opened && near(cartChest.x, cartChest.z, 1.5))
        return { id: 'cartChest', label: '✕ OPEN' };
      if (near(R.table.x, R.table.z, 1.3)) return { id: 'mapTable', label: '✕ LOOK' };
      if (near(R.wallMap.x, R.wallMap.z + 0.6, 1.45)) return { id: 'tideMap', label: '✕ LOOK' };
    }
    if (near(R.inDoor.x, R.inDoor.z, 1.2)) return { id: 'leaveHouse', room: R, label: '✕ LEAVE' };
    return null;
  }
  if (near(HOUSE_DOOR.outX, HOUSE_DOOR.outZ, 1.7))
    return { id: 'houseDoor', room: ROOMS[0], label: '✕ ENTER' };
  if (QUEST.q === 3 && P.carryCrescent && near(WHEEL_POS.x, WHEEL_POS.z, 5.2))
    return { id: 'wheel', label: '✕ PLACE THE CRESCENT' };
  if (!chest.opened && near(chest.x, chest.z, 1.7))
    return { id: 'chest', label: '✕ OPEN' };
  if (!doorChest.opened && kelpDoorCut && near(doorChest.x, doorChest.z, 1.8))
    return { id: 'doorChest', label: '✕ OPEN' };
  // v4.5: the other village doors (after the chests — the lighthouse door
  // spot overlaps the door-chest beat and must never steal its ✕)
  for (let i = 1; i < ROOMS.length; i++) {
    const Rd = ROOMS[i];
    if (Rd.id === 'light' && !kelpDoorCut) continue;   // kelp still bars it
    if (near(Rd.ext.outX, Rd.ext.outZ, Rd.id === 'light' ? 1.4 : 1.7))
      return { id: Rd.promptId, room: Rd, label: '✕ ENTER' };
  }
  for (const [npc, tag, rad] of [[finn, 'finn', 2.4], [tock, 'tock', 2.4], [pearl, 'pearl', 2.9]]) {
    if (near(npc.x, npc.z, rad)) return { id: 'talk', npc, tag, label: '✕ TALK' };
  }
  if (!wallBurned() && near(MIRROR_POS.x, MIRROR_POS.z, 2.4))
    return { id: 'mirror', label: 'HOLD ✕ — TURN THE SHELL' };
  return null;
}
function wallBurned() { return wallKelp.stalks[0].cut; }
function doInteract(ctx) {
  if (ctx.id === 'talk') {
    const t = ctx.tag;
    let id;
    if (t === 'finn') {
      if (QUEST.q >= 4) id = 'finnPost';
      else if (QUEST.q === 3) id = 'finnCarry';
      else if (!SAVE.talked.finn) id = 'finn1';    // THIS starts the Crescent thread
      else if (QUEST.q === 0) id = 'finn1';        // v3 self-heal: a damaged save
      // (talked but quest lost) gets the offer AGAIN — the arc can never dead-end
      else id = 'finnWait';
    } else if (t === 'tock') {
      if (QUEST.q >= 4) id = 'tockDusk';
      else id = SAVE.talked.tock ? 'tock2' : 'tock1';
    } else {
      if (QUEST.q >= 4) id = 'pearlStar';
      else id = SAVE.talked.pearl ? 'pearl2' : 'pearl1';
    }
    startDialog(id, ctx.npc);
  } else if (ctx.id === 'chest') {
    openChest();
  } else if (ctx.id === 'doorChest') {
    openDoorChest();
  } else if (ctx.id === 'homeChest') {
    openHomeChest();
  } else if (ctx.id === 'tockChest') {
    openRoomChest(tockChest, 'tockChest', 3, 'SALT CRYSTALS',
      'Three, from a tin marked RAINY DAYS. It has been sunny a year.');
  } else if (ctx.id === 'pearlChest') {
    openRoomChest(pearlChest, 'pearlChest', 3, 'SALT CRYSTALS',
      'Three of them, hidden where mothers never sweep.');
  } else if (ctx.id === 'lightChest') {
    openLightChest();
  } else if (ctx.id === 'cartChest') {
    openRoomChest(cartChest, 'cartChest', 3, 'SALT CRYSTALS',
      'Three, weighting the corners of a map that would not lie flat.');
  } else if (ctx.id === 'tideMap') {
    lookAtTideMap();
  } else if (ctx.id === 'mapTable') {
    lookAtMapTable();
  } else if (ctx.id === 'houseDoor' || ctx.id === 'tockDoor' || ctx.id === 'pearlDoor' || ctx.id === 'lightDoor' || ctx.id === 'cartDoor') {
    CINE.room = ctx.room;
    startCine('doorIn');
  } else if (ctx.id === 'leaveHouse') {
    CINE.room = ctx.room;
    startCine('doorOut');
  } else if (ctx.id === 'benchSit') {
    startCine('sit');
  } else if (ctx.id === 'windClock') {
    windTheClock();
  } else if (ctx.id === 'toyBoat') {
    placeToyBoat();
  } else if (ctx.id === 'starChart') {
    lookAtChart();
  } else if (ctx.id === 'logbook') {
    readLogbook();
  } else if (ctx.id === 'crates') {
    lookAtCrates();
  } else if (ctx.id === 'wheel') {
    startCine('wheel');
  }
  // mirror: nothing on press — it's a hold
}

/* ═══ v4.5: THE ROOMS' INTERACTIONS — every one is ✕-prompted, one line
   at most, and gets a tiny camera acknowledgment (a micro-beat, never a
   text dump). State that matters is saved. ═══ */
const MICRO = { cam: null, look: null, dur: 1.6, at: 0.55, t0: null, fired: false, caption: null, ms: 3000, onFire: null };
function startMicro(o) {
  MICRO.cam = o.cam; MICRO.look = o.look;
  MICRO.dur = o.dur || 1.6; MICRO.at = o.at !== undefined ? o.at : 0.55;
  MICRO.caption = o.caption || null; MICRO.ms = o.ms || 3000;
  MICRO.onFire = o.onFire || null; MICRO.fired = false;
  MICRO.t0 = [camera.position.x, camera.position.y, camera.position.z];
  startCine('micro');
}
/* Granny's floor clock — wind it, hear it live, hear it die */
const tockClock = { ticksLeft: 0, phase: 0, lastSign: 1, wasTicking: false };
function windTheClock() {
  SFX.crank();
  startMicro({
    cam: [330.35, 1.5, -100.5], look: [329.05, 1.6, -102.0], dur: 2.1, at: 0.9,
    onFire() { tockClock.ticksLeft = 4.2; tockClock.phase = 0; tockClock.wasTicking = true; },
  });
}
function tickClock() {
  const C = tockClock;
  if (C.ticksLeft > 0) {
    C.ticksLeft -= DT;
    // the swing dies with the spring: full arc at first, then nothing
    const env = clamp(C.ticksLeft / 1.6, 0, 1) * 0.42 + 0.02;
    C.phase += DT * 4.4;
    const s = Math.sin(C.phase);
    if (tockPend) tockPend.rotation.z = s * env;
    const sign = s >= 0 ? 1 : -1;
    if (sign !== C.lastSign) { C.lastSign = sign; if (roomAt(P.x, P.z)) SFX.tick(sign > 0); }
    if (C.ticksLeft <= 0) {
      C.ticksLeft = 0;
      if (tockPend) tockPend.rotation.z = 0;
      if (!SAVE.clockWound) {
        SAVE.clockWound = true; storeSave();
        showCaption('From outside, warm: “You hear that? …lovely.”', 3800);
      }
    }
  }
}
/* Pearl's toy boat — Wick sets it in the window facing the dry bay */
let pearlBoatAnimT = -1;
function placeToyBoat() {
  const R2 = pearlRoom;
  startMicro({
    cam: [330.3, 1.35, -139.6], look: [R2.boatSill.x, R2.boatSill.y + 0.1, R2.boatSill.z], dur: 2.3, at: 0.5,
    caption: 'For when the tide comes back.', ms: 3200,
    onFire() { pearlBoatAnimT = 0; SFX.pickup(); },
  });
}
function tickBoat() {
  if (pearlBoatAnimT < 0 || !pearlBoat) return;
  pearlBoatAnimT += DT;
  const R2 = pearlRoom;
  const k = smoothstep(clamp(pearlBoatAnimT / 1.1, 0, 1));
  const y = 0.015 + (R2.boatSill.y - 0.015) * k + Math.sin(k * Math.PI) * 0.35;
  pearlBoat.position.set(
    lerp(R2.boatRug.x, R2.boatSill.x, k), y, lerp(R2.boatRug.z, R2.boatSill.z, k));
  pearlBoat.rotation.y = lerp(0.6, Math.PI / 2, k);
  if (pearlBoatAnimT >= 1.1) {
    pearlBoatAnimT = -1;
    SAVE.boatWindow = true; storeSave();
  }
}
/* the star chart — blank until the sky gets its first star back */
function lookAtChart() {
  const starred = SAVE.sky >= 1;
  SFX.page();
  startMicro({
    cam: [331.5, 1.45, -139.85], look: [332.75, 1.45, -139.55], dur: 1.9, at: 0.55,
    caption: starred ? 'One real star on it now. She drew it herself.'
                     : 'Nobody could draw them for her.', ms: 3400,
    onFire() { if (!SAVE.chartSeen) { SAVE.chartSeen = true; storeSave(); } },
  });
}
/* the cartographer's wall map — pins following the water out */
function lookAtTideMap() {
  SFX.page();
  startMicro({
    cam: [330.2, 1.5, -220.4], look: [330.75, 1.45, -222.0], dur: 1.9, at: 0.55,
    caption: 'The sea used to reach the third stone. Someone keeps measuring.', ms: 3600,
    onFire() { if (!SAVE.mapTides) { SAVE.mapTides = true; storeSave(); } },
  });
}
/* the half-drawn new map on the drafting table */
function lookAtMapTable() {
  SFX.page();
  startMicro({
    cam: [331.1, 1.35, -220.1], look: [331.95, 0.8, -221.15], dur: 1.9, at: 0.55,
    caption: 'A new map, half-drawn. Waiting to be wrong again — the good way.', ms: 3600,
    onFire() { if (!SAVE.mapTable) { SAVE.mapTable = true; storeSave(); } },
  });
}
/* Finn's logbook — the last entry, a year old */
function readLogbook() {
  SFX.page();
  startMicro({
    cam: [329.35, 1.5, -179.75], look: [328.35, 0.85, -180.6], dur: 2.2, at: 0.6,
    caption: '“Day 1 without night. Light not needed. Keeping it clean anyway.”', ms: 3800,
  });
}
/* the crated stairs — Finn's polite "not yet" */
function lookAtCrates() {
  startMicro({
    cam: [330.6, 1.1, -180.3], look: [331.3, 1.9, -178.6], dur: 1.9, at: 0.55,
    caption: 'Finn’s hand: “The lamp room can wait for a lamp worth lighting.”', ms: 3600,
  });
}
/* shared salt-chest opener for the v4.5 rooms */
const roomChestAnims = [];
function openRoomChest(ch, saveKey, salt, big, small) {
  ch.opened = true;
  SAVE[saveKey] = true; storeSave();
  roomChestAnims.push({ ch, t: 0, salt, big, small });
  SFX.chestOpen();
}
function tickRoomChests() {
  for (let i = roomChestAnims.length - 1; i >= 0; i--) {
    const a = roomChestAnims[i];
    a.t += DT;
    a.ch.lid.rotation.x = -smoothstep(clamp(a.t / 0.5, 0, 1)) * 1.9;
    if (a.t > 0.65) {
      roomChestAnims.splice(i, 1);
      P.salt += a.salt;
      SAVE.salt = P.salt; storeSave();
      itemToast(a.big, a.small);
      SFX.pickup();
      burst(psSparkle, a.ch.x, 0.9, a.ch.z, 14, 1.2, 1.3, 0.9);
    }
  }
}
/* Finn's lighthouse chest — the HEART CONTAINER (same beat as the wreck) */
let lightChestAnimT = -1, lightHeartT = -1;
function openLightChest() {
  lightChest.opened = true;
  SAVE.lightChest = true; storeSave();
  lightChestAnimT = 0;
  SFX.chestOpen();
}
function tickLightChest() {
  if (lightChestAnimT < 0) return;
  lightChestAnimT += DT;
  lightChest.lid.rotation.x = -smoothstep(clamp(lightChestAnimT / 0.5, 0, 1)) * 1.9;
  if (lightChestAnimT > 0.4 && lightHeartT < 0) {
    lightHeartT = 0;
    lightChest.heart.visible = true;
  }
  if (lightHeartT >= 0) {
    lightHeartT += DT;
    const y0 = 0.5;
    if (lightHeartT < 1.0) {
      lightChest.heart.position.set(lightChest.x, y0 + lightHeartT * 0.9, lightChest.z);
      lightChest.heart.rotation.y += DT * 3;
    } else if (lightHeartT < 1.7) {
      const t = (lightHeartT - 1.0) / 0.7;
      lightChest.heart.position.set(lerp(lightChest.x, P.x, t), lerp(y0 + 0.9, 1.9, t), lerp(lightChest.z, P.z, t));
      lightChest.heart.rotation.y += DT * 6;
    } else {
      lightChest.heart.visible = false;
      lightChestAnimT = -1; lightHeartT = -1;
      gainHeart('HEART CONTAINER', 'Kept polished for a night worth lighting.', 1.4);
    }
  }
}

/* v4: the harbor-house salt chest */
let homeChestAnimT = -1;
function openHomeChest() {
  homeChest.opened = true;
  SAVE.houseChest = true; storeSave();
  homeChestAnimT = 0;
  SFX.chestOpen();
}
function tickHomeChest() {
  if (homeChestAnimT < 0) return;
  homeChestAnimT += DT;
  homeChest.lid.rotation.x = -smoothstep(clamp(homeChestAnimT / 0.5, 0, 1)) * 1.9;
  if (homeChestAnimT > 0.65) {
    homeChestAnimT = -1;
    P.salt += 3;
    SAVE.salt = P.salt; storeSave();
    itemToast('SALT CRYSTALS', 'Three of them, kept dry by a house that waited.');
    SFX.pickup();
    burst(psSparkle, homeChest.x, 0.9, homeChest.z, 14, 1.2, 1.3, 0.9);
  }
}

/* lighthouse-door chest — a salt cache for the curious slasher */
let doorChestAnimT = -1;
function openDoorChest() {
  doorChest.opened = true;
  SAVE.doorChest = true; storeSave();
  doorChestAnimT = 0;
  SFX.chestOpen();
}
function tickDoorChest() {
  if (doorChestAnimT < 0) return;
  doorChestAnimT += DT;
  doorChest.lid.rotation.x = -smoothstep(clamp(doorChestAnimT / 0.5, 0, 1)) * 1.9;
  if (doorChestAnimT > 0.65) {
    doorChestAnimT = -1;
    P.salt += 4;
    SAVE.salt = P.salt; storeSave();
    itemToast('SALT CACHE', 'Four crystals, dry as bone. Finn hoards the strangest things.');
    SFX.pickup();
    burst(psSparkle, doorChest.x, groundH(doorChest.x, doorChest.z) + 0.8, doorChest.z, 14, 1.2, 1.3, 0.9);
  }
}

/* chest + heart container */
let chestAnimT = -1, heartFloatT = -1;
function openChest() {
  chest.opened = true;
  SAVE.wreckChest = true; storeSave();
  chestAnimT = 0;
  SFX.chestOpen();
}
function tickChest() {
  if (chestAnimT < 0) return;
  chestAnimT += DT;
  chest.lid.rotation.x = -smoothstep(clamp(chestAnimT / 0.5, 0, 1)) * 1.9;
  if (chestAnimT > 0.4 && heartFloatT < 0) {
    heartFloatT = 0;
    chest.heart.visible = true;
  }
  if (heartFloatT >= 0) {
    heartFloatT += DT;
    const y0 = groundH(chest.x, chest.z) + 0.5;
    if (heartFloatT < 1.0) {
      chest.heart.position.set(chest.x, y0 + heartFloatT * 0.9, chest.z);
      chest.heart.rotation.y += DT * 3;
    } else if (heartFloatT < 1.7) {
      const t = (heartFloatT - 1.0) / 0.7;
      chest.heart.position.set(lerp(chest.x, P.x, t), lerp(y0 + 0.9, groundH(P.x, P.z) + 1.9, t), lerp(chest.z, P.z, t));
      chest.heart.rotation.y += DT * 6;
    } else {
      chest.heart.visible = false;
      chestAnimT = -1; heartFloatT = -1;
      gainHeart('HEART CONTAINER', 'The old sea kept one safe for you.', groundH(P.x, P.z) + 1.4);
    }

}

/* salt pickups — v3: a soft chime when you come near (2 m), pop-and-count
   on collect. The chime re-arms once you leave. */
function tickSalt() {
  for (const s of saltPickups) {
    if (s.got) continue;
    const d = Math.hypot(P.x - s.x, P.z - s.z);
    if (d < 2.0 && !s.chimed) { s.chimed = true; SFX.chime(1.6); }
    else if (d > 4.5) s.chimed = false;

/* ── THE SHELL LATCH — shared by every mirror-shell in the game (the
   grotto shell here, both hollow water-glyphs in p6c, the Foundry's in
   p6e; page scope makes one definition enough).

   The prompt says "HOLD ✕ — TURN THE SHELL", so a HOLD must be able to
   finish the job. It could not: while held the shell swept at 0.75 rad/s
   and the magnetic settle applied only on RELEASE, so a continuous hold
   crossed the 0.34 rad aim window in 0.45 s and the 1.0 s burn could
   never complete. Now the settle applies WHILE HELD too — the moment the
   shell comes inside the window the sweep stops and it seats itself on
   the mark and stays there for as long as you hold. The wind organ's
   auto-latch (p6g) is the reference feel. Release-turning is untouched:
   let go inside the window and the same settle seats it. */
const SHELL_RATE = 0.75, SHELL_SETTLE = 0.4;
function shellDelta(a, t) {
  let da = (a - t) % TAU;
  da = ((da % TAU) + TAU) % TAU;
  if (da > Math.PI) da -= TAU;
  return da;
}
function tickShellAim(sh, held, live) {
  /* sh = { angle, target, group }. `live` false = the puzzle is already
     solved: turn freely, never settle. Returns the signed delta. */
  let da = shellDelta(sh.angle, sh.target);
  const latch = live && Math.abs(da) < SHELL_SETTLE;
  if (held && !latch) {
    sh.angle += SHELL_RATE * DT;
    if (sh.angle > TAU) sh.angle -= TAU;
    da = shellDelta(sh.angle, sh.target);
  }
  if (live && Math.abs(da) < SHELL_SETTLE) {
    sh.angle = angLerp(sh.angle, sh.target, 0.05);
    da = shellDelta(sh.angle, sh.target);
  }
  sh.group.rotation.y = -sh.angle;
  return da;
}

/* ── the mirror-shell puzzle ── */
let burnT = 0, beamOn = false, wallBurnAnim = -1, mirrorDelta = 9;
function tickMirror() {
  /* the shell is a PLACE. Resolving the ✕ prompt walks every region's
     interact chain in the game — the whole world's worth of proximity
     tests — and this asked for it every single frame from anywhere,
     including two kilometres away on the Crown. Gate it on the mirror's
     own footprint (p6e's foundry pattern); everything below still runs
     unchanged, so the beam, the magnetic settle and the burn are
     byte-identical wherever they could ever be watched. */
  const dmx = P.x - MIRROR_POS.x, dmz = P.z - MIRROR_POS.z;
  const ctx = (dmx * dmx + dmz * dmz < 60 * 60) ? currentInteract() : null;
  const nearMirror = ctx && ctx.id === 'mirror';
  const held = !!(nearMirror && IN.atkHeld && state === 'play');
  const da = tickShellAim(mirror, held, !wallBurned());
  mirrorDelta = da;
  beamOn = !wallBurned() && Math.abs(da) < 0.17;
  beamOut.rotation.y = -mirror.angle;
  beamOut.material.opacity = beamOn ? 0.3 : (Math.abs(da) < 0.7 ? 0.1 : 0);
  if (beamOn && wallBurnAnim < 0) {
    burnT += DT;
    if (burnT > 0.15 && Math.random() < 0.3) {
      burst(psSpark, KELPWALL.x, groundH(KELPWALL.x, KELPWALL.z) + 1.5, KELPWALL.z, 3, 0.8, 1.6, 0.5);
    }
    if (burnT >= 1.0) {
      wallBurnAnim = 0;
      SFX.burn();
    }
  } else if (!beamOn) burnT = Math.max(0, burnT - DT * 2);
  if (wallBurnAnim >= 0 && !wallBurned()) {
    wallBurnAnim += DT;
    if (Math.random() < 0.5) {
      const s = wallKelp.stalks[(Math.random() * wallKelp.stalks.length) | 0];
      burst(psSpark, s.x, groundH(s.x, s.z) + Math.random() * 2.5, s.z, 4, 1.2, 2.0, 0.6);
    }
    if (wallBurnAnim > 1.4) {
      for (const s of wallKelp.stalks) s.cut = true;
      rebuildKelpPatch(wallKelp);
      for (const c of wallColl) c.off = true;
      SAVE.wallBurned = true; storeSave();
      burst(psDust, KELPWALL.x, groundH(KELPWALL.x, KELPWALL.z) + 1, KELPWALL.z, 20, 2.2, 2.0, 0.8);
      rumble({ duration: 250, strong: 0.4, weak: 0.5 });
    }
  }
}

/* ═══════════ ENEMIES — v2: fighting is the default activity.
   3 crab patrols + a first crab scuttling ~20 s from spawn, and 4 sun-imp
   clusters across the bay. Everything respawns on area re-entry. ═══════════ */
const crabs = [
  // patrol A — the quay gap, the open loop's first crab
  { x: 10, z: 27 }, { x: 20, z: 39 },
  // patrol B — mid-bay kelp forests
  { x: -8, z: 44 }, { x: 0, z: 54 }, { x: -20, z: 52 },
  // patrol C — outer bay & the grotto approach
  { x: 32, z: 66 }, { x: 42, z: 76 }, { x: 24, z: 116 }, { x: 38, z: 120 },
].map(s => ({
  c: buildScorchCrab(), sx: s.x, sz: s.z, x: s.x, z: s.z, hp: 3,
  st: 'patrol', t: Math.random() * 3, ang: 0, dir: [1, 0], dead: false, area: 'bay',
  lungeCD: 0, flash: 0,
}));
for (const cr of crabs) { cr.c.root.position.set(cr.x, groundH(cr.x, cr.z), cr.z); scene.add(cr.c.root); }

function mkImp(x, z) {
  return {
    m: buildSunImp(), sx: x, sz: z, x, z, y: 0, face: 0,
    st: 'drift', t: Math.random() * 2, dir: [0, 0, 0], dead: false, area: 'bay',
  };
}
const wisps = [
  // cluster D1 — over the first dune from spawn (deep enough that they are
  // never co-visible with the village NPCs: draw-call budget)
  [0, 48], [-5, 52], [4, 53],
  // D2 — mid-bay east
  [26, 56], [31, 61], [22, 62],
  // D3 — the wreck approach
  [-34, 78], [-29, 83], [-38, 84],
  // D4 — deep bay, before the grotto
  [16, 92], [21, 97], [12, 98],
].map(p => mkImp(p[0], p[1]));
for (const w of wisps) { w.y = groundH(w.x, w.z) + 1.8; w.m.root.position.set(w.x, w.y, w.z); scene.add(w.m.root); }
/* squash-pop corpses mid-animation (render-frame driven) */
const impPops = [];

function areaAt(x, z) {
  if (inGrottoAt(x, z)) return 'grotto';
  return z < 14 ? 'village' : 'bay';
}
function respawnLeftBehind() {
  const cur = P.area;
  for (const cr of crabs) {
    if (cr.dead && cr.area !== cur) {
      cr.dead = false; cr.hp = 3; cr.st = 'patrol'; cr.x = cr.sx; cr.z = cr.sz;
      cr.c.root.position.set(cr.x, groundH(cr.x, cr.z), cr.z);
    }
  }
  for (const w of wisps) {
    if (w.dead && w.area !== cur && w.area !== 'boss') {
      w.dead = false; w.st = 'drift'; w.x = w.sx; w.z = w.sz;
      w.y = groundH(w.x, w.z) + 1.8;
      w.m.root.visible = true;
      w.m.root.scale.setScalar(1);
    }
  }
}

function tickCrab(cr) {
  if (cr.dead) return;
  const d2p = Math.hypot(P.x - cr.x, P.z - cr.z);
  cr.t += DT;
  if (cr.flash > 0) cr.flash -= DT;
  if (cr.lungeCD > 0) cr.lungeCD -= DT;
  if (cr.st === 'stagger') {
    cr.x += cr.dir[0] * 4 * DT; cr.z += cr.dir[1] * 4 * DT;
    if (cr.t > 0.4) { cr.st = 'aggro'; cr.t = 0; }
  } else if (cr.st === 'patrol') {
    const a = Math.sin(cr.t * 0.5 + cr.sx) * 2.2;
    const tx = cr.sx + Math.cos(a) * 3, tz = cr.sz + Math.sin(a * 1.3) * 3;
    moveCrab(cr, tx, tz, 1.0);
    if (d2p < 8) { cr.st = 'aggro'; cr.t = 0; }
  } else if (cr.st === 'aggro') {
    moveCrab(cr, P.x, P.z, 1.9);
    // v3: leashed to the patrol ground — no kiting crab trains to the village
    if (d2p > 13 || Math.hypot(cr.x - cr.sx, cr.z - cr.sz) > 28) { cr.st = 'patrol'; cr.t = 0; }
    else if (d2p < 3.6 && cr.lungeCD <= 0) {
      cr.st = 'tele'; cr.t = 0; fmTeleStart(cr);
      SFX.click();
    }
  } else if (cr.st === 'tele') {
    // claws up, rattling — the read (a full 0.9 s of it)
    if (cr.t > 0.90) {
      cr.st = 'lunge'; cr.t = 0; fmTeleFire('scorchCrab', cr);
      const d = Math.hypot(P.x - cr.x, P.z - cr.z) || 1;
      cr.dir = [(P.x - cr.x) / d, (P.z - cr.z) / d];
      SFX.click();
    }
  } else if (cr.st === 'lunge') {
    const lox = cr.x, loz = cr.z;
    cr.x += cr.dir[0] * 7.5 * DT; cr.z += cr.dir[1] * 7.5 * DT;
    const c = collide(cr.x, cr.z, 0.6);
    const lr = resolveSolid(lox, loz, c[0], c[1]);
    cr.x = lr[0]; cr.z = lr[1];
    // v3: a well-timed jump sails over the pinch
    if (Math.hypot(P.x - cr.x, P.z - cr.z) < 1.3 && P.fy - groundH(P.x, P.z) < 0.7) hurtPlayer(1, cr.x, cr.z, cr.c.root);
    if (cr.t > 0.42) { cr.st = 'recover'; cr.t = 0; cr.lungeCD = 1.45; }
  } else if (cr.st === 'recover') {
    if (cr.t > 0.50) { cr.st = 'aggro'; cr.t = 0; }   // recovery shaved to pay for the windup
  }
  // soft push so it never overlaps the player standing still
  if (d2p < 1.35 && cr.st !== 'lunge') {
    const d = d2p || 1;
    cr.x -= (P.x - cr.x) / d * 1.2 * DT; cr.z -= (P.z - cr.z) / d * 1.2 * DT;
  }
}
function moveCrab(cr, tx, tz, sp) {
  const dx = tx - cr.x, dz = tz - cr.z, d = Math.hypot(dx, dz);
  if (d > 0.4) {
    const ox = cr.x, oz = cr.z;
    cr.x += dx / d * sp * DT; cr.z += dz / d * sp * DT;
    const c = collide(cr.x, cr.z, 0.5);
    const r = resolveSolid(ox, oz, c[0], c[1]);   // v4: crabs respect rock too
    cr.x = r[0]; cr.z = r[1];
    cr.ang = Math.atan2(dx, dz);
  }
}
let crabHitsTotal = 0;   // v3 telemetry: every registered sword→crab contact
function hitCrab(cr) {
  cr.hp--;
  crabHitsTotal++;
  cr.flash = 0.22;
  SFX.hit();
  P.hitstop = 4;                      // v3: a touch more hit-pause on contact
  rumble({ duration: 90, strong: 0.55, weak: 0.35 });
  const y = groundH(cr.x, cr.z);
  burst(psSpark, cr.x, y + 0.55, cr.z, 15, 2.3, 1.8, 0.45);   // big spark burst
  const d = Math.hypot(cr.x - P.x, cr.z - P.z) || 1;
  cr.dir = [(cr.x - P.x) / d, (cr.z - P.z) / d];
  if (cr.hp <= 0) {
    cr.dead = true;
    burst(psDust, cr.x, y + 0.3, cr.z, 16, 2.0, 1.6, 0.7);
    SFX.thump(false);
    cr.c.root.visible = false;      // burrows away — nothing dies in Brightharbor
    if (Math.random() < 0.35) {
      P.salt++; SAVE.salt = P.salt; storeSave();
      SFX.pickup();
      burst(psSparkle, cr.x, y + 0.6, cr.z, 8, 1.0, 1.2, 0.7);
    }
  } else {
    cr.st = 'stagger'; cr.t = 0;
  }
}

function tickWisp(w) {   // — the SUN IMP brain (name kept from v1)
  if (w.dead) return;
  w.t += DT;
  const gy = groundH(w.x, w.z);
  // shade fizzles imps into harmless sparkles — the theme as a mechanic.
  // Boss-arena imps are exempt (the whole grotto counts as shade; the King's
  // sun-madness sustains them — otherwise phase-3 adds die at spawn).
  if (w.area !== 'boss' && inShadeAt(w.x, w.z) && w.st !== 'pop') {
    popWisp(w);
    return;
  }
  const d2p = Math.hypot(P.x - w.x, P.z - w.z);
  const faceP = () => { w.face = Math.atan2(P.x - w.x, P.z - w.z); };
  if (w.st === 'drift') {
    w.y = gy + 1.8 + Math.sin(w.t * 2.2) * 0.25;
    // v3: imps are leashed to their dune — no kiting a glowing mob across
    // the map (and no village frames paying for a chase entourage)
    const dHome = Math.hypot(w.x - w.sx, w.z - w.sz);
    if (w.area !== 'boss' && dHome > 26) {
      w.x += (w.sx - w.x) / dHome * 2.4 * DT;
      w.z += (w.sz - w.z) / dHome * 2.4 * DT;
      return;
    }
    if (d2p > 1.5 && d2p < 16) {
      const d = d2p || 1;
      w.x += (P.x - w.x) / d * 1.25 * DT;
      w.z += (P.z - w.z) / d * 1.25 * DT;
      faceP();
    }
    if (d2p < 4.6) { w.st = 'tele'; w.t = 0; fmTeleStart(w); SFX.chirp(); }   // rear-up + chirp
  } else if (w.st === 'tele') {
    faceP();
    w.y = gy + 2.15 + Math.sin(w.t * 18) * 0.06;
    if (w.t > 0.90) {           // a full 0.9 s reared up before it stoops
      w.st = 'dive'; w.t = 0; fmTeleFire('sunImp', w);
      const ty = groundH(P.x, P.z) + 0.8;
      const dx = P.x - w.x, dy = ty - w.y, dz = P.z - w.z;
      const l = Math.hypot(dx, dy, dz) || 1;
      w.dir = [dx / l * 8.5, dy / l * 8.5, dz / l * 8.5];
      SFX.pop();
    }
  } else if (w.st === 'dive') {
    w.x += w.dir[0] * DT; w.y += w.dir[1] * DT; w.z += w.dir[2] * DT;
    if (Math.hypot(P.x - w.x, P.z - w.z) < 0.85 && Math.abs(w.y - (groundH(P.x, P.z) + 1.0)) < 1.0) {
      hurtPlayer(1, w.x, w.z, w.m.root);
      w.st = 'drift'; w.t = 0;
    }
    if (w.y < gy + 0.25 || w.t > 1.1) { w.st = 'drift'; w.t = 0; }
  }
}
function popWisp(w) {
  // squash-pop: two frames of squash, then a sparkle burst — kill feedback
  w.dead = true;
  impPops.push({ m: w.m, t: 0 });
  burst(psSpark, w.x, w.y, w.z, 16, 1.9, 1.0, 0.7);
  burst(psSparkle, w.x, w.y, w.z, 10, 1.3, 0.7, 0.8);
  SFX.pop();
  rumble({ duration: 60, strong: 0.25, weak: 0.35 });
}

/* ═══════════ THE SUNSTRUCK KING-CRAB ═══════════
   v4 BOSS TRUTH: the boss has real HP. Body hits ALWAYS chip (2), claw
   hits during slam-recovery windows do 5x (10). Phases at 60 / 30 HP.
   Proximity always wakes it — no quest-state excuses. */
const BOSS_HP = 90;
const BOSS_SLAM_TELE = 0.95;   // ≥54 ticks of claw-up warning; commits at 40%
const BOSS = {
  c: null, mark: null, active: false, phase: 0, clawHits: 0, st: 'idle', t: 0,
  hp: BOSS_HP, hpMax: BOSS_HP, bodyHits: 0,
  x: GROTTO_B.x, z: GROTTO_B.z - 2, ang: Math.PI,
  slamPos: [0, 0], chargeDir: [0, 0], chargeN: 0,
  wispT: 0, defeated: false, crescentGiven: false, flash: 0,
};
function bossPhaseHp(ph) { return ph <= 1 ? BOSS_HP : ph === 2 ? 60 : 30; }
function initBoss() {
  // v6: BUILD only — every save-derived fact (defeated, cured eyes, resting
  // spot) now lives in applyWorldState(), which runs at boot AND on every
  // save transition. John's field bug: a completed save configured the boss
  // at boot, then NEW GAME kept the cured boss — unfightable fresh game.
  bossHinted = [false, false, false, false];
  BOSS.c = buildKingCrab();
  BOSS.c.root.position.set(BOSS.x, groundH(BOSS.x, BOSS.z), BOSS.z);
  scene.add(BOSS.c.root);
  if (!BOSS.mark) BOSS.mark = buildSlamMark();
}
/* THE SLAM MARK — a baked ground ring burning at the COMMITTED strike point,
   so the slam is a place you can walk out of instead of a place you already
   are. One pooled annulus, unit radius, scaled per frame. No shadowBlur. */
function buildSlamMark() {
  /* a standing band, not a flat disc: the arena floor slopes, and a disc at
     one Y buries itself in the sand (caught in the staged screenshot) */
  const md = MD();
  for (let i = 0; i < 20; i++) {
    const a0 = i / 20 * TAU, a1 = (i + 1) / 20 * TAU;
    pushQuad(md, [Math.cos(a0), 0, Math.sin(a0)], [Math.cos(a1), 0, Math.sin(a1)],
      [Math.cos(a1) * 1.1, 0.55, Math.sin(a1) * 1.1], [Math.cos(a0) * 1.1, 0.55, Math.sin(a0) * 1.1],
      i % 2 ? [1, 0.72, 0.34] : [1, 0.5, 0.18]);
  }
  const m = mdMesh(md, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false,
  }), false);
  m.frustumCulled = false;
  m.visible = false;
  scene.add(m);
  return m;
}
/* ── the boss HP bar — standing convention for every boss to come ── */
const bossBarEl = el('bossBar'), bossFillEl = el('bossFill'), bossNameEl = el('bossName');
let bossBarShown = false, bossBarW = -1, bossFlashTimer = 0;
function refreshBossBar(hitFlash) {
  const B = BOSS;
  const want = B.active && !B.defeated;
  if (want !== bossBarShown) {
    bossBarShown = want;
    bossBarEl.classList.toggle('on', want);
    if (want) bossNameEl.textContent = 'THE SUNSTRUCK KING-CRAB';
    if (!want) bossBarEl.classList.remove('hit');
  }
  if (!want) return;
  const w = Math.round(clamp(B.hp / B.hpMax, 0, 1) * 1000) / 10;
  if (w !== bossBarW) {
    bossBarW = w;
    bossFillEl.style.width = `calc((100% - 4px) * ${w / 100})`;
  }
  if (hitFlash) {
    bossBarEl.classList.add('hit');
    clearTimeout(bossFlashTimer);
    bossFlashTimer = setTimeout(() => bossBarEl.classList.remove('hit'), 130);
  }
}
function calmBossEyes(t) {
  const colA = BOSS.c.eyeGlow.geometry.attributes.color;
  for (let i = 0; i < colA.count; i++) {
    colA.setXYZ(i, lerp(1.0, 0.15, t), lerp(0.62, 0.12, t), lerp(0.2, 0.1, t));
  }
  colA.needsUpdate = true;
}
function bossClawPos() {
  // world pos of the big claw tip-ish
  const a = BOSS.ang;
  return [BOSS.x + Math.sin(a) * 2.2 - Math.cos(a) * 2.0, BOSS.z + Math.cos(a) * 2.2 + Math.sin(a) * 2.0];
}
function tickBoss() {
  const B = BOSS;
  if (!B.c || B.defeated) return;
  const inArena = Math.hypot(P.x - GROTTO_B.x, P.z - GROTTO_B.z) < GROTTO_B.r + 1;
  if (!B.active) {
    // v4: proximity ALWAYS wakes a reachable boss — no quest-state excuses.
    // (Ben's field failure: standing in the arena slashing a dormant crab.)
    if (inArena) {
      B.active = true;
      if (B.phase === 0) B.phase = 1;
      B.hp = bossPhaseHp(B.phase);            // checkpoint at the phase start
      B.clawHits = 0; B.st = 'track'; B.t = 0;
      SFX.thump(true);
      CAM.shake = 0.3;
      rumble({ duration: 400, strong: 0.7, weak: 0.7 });
      refreshBossBar(false);
    }
    return;
  }
  B.t += DT;
  if (B.flash > 0) B.flash -= DT;
  const d2p = Math.hypot(P.x - B.x, P.z - B.z);
  const faceP = () => {
    const want = Math.atan2(P.x - B.x, P.z - B.z);
    B.ang = angLerp(B.ang, want, 0.04);
  };
  switch (B.st) {
    case 'track': {
      faceP();
      const d = d2p || 1;
      const sp = 1.15;
      B.x += (P.x - B.x) / d * sp * DT; B.z += (P.z - B.z) / d * sp * DT;
      keepInArena(B, 3.2);
      const wantSlam = B.phase !== 2;
      if (B.t > (B.phase === 3 ? 1.6 : 2.2)) {
        if (wantSlam && d2p < 7.5) { B.st = 'slamTele'; B.t = 0; B.slamPos = [P.x, P.z]; fmTeleStart(B); SFX.click(); }

         mark is burned into the sand and walking off it is the answer.
         (It used to chase you all the way to impact — undodgeable; at a
         60% commit a walker cleared the 2.5 m ring by 9 cm — measured —
         which is frame-perfect, and frame-perfect is banned.) */
      if (B.t < BOSS_SLAM_TELE * 0.4) {

    case 'slam':

      break;
    case 'burrow':
      if (B.t > 0.9) {
        // move under the sand to the arena edge opposite the player
        const a = Math.atan2(B.x - GROTTO_B.x, B.z - GROTTO_B.z) + Math.PI + (Math.random() - 0.5);
        B.x = GROTTO_B.x + Math.sin(a) * (GROTTO_B.r - 4);
        B.z = GROTTO_B.z + Math.cos(a) * (GROTTO_B.r - 4);

    case 'chargeTele':
      faceP();

        B.st = 'charge'; B.t = 0; fmTeleFire('kingCrabCharge', B);
        const d = d2p || 1;
        B.chargeDir = [(P.x - B.x) / d, (P.z - B.z) / d];
        B.chargeN++;
        SFX.burrow();
        rumble({ duration: 200, strong: 0.5, weak: 0.7 });
      }
      break;
    case 'charge': {
      B.x += B.chargeDir[0] * 10 * DT; B.z += B.chargeDir[1] * 10 * DT;
      if (Math.hypot(P.x - B.x, P.z - B.z) < 2.4) hurtPlayer(1, B.x - B.chargeDir[0], B.z - B.chargeDir[1], B.c.root);
      const dc = Math.hypot(B.x - GROTTO_B.x, B.z - GROTTO_B.z);
      if (dc > GROTTO_B.r - 3.2) {
        // crash into the wall — dizzy, vulnerable
        keepInArena(B, 3.2);
        B.st = 'dizzy'; B.t = 0;
        CAM.shake = 0.45;
        SFX.thump(true);
        burst(psDust, B.x, groundH(B.x, B.z) + 0.5, B.z, 24, 2.6, 2.2, 0.9);
        rumble({ duration: 300, strong: 0.8, weak: 0.5 });

    case 'dizzy':

        else { B.st = 'track'; B.t = 0; }

    case 'roar':

  if (B.phase === 3 && B.st !== 'roar') {
    B.wispT += DT;
    const alive = wisps.filter(w => w.area === 'boss' && !w.dead).length;
    if (B.wispT > 6 && alive < 2) {
      B.wispT = 0;
      const a = Math.random() * TAU;
      const wx = GROTTO_B.x + Math.sin(a) * 8, wz = GROTTO_B.z + Math.cos(a) * 8;
      let w = wisps.find(q => q.area === 'boss' && q.dead);
      if (!w) {
        w = mkImp(wx, wz);
        w.area = 'boss';
        scene.add(w.m.root);

      w.dead = false; w.st = 'drift'; w.x = wx; w.z = wz; w.y = groundH(wx, wz) + 2;

function keepInArena(B, margin) {
  const dx = B.x - GROTTO_B.x, dz = B.z - GROTTO_B.z;

/* v4: real HP — every registered hit calls this. Phases at 60/30, cure at 0. */
function dealBossDamage(n) {
  const B = BOSS;

  B.hp = Math.max(0, B.hp - n);
  refreshBossBar(true);
  if (B.hp <= 0) {
    startCine('bossDefeat');
    return;
  }
  const thr = B.phase === 1 ? 60 : B.phase === 2 ? 30 : 0;
  if (B.phase < 3 && B.hp <= thr && B.st !== 'roar') {
    B.st = 'roar'; B.t = 0;
    SFX.thump(true); CAM.shake = 0.4;
  }
}
function hitBossClaw() {
  const B = BOSS;
  B.clawHits++;
  B.flash = 0.2;
  SFX.clawHit();
  P.hitstop = 4;
  CAM.shake = 0.2;
  rumble({ duration: 120, strong: 0.6, weak: 0.4 });
  const cp = B.st === 'stuck' ? B.slamPos : bossClawPos();
  burst(psSpark, cp[0], groundH(cp[0], cp[1]) + 0.8, cp[1], 12, 2.2, 1.8, 0.5);
  if (B.st === 'stuck' || B.st === 'dizzy') B.t = Math.min(B.t, 1.2);   // brief extra window
  dealBossDamage(16);            // 8x — the telegraphed weakness pays off decisively
  // (was 6x: the 40%-commit slam mercy sped the mashing kid up ~7%, which
  //  erased the aimer's lead — the reward scales with the mercy)
}
/* one hint per PHASE, and each one names what that phase actually does.
   Phase 1 keeps its save flag (so it stays a once-ever line); 2 and 3 are
   per-session, re-armed by initBoss. */
const BOSS_HINT = {
  1: 'Hit the CLAW when it slams!',
  2: 'It CHARGES now — hit it while it’s dizzy!',
  3: 'Hit the CLAW — when it slams, and when it crashes!',
};
let bossHinted = [false, false, false, false];
/* v4: body hits ALWAYS chip — small but real, with FULL feedback. A kid
   who only ever slashes the shell still wins this fight. */
function hitBossBody() {
  const B = BOSS;
  B.bodyHits++;
  B.flash = 0.16;
  SFX.hit();
  P.hitstop = 3;
  CAM.shake = 0.12;
  rumble({ duration: 80, strong: 0.4, weak: 0.3 });
  const d = Math.hypot(P.x - B.x, P.z - B.z) || 1;
  const ex = B.x + (P.x - B.x) / d * 1.7, ez = B.z + (P.z - B.z) / d * 1.7;
  burst(psSpark, ex, groundH(ex, ez) + 1.0, ez, 10, 2.0, 1.5, 0.4);
  /* THE HINT MUST BE TRUE OF THE FIGHT YOU ARE IN. "Hit the CLAW when it
     slams!" is a lie in phase two — `wantSlam = B.phase !== 2`, so it
     never slams there: it burrows, charges, and crashes into the wall
     dizzy. One hint per phase, each one true of that phase. */
  const ph = clamp(B.phase | 0, 1, 3);
  const seen = ph === 1 ? !!(SAVE && SAVE.bossHint) : bossHinted[ph];
  if (!seen) {
    bossHinted[ph] = true;
    if (ph === 1 && SAVE) { SAVE.bossHint = true; storeSave(); }
    showCaption(BOSS_HINT[ph], 3600);
  }
  dealBossDamage(2);
}

/* ── sword swing resolution ──
   v3: the sword's hit volume is a VERTICAL BAND, ground to overhead — Wick
   can never swing "over" a low crab again. Crab hurtbox +40%, arc widened. */
function swingHits() {
  let any = trySwingKelp();
  for (const cr of crabs) {
    if (cr.dead) continue;
    // 2.6 range / 1.35 half-arc, and no height test downward: the blade owns
    // everything from the sand to overhead. Airborne swings still connect
    // unless Wick is well above the shell.
    if (inSwingArc(cr.x, cr.z, 2.6, 1.35) && P.fy - groundH(cr.x, cr.z) < 1.6) {
      hitCrab(cr); any = true;
    }
  }
  for (const w of wisps) {
    if (w.dead) continue;
    if (inSwingArc(w.x, w.z, 2.0) && w.y < P.fy + 2.2) { popWisp(w); any = true; }
  }
  const B = BOSS;
  if (B.active && !B.defeated) {
    const vuln = B.st === 'stuck' || B.st === 'dizzy';
    const hidden = B.st === 'burrow' && B.t > 0.4;   // underground — no target
    const cp = B.st === 'stuck' ? [B.slamPos[0], B.slamPos[1]] : [B.x, B.z];
    if (vuln && inSwingArc(cp[0], cp[1], B.st === 'dizzy' ? 3.4 : 2.6)) {
      hitBossClaw(); any = true;
    } else if (!hidden && inSwingArc(B.x, B.z, 4.5, 1.4)) {
      hitBossBody(); any = true;      // v4: the shell always chips
    }
  }
  return any;
}

/* ═══════════ CINEMATICS ═══════════ */
const CINE = { id: null, t: 0, step: 0 };
function startCine(id) {

    CAM.mode = 'cine';

    P.x = 328.25; P.z = -61.75; P.heading = 4.12;   // square to the bench

}
function endCine() {
  CINE.id = null;

}
const SIT_DUR = 3.0;               // v4.5: the whole sit beat, seconds
const SIT_RET = [328.6, -61.3];    // where Wick steps back to afterwards
const _cp = new THREE.Vector3(), _cl = new THREE.Vector3();
function cineCam(px, py, pz, lx, ly, lz) {

}
function tickCine() {
  const t = (CINE.t += DT);

  }
  if (CINE.id === 'sit') {

    // the net waiting in front of him

      327.75, 0.72, -62.2);

      } else {

      CINE.step = 4;
      SFX.bell();
      rumble({ duration: 900, strong: 0.9, weak: 0.9 });
      CAM.shake = 0.3;
    }
  } else if (t < 9.4) {
    // THE SKY HEALS ONE STEP — dims an eighth, shadows stretch, the star
    const k = smoothstep(clamp((t - 4.6) / 3.6, 0, 1));
    setSkyBlend(k);
    shadeGrow = k;
    if ((simTick & 3) === 0) rebuildShadePools();
    starT = clamp((t - 7.3) / 1.5, 0, 1);
    setStarOp(starT * 0.95);
    if (CINE.step === 4 && t > 6.8) { CINE.step = 5; SFX.night(); }
    // THE SHOT: from the wheel hill, over Brightharbor — houses and the bay
    // in frame while the sky dims, the shadows reach across town, and the
    // first star arrives over the water. One slow drift past the wheel.
    const ck = smoothstep(clamp((t - 4.6) / 4.2, 0, 1));
    cineCam(
      lerp(wx + 6.5, wx - 8.5, ck), lerp(wy + 0.8, wy + 3.2, ck), lerp(wz + 8, wz + 2.5, ck),
      lerp(wx + 34, wx + 28, ck), lerp(wy - 5, wy - 5.5, ck), lerp(wz + 52, wz + 48, ck));
  } else if (t < 12.2) {
    // the tidepool at the bay's edge REFILLS. a moonfish jumps, once.
    if (CINE.step === 5) {
      CINE.step = 6;
      tidepoolFilled = true;
      tidewater.visible = true;
      SFX.waterFill();
      SAVE.tidepool = true;
    }
    const k = smoothstep(clamp((t - 9.4) / 1.6, 0, 1));
    tidewater.position.y = groundH(REFILL_POOL.x, REFILL_POOL.z) - 0.5 + k * 1.05;
    const fk = clamp((t - 10.9) / 1.1, 0, 1);
    if (fk > 0 && fk < 1) {
      moonfish.visible = true;
      moonfish.scale.setScalar(2.3);
      const fx = REFILL_POOL.x + (fk - 0.5) * 2.6;
      const fy = tidewater.position.y + Math.sin(fk * Math.PI) * 1.7;
      moonfish.position.set(fx, fy, REFILL_POOL.z);
      moonfish.rotation.z = -(fk - 0.5) * 2.6;
      if (CINE.step === 6 && fk > 0.08) { CINE.step = 7; SFX.splash(); }
      if (fk > 0.9) { burst(psSparkle, fx, tidewater.position.y, REFILL_POOL.z, 10, 1.0, 1.4, 0.6); }
    } else if (fk >= 1) {
      moonfish.visible = false;
      if (CINE.step === 7) { CINE.step = 8; SFX.splash(); }
    }
    cineCam(REFILL_POOL.x - 6, groundH(REFILL_POOL.x, REFILL_POOL.z) + 2.6, REFILL_POOL.z - 6.5,
      REFILL_POOL.x + 0.5, groundH(REFILL_POOL.x, REFILL_POOL.z) + 0.2, REFILL_POOL.z + 1);
  } else if (t < 15.4) {
    // voices from the village below
    if (CINE.step === 8) {
      CINE.step = 9;
      QUEST.phases = 1;
      SAVE.ph = 1; SAVE.sky = 1; storeSave();
      setQuest(4);
      floatEl.textContent = '“...is that a star?” — Pearl, from the village below';
      floatEl.classList.add('on');
      SFX.yawn();
    }
    const k = smoothstep(clamp((t - 12.2) / 2.6, 0, 1));
    cineCam(lerp(wx + 3, wx + 5, k), wy + 2.2, lerp(wz + 15, wz + 13, k),
      wx + 30, wy - 2, wz + 60);
  } else {
    if (CINE.step === 9) {
      CINE.step = 10;
      floatEl.classList.remove('on');
      CINE.id = null;               // dialogue takes over; cine cam persists until dialog end
      startDialog('finn3', finn);
      dlgBox.classList.add('on');
      return;
    }
  }
}

/* TO BE CONTINUED — the bay, flooded back to ocean. phase 2's promise. */
let tbcT = 0;
function showTBC() {
  drawTBCArt();
  setState('tbc');
  tbcT = 0;
  el('tbcGo').textContent = '';
  setTimeout(() => el('tbc').classList.add('on'), 30);
  CAM.mode = 'cine';
}
function drawTBCArt() {
  const cv = el('tbcArt'), g = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  // dusk sky
  const sky = g.createLinearGradient(0, 0, 0, H * 0.62);
  sky.addColorStop(0, '#131b33'); sky.addColorStop(0.7, '#3a3a5c'); sky.addColorStop(1, '#a06a4e');
  g.fillStyle = sky; g.fillRect(0, 0, W, H * 0.62);
  // the mending moon — one bright phase of eight
  g.strokeStyle = 'rgba(220,228,224,0.28)'; g.lineWidth = 2;
  g.beginPath(); g.arc(W * 0.72, H * 0.24, 34, 0, TAU); g.stroke();
  g.fillStyle = '#dde6e0';
  g.beginPath(); g.arc(W * 0.72, H * 0.24, 34, -0.9, 0.35);
  g.arc(W * 0.72, H * 0.24, 22, 0.35, -0.9, true); g.closePath(); g.fill();
  // stars (a few now — the promise)
  g.fillStyle = '#e8ecf2';
  for (let i = 0; i < 12; i++) {
    const x = (hash2(i, 5) * 0.5 + 0.5) * W, y = (hash2(i, 11) * 0.5 + 0.5) * H * 0.4;
    g.globalAlpha = 0.3 + (hash2(i, 3) * 0.5 + 0.5) * 0.7;
    g.fillRect(x, y, 2, 2);
  }
  g.globalAlpha = 1;
  // THE SEA, COME HOME — silver water where the dry bay was
  const sea = g.createLinearGradient(0, H * 0.62, 0, H);
  sea.addColorStop(0, '#7d95a8'); sea.addColorStop(1, '#2c3e54');
  g.fillStyle = sea; g.fillRect(0, H * 0.62, W, H * 0.38);
  // moon road on the water
  g.fillStyle = 'rgba(230,238,235,0.3)';
  for (let i = 0; i < 14; i++) {
    const y = H * 0.64 + i * (H * 0.34 / 14);
    const w = 6 + i * 4.5;
    g.fillRect(W * 0.72 - w / 2 + hash2(i, 8) * 8, y, w, 2.2);
  }
  // headland + lighthouse silhouette (left), boats FLOATING again
  g.fillStyle = '#0d1220';
  g.beginPath();
  g.moveTo(0, H * 0.66); g.lineTo(W * 0.2, H * 0.6); g.lineTo(W * 0.26, H * 0.63); g.lineTo(W * 0.3, H * 0.7); g.lineTo(0, H * 0.78);
  g.closePath(); g.fill();
  g.fillRect(W * 0.205, H * 0.44, 14, H * 0.17);        // lighthouse tower
  g.fillRect(W * 0.198, H * 0.43, 20, 8);
  // its lamp is LIT again — first light in a year
  g.fillStyle = 'rgba(255,236,180,0.9)';
  g.fillRect(W * 0.206, H * 0.445, 12, 6);
  g.fillStyle = 'rgba(255,236,180,0.12)';
  g.beginPath(); g.moveTo(W * 0.218, H * 0.45); g.lineTo(W * 0.5, H * 0.36); g.lineTo(W * 0.5, H * 0.52); g.closePath(); g.fill();
  // floating boat silhouettes
  g.fillStyle = '#0d1220';
  for (const [bx, by, s] of [[0.45, 0.72, 1], [0.58, 0.8, 1.3], [0.85, 0.7, 0.8]]) {
    const x = W * bx, y = H * by;
    g.beginPath();
    g.moveTo(x - 22 * s, y); g.quadraticCurveTo(x, y + 10 * s, x + 22 * s, y);
    g.lineTo(x + 16 * s, y - 5 * s); g.lineTo(x - 16 * s, y - 5 * s);
    g.closePath(); g.fill();
    g.fillRect(x - 1.5 * s, y - 22 * s, 3 * s, 17 * s);
  }
}

  if (tbcT > 1.6 && IN.confirm) {
    el('tbc').classList.remove('on');

    SFX.confirm();

/* boss render-frame animation */
function animateBoss(dtv, now) {
  const B = BOSS;
  if (!B.c) return;
  const y = groundH(B.x, B.z);
  let yo = 0;
  if (B.st === 'burrow') yo = -Math.min(2.6, B.t * 4);
  if (B.st === 'emerge') yo = Math.min(0, -2.6 + B.t * 5);
  if (B.st === 'rest') yo = -0.6;
  B.c.root.position.set(B.x, y + yo, B.z);
  B.c.root.rotation.y = B.ang;
  const bdx = B.x - camera.position.x, bdz = B.z - camera.position.z;
  B.c.root.visible = !(B.st === 'burrow' && B.t > 0.7) && (bdx * bdx + bdz * bdz < 8100);
  B.c.shadow.scale.setScalar(1 + shadeGrow * 0.2);
  /* the slam mark: it draws itself on the sand through the windup, brightest
     once the crab has committed — the ring you have to be outside of */
  if (B.mark) {
    const tele = B.active && !B.defeated && B.st === 'slamTele' && B.c.root.visible;
    B.mark.visible = tele;
    if (tele) {
      const k = clamp(B.t / BOSS_SLAM_TELE, 0, 1);
      const mx = B.slamPos[0], mz = B.slamPos[1];
      /* seat the band on the LOWEST ground it covers so a slope never eats it */
      let lo = groundH(mx, mz);
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * TAU;
        lo = Math.min(lo, groundH(mx + Math.cos(a) * 2.5, mz + Math.sin(a) * 2.5));
      }
      B.mark.position.set(mx, lo - 0.05, mz);
      B.mark.scale.set(2.5, 1, 2.5);
      B.mark.material.opacity = 0.25 + k * 0.55 + Math.sin(now / 70) * 0.08 * k;
    }
  }
  const w = now / 1000;
  // legs scuttle
  const moving = B.st === 'track' || B.st === 'charge';
  const la = moving ? Math.sin(w * 16) * 0.14 : Math.sin(w * 2) * 0.02;
  B.c.legL.rotation.x = la; B.c.legR.rotation.x = -la;
  // slam claw
  const cl = B.c.clawL;
  if (B.st === 'slamTele') {
    cl.armN.rotation.x = -1.15;
    cl.armN.position.y = -0.04 * B.c.S + Math.sin(w * 30) * 0.02;
  } else if (B.st === 'slam' || B.st === 'stuck') {
    cl.armN.rotation.x = 0.75;
  } else {
    cl.armN.rotation.x = Math.sin(w * 1.8) * 0.06;
  }
  B.c.clawR.armN.rotation.x = Math.sin(w * 1.8 + 1) * 0.08;
  if (B.st === 'chargeTele') {
    B.c.body.rotation.x = 0.14;
    B.c.body.position.y = 0.28 * B.c.S - 0.1;
  } else if (B.st !== 'defeat' && B.st !== 'rest') {
    B.c.body.rotation.x *= 0.9;
    B.c.body.position.y = 0.28 * B.c.S + (B.st === 'roar' ? Math.sin(w * 22) * 0.06 + 0.2 : 0);
  }
  if (B.st === 'dizzy') B.c.body.rotation.z = Math.sin(w * 7) * 0.09;
  else if (B.st !== 'defeat') B.c.body.rotation.z *= 0.9;
  // hit flash + breathing moonglass glow on the crescent
  B.c.crescent.material.opacity = B.flash > 0 ? 0.55 + Math.sin(now / 30) * 0.4 : 0.95;
  B.c.crescentHalo.material.opacity = B.flash > 0 ? 0.5 : 0.09 + 0.06 * Math.sin(now / 480);
  // v4: the claw GLOWS through the vulnerability window ("hit the CLAW")
  const glowM = B.c.clawL.glow;
  if (glowM) {
    const vuln = B.active && !B.defeated && (B.st === 'stuck' || B.st === 'dizzy');
    glowM.visible = vuln;
    if (vuln) glowM.material.opacity = 0.38 + 0.24 * Math.sin(now / 90);
  }
  refreshBossBar(false);
}
/* crab + sun-imp render-frame animation */
function animateEnemies(dtv, now) {
  const w = now / 1000;
  const ccx = camera.position.x, ccz = camera.position.z;
  const near2 = (x, z, r) => { const dx = x - ccx, dz = z - ccz; return dx * dx + dz * dz < r * r; };
  for (const cr of crabs) {
    if (cr.dead) continue;
    const cdx = cr.x - ccx, cdz = cr.z - ccz;
    const cd2 = cdx * cdx + cdz * cdz;
    const vis = cd2 < 33 * 33;   // v3: fog haze owns everything past ~33 m
    cr.c.root.visible = vis;
    if (!vis) continue;
    // LOD: beyond 22 m only the shell + shadow draw (limbs are subpixel soup)
    const lodFar = cd2 > 17 * 17;   // v3: limbs are subpixel past ~17 m
    cr.c.clawL.armN.visible = !lodFar;
    cr.c.clawR.armN.visible = !lodFar;
    cr.c.legs.visible = !lodFar;
    const y = groundH(cr.x, cr.z);
    cr.c.root.position.set(cr.x, y, cr.z);
    cr.c.root.rotation.y = cr.ang;
    const moving = cr.st === 'patrol' || cr.st === 'aggro' || cr.st === 'lunge';
    const la = moving ? Math.sin(w * (cr.st === 'lunge' ? 26 : 14) + cr.sx) * 0.16 : 0;
    cr.c.legs.rotation.x = la;
    if (cr.st === 'tele') {
      // the READ: the oversized claw hoists high and rattles
      cr.c.clawL.armN.rotation.x = -1.35 + Math.sin(w * 34) * 0.1;
      cr.c.clawR.armN.rotation.x = -0.9 - Math.sin(w * 34) * 0.08;
      cr.c.body.position.y = 0.22 + 0.07;
      cr.c.body.rotation.x = -0.12;
    } else if (cr.st === 'stagger') {
      // v3: knockback HOP — the whole crab pops off the sand, claws flung
      const k = clamp(cr.t / 0.4, 0, 1);
      const hop = Math.sin(k * Math.PI) * 0.26;
      cr.c.root.position.y = y + hop;
      cr.c.shadow.position.y = -hop + 0.02;      // shadow stays on the sand
      cr.c.body.position.y = 0.22;
      cr.c.body.rotation.x = -0.18 * (1 - k);
      cr.c.clawL.armN.rotation.x = -0.6 * (1 - k);
      cr.c.clawR.armN.rotation.x = -0.5 * (1 - k);
    } else {
      cr.c.shadow.position.y = 0;
      cr.c.clawL.armN.rotation.x = Math.sin(w * 2.2 + cr.sx) * 0.1;
      cr.c.clawR.armN.rotation.x = Math.sin(w * 2.2 + cr.sx + 1) * 0.1;
      cr.c.body.position.y = 0.22 + (moving ? Math.abs(Math.sin(w * 14)) * 0.03 : 0);
      cr.c.body.rotation.x *= 0.85;
    }
    cr.c.body.scale.setScalar(cr.flash > 0 ? 1.1 : 1);
    // shell-flash on hit
    cr.c.flashM.visible = cr.flash > 0;
    if (cr.flash > 0) cr.c.flashM.material.opacity = 0.4 + Math.sin(now / 24) * 0.3;
    cr.c.shadow.scale.setScalar(1 + shadeGrow * 0.25);
  }
  for (const ws of wisps) {
    if (ws.dead) continue;
    const wdx = ws.x - ccx, wdz = ws.z - ccz;
    const wd2 = wdx * wdx + wdz * wdz;
    const vis = wd2 < 33 * 33;
    ws.m.root.visible = vis;
    if (!vis) continue;
    ws.m.wings.visible = wd2 < 17 * 17;   // LOD: wings fade past ~17 m
    ws.m.root.position.set(ws.x, ws.y, ws.z);
    ws.m.root.rotation.y = ws.face || 0;
    // blob shadow stays on the ground below the hovering imp
    ws.m.shadow.position.y = groundH(ws.x, ws.z) - ws.y + 0.04;
    // dragonfly wing buzz — fast flutter, faster when agitated
    const buzz = ws.st === 'drift' ? 55 : 80;
    ws.m.wings.rotation.x = -0.1 + Math.sin(now / 1000 * buzz + ws.sx) * 0.42;
    // posture per state: rear-up telegraph, head-first dive, gentle lean
    if (ws.st === 'tele') {
      ws.m.body.rotation.x = -0.55 - Math.sin(w * 20) * 0.06;       // rear up
      ws.m.torso.material.color.setRGB(1.45, 1.3, 1.15);           // brighten
    } else if (ws.st === 'dive') {
      ws.m.body.rotation.x = 0.75;                                  // grabby hands first
      ws.m.torso.material.color.setRGB(1.25, 1.12, 1.0);
    } else {
      ws.m.body.rotation.x = 0.12 + Math.sin(w * 2.4 + ws.sx) * 0.07;
      ws.m.torso.material.color.setRGB(1, 1, 1);
    }
    if (!LOWFX && Math.random() < 0.1) {
      psSpark.spawn(ws.x, ws.y - 0.15, ws.z, (Math.random() - 0.5) * 0.4, -0.6, (Math.random() - 0.5) * 0.4, 0.45);
    }
  }
  // squash-pop deaths: a beat of squash, then gone
  for (let i = impPops.length - 1; i >= 0; i--) {
    const p = impPops[i];
    p.t += dtv;
    const k = p.t / 0.13;
    if (k >= 1) {
      p.m.root.visible = false;
      p.m.root.scale.setScalar(1);
      impPops.splice(i, 1);
    } else {
      p.m.root.scale.set(1 + k * 1.6, Math.max(0.08, 1 - k * 1.5), 1 + k * 1.6);
    }
  }
}
