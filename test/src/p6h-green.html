<script>
/* ═══════════════════════════════════════════════════════════════════════
   PHASE 4, PART TWO — COOL WINDS COME HOME

   Owns: the payoff cinematic (the grass-wave re-green sweeping the forest
   IN FRAME), the swelter's permanent retirement, the LIVING SILVERRUN
   (water, wheels turning, the falls pouring), the SKIFF, sky step 4, the
   fourth star, and the phase-4 end card (Full Mirror tease).

   Concatenated AFTER p6g-crown.html — its pinned constants are in scope.
   Derives EVERYTHING from the save, both ways, via __worldStateHooks.
   ═══════════════════════════════════════════════════════════════════════ */
window.__worldStateHooks = window.__worldStateHooks || [];
window.__telemetryHooks = window.__telemetryHooks || [];

/* Part one's pinned geography (KROWN, STAIR_*, K_*) is in scope but not
   needed here: everything this file touches lives in the Parched Forest,
   at the Moonwheel, or on the river. What IS taken from p6g is taken by
   feature detection — the Sliver item, the shrine's pinwheels — so this
   file builds and runs whether or not part one has landed yet. */

/* ═══════════ THE WIND'S SOURCE ═══════════
   One front, one origin. The wind that re-greens the forest and the water
   that fills the bed are the SAME arrival, so they share a source point —
   the foot of the Dried Falls — and a single radial front distance. */
const WIND_SRC = { x: BASIN.x, z: BASIN.z };
const WIND_REACH = 2260;            // metres to the far side of the region

/* ═══════════ THE LIVING SILVERRUN — authored channel ═══════════
   The bed p6b carved is a shallow swale over rolling ground, not a canyon:
   measured, the channel holds a median 2.45 m of water between its crests
   and as little as 0.1 m at the pass. So the surface is authored, not
   simulated — thalweg-tracked, crest-clamped, longitudinally smoothed —
   and the skiff is constrained to the channel that authoring guarantees.
   Navigable stretch stops well short of the basin: the plunge pool is the
   Falls Hollow's mouth and must never take on water. */
const RUN_D0 = 34, RUN_D1 = 2246, RUN_STEP = 6;
const RUN_MINDEP = 0.85;            // guaranteed depth at the thalweg
const RUN_SPILL = 0.35;             // most the surface may stand over a crest
const RUN_WCAP = 13;                // half-width cap (the pines start at 10 m)
const SKIFF_DRAFT = 0.32;           // a flat-bottomed punt draws almost nothing

/* a coarse river-distance mask (8 m) — riverAt is a 14-segment scan and the
   green snapshot asks the question 800,000 times */
const RVM_X0 = 100, RVM_Z0 = -48, RVM_S = 8;
const RVM_W = Math.ceil((2200 - RVM_X0) / RVM_S), RVM_H = Math.ceil((1420 - RVM_Z0) / RVM_S);
const RVMASK = new Uint8Array(RVM_W * RVM_H);
(function bakeRiverMask() {
  for (let ix = 0; ix < RVM_W; ix++) {
    for (let iz = 0; iz < RVM_H; iz++) {
      const d = riverAt(RVM_X0 + ix * RVM_S + RVM_S / 2, RVM_Z0 + iz * RVM_S + RVM_S / 2)[0];
      RVMASK[iz * RVM_W + ix] = Math.min(255, Math.round(d));
    }
  }
})();
function nearRiverM(x, z) {
  const ix = Math.floor((x - RVM_X0) / RVM_S), iz = Math.floor((z - RVM_Z0) / RVM_S);
  if (ix < 0 || iz < 0 || ix >= RVM_W || iz >= RVM_H) return 255;
  return RVMASK[iz * RVM_W + ix];
}

/* the stations: position, thalweg (the deepest line, which wanders off the
   authored polyline by up to 9 m), the crest that contains the water, the
   surface, and the wetted half-widths */
const RUN = [];
(function buildRunProfile() {
  const N = Math.floor((RUN_D1 - RUN_D0) / RUN_STEP) + 1;
  for (let i = 0; i < N; i++) {
    const d = RUN_D0 + i * RUN_STEP;
    const p = riverPoint(d), p2 = riverPoint(Math.min(RIVER_LEN, d + 3));
    const tx = p2[0] - p[0], tz = p2[1] - p[1], L = Math.hypot(tx, tz) || 1;
    const nx = -tz / L, nz = tx / L;
    const h = (u) => groundH(p[0] + nx * u, p[1] + nz * u);
    let thal = 1e9, tu = 0;
    for (let u = -9; u <= 9; u += 0.75) { const v = h(u); if (v < thal) { thal = v; tu = u; } }
    let cl = -1e9, cr = -1e9;
    for (let u = tu - 17; u <= tu - 3; u += 1) cl = Math.max(cl, h(u));
    for (let u = tu + 3; u <= tu + 17; u += 1) cr = Math.max(cr, h(u));
    RUN.push({
      d, px: p[0], pz: p[1], x: p[0] + nx * tu, z: p[1] + nz * tu,
      fx: tx / L, fz: tz / L, nx, nz, tu,
      thal, crest: Math.min(cl, cr), y: 0, wl: 4, wr: 4,
    });
  }
  const sm = (arr, w) => arr.map((v, i) => {
    let s = 0, n = 0;
    for (let k = -w; k <= w; k++) { const j = i + k; if (j < 0 || j >= arr.length) continue; s += arr[j]; n++; }
    return s / n;
  });
  /* THE SPINE IS SMOOTHED. The raw thalweg jumps up to nine metres from one
     station to the next, so a hull perfectly centred at one station sits on
     the bank of the next, the clamp fires, and the clamp's speed penalty
     eats her way upstream a tenth at a time. Smooth the offset, and every
     station's frame agrees with its neighbours'. */
  {
    const tuS = sm(RUN.map(s => s.tu), 5);
    for (let i = 0; i < RUN.length; i++) {
      const s = RUN[i];
      s.tu = tuS[i];
      s.x = s.px + s.nx * s.tu;
      s.z = s.pz + s.nz * s.tu;
      /* the depth that matters is under the SPINE, not under the deepest
         point within four metres of it: once the spine is smoothed the two
         are no longer the same place, and a bar under the smoothed line came
         out fourteen centimetres ABOVE its own water surface. Take the
         highest ground the hull will pass over, including between stations. */
      let bed = -1e9;
      for (let a = -3; a <= 3; a += 1.5) bed = Math.max(bed, groundH(s.x + s.fx * a, s.z + s.fz * a));
      s.thal = bed;
    }
  }
  const thalS = sm(RUN.map(s => s.thal), 6);
  let surf = RUN.map((s, i) => Math.min(s.crest - 0.25, thalS[i] + 1.7));
  surf = sm(surf, 4);
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < RUN.length; i++) {
      surf[i] = Math.max(Math.min(surf[i], RUN[i].crest + RUN_SPILL), RUN[i].thal + RUN_MINDEP);
    }
    if (pass < 2) surf = sm(surf, 3);
  }
  for (let i = 0; i < RUN.length; i++) {
    const s = RUN[i];
    s.y = surf[i];
    /* THE SHORELINE: outward to where the water is a hand deep, which is
       where a river visibly stops. (The first cut ran the sheet out to the
       containing crest — up to 13 m a side — and the Silverrun read as a
       flooded meadow rather than a river.) Failing that, to the highest
       ground inside the cap, so the sheet always lands ON ground and can
       never end in mid-air over a hillside. */
    for (const side of [-1, 1]) {
      let best = 1.5, bestH = -1e9, w = 0;
      for (let u = 1.5; u <= RUN_WCAP; u += 0.5) {
        const hh = groundH(s.x + s.nx * u * side, s.z + s.nz * u * side);
        if (hh > s.y - 0.16) { w = u; break; }
        if (hh > bestH) { bestH = hh; best = u; }
        w = best;
      }
      if (side < 0) s.wl = w; else s.wr = w;
    }
    /* THE NAVIGABLE BAND, inside the wetted one: the shoreline is where the
       water is a hand deep, and a hull steered out there would touch bottom
       even though it never left the river. The skiff is clamped to where
       there is half a metre under her, measured, not assumed. */
    for (const side of [-1, 1]) {
      const wMax = side < 0 ? s.wl : s.wr;
      let nav = 0;
      for (let u = 0; u <= wMax; u += 0.25) {
        if (s.y - groundH(s.x + s.nx * u * side, s.z + s.nz * u * side) < 0.55) break;
        nav = u;
      }
      if (side < 0) s.navL = nav; else s.navR = nav;
    }
  }
  /* the band is smoothed and made to agree with its neighbours the same way:
     a channel that narrows by four metres in six is a channel that stops a
     boat dead */
  {
    const nl = sm(RUN.map(s => s.navL), 4), nr = sm(RUN.map(s => s.navR), 4);
    for (let i = 0; i < RUN.length; i++) {
      RUN[i].navL = Math.min(RUN[i].navL, nl[i]);
      RUN[i].navR = Math.min(RUN[i].navR, nr[i]);
    }
  }
})();
const RUN_LO = RUN[0], RUN_HI = RUN[RUN.length - 1];

/* station lookup by world position (linear scan over 370 stations is far
   too slow per frame — bucket by the authored polyline parameter instead) */
function runIndexAtD(d) {
  return clamp(Math.round((d - RUN_D0) / RUN_STEP), 0, RUN.length - 1);
}
function runNear(x, z) {
  const rv = riverAt(x, z);
  const i = runIndexAtD(rv[1] * RIVER_LEN);
  let bi = i, bd = 1e9;
  for (let k = Math.max(0, i - 10); k <= Math.min(RUN.length - 1, i + 10); k++) {
    const s = RUN[k], dd = (s.x - x) * (s.x - x) + (s.z - z) * (s.z - z);
    if (dd < bd) { bd = dd; bi = k; }
  }
  const s = RUN[bi];
  const off = (x - s.x) * s.nx + (z - s.z) * s.nz;       // lateral, + = right bank
  const along = (x - s.x) * s.fx + (z - s.z) * s.fz;
  return { i: bi, s, off, dist: Math.hypot(x - s.x, z - s.z), along };
}
/* is this point inside the wetted channel, and how deep? */
function riverSurfaceAt(x, z) {
  const r = runNear(x, z);
  const w = r.off < 0 ? r.s.wl : r.s.wr;
  if (Math.abs(r.off) > w + 0.6) return null;
  /* RULE 4: the INTERPOLATED sheet height between stations — lerp by
     run-distance toward the neighbour the query leans at. The rendered
     sheet spans stations linearly, so a hull riding the QUANTIZED station
     height stepped several cm against the drawn water at every graded
     riffle; the true local surface is the line between the stations. */
  const t = clamp(r.along / RUN_STEP, -1, 1);
  const j = clamp(r.i + (t >= 0 ? 1 : -1), 0, RUN.length - 1);
  return lerp(r.s.y, RUN[j].y, Math.abs(t));
}
function riverDepthAt(x, z) {
  /* the 8 m river mask is one array lookup and answers "nowhere near the
     water" for the boars, the hornets and every walking step in the region
     without touching the 14-segment polyline scan */
  if (nearRiverM(x, z) > 22) return 0;
  const y = riverSurfaceAt(x, z);
  if (y === null) return 0;
  return Math.max(0, y - groundH(x, z));
}
const riverWet = () => !!(SAVE && (SAVE.riverWet || SAVE.sky >= 4));

/* ── the three landings (board / hop out) ── */
const LANDINGS = [
  { id: 'falls', d: 2222, label: 'THE FALLS POOL' },
  { id: 'ferry', d: 1432, label: 'THE FERRY LANDING' },
  { id: 'camp',  d: 96,   label: 'THE PASS CAMP' },
];
for (const L of LANDINGS) {
  const s = RUN[runIndexAtD(L.d)];
  L.i = runIndexAtD(L.d);
  L.x = s.x; L.z = s.z; L.y = s.y;
}

/* ═══════════ palettes: burnt → living ═══════════
   Both ends are baked at build. The transform is a hue and value remap of the
   ALREADY-BAKED vertex colour, so every form-shading step the noon bake put
   there survives the change of season. Stone, salt and the spring greens
   are recognised by chroma and left alone — a green crag is worse than a
   burnt one. */
const GR_LO = col(0x3c5a2a), GR_MID = col(0x5d8737), GR_HI = col(0x9cb45c);
const PN_LO = col(0x27411f), PN_MID = col(0x3d6a2d), PN_HI = col(0x66924a);
const WET_STONE = col(0x6d6a5c);
function greenify(r, g, b, x, z, canopy, out) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  const sat = mx - mn;
  const lum = 0.32 * r + 0.55 * g + 0.13 * b;
  if (!canopy) {
    if (sat < 0.055) {                        // stone, salt, ash — untouched
      out[0] = r; out[1] = g; out[2] = b; return out;
    }
    if (g > r + 0.01) {                       // the springs were already alive
      out[0] = r; out[1] = g; out[2] = b; return out;
    }
    const rd = nearRiverM(x, z);
    if (rd < 7) {                             // the bed itself: wet stone, not lawn
      const k = 0.5 * (1 - rd / 7);
      out[0] = lerp(r, WET_STONE[0] * (0.6 + lum * 0.7), k);
      out[1] = lerp(g, WET_STONE[1] * (0.6 + lum * 0.7), k);
      out[2] = lerp(b, WET_STONE[2] * (0.6 + lum * 0.75), k);
      return out;
    }
  }
  const LO = canopy ? PN_LO : GR_LO, MI = canopy ? PN_MID : GR_MID, HI = canopy ? PN_HI : GR_HI;
  const t = clamp((lum - (canopy ? 0.13 : 0.20)) / (canopy ? 0.34 : 0.42), 0, 1);
  const n = vnoise(x * 0.021 + 4, z * 0.021 - 7) * 0.5 + 0.5;   // patchy, not painted
  let cr, cg, cb;
  if (t < 0.5) { const k = t * 2; cr = lerp(LO[0], MI[0], k); cg = lerp(LO[1], MI[1], k); cb = lerp(LO[2], MI[2], k); }
  else { const k = (t - 0.5) * 2; cr = lerp(MI[0], HI[0], k); cg = lerp(MI[1], HI[1], k); cb = lerp(MI[2], HI[2], k); }
  const nk = 0.86 + n * 0.26;
  cr *= nk; cg *= nk * 1.02; cb *= nk * 0.92;
  const keep = canopy ? 0.13 : 0.17;          // a little of the old ground shows through
  out[0] = clamp(lerp(cr, r, keep), 0, 1);
  out[1] = clamp(lerp(cg, g, keep), 0, 1);
  out[2] = clamp(lerp(cb, b, keep), 0, 1);
  return out;
}

<script>
/* ═══════════ p6h/2 — THE RE-GREEN: a live vertex-colour relerp ═══════════
   The forest's ground sheets and canopies are baked into 88 merged chunk
   meshes plus the far tier. Nothing is rebuilt: a build-time snapshot
   records, per mesh, exactly which vertex ranges belong to GROUND and to
   CANOPY (the ground sheet is each chunk's prefix by construction; every
   canopy's vertex range is in p6b's own render audit), their burnt colours
   and their distance from the wind's source. The front then relerps only
   the vertices it is crossing — budgeted per frame, priority to what the
   camera can actually see. Everything behind the front is snapped once. */
const GRN = {
  parts: [],            // { mesh, colA, ranges, n, burnt, dist, dmin, dmax, cx, cz, st, cursor }
  built: false,
  k: 0,                 // 0 burnt … 1 green (the permanent world state)
  front: -1,            // metres from WIND_SRC; <0 = no wave running
  band: 130,            // how wide the wave-front blend is
  budget: 26000,        // vertices per frame outside the visible set
  doneParts: 0, lastWork: 0, waveT: 0,
};
const _gcol = [0, 0, 0];
function grnSnapshot() {
  if (GRN.built) return;
  GRN.built = true;
  const t0 = performance.now();
  /* 1 — the ground prefix of every forest chunk (FGROUND_N, computed once) */
  const gcount = FGROUND_N;
  /* 2 — the canopies, from p6b's per-tree render audit */
  const canopies = new Map();
  for (const t of (window.__fmTreeAudit || [])) {
    if (t.bare || t.v1 <= t.vTrunk) continue;
    let a = canopies.get(t.key);
    if (!a) { a = []; canopies.set(t.key, a); }
    a.push(t.vTrunk, t.v1);
  }
  const mkPart = (mesh, ranges, cx, cz, canopyFrom) => {
    const colA = mesh.geometry.attributes.color, pos = mesh.geometry.attributes.position;
    let n = 0;
    for (let i = 0; i < ranges.length; i += 2) n += ranges[i + 1] - ranges[i];
    if (!n) return;
    const burnt = new Uint8Array(n * 3), dist = new Uint16Array(n);
    let slot = 0, dmin = 1e9, dmax = -1e9;
    for (let r = 0; r < ranges.length; r += 2) {
      for (let v = ranges[r]; v < ranges[r + 1]; v++, slot++) {
        burnt[slot * 3] = Math.round(clamp(colA.getX(v), 0, 1) * 255);
        burnt[slot * 3 + 1] = Math.round(clamp(colA.getY(v), 0, 1) * 255);
        burnt[slot * 3 + 2] = Math.round(clamp(colA.getZ(v), 0, 1) * 255);
        const d = Math.hypot(pos.getX(v) - WIND_SRC.x, pos.getZ(v) - WIND_SRC.z);
        dist[slot] = Math.min(65535, Math.round(d));
        if (d < dmin) dmin = d;
        if (d > dmax) dmax = d;
      }
    }
    GRN.parts.push({
      mesh, colA, ranges, n, burnt, dist, dmin, dmax, cx, cz,
      canopyFrom: canopyFrom | 0, st: 0, k: 0,
    });
  };
  for (const c of chunks) {
    if (!c.forest || !c.mesh) continue;
    const key = Math.floor(c.cx / FCH) + 'f' + Math.floor(c.cz / FCH);
    const gn = Math.min(gcount.get(key) || 0, c.mesh.geometry.attributes.position.count);
    const ranges = [];
    if (gn > 0) ranges.push(0, gn);
    const cn = canopies.get(key);
    let canopyFrom = gn > 0 ? gn : 0;
    if (cn) {
      /* the audit is emitted tree by tree in build order, so the ranges are
         already sorted and disjoint; merge touching ones to keep the list
         short (11,208 trees would otherwise be 11,208 range pairs) */
      for (let i = 0; i < cn.length; i += 2) {
        const a = cn[i], b = cn[i + 1];
        if (ranges.length >= 2 && ranges[ranges.length - 1] === a) ranges[ranges.length - 1] = b;
        else ranges.push(a, b);
      }
    }
    mkPart(c.mesh, ranges, c.cx, c.cz, canopyFrom);
  }
  /* 3 — the far tier: the horizon must change season with the near ground,
     or the forest re-greens inside a burnt-orange ring. Its forest tiles
     carry nothing but ground quads and canopy blobs, so the whole mesh is
     one range; the bay tiles are skipped by their own flag. */
  for (const t of farTiles) {
    if (t.bh || !t.mesh) continue;
    mkPart(t.mesh, [0, t.mesh.geometry.attributes.position.count],
      t.bx !== undefined ? t.bx : 0, t.bz !== undefined ? t.bz : 0, -1);
  }
  GRN.snapMs = Math.round(performance.now() - t0);
  GRN.totalVerts = GRN.parts.reduce((a, p) => a + p.n, 0);
}
/* write one part at blend k (0 burnt, 1 green) — or, when a front is
   supplied, per-vertex against the front's distance */
function grnWritePart(p, k, front, band) {
  const colA = p.colA, burnt = p.burnt, dist = p.dist;
  const pos = p.mesh.geometry.attributes.position;
  let slot = 0, moved = 0;
  for (let r = 0; r < p.ranges.length; r += 2) {
    const canopy = p.canopyFrom >= 0 && p.ranges[r] >= p.canopyFrom;
    for (let v = p.ranges[r]; v < p.ranges[r + 1]; v++, slot++) {
      let kk = k;
      if (front >= 0) {
        kk = clamp((front - dist[slot]) / band, 0, 1);
        kk *= k;
      }
      const br = burnt[slot * 3] / 255, bg = burnt[slot * 3 + 1] / 255, bb = burnt[slot * 3 + 2] / 255;
      if (kk <= 0.001) { colA.setXYZ(v, br, bg, bb); continue; }
      greenify(br, bg, bb, pos.getX(v), pos.getZ(v), canopy, _gcol);
      if (kk >= 0.999) colA.setXYZ(v, _gcol[0], _gcol[1], _gcol[2]);
      else colA.setXYZ(v, lerp(br, _gcol[0], kk), lerp(bg, _gcol[1], kk), lerp(bb, _gcol[2], kk));
      moved++;
    }
  }
  colA.needsUpdate = true;
  return slot;
}
/* the permanent state, both ways — the world-state hook's own hammer */
function grnSet(k) {
  grnSnapshot();
  GRN.k = k;
  GRN.front = -1;
  for (const p of GRN.parts) {
    if (p.st === (k > 0.5 ? 1 : 0)) continue;      // already there; skip the upload
    grnWritePart(p, k, -1, 1);
    p.st = k > 0.5 ? 1 : 0;
    p.k = k;
  }
  GRN.doneParts = GRN.parts.filter(p => p.st === 1).length;
}
/* THE WAVE. Front distance advances in metres; every part it is crossing is
   relerped, visible parts first, the rest inside a per-frame budget. */
function grnWave(front) {
  grnSnapshot();
  GRN.k = 1;
  GRN.front = front;
  const band = GRN.band;
  const ccx = camera.position.x, ccz = camera.position.z;
  const crossing = [], behind = [];
  for (const p of GRN.parts) {
    if (p.st === 1) continue;
    if (p.dmin > front) continue;                  // the wind has not reached it
    if (p.dmax < front - band) behind.push(p);     // wholly passed: one snap
    else crossing.push(p);
  }
  const key = (p) => (p.mesh.visible ? 0 : 1e9) + (p.cx - ccx) * (p.cx - ccx) + (p.cz - ccz) * (p.cz - ccz);
  crossing.sort((a, b) => key(a) - key(b));
  behind.sort((a, b) => key(a) - key(b));
  let work = 0;
  for (const p of crossing) {
    const vis = p.mesh.visible;
    if (!vis && work > GRN.budget) continue;       // off-screen may lag a frame
    work += grnWritePart(p, 1, front, band);
    p.k = clamp((front - (p.dmin + p.dmax) / 2) / band, 0, 1);
  }
  for (const p of behind) {
    if (work > GRN.budget * 1.6) break;
    grnWritePart(p, 1, -1, 1);
    p.st = 1; p.k = 1;
    work += p.n;
  }
  GRN.lastWork = work;
  GRN.doneParts = GRN.parts.filter(p => p.st === 1).length;
}

<script>
/* ═══════════ p6h/3 — THE LIVING SILVERRUN ═══════════
   One owner per stretch of water: the sheet below is the ONLY thing that
   renders the river, from the spring head under the falls to the pass camp
   pool. It never touches the plunge basin — that is the Falls Hollow's
   mouth, and a dungeon that has not heard water in a year does not get
   flooded by its own payoff. */
/* every static thing the wind leaves standing — ford stones, the wheels'
   frames, the softened thickets — shares ONE mesh and therefore one draw
   call; declared here because the wheels fill it before the fords do */
const WETPROP_MD = MD();
let wetPropMesh = null;
const C_SHOAL = [0.56, 0.70, 0.56], C_MID = [0.26, 0.52, 0.55], C_DEEP = [0.11, 0.28, 0.44];
const C_FOAM = [0.93, 0.97, 0.97], C_FOAM2 = [0.78, 0.88, 0.9];
const _rvc = [0, 0, 0];
/* a CONTINUOUS depth ramp, sampled per vertex. The first cut banded the
   sheet in four flat steps chosen from each segment's average depth, and
   the river came out as a chequerboard of teal and navy patches. */

<script>

/* ═══════════ RULES CORE registrations for p6h + RULE 6 (pure addition) ═══════════ */

  name: 'skiff', r: 2.6,

/* ═══════════ RULE 6 — invariantSweep(): the repair pass ═══════════

   the player stands in open air, every hull floats deep enough where it

   openNow(). Runs at the tail of applyWorldState (p7 calls it after the
