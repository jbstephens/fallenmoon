<script>
/* ═══════════════════════════════════════════════════════════════════════
   THE LAMP ROOM — a lighthouse that finally has a reason

   Finn's first joke in the whole game is that his lighthouse is useless:
   "A lighthouse in endless day is just... stairs." His stairs have been
   blocked by crates ever since, under one line — "The lamp room can wait
   for a lamp worth lighting."

   Phase 3 moves the sun. There is a dusk now. So the crates come down, the
   stairs go up, and the lamp gets lit — and its beam sweeps the bay and
   reaches all the way out to the Hourless Isles, so from the far side of
   the open sea you can always see the way home.

   Concatenated after p6e. Owns only its own room, its own beam and its own
   cinematic; everything else is reached through the wrap chain.
   ═══════════════════════════════════════════════════════════════════════ */
window.__worldStateHooks = window.__worldStateHooks || [];
window.__telemetryHooks = window.__telemetryHooks || [];

const LAMP_ROOM = { x: 330, z: -260, r: 2.35, wallH: 3.0 };
const LIGHTHOUSE = { x: 44, z: -16 };
const LAMP_COLL = [];
let lampBeam = null, lampGlowMesh = null, lampSpin = 0, lampLitNow = false;
let lampFlare = 0;                      // 0..1 lamp brightness, eased
const lampRoom = {
  id: 'lamp', promptId: 'lampStair',
  x: LAMP_ROOM.x, z: LAMP_ROOM.z, r: LAMP_ROOM.r, wallH: LAMP_ROOM.wallH,
  spawn: { x: 330, z: -258.5, heading: Math.PI },
  inDoor: { x: 330, z: -258.2 },
  /* "outside" for this room is the ground room's stairs — it is the only
     interior you leave by going DOWN, and doorOut just teleports to ext */
  ext: { outX: 331.75, outZ: -179.35, heading: Math.PI * 1.35 },
  coll: LAMP_COLL, mesh: null, glow: null, vis: [],
  lamp: { x: 330, z: -260.9 },
};

(function buildLampRoom() {
  const md = MD();
  const cx = LAMP_ROOM.x, cz = LAMP_ROOM.z, R = LAMP_ROOM.r, H = LAMP_ROOM.wallH;
  const IRON = [0.30, 0.31, 0.33], IRON_D = [0.20, 0.21, 0.23];
  const BRASS = [0.62, 0.50, 0.26], BRASS_D = [0.44, 0.35, 0.19];
  const FLOOR = [0.44, 0.42, 0.40], FLOOR2 = [0.38, 0.37, 0.35];
  const GLASS = [0.70, 0.80, 0.86];
  /* floor: iron plate, worn to a shine on the walking ring */
  lathe(md, [[0, 0], [R, 0]], { seg: 14, x: cx, y: 0, z: cz, col: FLOOR, flat: true });
  lathe(md, [[R * 0.42, 0.004], [R * 0.86, 0.004]], { seg: 14, x: cx, y: 0, z: cz, col: FLOOR2, flat: true });
  /* the astragals: eight iron uprights with glass between — this room is
     mostly window, which is the whole point of standing in it */
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU;
    box(md, { x: cx + Math.sin(a) * R, y: 0, z: cz + Math.cos(a) * R,
      w: 0.09, d: 0.09, h: H, ry: a, col: IRON });
  }
  for (let i = 0; i < 8; i++) {
    const a0 = i / 8 * TAU, a1 = (i + 1) / 8 * TAU;
    const p0 = [cx + Math.sin(a0) * R, cz + Math.cos(a0) * R];
    const p1 = [cx + Math.sin(a1) * R, cz + Math.cos(a1) * R];
    pushQuad(md, [p0[0], 0.32, p0[1]], [p1[0], 0.32, p1[1]],
      [p1[0], H - 0.22, p1[1]], [p0[0], H - 0.22, p0[1]], GLASS);
  }
  /* the cap and the ring beam */
  lathe(md, [[R + 0.14, H - 0.22], [R + 0.14, H], [R * 0.5, H + 0.5], [0, H + 0.72]],
    { seg: 14, x: cx, y: 0, z: cz, col: IRON_D, cols: [IRON, IRON_D, IRON_D] });
  lathe(md, [[R, 0.30], [R + 0.1, 0.30], [R + 0.1, 0.42], [R, 0.42]],
    { seg: 14, x: cx, y: 0, z: cz, col: IRON_D });
  /* THE LENS — a brass drum of stepped rings on a turning table */
  const lx = lampRoom.lamp.x, lz = lampRoom.lamp.z;
  lathe(md, [[0, 0], [0.52, 0], [0.52, 0.12], [0.44, 0.16]],
    { seg: 12, x: lx, y: 0.42, z: lz, col: BRASS_D });
  for (let i = 0; i < 5; i++) {
    const y0 = 0.58 + i * 0.17;
    const rr = 0.46 - Math.abs(i - 2) * 0.05;
    lathe(md, [[rr, y0], [rr + 0.05, y0 + 0.06], [rr, y0 + 0.14]],
      { seg: 12, x: lx, y: 0, z: lz, col: i % 2 ? BRASS : BRASS_D });
  }
  lathe(md, [[0.30, 1.44], [0.16, 1.62], [0, 1.70]], { seg: 10, x: lx, y: 0, z: lz, col: BRASS_D });
  /* the burner inside, and the oil pipe down to the floor */
  lathe(md, [[0.10, 0.62], [0.13, 0.86], [0.07, 1.02]], { seg: 8, x: lx, y: 0, z: lz, col: IRON_D });
  box(md, { x: lx + 0.34, y: 0.42, z: lz + 0.16, w: 0.05, d: 0.05, h: 0.5, col: IRON_D });
  /* a rail to lean on, and Finn's stool */
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU + 0.39;
    box(md, { x: cx + Math.sin(a) * (R - 0.22), y: 0.86, z: cz + Math.cos(a) * (R - 0.22),
      w: 0.5, d: 0.05, h: 0.05, ry: a, col: IRON });
  }
  box(md, { x: cx - 1.2, y: 0, z: cz + 0.9, w: 0.34, d: 0.34, h: 0.44, ry: 0.4, col: [0.45, 0.36, 0.25] });
  LAMP_COLL.push([lx, lz, 0.72]);                     // the lens itself
  LAMP_COLL.push([cx - 1.2, cz + 0.9, 0.3]);          // the stool
  lampRoom.mesh = mdMesh(md, WORLD_MAT, false);
  lampRoom.mesh.matrixAutoUpdate = false; lampRoom.mesh.updateMatrix();
  lampRoom.mesh.frustumCulled = false;
  lampRoom.mesh.visible = false;
  scene.add(lampRoom.mesh);
  /* glow: the burner's own light, swelled once it is lit */
  const mdG = MD();
  lathe(mdG, [[0, 0.001], [0.7, 0]], { seg: 10, x: lx, y: 0.45, z: lz, col: [1.0, 0.86, 0.52] });
  for (const [ox, oz] of [[0.34, 0], [0, 0.34]]) {
    pushQuad(mdG, [lx - ox, 0.55, lz - oz], [lx + ox, 0.55, lz + oz],
      [lx + ox, 1.45, lz + oz], [lx - ox, 1.45, lz - oz], [1.0, 0.90, 0.62]);
  }
  lampRoom.glow = mdMesh(mdG, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.0,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  }), false);
  lampRoom.glow.matrixAutoUpdate = false; lampRoom.glow.updateMatrix();
  lampRoom.glow.visible = false;
  scene.add(lampRoom.glow);
  ROOMS.push(lampRoom);
})();

/* THE BEAM — the thing the whole feature is for. Two long additive wedges
   turning about the tower, cheap enough to leave on forever: no shadow map,
   no light, just geometry that sweeps. Drawn from the real lamp height on
   the real tower so it lines up from the bay AND from the isles. */
(function buildLampBeam() {
  const bx = LIGHTHOUSE.x, bz = LIGHTHOUSE.z;
  const by = groundH(bx, bz) - 0.3 + 8.95;
  const md = MD();
  /* A LIGHTHOUSE BEAM, NOT A LASER BAR. The first cut was 620m long and 26m
     wide at the far end, additive and bright — from the shore it read as a
     solid glowing girder lying across the horizon. What sells a beam is a
     NARROW shaft that fades out long before it ends, tilted down onto the
     water, faint enough to be atmosphere. Two wedges crossed in an X so it
     reads from any bearing without a cone's triangles. */
  const LEN = 300, W0 = 0.35, W1 = 4.6, DROP = 5.5;
  for (const dir of [1, -1]) {
    const near = [1.0, 0.95, 0.78], far = [1.0, 0.88, 0.55];
    const fz = LEN * dir, fy = -DROP;
    // horizontal blade
    pushQuad(md, [-W0, 0, 0], [W0, 0, 0], [W1, fy, fz], [-W1, fy, fz], near, far);
    // vertical blade
    pushQuad(md, [0, -W0, 0], [0, W0, 0], [0, fy + W1 * 0.6, fz], [0, fy - W1 * 0.6, fz], near, far);
  }
  lampBeam = mdMesh(md, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.0,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true,
    side: THREE.DoubleSide,
  }), false);
  lampBeam.renderOrder = 4;
  lampBeam.position.set(bx, by, bz);
  lampBeam.frustumCulled = false;
  lampBeam.visible = false;
  scene.add(lampBeam);
  /* the lamp itself, a warm bead on the tower, visible from a long way off */
  const mdH = MD();
  lathe(mdH, [[0, 0], [1.5, 0]], { seg: 10, x: 0, y: 0, z: 0, col: [1.0, 0.92, 0.66] });
  lampGlowMesh = mdMesh(mdH, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.0,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  }), false);
  lampGlowMesh.position.set(bx, by, bz);
  lampGlowMesh.frustumCulled = false;
  lampGlowMesh.visible = false;
  scene.add(lampGlowMesh);
})();

function lampSunk() {   // 0 at noon, 1 at the bottom of the gold hour
  try { if (typeof fSunK === 'number') return clamp(fSunK, 0, 1); } catch (e) {}
  return 0;
}
function lampStairsOpen() { return !!(SAVE && SAVE.sunArc); }

/* ── interactions ─────────────────────────────────────────────────────── */
const _lampInteract = currentInteract;
currentInteract = function () {
  const R = (typeof roomAt === 'function') ? roomAt(P.x, P.z) : null;
  /* the ground room's stairs: once there is a dusk, they go somewhere */
  if (R && R.id === 'light' && lampStairsOpen() && R.stairs &&
      Math.hypot(P.x - R.stairs.x, P.z - R.stairs.z) < 1.5) {
    return { id: 'lampStair', label: '✕ CLIMB' };
  }
  if (R && R.id === 'lamp') {
    if (Math.hypot(P.x - lampRoom.lamp.x, P.z - lampRoom.lamp.z) < 1.5) {
      return SAVE && SAVE.lampLit ? { id: 'lampLook', label: '✕ LOOK' }
                                  : { id: 'lampLight', label: '✕ LIGHT THE LAMP' };
    }
    if (Math.hypot(P.x - lampRoom.inDoor.x, P.z - lampRoom.inDoor.z) < 1.4) {
      return { id: 'lampDown', label: '✕ GO DOWN', room: lampRoom };
    }
  }
  return _lampInteract();
};

const _lampDo = doInteract;
doInteract = function (ctx) {
  if (!ctx) return _lampDo(ctx);
  if (ctx.id === 'lampStair') {
    CINE.room = lampRoom; startCine('doorIn');
    if (!(SAVE && SAVE.lampLit)) showCaption('Finn moved the crates.', 2600);
    return;
  }
  if (ctx.id === 'lampDown') { CINE.room = lampRoom; startCine('doorOut'); return; }
  if (ctx.id === 'lampLook') {
    showCaption('It turns all night. Or all whatever this is.', 3200);
    SFX.bellSmall ? SFX.bellSmall() : SFX.chime && SFX.chime();
    return;
  }
  if (ctx.id === 'lampLight') { startCine('lampLight'); return; }
  return _lampDo(ctx);
};

/* ── the lighting: a short authored beat, then the beam is yours ──────── */
const _lampTickCine = tickCine;
tickCine = function (t) {
  if (CINE.id !== 'lampLight') return _lampTickCine(t);
  const bx = LIGHTHOUSE.x, bz = LIGHTHOUSE.z;
  const by = groundH(bx, bz) - 0.3 + 8.95;
  const lx = lampRoom.lamp.x, lz = lampRoom.lamp.z;
  if (CINE.step === 0) {
    CINE.step = 1;
    if (SAVE) { SAVE.lampLit = true; storeSave(); }
    lampLitNow = true;
    SFX.crank ? SFX.crank() : null;
    showCaption('', 1);
  }
  /* 0-2.4s: the burner catches, close on the lens */
  if (t < 2.4) {
    lampFlare = smoothstep(clamp(t / 2.0, 0, 1)) * 0.85;
    const k = smoothstep(clamp(t / 2.4, 0, 1));
    cineCam(lx + 1.5 - k * 0.5, 1.15 + k * 0.25, lz + 1.6 - k * 0.4, lx, 1.0, lz);
    if (CINE.step === 1 && t > 0.5) { CINE.step = 2; SFX.burn ? SFX.burn() : null; }
  } else if (t < 5.2) {
    /* the lens begins to turn */
    lampFlare = 0.85 + 0.15 * smoothstep(clamp((t - 2.4) / 2.4, 0, 1));
    const k = smoothstep(clamp((t - 2.4) / 2.8, 0, 1));
    cineCam(lx + 1.0 + k * 1.2, 1.4 + k * 0.5, lz + 1.2 + k * 1.4, lx, 1.05, lz);
    if (CINE.step === 2 && t > 3.0) { CINE.step = 3; SFX.grind ? SFX.grind() : null; }
  } else if (t < 10.6) {
    /* OUT of the tower: the beam sweeping the bay at gold hour */
    lampFlare = 1;
    const k = smoothstep(clamp((t - 5.2) / 5.4, 0, 1));
    const a = -0.9 + k * 1.5;
    cineCam(bx + Math.sin(a) * lerp(26, 96, k), by + lerp(2.5, 20, k), bz + Math.cos(a) * lerp(26, 96, k),
      bx, by - lerp(0, 5, k), bz);
    if (CINE.step === 3 && t > 6.2) {
      CINE.step = 4;
      showCaption('“A lighthouse in endless day is just stairs,” he said.', 4200);
    }
  } else {
    lampFlare = 1;
    const k = smoothstep(clamp((t - 10.6) / 1.4, 0, 1));
    cineCam(bx + Math.sin(0.6) * lerp(96, 60, k), by + lerp(20, 14, k), bz + Math.cos(0.6) * lerp(96, 60, k),
      bx, by - 5, bz);
    if (t >= 12.0) {
      markCineSeen('lampLight');
      P.x = lampRoom.spawn.x; P.z = lampRoom.spawn.z; P.heading = lampRoom.spawn.heading;
      P.fy = groundH(P.x, P.z); P.vx = 0; P.vz = 0; P.st = 'idle';
      CAM.yaw = P.heading + Math.PI; CAM.pitch = 0.3; CAM.ready = false;
      endCine();
      showCaption('It is not much of a night. It is enough to steer by.', 4000);
    }
  }
};

/* ── the beam lives, whether or not anyone is watching ────────────────── */
const _lampCull = cullChunks;
cullChunks = function (ccx, ccz) {
  _lampCull(ccx, ccz);
  extendLampDebugOnce();
  const lit = lampLitNow || !!(SAVE && SAVE.lampLit);
  const want = lit ? (0.34 + 0.66 * lampSunk()) : 0;      // brightest at dusk
  lampFlare += ((CINE.id === 'lampLight' ? lampFlare : (lit ? 1 : 0)) - lampFlare) * 0.06;
  if (lampBeam) {
    lampSpin += 0.0065;                                    // ~6s a revolution
    lampBeam.rotation.y = lampSpin;
    lampBeam.material.opacity = want * 0.17;   // atmosphere, not a bar
    lampBeam.visible = lit && want > 0.02;
  }
  if (lampGlowMesh) {
    lampGlowMesh.material.opacity = lit ? 0.35 + 0.4 * lampSunk() : 0;
    lampGlowMesh.visible = lit;
    lampGlowMesh.lookAt(camera.position);
  }
  if (lampRoom.glow) lampRoom.glow.material.opacity = 0.42 * lampFlare;
};

window.__worldStateHooks.push(function (S) {
  lampLitNow = !!S.lampLit;
  lampFlare = lampLitNow ? 1 : 0;
  if (lampBeam) { lampBeam.visible = false; lampBeam.material.opacity = 0; }
  if (lampGlowMesh) { lampGlowMesh.visible = false; lampGlowMesh.material.opacity = 0; }
  if (lampRoom.glow) lampRoom.glow.material.opacity = 0;
});
window.__telemetryHooks.push(function (T) {
  T.lampLit = !!(SAVE && SAVE.lampLit);
  T.lampStairsOpen = lampStairsOpen();
  T.inLampRoom = !!(typeof roomAt === 'function' && roomAt(P.x, P.z) &&
                    roomAt(P.x, P.z).id === 'lamp');
  T.lampBeamOn = !!(lampBeam && lampBeam.visible);
});
/* __fmDebug is born in p7, which loads AFTER this file, so the helpers have
   to be hung on lazily — the same once-guard the tide and forest parts use. */
let lampDebugDone = false;
function extendLampDebugOnce() {
  if (lampDebugDone) return;
  const d = window.__fmDebug;
  if (!d) return;
  lampDebugDone = true;
  d.warpLamp = function () {
    window.__fmDebug.warp(lampRoom.spawn.x, lampRoom.spawn.z);
    return { x: lampRoom.spawn.x, z: lampRoom.spawn.z };
  };
  d.lampInfo = function () {
    return { lit: !!(SAVE && SAVE.lampLit), stairs: lampStairsOpen(),
      beam: !!(lampBeam && lampBeam.visible),
      opacity: lampBeam ? +lampBeam.material.opacity.toFixed(3) : null,
      sunk: +lampSunk().toFixed(3) };
  };
}
</script>
