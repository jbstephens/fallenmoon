<script>
/* ═══════════════════════════════════════════════════════════════════════
   PHASE 3, PART ONE — THE CROSSING & THE HOURLESS ISLES (the world)

   Owns: the open-ocean swell, the keel salvage + Finn's refit + the DOUBLE
   SAIL, combat afloat (sun gulls, reef gar), the crossing cinematic with
   THE DROWNED MOON, and the archipelago itself (islands, shores, the
   Bellwright, clapper crabs, chests, landfall).

   Does NOT own: the Foundry dungeon, the Hour Tortoise, the Gibbous Bell,

   is concatenated AFTER this file and may rely on every const below.

   Wraps (delegate pattern, _n2 = the night-two/tide owner):

/* ── PINNED GEOGRAPHY (authoritative; p6e reads these) ───────────────── */
/* The isles sit WEST/SOUTHWEST of Brightharbor, deliberately opposite the
   Parched Forest (x 170..2180) so no far-tier land can intrude on the

const ISLES = { x0: -2450, x1: -250, z0: -1150, z1: 350 };

const WATCHSTONE = { x: -980, z: -210, r: 95 };  // first landfall + anchor
const KILN_ISLE = { x: -1520, z: -420, r: 145 }; // Great Campanile + Foundry
const DROWNED_SPIRE = { x: -1180, z: -640, r: 58 };

const CHIME_REEF = { x: -1350, z: -60, r: 92 };

const FOUNDRY_DOOR = { x: -1520, z: -352 };
/* THE TWO BAY-SIDE PINS BELOW ARE THE ONLY NUMBERS CORRECTED FROM THE
   ORIGINAL BLOCK, and only after sampling the flooded bay's real waterline
   (WL = -0.55): the authored literals were (34,96) — 79 m from the only
   drowned wreck, in 2.1 m of open water — and (10.5,9.5), which is 1.6 m
   UNDER the returned sea. A "pry the keel" prompt floating in open water
   and a "beach" below the waterline are not shippable. Names are untouched
   (nothing outside this file reads them) and every ISLES pin above is
   byte-identical to the brief. */
/* where Finn refits the boat: the dry beach beside the moored wake-boat */
const REFIT_BEACH = { x: 9.0, z: -2.6 };
/* the drowned wreck's keel timber — ON her deck, where you disembark */
const KEEL_SPOT = { x: WRECK.x - 1.6, z: WRECK.z + 1.2 };

window.__worldStateHooks = window.__worldStateHooks || [];
window.__telemetryHooks = window.__telemetryHooks || [];

/* ── save-derived gates ───────────────────────────────────────────────── */
const refitDone = () => !!(SAVE && SAVE.boatRefit);
const seaOpen = refitDone;          // once she is refit, the sea edge lets you go
window.__foundrySealed = () => !(SAVE && SAVE.watchBell);   // p6e reads this

/* ═══ THE SWELL ═══
   Three sine components with different amplitude, period and heading, so
   the water never reads metronomic. Everything is evaluated analytically —
   the displaced grid below writes IN PLACE into pooled Float32Arrays and
   allocates nothing per frame. The BAY STAYS CALM: the amplitude envelope
   is zero inside SEA_EDGE and shoals to nothing against every shore. */
const SWELL = [
  { amp: 0.95, dx:  0.93, dz:  0.37, len: 78, spd: 8.8 },
  { amp: 0.52, dx:  0.55, dz: -0.84, len: 41, spd: 6.4 },
  { amp: 0.24, dx:  0.99, dz: -0.12, len: 23, spd: 4.9 },
];
for (const s of SWELL) { s.k = TAU / s.len; s.w = s.k * s.spd; }
let seaClock = 0;                       // sim-driven (deterministic under turbo)

/* the BIG SET: a travelling crest, telegraphed, that costs SPEED not hearts */
const SET = {
  on: false, phase: 'idle', t: 0, next: 9, nx: 0.94, nz: 0.34,
  c: 0, spd: 16, amp: 0, hit: false, warned: false, u: 0,
  passes: 0, stalls: 0, keeps: 0, lastLine: -999, spillT: 0,
};
function bigSetHeight(x, z) {
  if (!SET.on) return 0;
  const u = x * SET.nx + z * SET.nz - SET.c;
  const w = 27;
  if (u > 92 || u < -104) return 0;
  const g = Math.exp(-(u * u) / (w * w));
  const t2 = (u + w * 1.55);
  return SET.amp * (g - 0.4 * Math.exp(-(t2 * t2) / (w * w * 0.85)));
}
/* the envelope: calm bay, open ocean, and shoaling water against a shore */
/* two answers from one island sweep: how much swell survives here, and how
   far offshore we are (which is what the water's COLOUR reads, not the
   swell — a calm lee should still be deep blue if the water is deep) */
const _shoal = { amp: 0, off: 1 };
function seaShoalAt(x, z) {
  const dBay = Math.hypot(x - SEA_EDGE.x, z - SEA_EDGE.z);
  let k = smoothstep(clamp((dBay - 98) / 62, 0, 1));
  let off = smoothstep(clamp((dBay - 96) / 90, 0, 1));
  for (let i = 0; i < ISLE_LIST.length; i++) {
    const is = ISLE_LIST[i];
    const d = Math.hypot(x - is.x, z - is.z);
    if (d < is.r + 60) k *= clamp((d - is.r * 0.94) / 58, 0, 1);
    if (d < is.r + 210) off = Math.min(off, smoothstep(clamp((d - is.r * 0.98) / 205, 0, 1)));
  }
  const dr = Math.hypot(x - CHIME_REEF.x, z - CHIME_REEF.z);
  if (dr < CHIME_REEF.r + 60) k *= clamp(0.42 + (dr - CHIME_REEF.r * 0.92) / 110, 0.42, 1);
  if (dr < CHIME_REEF.r + 190) off = Math.min(off, smoothstep(clamp((dr - CHIME_REEF.r * 0.9) / 185, 0, 1)));

}
function swellAmpAt(x, z) { return seaShoalAt(x, z).amp; }
function swellRawAt(x, z, t) {

  for (let i = 0; i < 3; i++) {
    const s = SWELL[i];
    h += s.amp * Math.sin((x * s.dx + z * s.dz) * s.k - s.w * t);
  }

}
/* the one public answer: displacement of the sea surface at (x,z), now */
function swellAt(x, z) {

  return (swellRawAt(x, z, seaClock) + bigSetHeight(x, z)) * a;
}
window.__swellAt = swellAt;

/* ═══ THE SEA FLOOR — one analytic field, one mesh authority ═══ */
const SEA_FLOOR = -12.5;
const MOON_BOWL_R = 640, MOON_BOWL_D = 232;
const CHAN = { z: 34, hw: 18, fall: 8 };     // the harbour gap west out of the bay
const CHAN_RECT = { x0: -112, x1: -88, z0: 0, z1: 68 };

/* island shape parameters live ON the pinned objects — one table, no copy */
WATCHSTONE.top = 12.5; WATCHSTONE.core = 0.80; WATCHSTONE.shelf = -8.5; WATCHSTONE.rough = 0.9; WATCHSTONE.wob = 0.10; WATCHSTONE.seed = 1.7; WATCHSTONE.id = 'watch';
KILN_ISLE.top = 30.0; KILN_ISLE.core = 0.86; KILN_ISLE.shelf = -9.5; KILN_ISLE.rough = 1.3; KILN_ISLE.wob = 0.12; KILN_ISLE.seed = 3.1; KILN_ISLE.id = 'kiln';
DROWNED_SPIRE.top = -1.7; DROWNED_SPIRE.core = 0.55; DROWNED_SPIRE.shelf = -9.0; DROWNED_SPIRE.rough = 0.3; DROWNED_SPIRE.wob = 0.08; DROWNED_SPIRE.seed = 5.4; DROWNED_SPIRE.id = 'spire';
NETMENDER.top = 7.6; NETMENDER.core = 0.68; NETMENDER.shelf = -7.5; NETMENDER.rough = 0.7; NETMENDER.wob = 0.14; NETMENDER.seed = 0.9; NETMENDER.id = 'net';
GANNET_STACK.top = 21.0; GANNET_STACK.core = 0.24; GANNET_STACK.shelf = -9.5; GANNET_STACK.rough = 1.1; GANNET_STACK.wob = 0.09; GANNET_STACK.seed = 4.2; GANNET_STACK.id = 'gannet';
GANNET_STACK.ramp = 1.35; GANNET_STACK.rampCore = 0.78;      // the gull road up
LONG_STRAND.top = 6.2; LONG_STRAND.core = 0.92; LONG_STRAND.shelf = -7.0; LONG_STRAND.rough = 0.8; LONG_STRAND.wob = 0.16; LONG_STRAND.seed = 2.4; LONG_STRAND.id = 'strand';

function isleRadiusAt(is, a) {
  return is.r * (1 + is.wob * (Math.sin(a * 3 + is.seed) * 0.6 + Math.sin(a * 5 + is.seed * 2.3) * 0.4));
}
function isleProfileH(is, x, z) {
  const dx = x - is.x, dz = z - is.z;
  const d = Math.hypot(dx, dz);
  if (d > is.r * 1.75) return null;
  const a = Math.atan2(dz, dx);
  const R = isleRadiusAt(is, a);
  if (d > R * 1.6) return null;
  if (d >= R) {                              // the shelf falling away offshore
    const t = smoothstep(clamp((d - R) / (R * 0.58), 0, 1));
    return lerp(WL, is.shelf, t);
  }
  let core = is.core;
  if (is.ramp !== undefined) {
    let da = a - is.ramp;
    da = ((da % TAU) + TAU) % TAU; if (da > Math.PI) da -= TAU;
    core = lerp(core, is.rampCore, smoothstep(clamp((0.9 - Math.abs(da)) / 0.6, 0, 1)));
  }
  const k = 1 - d / R;                       // 0 at the waterline → 1 at the core
  let h = WL + (is.top - WL) * smoothstep(clamp(k / core, 0, 1));
  const inland = clamp(k * 4.5, 0, 1);
  h += vnoise(x * 0.014, z * 0.014) * (is.top * 0.16 + 1.4) * inland;   // long dune swell
  h += vnoise(x * 0.045, z * 0.045) * is.rough * inland;
  h += vnoise(x * 0.11 + 7, z * 0.11) * 0.35 * inland;                  // hummocks
  return h;
}
/* CHIME REEF: a shallow bar with a handful of rock heads breaking the swell */
const REEF_HEADS = [];
{
  const rnd = mulberry32(60418);
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * TAU + rnd() * 0.4;
    const d = CHIME_REEF.r * (0.3 + rnd() * 0.62);
    REEF_HEADS.push({ x: CHIME_REEF.x + Math.cos(a) * d, z: CHIME_REEF.z + Math.sin(a) * d,
      r: 3.6 + rnd() * 3.4, h: WL + 0.9 + rnd() * 2.2 });
  }
}
function reefH(x, z) {
  const d = Math.hypot(x - CHIME_REEF.x, z - CHIME_REEF.z);
  let h = -1e9;
  if (d < CHIME_REEF.r * 1.4) {
    h = lerp(WL - 1.35, SEA_FLOOR, smoothstep(clamp((d - CHIME_REEF.r * 0.7) / (CHIME_REEF.r * 0.7), 0, 1)));
    h += vnoise(x * 0.05, z * 0.05) * 0.5;
  }
  for (let i = 0; i < REEF_HEADS.length; i++) {
    const rh = REEF_HEADS[i];
    const dd = Math.hypot(x - rh.x, z - rh.z);
    if (dd < rh.r + 2) h = Math.max(h, lerp(rh.h, WL - 1.2, smoothstep(clamp((dd - rh.r * 0.55) / (rh.r * 0.9), 0, 1))));
  }
  return h;
}
/* THE HOME HEADLAND: Brightharbor's own west rim, seen from the sea, and
   the CHANNEL cut through it — the only way out of the bay. */
const _n2GroundH = groundH;                 // the pre-phase-3 ground authority
function homeSeamH(z) { return _n2GroundH(-110, clamp(z, -108, 184)); }
function chanWz(z) {
  const d = Math.abs(z - CHAN.z);
  return smoothstep(clamp((CHAN.hw + CHAN.fall - d) / CHAN.fall, 0, 1));
}
function chanFloorWest(x, z) {
  return lerp(-4.5, -11.5, smoothstep(clamp((-110 - x) / 78, 0, 1)));
}
function homeCoastH(x, z) {
  const zw = smoothstep(clamp((250 - Math.abs(z - 40)) / 88, 0, 1));
  if (zw <= 0) return -1e9;
  const fall = smoothstep(clamp((-110 - x) / 120, 0, 1));
  let h = lerp(homeSeamH(z), -9.8, fall);
  const w = chanWz(z);
  if (w > 0) h = lerp(h, Math.min(h, chanFloorWest(x, z)), w);
  return lerp(-9.8, h, zw);
}
function seaRaw(x, z) {
  let h = SEA_FLOOR + vnoise(x * 0.0035, z * 0.0035) * 3.4 + vnoise(x * 0.012, z * 0.012) * 0.8;
  const dm = Math.hypot(x - MOON_SITE.x, z - MOON_SITE.z);
  if (dm < MOON_BOWL_R) h -= MOON_BOWL_D * smoothstep(clamp((MOON_BOWL_R - dm) / (MOON_BOWL_R * 0.66), 0, 1));
  for (let i = 0; i < ISLE_LIST.length; i++) {
    const p = isleProfileH(ISLE_LIST[i], x, z);
    if (p !== null && p > h) h = p;
  }
  const rf = reefH(x, z);
  if (rf > h) h = rf;
  if (x > -262) { const c = homeCoastH(x, z); if (c > h) h = c; }
  return h;
}
/* the CHANNEL inside the bay's own rendered rect: the same cut, expressed
   over Brightharbor's terrain so the two fields meet exactly at x = -110 */
function chanW(x, z) {
  return smoothstep(clamp((-92 - x) / 6, 0, 1)) * chanWz(z);
}
function chanRaw(x, z) {
  const nat = _n2GroundH(x, z);
  const w = chanW(x, z);
  if (w <= 0) return nat;
  const t = smoothstep(clamp((-92 - x) / 18, 0, 1));
  const floor = lerp(-2.95, seaRaw(-110, z), t);
  return lerp(nat, Math.min(nat, floor), w);
}

/* ONE GROUND AUTHORITY: both fields are mesh-fields, so the height the sim
   reads IS the triangulation that renders. The channel field reuses
   Brightharbor's exact lattice (origin −110/−110, step 2.2, BAY_FINE) so
   its vertices land on the bay sheet's own vertices — which is what lets
   the carve below edit that sheet in place instead of pairing a second
   copy of the ground against it. */
const SEA_STEP = 6;
const SEA_X0 = -2468, SEA_Z0 = -1184, SEA_X1 = -104, SEA_Z1 = 388;
const ISLE_FINE = (x, z) => {
  for (let i = 0; i < ISLE_LIST.length; i++) {
    const is = ISLE_LIST[i];
    const d = Math.hypot(x - is.x, z - is.z);
    if (d > is.r - 30 && d < is.r + 24) return true;
  }
  return Math.hypot(x - CHIME_REEF.x, z - CHIME_REEF.z) < CHIME_REEF.r + 18;
};
const seaHMesh = makeMeshField(seaRaw, SEA_X0, SEA_Z0, SEA_X1, SEA_Z1, SEA_STEP, ISLE_FINE);
const chanHMesh = makeMeshField(chanRaw, -110, -110, 110, 186, 2.2, BAY_FINE);
const inSeaQ = (x, z) => x < -110 && x > SEA_X0 && z > SEA_Z0 && z < SEA_Z1;
const inChanQ = (x, z) => x >= -110 && x <= CHAN_RECT.x1 && z >= CHAN_RECT.z0 && z <= CHAN_RECT.z1;
groundH = function (x, z) {
  if (x < -86) {
    if (inSeaQ(x, z)) return seaHMesh(x, z);
    if (inChanQ(x, z)) return chanHMesh(x, z);
  }
  return _n2GroundH(x, z);
};
/* which island (if any) owns this spot — used by areas, shade and culling */
function isleAt(x, z) {
  for (let i = 0; i < ISLE_LIST.length; i++) {
    const is = ISLE_LIST[i];
    if (Math.hypot(x - is.x, z - is.z) < is.r * 1.12) return is;
  }
  return null;
}
function ashoreOnIsle(x, z) {
  const is = isleAt(x, z);
  return is && groundH(x, z) > WL - 0.2 ? is : null;
}
const atSeaQ = (x, z) => x < -96;

/* ── water depth: the sea now reaches a great deal further west ── */
const _n2WaterDepth = waterDepthAt;
waterDepthAt = function (x, z) {
  if (x < -86 && (inSeaQ(x, z) || inChanQ(x, z))) {
    if (!flooded()) return 0;
    return Math.max(0, WL - groundH(x, z));
  }
  return _n2WaterDepth(x, z);
};

/* ── shade, respawn anchors, areas ── */
/* every island carries a shade circle and a mooring anchor; the anchor is
   where a sunstruck sailor wakes — WITH the boat, never in the water */
const ISLE_SHADE = [];
const ISLE_ANCHORS = [];   // {x,z (moor, in water), sx,sz (shade, ashore), id}
function pushIsleAnchor(is, ax, az, sx, sz) {
  ISLE_ANCHORS.push({ x: ax, z: az, sx, sz, id: is.id });
}
const _n2InShadeAt = inShadeAt;
inShadeAt = function (x, z) {
  if (x < -96) {
    for (let i = 0; i < ISLE_SHADE.length; i++) {
      const s = ISLE_SHADE[i];
      if (Math.hypot(x - s.x, z - s.z) < s.r) return true;
    }
    return false;
  }
  return _n2InShadeAt(x, z);
};
let lastIsleAnchor = -1;                   // the most recent landfall/mooring
function nearestIsleAnchor(x, z) {
  /* NEAREST, not last-remembered. The stale index sent a player downed on
     Kiln Isle's beach 1.5km home to the village — with the boat still
     moored at Kiln. lastIsleAnchor breaks ties only. */
  let best = -1, bd = 1e9;
  for (let i = 0; i < ISLE_ANCHORS.length; i++) {
    const a = ISLE_ANCHORS[i];
    const d = Math.hypot(x - a.sx, z - a.sz) - (i === lastIsleAnchor ? 25 : 0);
    if (d < bd) { bd = d; best = i; }
  }
  return best >= 0 ? ISLE_ANCHORS[best] : null;
}
const _n2NearestShade = nearestShadeSpot;
nearestShadeSpot = function (x, z) {
  if (x < -96) {
    const a = nearestIsleAnchor(x, z);
    if (a) return { x: a.sx, z: a.sz };
  }
  return _n2NearestShade(x, z);
};
const _n2AreaAt = areaAt;
areaAt = function (x, z) {
  if (x < -96) {
    const is = isleAt(x, z);
    return is ? 'isle_' + is.id : 'sea';
  }
  return _n2AreaAt(x, z);
};

/* ── SOLID authority west of the bay ── */
const SPIRE_WALL = { r0: 6.6, r1: 9.4, archA: 1.05, archHalf: 0.36 };
function spireArchOpen(a) {
  let da = a - SPIRE_WALL.archA;
  da = ((da % TAU) + TAU) % TAU; if (da > Math.PI) da -= TAU;
  return Math.abs(da) < SPIRE_WALL.archHalf;
}
function isleSolidAt(x, z) {
  /* the Drowned Spire's shell — you sail IN through the broken arch */
  {
    const dx = x - DROWNED_SPIRE.x, dz = z - DROWNED_SPIRE.z;
    const d = Math.hypot(dx, dz);
    if (d > SPIRE_WALL.r0 && d < SPIRE_WALL.r1 && !spireArchOpen(Math.atan2(dz, dx))) return true;

  for (let i = 0; i < REEF_HEADS.length; i++) {

};

/* ── collide: Brightharbor's clamp stops at x = −98, which is the middle of

collide = function (px, pz, pr, fy) {

  for (let i = 0; i < COLL.length; i++) {
    const c = COLL[i];

    if (c.top !== undefined && fy !== undefined && fy >= c.top - 0.42) continue;

/* ── THE HARBOUR GAP, carved into the sheet that already renders it ──
   The bay's ground mesh was finalised in p4 (its build data is gone), so the
   channel is cut by moving the sheet's OWN vertices onto the new field and

const S_SEABED = col(0x6d7a72), S_SEABED2 = col(0x55635f), S_CHANROCK = col(0x7e7d72),

      const vx = C[0] - A[0], vy = C[1] - A[1], vz = C[2] - A[2];

        const dst = k === 0 ? A : k === 1 ? B : C;
        const cc = chanColor(dst[0], dst[2], dst[1]);

<script>
/* ═══════════ p6d/2 — THE OPEN OCEAN: swell grid, far water, the DROWNED MOON ═══════════ */

/* ── the displaced swell grid ──
   ≤48x48 verts, indexed, written IN PLACE into pooled Float32Arrays every
   frame. Zero allocation in the hot path: the arrays, the index buffer and
   every scratch below are made once, here. */
const WG_N = LOWFX ? 30 : 48;
const WG_CELL = LOWFX ? 11.5 : 7.0;
const WG_SPAN = (WG_N - 1) * WG_CELL;
let waveMesh = null, wavePos = null, waveCol = null, waveMat = null, waveIdx = null;
let waveKeyI = 1e9, waveKeyJ = 1e9;
(function buildWaveGrid() {
  const n = WG_N * WG_N;

  waveCol = new Float32Array(n * 3);
  waveIdx = new Uint16Array((WG_N - 1) * (WG_N - 1) * 6);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(wavePos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(waveCol, 3));
  g.setIndex(new THREE.BufferAttribute(waveIdx, 1));
  waveMat = new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.87, depthWrite: false,

})();
const S_SEA1 = col(0x11384f), S_SEA2 = col(0x1c5b68), S_SEA3 = col(0x3f8b8c),
      S_SEA_SHOAL = col(0x6fb3a4), S_FOAM = col(0xdff0ee);
const _wc = [0, 0, 0];
let waterClarity = 0;              // 0 normal → 1 the clear water over the moon
/* the bay keeps its OWN water plane (p6c). The ocean grid must not draw a
   second surface on top of it, so the cells inside the bay's footprint are

const bayWaterCell = (cx, cz) => cx > -104 && cx < 106 && cz > -64 && cz < 190;
function rebuildWaveIndex(x0, z0) {
  let o = 0;
  for (let j = 0; j < WG_N - 1; j++) {
    for (let i = 0; i < WG_N - 1; i++) {
      if (bayWaterCell(x0 + (i + 0.5) * WG_CELL, z0 + (j + 0.5) * WG_CELL)) continue;
      const a = j * WG_N + i, b = a + 1, c = a + WG_N, d = c + 1;
      waveIdx[o++] = a; waveIdx[o++] = c; waveIdx[o++] = d;
      waveIdx[o++] = a; waveIdx[o++] = d; waveIdx[o++] = b;
    }
  }
  for (let k = o; k < waveIdx.length; k++) waveIdx[k] = 0;
  waveMesh.geometry.index.needsUpdate = true;
  waveMesh.geometry.setDrawRange(0, o);
}
function updateWaveGrid() {
  const ci = Math.round(camera.position.x / WG_CELL), cj = Math.round(camera.position.z / WG_CELL);
  const cx = ci * WG_CELL, cz = cj * WG_CELL;
  const x0 = cx - WG_SPAN / 2, z0 = cz - WG_SPAN / 2;
  if (ci !== waveKeyI || cj !== waveKeyJ) { waveKeyI = ci; waveKeyJ = cj; rebuildWaveIndex(x0, z0); }
  let o = 0;
  let prevH = 0;
  for (let j = 0; j < WG_N; j++) {
    const z = z0 + j * WG_CELL;
    prevH = 0;
    for (let i = 0; i < WG_N; i++, o += 3) {
      const x = x0 + i * WG_CELL;
      const sh = seaShoalAt(x, z);
      const a = sh.amp, off = sh.off;
      const bs = a <= 0.002 ? 0 : bigSetHeight(x, z);
      let h = a <= 0.002 ? 0 : (swellRawAt(x, z, seaClock) + bs) * a;
      /* the rim rings flatten to the far sheet's level as well as its
         colour — displaced rim verts over a flat floor tore sawtooth gaps
         along the grid's edge, marching as the origin snapped */
      const ri0 = Math.min(i, WG_N - 1 - i), rj0 = Math.min(j, WG_N - 1 - j);
      const rimK = Math.min(1, Math.min(ri0, rj0) / 3);
      h *= rimK;
      wavePos[o] = x; wavePos[o + 1] = WL + h; wavePos[o + 2] = z;
      /* colour reads DEPTH, never calm: open-ocean blue in the deep, teal
         over the shoals. The swell is sculpted by its own slope (free — the
         previous vertex in this row is one subtraction away), which is what
         gives a stylised sea its faces. */
      mix3(S_SEA1, S_SEA3, 1 - off, _wc);
      if (off < 0.5) mix3(_wc, S_SEA_SHOAL, (0.5 - off) * 1.5, _wc);
      const slope = (h - prevH) / WG_CELL;
      prevH = h;
      const lit = clamp(1 + slope * 0.85, 0.82, 1.26);
      _wc[0] *= lit; _wc[1] *= lit; _wc[2] *= lit;
      /* THE DARK CREST LINE: a big set announces itself as a hard dark band
         with white water on its shoulder, visible half a minute out */
      if (bs > 0.28) {
        mix3(_wc, S_SEA1, clamp(bs / 1.4, 0, 0.75), _wc);
        _wc[0] *= 0.72; _wc[1] *= 0.76; _wc[2] *= 0.82;
      } else if (bs < -0.18) {

      const dip = clamp((-h - 0.25) / 1.0, 0, 1);
      if (dip > 0) mix3(_wc, S_SEA2, dip * 0.55, _wc);
      /* the RIM of the grid dissolves into the far-water colour, so the
         grid's origin snapping a cell as you sail never pops a visible edge */
      if (rimK < 1) mix3(_wc, [0.09, 0.26, 0.36], (1 - rimK) * 0.9, _wc);

/* ── the far water: one opaque sheet under everything, holed around the
   islands so their shallows stay readable ── */
let farSeaMesh = null;
(function buildFarSea() {
  const md = MD();
  const S = 80;
  const cDeep = [0.09, 0.26, 0.36], cMid = [0.12, 0.33, 0.42];
  /* a point is COVERED when another sheet already draws a floor there; a

     can never leave a hole for the sky to shine up through */
  const covered = (px, pz) => px > -300 && pz > -194 && pz < 264;   // the home coast sheet
  const S_SEA_SHOAL_F = [0.36, 0.62, 0.58];
  /* NO MORE HOLES. The old builder DROPPED whole 80m cells wherever another
     sheet 'covered' the area — around every isle, the reef, and the moon
     bowl — leaving giant binary sawtooth seams that read as black teeth

     grid's origin snapped over them. One continuous sheet, colored by the

    const d = Math.max(0, WL - seaRaw(px, pz));
    const k = clamp(d / 7, 0, 1);
    const c = [0, 0, 0];

    return c;
  };
  const nearShore = (px, pz) => {
    for (let i = 0; i < ISLE_LIST.length; i++) {
      const is = ISLE_LIST[i];
      if (Math.hypot(px - is.x, pz - is.z) < is.r * 2.2) return true;
    }
    return Math.hypot(px - CHIME_REEF.x, pz - CHIME_REEF.z) < CHIME_REEF.r * 2.0;
  };
  const quad = (x, z, s) => {
    const c00 = depthCol(x, z), c01 = depthCol(x, z + s),
          c11 = depthCol(x + s, z + s), c10 = depthCol(x + s, z);
    md.p.push(x, 0, z, x, 0, z + s, x + s, 0, z + s, x, 0, z, x + s, 0, z + s, x + s, 0, z);
    for (const c of [c00, c01, c11, c00, c11, c10]) md.c.push(c[0], c[1], c[2]);
  };
  for (let x = SEA_X0; x < -110; x += S) {
    for (let z = SEA_Z0; z < SEA_Z1; z += S) {
      if (covered(x, z) && covered(x + S, z) && covered(x, z + S) && covered(x + S, z + S)) {
        // still skip only what a fully OPAQUE sheet owns (the home coast) —
        // isles and bowl now get depth-colored water beneath them instead
        if (x > -300 && z > -194 && z < 264) continue;
      }
      if (nearShore(x + S / 2, z + S / 2)) {
        for (let sx = 0; sx < S; sx += 20) for (let sz = 0; sz < S; sz += 20) quad(x + sx, z + sz, 20);
      } else quad(x, z, S);

  farSeaMesh.position.y = WL - 0.55;
  farSeaMesh.matrixAutoUpdate = false; farSeaMesh.updateMatrix();
  farSeaMesh.frustumCulled = false;
  farSeaMesh.visible = false;
  scene.add(farSeaMesh);
})();

/* ── THE DROWNED MOON ──
   A colossal pale sphere on the seabed, WRAPPED IN CHAINS, half-buried in
   silt. Seen once, from above, inside an authored camera move. You cannot
   reach it, fight it or touch it. Cost: one sphere, some rings, a silt bowl
   built from the SAME height field the sim reads. */
let moonMesh = null, moonSiltMesh = null, moonChainMesh = null;
(function buildDrownedMoon() {
  const md = MD();
  const pale = [0.96, 0.96, 0.90], pale2 = [0.86, 0.87, 0.82], grey = [0.42, 0.45, 0.46];
  const R = MOON_SITE.r;
  /* pole to pole: she must be CLOSED at the crown — the first cut of this
     sphere stopped at 68° and left an open ring exactly where the camera
     looks down at her, so the reveal was a hole into the abyss. */
  const rows = [];
  for (let i = 0; i <= 22; i++) {
    const a = -Math.PI / 2 + (i / 22) * Math.PI;
    rows.push([Math.cos(a) * R, Math.sin(a) * R]);
  }
  /* 40 segments x 22 rows, not 20 x 11: the craters below are PAINTED into
     these vertices, and at the coarse cut a 30m crater owned two or three of
     them and blurred into a smudge. She also read as a smooth cream egg. */
  const cols = [];
  for (let i = 0; i < rows.length; i++) {
    const k = i / (rows.length - 1);                 // 0 = buried pole, 1 = crown

  }

     into the sphere's own vertex colours (rather than laying dishes on top)
     is the only way they follow her curve, since latheW cannot tilt. */
  {
    const rnd = mulberry32(20260817);

      // wider (0.13-0.34 rad) and deeper: at the old size and contrast they
      // simply did not survive the fog out here

      const nx2 = px2 / l2, ny2 = py2 / l2, nz2 = pz2 / l2;

        if (dot < c3.c) continue;

        const t2 = (dot - c3.c) / (1 - c3.c);
        const k3 = t2 < 0.22 ? lerp(1.12, c3.deep, t2 / 0.22) : c3.deep + (t2 - 0.22) * 0.22;
        col2.setXYZ(i, Math.min(1, col2.getX(i) * k3), Math.min(1, col2.getY(i) * k3), Math.min(1, col2.getZ(i) * k3));

      }
    }

  moonMesh.matrixAutoUpdate = false; moonMesh.updateMatrix();
  moonMesh.frustumCulled = false;
  moonMesh.visible = false;
  scene.add(moonMesh);

  /* THE CHAINS: four bands of vast links, rising out of the silt, over the
     crown, and down the other side. Nobody says who set them. */
  const mdC = MD();
  const iron = [0.17, 0.18, 0.21], iron2 = [0.10, 0.11, 0.14];
  for (let b = 0; b < 3; b++) {
    const ba = b / 3 * Math.PI + 0.35;
    /* 112 links a band, not 40. At 40 the links sat ~16m apart while each was
       only ~5m across, so the band read as a row of floating grey rocks — the
       single worst thing about the first reveal. Now they overlap end to end
       and the eye joins them into one chain. */
    const N = 112;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const ang = -0.35 + t * (Math.PI + 0.7);
      const rr = R * 1.035;
      const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
      const lx = px * Math.cos(ba), lz = px * Math.sin(ba);

      // overlap end to end, so from any distance the band reads as CHAIN
      latheW(mdC, [[R * 0.042, 0], [R * 0.028, R * 0.040], [R * 0.042, R * 0.080]],

  moonChainMesh = mdMesh(mdC, new THREE.MeshBasicMaterial({ vertexColors: true }), false);
  moonChainMesh.position.copy(moonMesh.position);
  moonChainMesh.matrixAutoUpdate = false; moonChainMesh.updateMatrix();
  moonChainMesh.frustumCulled = false;
  moonChainMesh.visible = false;

  /* the silt bowl it lies in — built from seaHMesh, so the floor you see is
     the floor the field answers (nothing walks here; the pairing rule holds

  const mdS = MD();
  const STEP = 26;

    return mix3(silt, siltDeep, smoothstep(clamp(t * 1.25, 0, 1)));
  };
  for (let x = MOON_SITE.x - MOON_BOWL_R; x < MOON_SITE.x + MOON_BOWL_R; x += STEP) {
    for (let z = MOON_SITE.z - MOON_BOWL_R; z < MOON_SITE.z + MOON_BOWL_R; z += STEP) {

      const c00 = gc(x, z, y00).slice(), c01 = gc(x, z + STEP, y01).slice();

})();

/* ── the harbour gap's water, seen from the BAY side. The ocean grid owns
   the surface once the camera is west of the headland; this static patch
   owns it before that, at exactly the same height, so the swap is
   invisible and the two never draw on top of each other. ── */
let chanWaterMesh = null;
(function buildChannelWater() {
  const md = MD();
  const S = 4;
  for (let x = -114; x < -86; x += S) {
    for (let z = 0; z < 68; z += S) {
      const g4 = [chanHMesh(x, z), chanHMesh(x + S, z), chanHMesh(x, z + S), chanHMesh(x + S, z + S)];
      if (Math.min(g4[0], g4[1], g4[2], g4[3]) > WL + 0.3) continue;
      const c = [0.15, 0.37, 0.47];
      md.p.push(x, 0, z, x, 0, z + S, x + S, 0, z + S, x, 0, z, x + S, 0, z + S, x + S, 0, z);
      for (let i = 0; i < 6; i++) md.c.push(c[0], c[1], c[2]);
    }
  }
  chanWaterMesh = mdMesh(md, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.88, depthWrite: false,
  }), false);
  chanWaterMesh.renderOrder = 2;
  chanWaterMesh.position.y = WL - 0.05;
  chanWaterMesh.matrixAutoUpdate = false; chanWaterMesh.updateMatrix();
  chanWaterMesh.frustumCulled = false;
  chanWaterMesh.visible = false;
  scene.add(chanWaterMesh);
})();

/* ── the seam curtain: the bay sheet (2.2 m lattice) and the sea sheet
   (6 m) meet at x = −110 with different z-samples. A one-metre-stepped
   skirt hung on the higher of the two edges plugs every hairline. ── */
let seamMesh = null;
(function buildSeamSkirt() {
  const md = MD();
  const c = mix3(S_SEABED2, [0, 0, 0], 0.25);
  for (let z = -130; z < 210; z += 1) {
    const y0 = Math.max(chanHMesh(-110, z), seaHMesh(-110.001, z));
    const y1 = Math.max(chanHMesh(-110, z + 1), seaHMesh(-110.001, z + 1));
    md.p.push(-110, y0 + 0.05, z, -110, y1 + 0.05, z + 1, -110, y1 - 9, z + 1,
              -110, y0 + 0.05, z, -110, y1 - 9, z + 1, -110, y0 - 9, z);
    for (let i = 0; i < 6; i++) md.c.push(c[0], c[1], c[2]);
  }
  seamMesh = mdMesh(md, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }), false);
  seamMesh.matrixAutoUpdate = false; seamMesh.updateMatrix();
  seamMesh.frustumCulled = false;
  seamMesh.visible = false;
  scene.add(seamMesh);
})();
</script>
<script>
/* ═══════════ p6d/3 — THE HOURLESS ISLES: shores, towers, bells ═══════════
   An old bell-keeping culture rang the hours from tower to tower, the hour
   passing across the water like a wave. Silent for a year, because there
   are no hours any more. Bleached timber, verdigris bronze, salt-white
   stone, gull-streaked. ONE ground authority throughout: every walkable
   surface is either the seaHMesh sheet or a platform collider whose top IS
   the rendered deck. */

const S_ISAND = col(0xe2d3af), S_IWET = col(0xa2997f), S_ITURF = col(0xbab887),
      S_ITURF2 = col(0x98a271), S_IROCK = col(0x9d9a8f), S_IROCK2 = col(0x7b7a72),
      S_IDEEP = col(0x53625e);
const S_STONE = col(0xd5ccb6), S_STONE2 = col(0xb0a68e), S_STONE3 = col(0x8a8274),
      S_BRONZE = col(0x9c7c3e), S_BRONZE2 = col(0x6f5527), S_VERD = col(0x5f9c86),
      S_TIMB = col(0xa79576), S_TIMB2 = col(0x83725a), S_GUANO = col(0xe9e7dd),
      S_ROPE = col(0xbfae8a), S_SOOT = col(0x4a463f);

/* ── my own chunk tier: one merged mesh per island, culled by distance ── */
const seaChunks = [];
function seaChunk(id, x, z, r) {
  for (let i = 0; i < seaChunks.length; i++) if (seaChunks[i].id === id) return seaChunks[i].md;
  const c = { id, md: MD(), x, z, r2: r * r, mesh: null };
  seaChunks.push(c);
  return c.md;
}

/* ── island ground colour ── */
function isleColor(x, z, y) {
  const n = vnoise(x * 0.07, z * 0.07);
  const n2 = vnoise(x * 0.019 + 11, z * 0.019 - 4);
  if (y < WL - 0.9) { mix3(S_IDEEP, S_IWET, clamp((y - (WL - 5.5)) / 4.6, 0, 1), _gc); return _gc; }
  if (y < WL + 0.5) { mix3(S_IWET, S_ISAND, clamp((y - (WL - 0.9)) / 1.4, 0, 1), _gc); return _gc; }
  const sx = (seaHMesh(x + 2, z) - seaHMesh(x - 2, z)) / 4;
  const sz = (seaHMesh(x, z + 2) - seaHMesh(x, z - 2)) / 4;
  const slope = Math.hypot(sx, sz);
  /* sand → salt-bleached turf, patched by two noise octaves so no two
     facets read the same, and rock only where the ground really breaks */
  mix3(S_ISAND, S_ITURF, clamp((y - WL - 1.6) / 4.4 + n2 * 0.25, 0, 1), _gc);
  mix3(_gc, S_ITURF2, clamp(n * 0.5 + n2 * 0.45 + 0.4, 0, 1) * 0.5, _gc);
  const rockT = 0.52 + n * 0.22 + n2 * 0.16;
  if (slope > rockT) mix3(_gc, n > 0 ? S_IROCK : S_IROCK2, clamp((slope - rockT) / 0.55, 0, 0.85), _gc);
  return _gc;
}
/* The bay's bake drops to 56% brightness on any face turned more than ~35°
   from the sun, which is right for a cracked seabed and wrong for an island:
   a dome's whole lee turns one flat grey. The isles use a gentler four-step
   ramp of the same shape — the toon banding stays, the dead half-dome goes —
   plus a faint azimuth tint so no two slopes read identically. */
const _ic = [0, 0, 0];
function pushTriIsle(md, ax, ay, az, bx, by, bz, cx, cy, cz, cA, cB, cC) {
  const ux = bx - ax, uy = by - ay, uz = bz - az;
  const vx = cx - ax, vy = cy - ay, vz = cz - az;
  let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const l = Math.hypot(nx, ny, nz) || 1;
  nx /= l; ny /= l; nz /= l;
  const d = nx * SUNDIR[0] + ny * SUNDIR[1] + nz * SUNDIR[2];
  const k = d > 0.86 ? 1.05 : d > 0.68 ? 0.98 : d > 0.42 ? 0.9 : 0.82;
  const warm = 1 + nx * 0.035, cool = 1 - nz * 0.03;
  for (const c of [cA, cB, cC]) {
    _ic[0] = Math.min(1, c[0] * k * warm);
    _ic[1] = Math.min(1, c[1] * k);
    _ic[2] = Math.min(1, c[2] * k * cool);
    md.c.push(_ic[0], _ic[1], _ic[2]);
  }
  md.p.push(ax, ay, az, bx, by, bz, cx, cy, cz);
}

/* ── the shared sheet builder: the SAME lattice and fine-cell split the
   height field uses, so rendered == physics by construction ── */
function buildSeaSheet(md, x0, z0, x1, z1, keep) {
  const gcv = (x, z) => {
    const y = seaHMesh(x, z);
    const c = isleColor(x, z, y);
    return [c[0], c[1], c[2], y];
  };
  const cell = (x, z, s) => {
    const c00 = gcv(x, z), c10 = gcv(x + s, z), c01 = gcv(x, z + s), c11 = gcv(x + s, z + s);
    pushTriIsle(md, x, c00[3], z, x, c01[3], z + s, x + s, c11[3], z + s, c00, c01, c11);
    pushTriIsle(md, x, c00[3], z, x + s, c11[3], z + s, x + s, c10[3], z, c00, c11, c10);
  };
  const ax0 = SEA_X0 + Math.floor((x0 - SEA_X0) / SEA_STEP) * SEA_STEP;
  const az0 = SEA_Z0 + Math.floor((z0 - SEA_Z0) / SEA_STEP) * SEA_STEP;
  for (let x = ax0; x < x1; x += SEA_STEP) {
    for (let z = az0; z < z1; z += SEA_STEP) {
      if (keep && !keep(x + SEA_STEP / 2, z + SEA_STEP / 2)) continue;
      if (ISLE_FINE(x, z)) {
        const h = SEA_STEP / 2;
        cell(x, z, h); cell(x + h, z, h); cell(x, z + h, h); cell(x + h, z + h, h);
      } else cell(x, z, SEA_STEP);
    }
  }
}
for (const is of ISLE_LIST) {
  const R = is.r * 1.55;
  const md = seaChunk(is.id, is.x, is.z, R + 60);
  buildSeaSheet(md, is.x - R, is.z - R, is.x + R, is.z + R,
    (mx, mz) => Math.hypot(mx - is.x, mz - is.z) < R + SEA_STEP);
}
/* the chime reef's bar */
{
  const R = CHIME_REEF.r * 1.5;
  const md = seaChunk('reef', CHIME_REEF.x, CHIME_REEF.z, R + 60);
  buildSeaSheet(md, CHIME_REEF.x - R, CHIME_REEF.z - R, CHIME_REEF.x + R, CHIME_REEF.z + R,
    (mx, mz) => Math.hypot(mx - CHIME_REEF.x, mz - CHIME_REEF.z) < R + SEA_STEP);
}
/* Brightharbor's west headland and the harbour gap, seen from the water */
{
  const md = seaChunk('coast', -190, CHAN.z, 240);
  buildSeaSheet(md, -302, -196, -110, 266, null);
}

/* ── small shared kit ── */
function isleRock(md, x, z, r, h, seed) {
  const y = seaHMesh(x, z);
  latheW(md, [[r, 0], [r * 1.05, h * 0.45], [r * 0.6, h * 0.85], [0, h]],
    { seg: 6, ex: 0.8 + (hash2(seed, 3) * 0.5 + 0.5) * 0.5, x, y: y - 0.4, z, ry: seed * 1.7,
      flat: true, segJitter: 0.14, col: S_IROCK, cols: [S_IROCK2, S_IROCK, S_STONE2] });
}
/* a bell: hum-shaped bronze, a crown loop, a clapper. The shape reads BELL. */
function bellMesh(md, x, y, z, s, ry, tone2) {
  const c1 = tone2 ? S_VERD : S_BRONZE, c2 = tone2 ? S_BRONZE2 : S_BRONZE2;
  latheW(md, [[0.62 * s, 0], [0.66 * s, 0.1 * s], [0.5 * s, 0.5 * s], [0.34 * s, 0.95 * s],
              [0.36 * s, 1.05 * s], [0.14 * s, 1.15 * s], [0, 1.18 * s]],
    { seg: 9, x, y, z, ry, flat: true, col: c1, cols: [c2, c1, c1, c1, c2, c2] });
  latheW(md, [[0.1 * s, 1.18 * s], [0.08 * s, 1.34 * s], [0, 1.4 * s]],
    { seg: 5, x, y, z, ry, flat: true, col: c2 });
  latheW(md, [[0.07 * s, 0.12 * s], [0.1 * s, 0.02 * s], [0, -0.02 * s]],
    { seg: 5, x, y, z, ry, flat: true, col: S_BRONZE2 });   // the clapper's tongue
}
/* a timber A-frame headstock a bell hangs in */
function bellFrame(md, x, z, s, ry) {
  const y = seaHMesh(x, z);
  for (const sg of [-1, 1]) {
    boxW(md, { x: x + Math.cos(ry) * sg * 1.5 * s, y, z: z + Math.sin(ry) * sg * 1.5 * s,
      w: 0.22 * s, d: 0.22 * s, h: 2.5 * s, rz: -sg * 0.16, ry, col: S_TIMB, colB: S_TIMB2 });
  }
  boxW(md, { x, y: y + 2.4 * s, z, w: 1.7 * s, d: 0.2 * s, h: 0.22 * s, ry: ry + Math.PI / 2, col: S_TIMB2 });
}

/* ═══ WATCHSTONE — first landfall, a jetty, one silent tower ═══ */
const WATCH_TOWER = { x: WATCHSTONE.x + 16, z: WATCHSTONE.z - 22, r: 4.6 };
const WATCH_BELL = { x: WATCHSTONE.x + 2, z: WATCHSTONE.z + 4 };
const JETTY = { a: 0.62, len: 30, y: WL + 0.85, hw: 2.6 };
JETTY.rootX = WATCHSTONE.x + Math.cos(JETTY.a) * (WATCHSTONE.r * 0.82);
JETTY.rootZ = WATCHSTONE.z + Math.sin(JETTY.a) * (WATCHSTONE.r * 0.82);
JETTY.tipX = WATCHSTONE.x + Math.cos(JETTY.a) * (WATCHSTONE.r * 0.82 + JETTY.len);
JETTY.tipZ = WATCHSTONE.z + Math.sin(JETTY.a) * (WATCHSTONE.r * 0.82 + JETTY.len);
(function buildWatchstone() {
  const md = seaChunk('watch', WATCHSTONE.x, WATCHSTONE.z, 0);
  const rnd = mulberry32(9101);
  /* THE TOWER — salt-white drum, an arcaded belfry with nothing in it */
  {
    const x = WATCH_TOWER.x, z = WATCH_TOWER.z, y = seaHMesh(x, z);
    latheW(md, [[5.4, -1.2], [4.6, 0.6], [4.2, 15.0], [4.6, 16.2], [4.4, 17.0]],
      { seg: 11, x, y, z, flat: true, segJitter: 0.05, col: S_STONE, cols: [S_STONE2, S_STONE, S_STONE, S_STONE2] });
    // the belfry stage: four piers and a lintel ring — open arches, no bell
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU + 0.3;
      boxW(md, { x: x + Math.cos(a) * 3.7, y: y + 17.0, z: z + Math.sin(a) * 3.7,
        w: 0.62, d: 0.62, h: 4.6, ry: a, col: S_STONE, colB: S_STONE2 });
    }
    latheW(md, [[4.5, 21.6], [4.7, 22.2], [4.3, 22.6]], { seg: 11, x, y, z, flat: true, col: S_STONE2 });
    latheW(md, [[4.9, 22.6], [3.2, 25.4], [0, 27.4]], { seg: 11, x, y, z, flat: true, col: S_VERD, cols: [S_VERD, mix3(S_VERD, S_BRONZE2, 0.4)] });
    // a stair-less door at the foot, dark inside
    boxW(md, { x: x + Math.cos(2.4) * 4.5, y, z: z + Math.sin(2.4) * 4.5, w: 0.9, d: 0.3, h: 2.6, ry: 2.4, col: S_SOOT });
    addColl(x, z, 4.9);
    ISLE_SHADE.push({ x: x + 3.5, z: z + 4.5, r: 6.2 });
  }
  /* THE BELL — too great to hang, set in its cradle at the tower's foot,
     with the striking beam still roped and ready. This is the one you ring. */
  {
    const x = WATCH_BELL.x, z = WATCH_BELL.z, y = seaHMesh(x, z);
    bellFrame(md, x, z, 1.15, 0.9);
    // the stone cradle
    latheW(md, [[2.2, 0], [2.0, 0.5], [1.6, 0.62]], { seg: 9, x, y, z, flat: true, col: S_STONE2, cols: [S_STONE3, S_STONE2] });
    // THE BELL herself — too great to hang, set down in her cradle, verdigris
    // where the rain has run and bright bronze where hands have touched her
    bellMesh(md, x, y + 0.55, z, 1.45, 0.9, false);
    addColl(x, z, 1.9);
    // the striking beam, slung on ropes
    boxW(md, { x: x + 1.9, y: y + 1.5, z: z + 1.5, w: 0.16, d: 1.5, h: 0.16, ry: 0.9 + Math.PI / 2, col: S_TIMB2 });
  }
  /* THE JETTY — stone piers, a plank deck, bollards. Plat colliders' tops
     ARE the rendered deck: one surface, one truth. */
  {
    const n = 11;
    const ux = Math.cos(JETTY.a), uz = Math.sin(JETTY.a);
    const px = -uz, pz = ux;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const x = lerp(JETTY.rootX, JETTY.tipX, t), z = lerp(JETTY.rootZ, JETTY.tipZ, t);
      const gy = seaHMesh(x, z);
      // pier legs down to the bed
      if (i % 2 === 0) {
        for (const sg of [-1, 1]) {
          boxW(md, { x: x + px * sg * (JETTY.hw - 0.5), y: gy - 0.3, z: z + pz * sg * (JETTY.hw - 0.5),
            w: 0.34, d: 0.34, h: JETTY.y - gy + 0.3, ry: JETTY.a, col: S_STONE3, colB: S_STONE3 });
        }
      }
      // deck plank band
      boxW(md, { x, y: JETTY.y - 0.22, z, w: JETTY.hw, d: (JETTY.len / n) * 0.55, h: 0.22,
        ry: JETTY.a + Math.PI / 2, col: i % 2 ? S_TIMB : S_TIMB2 });
      const cc = addColl(x, z, JETTY.hw * 0.92, JETTY.y);
      cc.plat = true;
    }
    // bollards + a coil of rope at the tip
    for (const sg of [-1, 1]) {
      const bx = JETTY.tipX + px * sg * (JETTY.hw - 0.6), bz = JETTY.tipZ + pz * sg * (JETTY.hw - 0.6);
      latheW(md, [[0.24, JETTY.y], [0.3, JETTY.y + 0.5], [0.22, JETTY.y + 0.62]], { seg: 6, x: bx, y: 0, z: bz, flat: true, col: S_TIMB2 });
    }
    latheW(md, [[0.5, JETTY.y], [0.55, JETTY.y + 0.16], [0.3, JETTY.y + 0.2]],
      { seg: 8, x: JETTY.tipX - ux * 2.4, y: 0, z: JETTY.tipZ - uz * 2.4, flat: true, col: S_ROPE });
  }
  /* dressing: crates, a drying rack with no fish, wind-bent rocks */
  for (let i = 0; i < 7; i++) {
    const a = rnd() * TAU, d = WATCHSTONE.r * (0.25 + rnd() * 0.6);
    isleRock(md, WATCHSTONE.x + Math.cos(a) * d, WATCHSTONE.z + Math.sin(a) * d, 1.1 + rnd() * 1.6, 1.4 + rnd() * 2.2, i * 3 + 1);
  }
  for (let i = 0; i < 3; i++) {
    const x = JETTY.rootX - 5 + i * 2.4, z = JETTY.rootZ + 4 + (i % 2) * 1.6;
    const y = seaHMesh(x, z);
    boxW(md, { x, y, z, w: 0.55, d: 0.55, h: 0.9, ry: rnd() * 3, col: S_TIMB, colB: S_TIMB2 });
    addColl(x, z, 0.6);
  }
  pushIsleAnchor(WATCHSTONE, JETTY.tipX + Math.cos(JETTY.a + 1.4) * 4.2, JETTY.tipZ + Math.sin(JETTY.a + 1.4) * 4.2,
    WATCH_TOWER.x + 3.5, WATCH_TOWER.z + 4.5);
})();

})();
window.__foundryDoor = { x: FOUNDRY_DOOR.x, z: FOUNDRY_DOOR.z, facing: Math.PI, get y() { return groundH(FOUNDRY_DOOR.x, FOUNDRY_DOOR.z); } };

/* ═══ THE DROWNED SPIRE — sail in through the broken arch ═══ */
const SPIRE_LEDGE = { x: DROWNED_SPIRE.x - 4.2, z: DROWNED_SPIRE.z - 2.6, r: 3.0, y: WL + 0.55 };
(function buildSpire() {
  const md = seaChunk('spire', DROWNED_SPIRE.x, DROWNED_SPIRE.z, 0);
  const x = DROWNED_SPIRE.x, z = DROWNED_SPIRE.z;
  const R0 = SPIRE_WALL.r0, R1 = SPIRE_WALL.r1;
  const base = WL - 3.4, lip = WL + 7.6;
  // the shell, built as a ring of stone segments with the arch left OUT —
  // the same arc the solid test opens
  const seg = 26;
  for (let i = 0; i < seg; i++) {
    const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
    const am = (a0 + a1) / 2;
    if (spireArchOpen(am)) continue;
    const rm = (R0 + R1) / 2, w = (R1 - R0) / 2;
    const cx = x + Math.cos(am) * rm, cz = z + Math.sin(am) * rm;
    const hh = lip - base - (Math.abs(((am - SPIRE_WALL.archA + Math.PI * 3) % TAU) - Math.PI) < 0.75 ? 2.6 : 0);
    boxW(md, { x: cx, y: base, z: cz, w: w, d: rm * TAU / seg * 0.62, h: hh,
      ry: am + Math.PI / 2, col: i % 2 ? S_STONE : S_STONE2, colB: S_STONE3 });
  }
  // the bell-lip cornice, and the belfry arcade stubs above the water
  latheW(md, [[R1 + 0.4, lip], [R1 + 0.7, lip + 0.7], [R1, lip + 1.0]],
    { seg: 14, x, y: 0, z, flat: true, col: S_STONE2, cols: [S_STONE3, S_STONE2] });
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU + 0.2;
    if (spireArchOpen(a)) continue;
    boxW(md, { x: x + Math.cos(a) * (R0 + R1) / 2, y: lip + 1.0, z: z + Math.sin(a) * (R0 + R1) / 2,
      w: 0.5, d: 0.5, h: 2.4, ry: a, col: S_STONE });
  }
  // THE LEDGE inside: a fallen floor slab you can step out onto
  {
    const lx = SPIRE_LEDGE.x, lz = SPIRE_LEDGE.z;
    latheW(md, [[SPIRE_LEDGE.r + 0.4, WL - 1.4], [SPIRE_LEDGE.r + 0.2, SPIRE_LEDGE.y - 0.25],
                [SPIRE_LEDGE.r, SPIRE_LEDGE.y]], { seg: 9, x: lx, y: 0, z: lz, flat: true, col: S_STONE2, cols: [S_STONE3, S_STONE2, S_STONE] });
    const cc = addColl(lx, lz, SPIRE_LEDGE.r * 0.92, SPIRE_LEDGE.y);
    cc.plat = true;
    // the spire's own bell, down off its headstock, half in the water
    bellMesh(md, lx + 1.8, SPIRE_LEDGE.y - 0.2, lz + 1.6, 1.5, 0.7, true);
  }
  ISLE_SHADE.push({ x, z, r: R0 + 0.6 });
  pushIsleAnchor(DROWNED_SPIRE, x + Math.cos(SPIRE_WALL.archA) * 15, z + Math.sin(SPIRE_WALL.archA) * 15,
    SPIRE_LEDGE.x, SPIRE_LEDGE.z);
  // a couple of rocks outside, breaking the swell
  isleRock(md, x + 14, z + 11, 2.6, 3.2, 7);
  isleRock(md, x - 13, z + 15, 2.0, 2.4, 11);
})();

/* ═══ NETMENDER'S ROCK — the Bellwright's ═══ */
const NETMEND_HUT = { x: NETMENDER.x + 2, z: NETMENDER.z + 3 };
const BELLWRIGHT_POS = { x: NETMENDER.x + 4.6, z: NETMENDER.z + 6.2 };
(function buildNetmender() {
  const md = seaChunk('net', NETMENDER.x, NETMENDER.z, 0);
  const rnd = mulberry32(77);
  const x = NETMEND_HUT.x, z = NETMEND_HUT.z, y = seaHMesh(x, z);
  // a lean-to of bleached timber and net
  for (const sg of [-1, 1]) {
    boxW(md, { x: x + sg * 2.4, y, z: z - 1.8, w: 0.18, d: 0.18, h: 2.6, col: S_TIMB2 });
    boxW(md, { x: x + sg * 2.4, y, z: z + 1.8, w: 0.18, d: 0.18, h: 1.7, col: S_TIMB2 });
  }
  boxW(md, { x, y: y + 1.7, z: z + 0.4, w: 2.7, d: 2.3, h: 0.22, shz: 0, rx: -0.32, col: S_TIMB, colB: S_TIMB2 });
  // the workbench with a bell part-oiled on it
  boxW(md, { x: x - 0.4, y, z: z + 0.6, w: 1.3, d: 0.6, h: 0.85, col: S_TIMB, colB: S_TIMB2 });
  bellMesh(md, x - 0.4, y + 0.85, z + 0.6, 0.7, 0.4, false);
  addColl(x, z, 1.6);
  // oil jars, rope coils, a whetstone
  for (let i = 0; i < 4; i++) {
    const jx = x + 2.2 + rnd() * 2, jz = z + 1.4 + rnd() * 2.4;
    latheW(md, [[0.24, 0], [0.3, 0.3], [0.14, 0.5], [0.18, 0.56]], { seg: 6, x: jx, y: seaHMesh(jx, jz), z: jz, flat: true, col: mix3(S_BRONZE2, S_TIMB, 0.4) });
  }
  latheW(md, [[0.55, 0], [0.6, 0.18], [0.32, 0.22]], { seg: 8, x: x - 2.6, y: seaHMesh(x - 2.6, z + 1.4), z: z + 1.4, flat: true, col: S_ROPE });
  for (let i = 0; i < 5; i++) {
    const a = rnd() * TAU, d = NETMENDER.r * (0.4 + rnd() * 0.5);
    isleRock(md, NETMENDER.x + Math.cos(a) * d, NETMENDER.z + Math.sin(a) * d, 1.0 + rnd() * 1.4, 1.2 + rnd() * 1.8, i * 7 + 3);
  }

})();

/* ═══ GANNET STACK — the gull road, and a chest on the crown ═══ */
(function buildGannet() {
  const md = seaChunk('gannet', GANNET_STACK.x, GANNET_STACK.z, 0);
  const rnd = mulberry32(313);
  // guano-streaked ledges around the stack
  for (let i = 0; i < 10; i++) {
    const a = rnd() * TAU, d = GANNET_STACK.r * (0.45 + rnd() * 0.5);
    const x = GANNET_STACK.x + Math.cos(a) * d, z = GANNET_STACK.z + Math.sin(a) * d;
    const y = seaHMesh(x, z);
    if (y < WL + 0.4) continue;
    latheW(md, [[1.6 + rnd(), 0], [1.3, 0.5], [0, 0.62]], { seg: 6, ex: 0.7, x, y, z, ry: rnd() * 3,
      flat: true, col: i % 3 ? S_IROCK : S_GUANO, cols: [S_IROCK2, i % 2 ? S_GUANO : S_IROCK] });
  }
  // wind-scoured spires on the crown
  for (let i = 0; i < 4; i++) {

    isleRock(md, GANNET_STACK.x + Math.cos(a) * d, GANNET_STACK.z + Math.sin(a) * d, 1.4 + rnd() * 1.2, 3.5 + rnd() * 4, i * 9 + 5);
  }
  ISLE_SHADE.push({ x: GANNET_STACK.x + 4, z: GANNET_STACK.z + 5, r: 4.4 });
  const ax = GANNET_STACK.x + Math.cos(GANNET_STACK.ramp) * (GANNET_STACK.r + 16);
  const az = GANNET_STACK.z + Math.sin(GANNET_STACK.ramp) * (GANNET_STACK.r + 16);
  pushIsleAnchor(GANNET_STACK, ax, az,
    GANNET_STACK.x + Math.cos(GANNET_STACK.ramp) * GANNET_STACK.r * 0.55,
    GANNET_STACK.z + Math.sin(GANNET_STACK.ramp) * GANNET_STACK.r * 0.55);
})();

/* ═══ THE LONG STRAND — beach, salt seams, and a heart container ═══ */
(function buildStrand() {
  const md = seaChunk('strand', LONG_STRAND.x, LONG_STRAND.z, 0);
  const rnd = mulberry32(5150);
  // driftwood: whole trunks the sea carried a very long way
  for (let i = 0; i < 9; i++) {
    const a = rnd() * TAU, d = LONG_STRAND.r * (0.55 + rnd() * 0.42);
    const x = LONG_STRAND.x + Math.cos(a) * d, z = LONG_STRAND.z + Math.sin(a) * d;
    const y = seaHMesh(x, z);
    if (y < WL + 0.1) continue;
    boxW(md, { x, y: y + 0.25, z, w: 0.34, d: 2.6 + rnd() * 3, h: 0.5, tw: 0.2, td: 2.2,
      ry: rnd() * TAU, rz: 0.1, col: S_TIMB, colB: S_TIMB2, warm: true });
    addColl(x, z, 1.0);
  }
  // the salt seams: crusted white rock shelves
  for (let i = 0; i < 5; i++) {
    const a = 1.1 + i * 0.5, d = LONG_STRAND.r * 0.42;
    const x = LONG_STRAND.x + Math.cos(a) * d, z = LONG_STRAND.z + Math.sin(a) * d;
    const y = seaHMesh(x, z);
    latheW(md, [[2.6, 0], [2.3, 0.5], [1.2, 0.66]], { seg: 7, ex: 0.7, x, y, z, ry: a, flat: true, col: C_SALT, cols: [S_STONE2, C_SALT] });
    addColl(x, z, 2.2);
  }
  // the driftwood arch over the dune chest
  {
    const x = LONG_STRAND.x - 12, z = LONG_STRAND.z - 16, y = seaHMesh(x, z);
    for (const sg of [-1, 1]) {
      boxW(md, { x: x + sg * 1.6, y, z, w: 0.26, d: 0.26, h: 2.6, rz: -sg * 0.22, col: S_TIMB2, warm: true });

    isleRock(md, LONG_STRAND.x + Math.cos(a) * d, LONG_STRAND.z + Math.sin(a) * d, 0.9 + rnd() * 1.5, 1.0 + rnd() * 1.6, i * 11 + 7);
  }
  pushIsleAnchor(LONG_STRAND, LONG_STRAND.x + LONG_STRAND.r + 20, LONG_STRAND.z + 30, LONG_STRAND.x - 12, LONG_STRAND.z - 16);

/* ═══ CHIME REEF — half-drowned bells that ring in the swell ═══ */
const REEF_BELLS = [];
(function buildReef() {
  const md = seaChunk('reef', CHIME_REEF.x, CHIME_REEF.z, 0);
  const rnd = mulberry32(1212);
  for (let i = 0; i < REEF_HEADS.length; i++) {
    const rh = REEF_HEADS[i];
    isleRock(md, rh.x, rh.z, rh.r * 0.8, Math.max(0.6, rh.h - seaHMesh(rh.x, rh.z)) + 0.4, i * 13 + 2);
    // a bell, tilted, hung in a broken frame beside the rock
    const a = rnd() * TAU;
    const bx = rh.x + Math.cos(a) * (rh.r + 2.4), bz = rh.z + Math.sin(a) * (rh.r + 2.4);
    const by = WL - 0.35 + rnd() * 0.9;
    const g = new THREE.Group();
    const mdB = MD();
    bellMesh(mdB, 0, 0, 0, 1.3 + rnd() * 0.7, 0, i % 2 === 0);
    // the broken headstock it still hangs from
    boxW(mdB, { x: 0, y: 1.5, z: 0, w: 0.14, d: 1.5, h: 0.14, ry: rnd() * 3, col: S_TIMB2 });
    const m = mdMesh(mdB, WORLD_MAT, false);
    m.frustumCulled = false;
    g.add(m);
    g.position.set(bx, by, bz);
    g.rotation.z = (rnd() - 0.5) * 0.5;
    g.visible = false;
    scene.add(g);
    REEF_BELLS.push({ g, x: bx, z: bz, y: by, tone: 0.6 + i * 0.19, ph: rnd() * TAU, rang: 0 });
  }
})();

/* ── scrub: salt-burnt tussocks, shell grit and low thorn, scattered by the
   SAME height field the ground uses, so nothing floats ── */
(function isleScrub() {
  for (const is of ISLE_LIST) {
    if (is.id === 'spire') continue;
    const md = seaChunk(is.id, is.x, is.z, 0);
    const rnd = mulberry32(is.seed * 1000 + 17);
    const n = Math.round(is.r * 1.5);
    const C_TUSS = mix3(S_ITURF, S_ISAND, 0.25), C_TUSS2 = mix3(S_ITURF2, [0, 0, 0], 0.12);
    for (let i = 0; i < n; i++) {
      const a = rnd() * TAU, dd = is.r * Math.sqrt(rnd()) * 0.96;
      const x = is.x + Math.cos(a) * dd, z = is.z + Math.sin(a) * dd;
      const y = seaHMesh(x, z);
      if (y < WL + 1.1) continue;
      const t = rnd();
      if (t < 0.62) {
        // a tussock: three blades from one root
        for (let b = 0; b < 3; b++) {
          const ba = rnd() * TAU;
          boxW(md, { x, y: y - 0.05, z, w: 0.05, d: 0.05, h: 0.35 + rnd() * 0.4,
            tw: 0.008, td: 0.008, rx: Math.cos(ba) * 0.4, rz: Math.sin(ba) * 0.4,
            warm: true, col: b % 2 ? C_TUSS : C_TUSS2 });
        }
      } else if (t < 0.86) {
        // shell grit / small stones
        latheW(md, [[0.12 + rnd() * 0.16, 0], [0.1, 0.07 + rnd() * 0.08], [0, 0.1]],
          { seg: 5, x, y: y - 0.03, z, ry: rnd() * TAU, flat: true, col: rnd() < 0.5 ? S_ISAND : S_IROCK });
      } else {
        // a wind-flattened thorn
        latheW(md, [[0.5 + rnd() * 0.4, 0.3], [0.34, 0.55], [0, 0.62]],
          { seg: 5, ex: 0.55, x, y, z, ry: rnd() * TAU, flat: true, warm: true,
            col: C_TUSS2, cols: [C_TUSS2, C_TUSS] });
      }
    }
  }
})();

/* ── finalise every isle chunk into one mesh apiece ── */
for (const c of seaChunks) {
  if (!c.md.p.length) { c.md = null; continue; }
  c.mesh = mdMesh(c.md, WORLD_MAT, false);
  c.mesh.matrixAutoUpdate = false; c.mesh.updateMatrix();
  c.mesh.visible = false;
  scene.add(c.mesh);
  c.md = null;
}

<script>

const SEAFX = { heave: 0, pitch: 0, roll: 0, deckY: 0 };

  const fx = Math.sin(BOAT.ang), fz = Math.cos(BOAT.ang);

  SEAFX.pitch = Math.atan2(hB - hS, f * 2) * 0.85;

    keelItem.visible = true;
    keelItem.scale.setScalar(1);
    keelItem.position.set(KEEL_SPOT.x, WL + 0.3 + k * 0.5, KEEL_SPOT.z);
    keelItem.rotation.set(0, 0.8, 0.1 - k * 0.3);
    return;
  }
  if (!P.sailing) return;
  /* ride the deck: heave, pitch and roll under his feet */
  const fx = Math.sin(BOAT.ang), fz = Math.cos(BOAT.ang);
  const ox = BATK.on ? 0.15 : -0.45;
  c.root.position.set(BOAT.x + fx * ox - fz * (BATK.on ? 0.42 : 0),
    SEAFX.deckY + 0.72 + SEAFX.pitch * ox, BOAT.z + fz * ox + fx * (BATK.on ? 0.42 : 0));
  c.root.rotation.set(SEAFX.pitch * 0.7, BOAT.ang, SEAFX.roll * 0.6);
  if (BATK.on) {
    /* THE BRACED BOAT STANCE — half-risen off the thwart, one foot on the
       gunwale, the same swing carried out over the water. Never capsizes. */
    const ph = 1 - BATK.t / BATK.total;
    poseHumanoid(c, 'idle', dtv, 0, { armsOverride: true, wind: 0.8 });
    c.pelvis.position.y = (c.pelvis.userData.y0 !== undefined ? c.pelvis.userData.y0 : 0) - 0.1;
    c.hipL.rotation.x = -0.62; c.kneeL.rotation.x = 0.66;
    c.hipR.rotation.x = 0.26; c.kneeR.rotation.x = 0.3;
    c.torso.rotation.x = 0.16;
    poseAttack(c, BATK.n, ph);
    swordToHand(true);
    updateTrail(ph);
  }
};

/* ═══ the render frame: visibility, the sea, the creatures, the fog ═══ */
const FOGS = { col: col(0xd6dee2), near: 250, far: 1500 };
const FOG_CLEAR = { col: col(0x7fb0bb), near: 520, far: 2200 };
let seaFogT = 0, seaClockR = performance.now(), seaDbgDone = false;
const _n2CullChunks = cullChunks;
cullChunks = function (ccx, ccz) {
  _n2CullChunks(ccx, ccz);
  const now = performance.now();
  const dtv = Math.min(0.1, (now - seaClockR) / 1000);
  seaClockR = now;
  const near2 = (x, z, r) => { const dx = x - ccx, dz = z - ccz; return dx * dx + dz * dz < r * r; };
  const west = ccx < -60;
  /* the isles' chunks */
  for (let i = 0; i < seaChunks.length; i++) {
    const c = seaChunks[i];
    if (!c.mesh) continue;
    const R = c.id === 'camp' ? 1600 : c.id === 'kiln' ? 720 : c.id === 'coast' ? 460 : 640;
    c.mesh.visible = west && near2(c.x, c.z, R);
  }
  seamMesh.visible = west && near2(-110, CHAN.z, 300);
  farSeaMesh.visible = flooded() && ccx < 40;
  /* THE SWELL GRID — written in place, only where there is open sea to see.
     West of the headland it owns the surface; inside the bay, the bay's own
     plane does, and the harbour gap gets its static patch. */
  const gridOn = flooded() && ccx < -78;
  waveMesh.visible = gridOn;
  if (gridOn) updateWaveGrid();
  chanWaterMesh.visible = flooded() && ccx < 60;
    /* it owns the trench UNCONDITIONALLY: hiding it while the swell grid was
       on left the dredged channel as a bare grey seabed whenever the camera
       sat west of -78 — sailing home crossed a waterless trench (the code
       reviewer predicted this from the sheet conditions; John photographed
       it an hour later). It sits a hair lower so the bay plane never
       coplanar-fights it at the mouth. */
  /* THE DROWNED MOON: only ever seen from above it */
  const dMoon = Math.hypot(ccx - MOON_SITE.x, ccz - MOON_SITE.z);
  const moonVis = west && dMoon < 900;
  moonMesh.visible = moonVis; moonChainMesh.visible = moonVis;
  moonSiltMesh.visible = west && dMoon < MOON_BOWL_R + 320;
  /* the chime reef: bells that ring in the swell — the sound of the place */
  for (let i = 0; i < REEF_BELLS.length; i++) {
    const b = REEF_BELLS[i];
    const vis = west && near2(b.x, b.z, 220);
    b.g.visible = vis;
    if (!vis) continue;
    const h = swellAt(b.x, b.z);
    b.g.position.y = b.y + h * 0.55;
    b.g.rotation.z = Math.sin(seaClock * 1.4 + b.ph) * 0.16 + h * 0.09;
    b.rang -= dtv;
    if (h > 0.45 && b.rang <= 0 && near2(b.x, b.z, 150)) {
      b.rang = 2.2 + Math.random() * 2.4;
      const d = Math.hypot(ccx - b.x, ccz - b.z);
      SFX.bellIsle(b.tone, clamp(1 - d / 150, 0.08, 0.55));
    }
  }
  /* chests, salt, the Bellwright */
  spireChest.group.visible = west && near2(spireChest.x, spireChest.z, 90);
  gannetChest.group.visible = west && near2(gannetChest.x, gannetChest.z, 90);
  strandChest.group.visible = west && near2(strandChest.x, strandChest.z, 90);
  for (const s of iSalt) {
    if (s.got) { s.mesh.visible = false; continue; }
    const sv = west && near2(s.x, s.z, 38);
    s.mesh.visible = sv;
    if (sv) {
      s.mesh.position.y = s.baseY + 0.15 + Math.sin(now / 420 + s.ph * 4) * 0.09;
      s.mesh.rotation.y += dtv * 1.7;
      if (!LOWFX && Math.random() < 0.05) {
        psSparkle.spawn(s.x + (Math.random() - 0.5) * 0.5, s.mesh.position.y + 0.3, s.z + (Math.random() - 0.5) * 0.5, 0, 0.45, 0, 0.7);
      }
    }
  }
  bellwright.char.root.visible = west && near2(bellwright.x, bellwright.z, 40);
  /* the boat on the swell, and her keel under her */
  poseBoatOnSwell(now);
  if (sailboat.group.visible && refitDone()) {
    sail2.scale.y += (((P.sailing && BOAT.sailK > 0.5) ? 1 : 0.12) - sail2.scale.y) * Math.min(1, dtv * 3);
  }
  /* the keel timber, waiting on the wreck */
  if (!P.carryKeel && state !== 'cine') {
    const waiting = !!(SAVE && !SAVE.keelFound && flooded());
    keelItem.visible = waiting && near2(KEEL_SPOT.x, KEEL_SPOT.z, 70);
    if (keelItem.visible) {
      keelItem.scale.setScalar(1);
      keelItem.position.set(KEEL_SPOT.x, WL + 0.34, KEEL_SPOT.z);
      keelItem.rotation.set(0, 0.8, 0.1);
    }
  }
  /* SUN GULLS */
  for (let i = 0; i < GULLS.length; i++) {
    const g = GULLS[i];
    const vis = !g.dead && west && near2(g.x, g.z, 90);
    g.m.root.visible = vis;
    if (!vis) continue;
    g.m.root.position.set(g.x, g.y, g.z);
    g.m.root.rotation.y = g.face;
    const flap = g.st === 'dive' ? 0.1 : Math.sin(now / (g.st === 'tele' ? 90 : 210) + g.ph) * (g.st === 'tele' ? 0.9 : 0.55);
    g.m.wingL.rotation.z = flap; g.m.wingR.rotation.z = -flap;
    g.m.root.rotation.x = g.st === 'dive' ? 0.7 : g.st === 'tele' ? -0.6 : 0;
    g.m.glow.material.opacity = g.st === 'tele' ? 0.55 + 0.45 * Math.sin(now / 60) : 0.85;
  }
  /* REEF GAR: the wake is the contract */
  for (let i = 0; i < GARS.length; i++) {
    const g = GARS[i];
    const live = !g.cured && west && near2(g.x, g.z, 110) && flooded();
    const wakeOn = live && (g.st === 'cruise' || g.st === 'run' || g.st === 'breach');
    g.c.wakeRoot.visible = wakeOn;
    if (wakeOn) {
      g.c.wakeRoot.position.set(g.x, WL + 0.06 + swellAt(g.x, g.z), g.z);
      g.c.wakeRoot.rotation.y = g.ang;
      if (g.st === 'run' && !LOWFX && Math.random() < 0.35) {
        psSpray.spawn(g.x, WL + 0.2, g.z, (Math.random() - 0.5), 0.9, (Math.random() - 0.5), 0.4);
      }
    }
    const bodyOn = live && g.st === 'breach';
    g.c.root.visible = bodyOn || (g.cured && g.st === 'dive' && west && near2(g.x, g.z, 110));
    if (g.c.root.visible) {
      const by = g.st === 'breach' ? g.breachY : WL - 0.4;
      g.c.root.position.set(g.x, by, g.z);
      g.c.root.rotation.set(g.st === 'breach' ? Math.cos(clamp(g.t / 1.15, 0, 1) * Math.PI) * 0.8 : -0.5, g.ang, Math.sin(now / 120) * 0.12);
    }
  }
  /* clapper crabs: they CLANG as they walk, and their bell rings when hit */
  for (let i = 0; i < CLAPPERS.length; i++) {
    const cr = CLAPPERS[i];
    if (cr.dead || !cr.c.root.visible) continue;
    cr.clangT -= dtv;
    const moving = cr.st === 'patrol' || cr.st === 'aggro' || cr.st === 'stagger';
    if (moving && cr.clangT <= 0) {
      cr.clangT = cr.st === 'aggro' ? 0.34 : 0.62;
      const d = Math.hypot(ccx - cr.x, ccz - cr.z);
      if (d < 34) SFX.clang();
    }
    if (cr.ring > 0) {
      cr.ring -= dtv;
      cr.bell.rotation.z = Math.sin(now / 28) * 0.3 * clamp(cr.ring / 0.45, 0, 1);
    } else cr.bell.rotation.z *= 0.9;
  }
  /* the ocean's own voice */
  if (west && flooded() && state === 'play' && (simTick % 150) === 0) {
    SFX.wash(clamp(Math.abs(SEAFX.heave) * 0.7 + (P.sailing ? BOAT.spd / 12 : 0.2), 0.1, 1));
  }
  /* fog: a long pale sea haze — and it goes CLEAR over the moon */
  const wantSea = west ? 1 : 0;
  seaFogT += (wantSea - seaFogT) * Math.min(1, dtv * 1.6);
  if (seaFogT > 0.004) {
    const cl = CROSS.fog;
    const tn = lerp(FOGS.near, FOG_CLEAR.near, cl), tf = lerp(FOGS.far, FOG_CLEAR.far, cl);
    scene.fog.near = lerp(scene.fog.near, tn, seaFogT);
    scene.fog.far = lerp(scene.fog.far, tf, seaFogT);
    const fc = scene.fog.color;
    const cc = mix3(FOGS.col, FOG_CLEAR.col, cl);
    fc.setRGB(lerp(fc.r, cc[0], seaFogT), lerp(fc.g, cc[1], seaFogT), lerp(fc.b, cc[2], seaFogT));
  }
  extendSeaDebugOnce();
};

/* ═══ THE ONE DERIVATION — every phase-3 fact flows from the save, BOTH
   ways. A NEW GAME un-refits the boat, un-sees the moon, closes every
   chest, re-hangs the keel on the wreck and silences Watchstone. ═══ */
window.__worldStateHooks.push(function (S) {
  const refit = !!S.boatRefit;
  showRefit(refit);
  mast2.scale.set(1, 1, 1);
  sail2.scale.y = 0.12;
  P.carryKeel = !!S.keelCarried && !refit;
  for (const c of keelDeck) c.off = !(S.sky >= 2);
  keelItem.visible = false;
  keelItem.scale.setScalar(1);
  keelItem.rotation.set(0, 0.8, 0.1);
  keelItem.position.set(KEEL_SPOT.x, WL + 0.34, KEEL_SPOT.z);
  spireChest.opened = !!S.spireChest;
  spireChest.lid.rotation.x = S.spireChest ? -1.9 : 0;
  gannetChest.opened = !!S.gannetChest;
  gannetChest.lid.rotation.x = S.gannetChest ? -1.9 : 0;
  strandChest.opened = !!S.strandHeart;
  strandChest.lid.rotation.x = S.strandHeart ? -1.9 : 0;
  strandChest.heart.visible = false;
  iChestAnims.length = 0; strandAnimT = -1; strandHeartT = -1;
  for (const s of iSalt) { s.got = false; s.chimed = false; s.mesh.visible = false; }
  for (const g of GULLS) {
    g.dead = false; g.st = 'wheel'; g.t = Math.random() * 3; g.cd = 0;
    g.x = g.sx; g.z = g.sz; g.y = Math.max(seaHMesh(g.x, g.z), WL) + 11;
    g.m.root.visible = false; g.m.root.scale.setScalar(1);
  }
  for (const g of GARS) {
    g.cured = false; g.hp = 2; g.st = 'cruise'; g.t = Math.random() * 4;
    g.x = g.sx; g.z = g.sz;
    g.c.root.visible = false; g.c.wakeRoot.visible = false;
  }
  gullsPopped = 0; garsCured = 0; garRams = 0;
  SET.on = false; SET.warned = false; SET.hit = false; SET.spillT = 0;
  SET.next = 12 + Math.random() * 10;
  SET.passes = 0; SET.stalls = 0; SET.keeps = 0;
  BATK.on = false; BATK.n = 0; BATK.cool = 0;
  waterClarity = 0; CROSS.on = false; CROSS.fog = 0;
  isleSeen = {}; lastIsleAnchor = -1; outerCd = 0; landfallCd = 0;
  if (REFIT.finnHome) {
    finn.x = REFIT.finnHome.x; finn.z = REFIT.finnHome.z;
    finn.baseY = groundH(finn.x, finn.z);
    finn.char.root.position.set(finn.x, finn.baseY, finn.z);
    finn.char.root.rotation.y = REFIT.finnHome.ry;
    REFIT.finnHome = null;
  }
});

/* ── telemetry: everything a harness needs to assert the crossing ── */
window.__telemetryHooks.push(function (T) {
  const west = P.x < -96;
  T.seaRegion = west ? (ashoreOnIsle(P.x, P.z) ? 'isles' : 'sea') : 'bay';
  T.atSea = west;
  T.isleHere = (() => { const is = isleAt(P.x, P.z); return is ? is.id : null; })();
  T.swellH = Math.round(swellAt(P.x, P.z) * 1000) / 1000;
  T.swellAmp = Math.round(swellAmpAt(P.x, P.z) * 100) / 100;
  T.boatHeave = Math.round(SEAFX.heave * 1000) / 1000;
  T.boatPitch = Math.round(SEAFX.pitch * 1000) / 1000;
  T.boatRoll = Math.round(SEAFX.roll * 1000) / 1000;
  T.sailCount = refitDone() ? 2 : 1;
  T.boatRefit = refitDone();
  T.keelFound = !!(SAVE && SAVE.keelFound);
  T.keelCarried = !!P.carryKeel;
  T.moonSeen = !!(SAVE && SAVE.moonSeen);
  T.moonVis = moonMesh.visible;
  T.waterClarity = Math.round(waterClarity * 100) / 100;
  T.isleLandfall = !!(SAVE && SAVE.isleLandfall);
  T.watchBell = !!(SAVE && SAVE.watchBell);
  T.foundrySealed = window.__foundrySealed();
  T.bellwrightTalked = SAVE ? (SAVE.bellwrightTalked || 0) : 0;
  T.spireChest = spireChest.opened;
  T.gannetChest = gannetChest.opened;
  T.strandHeart = strandChest.opened;
  T.iSaltGot = iSalt.filter(s => s.got).length;
  T.gullsAlive = GULLS.filter(g => !g.dead).length;
  T.gullsPopped = gullsPopped;
  T.garsAlive = GARS.filter(g => !g.cured).length;
  T.garsCured = garsCured; T.garRams = garRams;
  let gd = 999, gst = '', gv = false;
  for (const g of GARS) {
    if (g.cured) continue;
    const d = Math.hypot(P.x - g.x, P.z - g.z);
    if (d < gd) { gd = d; gst = g.st; gv = g.c.wakeRoot.visible; }
  }
  T.nearGarDist = gd; T.nearGarState = gst; T.nearGarWakeVis = gv;
  let hd = 999, hst = '';
  for (const g of GULLS) {
    if (g.dead) continue;
    const d = Math.hypot(P.x - g.x, P.z - g.z);
    if (d < hd) { hd = d; hst = g.st; }
  }
  T.nearGullDist = hd; T.nearGullState = hst;
  T.setOn = SET.on; T.setU = Math.round(SET.u * 10) / 10; T.setAmp = SET.amp;
  T.setWarned = SET.warned; T.setPasses = SET.passes;
  T.setStalls = SET.stalls; T.setKeeps = SET.keeps; T.setSpill = SET.spillT > 0;
  T.boatAtk = BATK.on; T.boatAtkN = BATK.n;
  T.seaCine = (CINE.id === 'keel' || CINE.id === 'refit' || CINE.id === 'watchbell' || CINE.id === 'crossing') ? CINE.id : null;
  T.seaChunksVis = seaChunks.filter(c => c.mesh && c.mesh.visible).length;
  T.chanCarve = window.__chanCarve;
});

/* ── debug (lazy — __fmDebug is born in p7) ── */
function extendSeaDebugOnce() {
  if (seaDbgDone || !window.__fmDebug) return;
  seaDbgDone = true;
  Object.assign(window.__fmDebug, {
    /* put the player AT SEA, in the boat, at a real sailing spot */
    warpSea(x, z, ang) {
      if (!P.sailing) {
        BOAT.x = x; BOAT.z = z;
        boardBoat();
      }
      BOAT.x = x; BOAT.z = z;
      if (ang !== undefined) BOAT.ang = ang;
      BOAT.spd = 0;
      P.x = x; P.z = z; P.fy = WL + 0.45; P.air = false;
      sailboat.group.position.set(x, WL - 0.18, z);
      P.area = areaAt(x, z);
      CAM.ready = false;
      return { x: BOAT.x, z: BOAT.z, depth: waterDepthAt(x, z) };
    },
    isleInfo() {
      return {
        extent: { w: ISLES.x1 - ISLES.x0, h: ISLES.z1 - ISLES.z0 },
        crossing: Math.round(Math.hypot(CROSS_LANE.toX - CROSS_LANE.fromX, CROSS_LANE.toZ - CROSS_LANE.fromZ)),
        isles: ISLE_LIST.map(is => ({ id: is.id, x: is.x, z: is.z, r: is.r, top: is.top })),
        anchors: ISLE_ANCHORS.length,
        gulls: GULLS.length, gars: GARS.length, clappers: CLAPPERS.length,
        carve: window.__chanCarve,
      };
    },
    swellAt(x, z) {
      return { h: swellAt(x, z), amp: swellAmpAt(x, z), set: bigSetHeight(x, z), clock: seaClock };
    },
    bigSetNow() { spawnBigSet(); return { c: SET.c, n: [SET.nx, SET.nz], amp: SET.amp }; },
    seaGround(x, z) { return { g: groundH(x, z), depth: waterDepthAt(x, z), solid: worldSolidAt(x, z) }; },
  });
}
</script>
