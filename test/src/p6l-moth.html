<script>
/* ═══════════════════════════════════════════════════════════════════════
   PHASE 6, PART TWO — THE WANING LANTERN (p6l-moth)

   Owns: the ARC FLOW of phase six (quests 23→27 — Pearl's rooftop reveal,
   the tinker's STAR LANTERN beat, the beacon-quest compass answers, the
   carry home, sky step 6, the 6/8 end card), THE FAR STAR LAMP ROOM (an
   off-world capped interior in the rooms strip), and THE LANTERN MOTH —
   the guardian that WEARS the phase: a great ash-grey moth asleep around
   THE WANING LANTERN. Nothing dies: cured, the ash blows off silver-blue
   and it keeps the tower as its roost.

   Concatenated AFTER p6k-stars.html (the sky, the constellations, the
   spyglass sighting, the four beacon islets) and BEFORE p7-flow. p6k's
   interfaces are consumed by FEATURE DETECTION ONLY — this file builds
   and runs whether or not p6k has landed: __p6k.lanternPoolAt /
   lanternPoolR / farStarDoor / beaconPos / sightingActive / laneTarget
   all have graceful fallbacks (the pinned-interface law).

   Derives EVERYTHING from the save, both ways, via __worldStateHooks.
   ═══════════════════════════════════════════════════════════════════════ */
window.__worldStateHooks = window.__worldStateHooks || [];
window.__telemetryHooks = window.__telemetryHooks || [];
window.__WORLD_REG = window.__WORLD_REG || [];
window.__PORTALS = window.__PORTALS || [];

/* ── the quest banners (assigned, not edited into p6-game — the DLG law) ── */
QUEST_TEXT[23] = 'THE CHALK WAS RIGHT';
QUEST_TEXT[24] = 'LIGHT THE FOUR DARK BEACONS';
QUEST_TEXT[25] = 'THE LANTERN MOTH';
QUEST_TEXT[26] = 'CARRY THE LANTERN TO THE MOONWHEEL';
QUEST_TEXT[27] = '6/8 PHASES RESTORED';

/* ── pinned geography ── */
const ML_REVEAL = { x: 4.5, z: -3.5 };        // the quay by Pearl's shore spot
const ML_ROOF = { x: 6, z: -38 };             // the harbor-row house whose roof frames the sky
/* fallback beacon line, bay → open west (only read until p6k lands;
   b3 = the Far Star fallback, standing on Long Strand's far shore so the
   probes have real footing pre-integration) */
const ML_BEACON_FB = [
  { x: -240, z: 80 }, { x: -700, z: -150 }, { x: -1300, z: -500 }, { x: -2118, z: -772 },
];
const ML_FAR_DOOR_FB = { x: -2118, z: -772, outX: -2116.5, outZ: -768.6, heading: 0.4 };
const ML_BAY_OUT = { x: -70, z: 40 };         // the bay mouth (CROSS_LANE's origin)

/* ── p6k consumption — all through these shims, nowhere else ── */
function mlK() { return window.__p6k || null; }
function mlBeaconPos(i) {
  const k = mlK();
  if (k && Array.isArray(k.beaconPos) && k.beaconPos[i]) return k.beaconPos[i];
  return ML_BEACON_FB[i];
}
function mlFarDoor() {
  const k = mlK();
  if (k && k.farStarDoor) return k.farStarDoor;
  return ML_FAR_DOOR_FB;
}
function mlPoolR() {
  const k = mlK();
  return (k && typeof k.lanternPoolR === 'number') ? k.lanternPoolR : 3.0;
}
/* the fight's own fallback pool: the star lantern's light POOLS where you
   stand — it follows with a lag, so sprinting through a dark wave outruns
   your own light. Standing still is always safe (kid-fair). */
const ML_POOL = { x: 0, z: 0, live: false };
function mlFallbackPoolAt(x, z) {
  if (!ML_POOL.live) return false;
  return Math.hypot(x - ML_POOL.x, z - ML_POOL.z) < mlPoolR();
}
function mlPoolAt(x, z) {
  const k = mlK();
  if (k && typeof k.lanternPoolAt === 'function') {
    try { if (k.lanternPoolAt(x, z)) return true; } catch (e) {}
    /* p6k's pool may not know about the off-world arena — the local pool
       is still valid ground (two pools = the co-op edge) */
  }
  return mlFallbackPoolAt(x, z);
}
function mlBeaconLitArr() {
  return (SAVE && Array.isArray(SAVE.beaconLit)) ? SAVE.beaconLit : [];
}
function mlLitCount() { return mlBeaconLitArr().filter(Boolean).length; }
function mlNextDarkIdx() {
  const a = mlBeaconLitArr();
  for (let i = 0; i < 4; i++) if (!a[i]) return i;
  return -1;
}
const mlCarry6 = () => !!(SAVE && SAVE.lantern6 && SAVE.sky < 6);

/* ── THE ARC IS ONE LONG NIGHT (the phase-5 precedent: q18–21 held dusk
   down for the whole market arc; the star road holds it for 23–26) ── */
const _mlPrevNightTarget = nmNightTarget;
nmNightTarget = function () {
  if (SAVE && SAVE.q >= 23 && SAVE.q < 27) return 1;
  return _mlPrevNightTarget();
};

/* ── the deepened dusk of sky step 6 rides p6k's star-field; this part
   only sets the flags (sky/ph = 6) and lets the owners answer ── */
</script>
<script>
/* ═══════════ p6l/2 — THE FAR STAR LAMP ROOM (off-world interior) ═══════════
   A capped room: no sky from inside — the panes are BAKED dusk, warm
   toward the lamp, cold at the rim (the warm-vs-dark bake). The rail and
   the round wall are the fight's "no fall fail": interiorResolve clamps
   the circle, so the worst a wing-gust does is press you against iron. */
const ML_C = { x: 330, z: -360 };             // arena centre, rooms strip
const ML_R = 10.5, ML_WALL_H = 6.4;
const ML_COLL = [];
/* the floor is this room's ground truth: sample the strip terrain under
   the whole footprint and cap it, so the authored floor is ALWAYS the
   standing surface (rendered == physics, RULE 1) */
const ML_FLOOR_Y = (function () {
  let m = -1e9;
  for (let dx = -12; dx <= 12; dx += 6) for (let dz = -12; dz <= 12; dz += 6) {
    m = Math.max(m, groundH(ML_C.x + dx, ML_C.z + dz));
  }
  return m + 0.35;
})();
const mlInRoomRect = (x, z) => x > 316 && x < 344 && z > -376 && z < -344;
const _mlPrevGroundH = groundH;
groundH = function (x, z) {
  if (mlInRoomRect(x, z)) return ML_FLOOR_Y;
  return _mlPrevGroundH(x, z);
};
/* the room heals like every interior: the lamp room is shelter */
const _mlPrevInShade = inShadeAt;
inShadeAt = function (x, z) {
  if (mlInRoomRect(x, z)) return true;
  return _mlPrevInShade(x, z);
};
/* SUNSTRUCK in the lamp room wakes you at the door, never across the sea
   (the boat waits at the islet — the dunk-orphan law's indoor cousin) */
const _mlPrevNearShade = nearestShadeSpot;
nearestShadeSpot = function (x, z) {
  if (mlInRoomRect(x, z)) return { x: 330, z: -351.4 };
  return _mlPrevNearShade(x, z);
};

const mothRoom = {
  id: 'mothroom', promptId: 'mlDoor',
  x: ML_C.x, z: ML_C.z, r: ML_R, wallH: ML_FLOOR_Y + ML_WALL_H,
  spawn: { x: 330, z: -351.4, heading: Math.PI },
  inDoor: { x: 330, z: -350.6 },
  /* ext re-derived from the sibling's door every doorOut (mlSeatExt) */
  ext: { outX: ML_FAR_DOOR_FB.outX, outZ: ML_FAR_DOOR_FB.outZ, heading: ML_FAR_DOOR_FB.heading },
  coll: ML_COLL, mesh: null, glow: null, vis: [],
};
function mlSeatExt() {
  const d = mlFarDoor();
  mothRoom.ext = {
    outX: (typeof d.outX === 'number') ? d.outX : d.x,
    outZ: (typeof d.outZ === 'number') ? d.outZ : d.z + 2.2,
    heading: (typeof d.heading === 'number') ? d.heading : 0,
  };
}
function mlInMothRoom() { return roomAt(P.x, P.z) === mothRoom; }

(function mlBuildRoom() {
  const md = MD();
  const cx = ML_C.x, cz = ML_C.z, R = ML_R, y0 = ML_FLOOR_Y, H = ML_WALL_H;
  const IRON = [0.24, 0.245, 0.28], IRON_D = [0.155, 0.16, 0.19];
  const FLOOR_W = [0.46, 0.40, 0.33], FLOOR_C = [0.235, 0.25, 0.30];
  const PANE = [0.075, 0.10, 0.185], PANE_D = [0.045, 0.06, 0.12];
  const BRASS = [0.56, 0.45, 0.24], BRASS_D = [0.38, 0.30, 0.17];
  /* floor disc: warm near the lamp, cold slate at the rim — 16 wedges,
     3 radial bands so the warmth is a gradient, not a decal */
  for (let i = 0; i < 16; i++) {
    const a0 = i / 16 * TAU, a1 = (i + 1) / 16 * TAU;
    let r0 = 0;
    for (const [r1, kWarm] of [[3.2, 1], [6.8, 0.42], [R + 0.3, 0.1]]) {
      const cA = mix3(FLOOR_C, FLOOR_W, kWarm * (0.85 + 0.15 * ((i % 2) ? 1 : 0.8)));
      pushTri(md, cx + Math.cos(a0) * r0, y0 + 0.01, cz + Math.sin(a0) * r0,
        cx + Math.cos(a0) * r1, y0 + 0.01, cz + Math.sin(a0) * r1,
        cx + Math.cos(a1) * r1, y0 + 0.01, cz + Math.sin(a1) * r1, cA);
      pushTri(md, cx + Math.cos(a0) * r0, y0 + 0.01, cz + Math.sin(a0) * r0,
        cx + Math.cos(a1) * r1, y0 + 0.01, cz + Math.sin(a1) * r1,
        cx + Math.cos(a1) * r0, y0 + 0.01, cz + Math.sin(a1) * r0, cA);
      r0 = r1;
    }
  }
  /* twelve iron uprights + baked dusk panes between (no sky from inside —
     the "glass" is painted night, star-flecked, PERFECT and waiting) */
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU;
    box(md, { x: cx + Math.cos(a) * R, y: y0, z: cz + Math.sin(a) * R,
      w: 0.16, d: 0.16, h: H, ry: -a, col: IRON });
  }
  const rnd = mulberry32(660);
  for (let i = 0; i < 12; i++) {
    const a0 = i / 12 * TAU, a1 = (i + 1) / 12 * TAU;
    const p0 = [cx + Math.cos(a0) * R, cz + Math.sin(a0) * R];
    const p1 = [cx + Math.cos(a1) * R, cz + Math.sin(a1) * R];
    pushQuad(md, [p0[0], y0 + 0.9, p0[1]], [p1[0], y0 + 0.9, p1[1]],
      [p1[0], y0 + H - 0.5, p1[1]], [p0[0], y0 + H - 0.5, p0[1]], PANE, PANE_D);
    /* star flecks baked into the pane — tiny bright quads, not lights */
    for (let s = 0; s < 4; s++) {
      const t = 0.15 + rnd() * 0.7, hgt = y0 + 1.6 + rnd() * (H - 2.8);
      const sx = p0[0] + (p1[0] - p0[0]) * t, sz = p0[1] + (p1[1] - p0[1]) * t;
      const nx = Math.cos((a0 + a1) / 2) * -0.03, nz = Math.sin((a0 + a1) / 2) * -0.03;
      const b = 0.35 + rnd() * 0.4;
      box(md, { x: sx + nx, y: hgt, z: sz + nz, w: 0.035, d: 0.02, h: 0.035, col: [b, b, b + 0.12] });
    }
    /* sill and header bands */
    pushQuad(md, [p0[0], y0, p0[1]], [p1[0], y0, p1[1]],
      [p1[0], y0 + 0.9, p1[1]], [p0[0], y0 + 0.9, p0[1]], IRON_D);
  }
  /* the door bay: a framed opening with a warm floor cue (RULE 2 — a
     passable opening must READ as an opening) */
  box(md, { x: cx - 1.05, y: y0, z: cz + R - 0.1, w: 0.18, d: 0.2, h: 2.6, col: BRASS_D });
  box(md, { x: cx + 1.05, y: y0, z: cz + R - 0.1, w: 0.18, d: 0.2, h: 2.6, col: BRASS_D });
  box(md, { x: cx, y: y0 + 2.6, z: cz + R - 0.1, w: 1.25, d: 0.2, h: 0.22, col: BRASS });
  pushQuad(md, [cx - 0.9, y0 + 0.02, cz + R - 1.6], [cx + 0.9, y0 + 0.02, cz + R - 1.6],
    [cx + 0.9, y0 + 0.02, cz + R + 0.1], [cx - 0.9, y0 + 0.02, cz + R + 0.1],
    mix3(FLOOR_W, BRASS, 0.5));
  /* pane above the door, wall below the frame's sides handled by the ring */
  /* the cap: a full cone — NO sky from inside */
  lathe(md, [[R + 0.25, y0 + H - 0.5], [R + 0.25, y0 + H], [R * 0.45, y0 + H + 1.3], [0, y0 + H + 1.7]],
    { seg: 14, x: cx, y: 0, z: cz, col: IRON_D, cols: [IRON, IRON_D, PANE_D] });
  /* the lean rail — the thing that catches you (visual; the clamp is law) */
  for (let i = 0; i < 12; i++) {
    const a = (i + 0.5) / 12 * TAU;
    box(md, { x: cx + Math.cos(a) * (R - 0.55), y: y0 + 0.92, z: cz + Math.sin(a) * (R - 0.55),
      w: 2.6, d: 0.07, h: 0.07, ry: -a + Math.PI / 2, col: IRON });
    box(md, { x: cx + Math.cos(a) * (R - 0.55), y: y0, z: cz + Math.sin(a) * (R - 0.55),
      w: 0.07, d: 0.07, h: 0.92, col: IRON_D });
  }
  /* THE GREAT LAMP — a brass column and drum at centre; the Waning
     Lantern hangs in its heart (its own mesh, below) */
  lathe(md, [[1.6, y0], [1.35, y0 + 0.18], [0.62, y0 + 0.5], [0.5, y0 + 1.7], [0.95, y0 + 1.95], [0.95, y0 + 2.5], [0.62, y0 + 2.75], [0.2, y0 + 2.9]],
    { seg: 12, x: cx, y: 0, z: cz, col: BRASS_D, cols: [IRON_D, BRASS_D, BRASS, BRASS_D] });
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * TAU;
    box(md, { x: cx + Math.cos(a) * 0.86, y: y0 + 1.95, z: cz + Math.sin(a) * 0.86,
      w: 0.07, d: 0.07, h: 0.55, col: BRASS });
  }
  ML_COLL.push([cx, cz, 1.5]);
  mothRoom.mesh = mdMesh(md, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }), false);
  mothRoom.mesh.matrixAutoUpdate = false; mothRoom.mesh.updateMatrix();
  mothRoom.mesh.frustumCulled = false;
  mothRoom.mesh.visible = false;
  scene.add(mothRoom.mesh);
  /* the glow layer: the lamp's warmth + the door cue, swelled by state */
  const mdG = MD();
  lathe(mdG, [[0, y0 + 0.03], [2.6, y0 + 0.02]], { seg: 12, x: cx, y: 0, z: cz, col: [1.0, 0.8, 0.45] });
  for (const [ox, oz] of [[0.7, 0], [0, 0.7]]) {
    pushQuad(mdG, [cx - ox, y0 + 1.9, cz - oz], [cx + ox, y0 + 1.9, cz + oz],
      [cx + ox, y0 + 2.6, cz + oz], [cx - ox, y0 + 2.6, cz - oz], [1.0, 0.85, 0.55]);
  }
  mothRoom.glow = mdMesh(mdG, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.22,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  }), false);
  mothRoom.glow.matrixAutoUpdate = false; mothRoom.glow.updateMatrix();
  mothRoom.glow.visible = false;
  scene.add(mothRoom.glow);
  ROOMS.push(mothRoom);
})();

/* the lamp room is its own ground owner over the strip (RULE 1: the wrap
   above must be DECLARED, so the conformance sweep judges it) */
window.__WORLD_REG.push({
  name: 'p6l-lamproom', kind: 'ground', over: ['rooms-strip'],
  owns: (x, z) => mlInRoomRect(x, z),
  ground: () => ML_FLOOR_Y,
  note: 'the Far Star lamp room — capped floor over the strip terrain; solid is interiorResolve',
});
/* RULE 2: the tower door is a registered threshold (frames + floor cue on
   the interior side here; the shell side is p6k geometry) */
window.__PORTALS.push((function () {
  const d = mlFarDoor();
  return { name: 'farstar-lamp-door', x: d.x, z: d.z, openNow: () => true };
})());

/* ═══ THE WANING LANTERN — the relic itself ═══ */
let mlRelic = null, mlRelicGlow = null;
(function mlBuildRelic() {
  const g = new THREE.Group();
  const md = MD();
  const BRASS = [0.66, 0.53, 0.28], BRASS_D = [0.42, 0.33, 0.18], GLASS = [0.9, 0.82, 0.6];
  lathe(md, [[0.16, 0], [0.2, 0.05], [0.14, 0.09]], { seg: 8, col: BRASS_D });
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * TAU;
    box(md, { x: Math.cos(a) * 0.15, y: 0.09, z: Math.sin(a) * 0.15, w: 0.025, d: 0.025, h: 0.3, col: BRASS });
  }
  lathe(md, [[0.1, 0.1], [0.13, 0.24], [0.09, 0.36]], { seg: 8, col: GLASS });
  lathe(md, [[0.17, 0.39], [0.1, 0.46], [0.03, 0.5]], { seg: 8, col: BRASS_D });
  box(md, { x: 0, y: 0.5, z: 0, w: 0.02, d: 0.06, h: 0.1, col: BRASS });
  const m = mdMesh(md, new THREE.MeshBasicMaterial({ vertexColors: true }), false);
  m.frustumCulled = false;
  g.add(m);
  const mdG = MD();
  lathe(mdG, [[0, 0.23], [0.34, 0.22]], { seg: 8, col: [1.0, 0.82, 0.5] });
  mlRelicGlow = mdMesh(mdG, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  }), false);
  mlRelicGlow.frustumCulled = false;
  g.add(mlRelicGlow);
  g.visible = false;
  scene.add(g);
  mlRelic = g;
})();
function mlRelicHome() {
  mlRelic.position.set(ML_C.x, ML_FLOOR_Y + 1.95, ML_C.z);
  mlRelic.rotation.set(0, 0, 0);
  mlRelic.scale.setScalar(1.6);
}
</script>
<script>
/* ═══════════ p6l/3 — THE LANTERN MOTH: the build ═══════════
   A GREAT SILVER MOTH, not a grey blob (the drowned-moon lesson: overlap
   and contrast). Ash-grey dusk fur, wing rims picked out pale; underneath
   the ash the silver-blue is already there — the cure lerps every vertex
   toward its stored silver target. */
SFX.mothCry = function () { if (!AC) return; const t = AC.currentTime;
  tone(620, t, 0.5, 0.05, 'sine'); tone(930, t + 0.1, 0.55, 0.04, 'sine');
  noiseBurst(t, 0.5, 0.02, 1800, 500, 0.6, 'bandpass'); };
SFX.mothWing = function () { if (!AC) return; const t = AC.currentTime;
  noiseBurst(t, 0.42, 0.1, 420, 140, 0.85, 'lowpass'); };
SFX.mothTele = function () { if (!AC) return; const t = AC.currentTime;
  tone(440, t, 0.3, 0.035, 'triangle'); tone(660, t + 0.16, 0.34, 0.035, 'triangle');
  tone(990, t + 0.32, 0.4, 0.03, 'triangle'); };
SFX.darkWave = function () { if (!AC) return; const t = AC.currentTime;
  noiseBurst(t, 1.4, 0.08, 220, 60, 1.2, 'lowpass'); tone(72, t, 1.3, 0.05, 'sine'); };

const ML_ASH = {
  body: col(0x565460), fur: col(0x6a6674), wing: col(0x5d5a68),
  wing2: col(0x484552), rim: col(0x9aa0b2), eye: col(0x8f96a8),
};
const ML_SILVER = {
  body: col(0xa8bdd4), fur: col(0xc2d4e6), wing: col(0xb6c9e0),
  wing2: col(0x8fa8c6), rim: col(0xe8f2ff), eye: col(0xdff0ff),
};
function mlBuildMoth() {
  const mat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
  const root = new THREE.Group();
  const parts = {};
  /* body + head, one mesh */
  const mdB = MD();
  /* thorax: fat, furred (jittered rings) */
  lathe(mdB, [[0.0, -1.05], [0.16, -0.9], [0.3, -0.45], [0.42, 0.0], [0.34, 0.42], [0.2, 0.62], [0.0, 0.72]],
    { seg: 9, col: ML_ASH.body, cols: [ML_ASH.body, ML_ASH.body, ML_ASH.fur, ML_ASH.fur, ML_ASH.body] });
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * TAU;
    box(mdB, { x: Math.cos(a) * 0.3, y: 0.34, z: Math.sin(a) * 0.14 + 0.32,
      w: 0.05, d: 0.05, h: 0.22, rz: a, col: ML_ASH.fur });
  }
  /* head + the great eyes + plume antennae */
  lathe(mdB, [[0.0, 0.68], [0.15, 0.78], [0.13, 0.92], [0.0, 0.98]], { seg: 8, col: ML_ASH.body });
  for (const s of [-1, 1]) {
    box(mdB, { x: 0.11 * s, y: 0.84, z: 0.1, w: 0.07, d: 0.075, h: 0.09, col: ML_ASH.eye });
    /* feathered antenna: a little fan of thin boxes */
    for (let k = 0; k < 3; k++) {
      box(mdB, { x: 0.1 * s, y: 0.98 + k * 0.1, z: 0.02 - k * 0.02,
        w: 0.16 + k * 0.05, d: 0.012, h: 0.012, ry: s * (0.5 + k * 0.16), col: ML_ASH.rim });
    }
  }
  /* forelegs — the pair that will hand the Lantern down */
  for (const s of [-1, 1]) {
    box(mdB, { x: 0.2 * s, y: 0.42, z: 0.3, w: 0.045, d: 0.05, h: 0.4, rz: s * 0.5, col: ML_ASH.body });
    box(mdB, { x: 0.34 * s, y: 0.1, z: 0.42, w: 0.04, d: 0.04, h: 0.3, rz: s * 0.16, col: ML_ASH.body });
  }
  const body = mdMesh(mdB, mat, false);
  body.frustumCulled = false;
  /* orient: +z forward, y up; lathe built along y — pitch the body level */
  const bodyN = new THREE.Group();
  bodyN.add(body);
  body.rotation.x = Math.PI / 2 - 0.25;
  root.add(bodyN);
  parts.body = body; parts.bodyN = bodyN;
  /* wings: two nodes, each a big scalloped fan (upper + under pair) */
  const mkWing = (side) => {
    const md = MD();
    const S = side;                        // +1 right, −1 left
    /* upper wing: root at 0, tip out at x = S*2.3 — five scallop ribs */
    const tip = [S * 2.3, 0, -0.25];
    const edge = [
      [S * 0.55, 0, 0.75], [S * 1.35, 0, 0.62], [S * 2.05, 0, 0.25],
      tip, [S * 1.7, 0, -0.75], [S * 0.9, 0, -0.85],
    ];
    let prev = [S * 0.12, 0, 0.4];
    for (let i = 0; i < edge.length; i++) {
      const e = edge[i];

<script>
/* ═══════════ p6l/5 — THE FIGHT ═══════════
   Three phases, and the guardian WEARS them: P1 wing-gusts + dives (the
   rail catches, the sword answers), P2 the dark waves (your own light is
   the safe ground — shade-heal inverted), P3 the moth-spiral (jump it;
   it tires after every pass). HP 84, notch convention 84/56/28. Body
   chips ALWAYS land. Cold-7-year-old telegraphs, ≥0.9 s each. */
const MOTH_HP = 84;
const MOTH = {
  c: null, active: false, defeated: false, phase: 0, st: 'sleep', t: 0,
  hp: MOTH_HP, hpMax: MOTH_HP, x: ML_C.x, y: ML_FLOOR_Y + 2.15, z: ML_C.z,
  ang: Math.PI, flash: 0, barShown: false, bodyHits: 0, silverShown: -1,
  homeA: 0.6, nextGust: true, gustR: 0, gustHit: false,
  dive: { tx: ML_C.x, tz: ML_C.z, lock: false }, diveHit: false,
  wave: { ax: 1, az: 0, s: -99, on: false, hit: false }, waveN: 0,
  spiral: { ax: 1, az: 0, s: -99, on: false }, spiralN: 0,
  gustN: 0, diveN: 0, hintGust: false, hintPool: false, hintSpiral: false,
  wingK: 0.05, wingT: 0, flapHz: 2.2,
};
MOTH.c = mlBuildMoth();
function mlMothPhaseHp(ph) { return ph <= 1 ? MOTH_HP : ph === 2 ? 56 : 28; }

let mlBarW = -1, mlBarFlashT = null;
function mlRefreshBar(hitFlash) {
  const want = MOTH.active && !MOTH.defeated;
  if (want !== MOTH.barShown) {
    MOTH.barShown = want;
    bossBarEl.classList.toggle('on', want);
    if (want) bossNameEl.textContent = 'THE LANTERN MOTH';
    if (!want) bossBarEl.classList.remove('hit');
    mlBarW = -1;
  }
  if (!want) return;
  const w = Math.round(clamp(MOTH.hp / MOTH.hpMax, 0, 1) * 1000) / 10;
  if (w !== mlBarW) {
    mlBarW = w;
    bossFillEl.style.width = `calc((100% - 4px) * ${w / 100})`;
  }
  if (hitFlash) {
    bossBarEl.classList.add('hit');
    clearTimeout(mlBarFlashT);
    mlBarFlashT = setTimeout(() => bossBarEl.classList.remove('hit'), 130);
  }
}
function mlMothReset(keepPhase) {
  const M = MOTH;
  M.active = false;
  M.st = 'sleep'; M.t = 0;
  M.phase = keepPhase ? M.phase : 0;
  M.hp = mlMothPhaseHp(Math.max(1, M.phase));
  if (!keepPhase) M.hp = MOTH_HP;
  M.x = ML_C.x; M.z = ML_C.z; M.y = ML_FLOOR_Y + 2.15; M.ang = Math.PI;
  M.gustR = 0; M.wave.on = false; M.spiral.on = false; M.wingK = 0.05;

}
function mlDealMothDamage(n) {

  if (!M.active || M.defeated) return;
  M.hp = Math.max(0, M.hp - n);
  mlRefreshBar(true);
  if (M.hp <= 0) { startCine('mlCure'); return; }

    M.phase = 2; M.st = 'roar'; M.t = 0;
    SFX.mothCry(); CAM.shake = 0.3;

    SFX.mothCry(); CAM.shake = 0.34;

}
const ML_VULN = { low: 1, stoop: 1, tired: 1 };
function mlHitMothBody() {
  const M = MOTH;
  M.bodyHits++;

  SFX.hit();
  P.hitstop = 3;
  CAM.shake = 0.12;
  rumble({ duration: 80, strong: 0.4, weak: 0.3 });

}
function mlHitMothVuln() {

}
function mlMothSwingHits() {

  if (!inSwingArc(M.x, M.z, 4.2, 1.5)) return false;
  if (ML_VULN[M.st]) { mlHitMothVuln(); return true; }
  mlHitMothBody();                     // body chips ALWAYS land — the law

}
function mlKeepMothIn(o, margin) {
  const dx = o.x - ML_C.x, dz = o.z - ML_C.z;
  const d = Math.hypot(dx, dz) || 1;

function mlWaveProj(x, z, W) { return (x - ML_C.x) * W.ax + (z - ML_C.z) * W.az; }

  const M = MOTH;

  const inR = mlInMothRoom();

      if (M.phase === 0) M.phase = 1;
      M.hp = mlMothPhaseHp(M.phase);
      M.st = 'wake'; M.t = 0;

      M.z += (ML_C.z - M.z) * Math.min(1, DT * 2);

      M.x += (hx - M.x) * Math.min(1, DT * 1.8);
      M.z += (hz - M.z) * Math.min(1, DT * 1.8);

          M.nextGust = !M.nextGust;
        } else if (M.phase === 2) {
          M.st = (M.waveN % 3 === 2) ? 'diveTele' : 'waveTele';
        } else {

      }

    }
    case 'gustTele': {                    /* ≥0.9 s, visible silver ripple */
      faceP();
      M.wingK = 0.35;
      M.y = py + 1.9;
      if (M.t < 0.05 && M.t - DT <= 0) SFX.mothTele();

      if (!M.gustHit && !P.air && Math.abs(distP - M.gustR) < 1.0) {

        P.vx += (P.x - M.x) / d * 9.5;
        P.vz += (P.z - M.z) / d * 9.5;

    case 'waveTele': {                    /* the dark gathers at one wall */
      faceP();

      M.z += (ML_C.z - M.z) * Math.min(1, DT * 2.4);

        SFX.darkWave();
      }
      break;
    }
    case 'wave': {
      const W = M.wave;
      const prev = W.s;
      W.s += DT * 6.2;
      const pp = mlWaveProj(P.x, P.z, W);
      if (!W.hit && pp > prev && pp <= W.s) {
        /* the front crosses you: your own light is the only shelter */
        if (!mlPoolAt(P.x, P.z)) {
          W.hit = true;
          hurtPlayer(1, P.x - W.ax * 2.5, P.z - W.az * 2.5, M.c.root);
          if (!M.hintPool && !cineSeen('mlHintPool')) {
            M.hintPool = true; markCineSeen('mlHintPool');
            showCaption('Your lantern-light is safe ground — stand in the silver and let the dark pass.', 4200);
          }
        } else {
          W.hit = true;
          SFX.chime(1.4);
          burst(psSparkle, P.x, ML_FLOOR_Y + 0.6, P.z, 10, 1.2, 0.8, 0.8);
        }
      }
      M.y = py + 3.0 + Math.sin(M.t * 5) * 0.15;
      if (W.s > ML_R + 2.5) {
        W.on = false;
        M.waveN++;
        M.st = 'stoop'; M.t = 0;
      }
      break;
    }
    case 'stoop': {                       /* it stoops by the lamp — strike */
      M.wingK = 0.2;
      M.x += (ML_C.x + 2.2 - M.x) * Math.min(1, DT * 3);
      M.z += (ML_C.z - M.z) * Math.min(1, DT * 3);
      M.y += (py + 0.55 - M.y) * Math.min(1, DT * 4);
      if (M.t > 1.9) { M.st = 'hover'; M.t = 0; }
      break;
    }
    case 'spiralTele': {
      faceP();
      M.wingK = 1.05;
      M.y = py + 2.8;
      if (M.t < 0.05 && M.t - DT <= 0) {
        const a = Math.random() * TAU;
        M.spiral.ax = Math.cos(a); M.spiral.az = Math.sin(a);
        M.spiral.s = -(ML_R + 1.2);
        SFX.mothTele(); SFX.mothWing();
      }
      if (M.t > 1.1) { M.st = 'spiral'; M.t = 0; M.spiral.on = true; }
      break;
    }
    case 'spiral': {
      const W = M.spiral;
      const prev = W.s;
      W.s += DT * 5.4;
      const pp = mlWaveProj(P.x, P.z, W);
      const grounded = !P.air;               // airborne clears it, always (kid-fair)
      if (pp > prev - 0.3 && pp <= W.s && Math.abs(pp - W.s) < 0.8 && grounded && P.iframes <= 0) {
        hurtPlayer(1, P.x - W.ax * 2.5, P.z - W.az * 2.5, M.c.root);
        if (!M.hintSpiral && !cineSeen('mlHintSpiral')) {
          M.hintSpiral = true; markCineSeen('mlHintSpiral');
          showCaption('JUMP the moth-line — the great moth tires after every pass.', 3800);
        }
      }
      M.y = py + 2.8 + Math.sin(M.t * 4) * 0.2;
      if (W.s > ML_R + 2.5) {
        W.on = false;
        M.spiralN++;
        M.st = 'tired'; M.t = 0;
      }
      break;
    }
    case 'tired': {                       /* the big window */
      M.wingK = 0.12;
      M.x += (ML_C.x + 1.8 - M.x) * Math.min(1, DT * 3);
      M.z += (ML_C.z + 1.2 - M.z) * Math.min(1, DT * 3);
      M.y += (py + 0.5 - M.y) * Math.min(1, DT * 4);
      if (M.t > 2.5) { M.st = 'hover'; M.t = 0; }
      break;
    }
  }
  mlKeepMothIn(M, 1.4);
  /* the veil rests once phase two is done dousing */
  if (M.phase >= 2 && M.st !== 'wave' && M.st !== 'waveTele') {
    mlVeilEl.style.opacity = M.phase === 2 ? '0.75' : '0.45';
  }
  if (M.phase === 1) mlVeilEl.style.opacity = '0';
}

<script>
/* ═══════════ p6l/6 — the arena camera (the sail-camera pattern) ═══════════
   The default room camera hugs at 2.15 m — right for a bedroom, blind for
   a boss. In the lamp room the follow cam stands further back and a
   little higher, clamped by the same circle. */
function mlArenaCamera(dtv) {
  const wantDist = 4.6;
  CAM.dist += (wantDist - CAM.dist) * Math.min(1, dtv * 3);
  let manual = false;
  if (state === 'play') {
    const sx = clamp(IN.cx, -1, 1), sy = clamp(IN.cy, -1, 1);
    if (sx || sy) { CAM.yaw -= sx * 3.1 * dtv; CAM.pitch += sy * 2.0 * dtv; manual = true; }
    if (CAMIN.mdx || CAMIN.mdy) { CAM.yaw -= CAMIN.mdx * 0.0034; CAM.pitch += CAMIN.mdy * 0.0026; manual = true; }
    if (CAMIN.tdx || CAMIN.tdy) { CAM.yaw -= CAMIN.tdx * 0.0085; CAM.pitch += CAMIN.tdy * 0.0065; manual = true; }
  }
  CAMIN.mdx = CAMIN.mdy = CAMIN.tdx = CAMIN.tdy = 0;
  if (manual || CAMIN.touching) CAM.stickAge = 0; else CAM.stickAge += dtv;
  CAM.pitch = clamp(CAM.pitch, PITCH_MIN, PITCH_MAX);
  const ty = P.fy + 1.35;
  const tx = P.x, tz = P.z;
  const cp = Math.cos(CAM.pitch), spv = Math.sin(CAM.pitch);
  const dx = Math.sin(CAM.yaw) * cp, dz = Math.cos(CAM.yaw) * cp;
  let dist = CAM.dist;
  for (let s = 0.2; s <= 1.0; s += 0.1) {
    const sx2 = tx + dx * dist * s, sz2 = tz + dz * dist * s;
    if (Math.hypot(sx2 - ML_C.x, sz2 - ML_C.z) > ML_R - 0.3) {
      dist = Math.max(1.2, dist * (s - 0.1)); break;
    }
  }
  const cx = tx + dx * dist, cz = tz + dz * dist;
  let cy = ty + spv * dist;
  cy = clamp(cy, ML_FLOOR_Y + 0.5, ML_FLOOR_Y + ML_WALL_H - 0.4);
  const k = CAM.ready ? Math.min(1, dtv * (manual ? 15 : 6.5)) : 1;
  CAM.x += (cx - CAM.x) * k; CAM.y += (cy - CAM.y) * k; CAM.z += (cz - CAM.z) * k;
  CAM.ready = true;
  camera.position.set(
    CAM.x + (Math.random() - 0.5) * CAM.shake,
    CAM.y + (Math.random() - 0.5) * CAM.shake * 0.6,
    CAM.z + (Math.random() - 0.5) * CAM.shake);
  CAM.shake = Math.max(0, CAM.shake - dtv * 1.6);
  _mlCamLook.set(tx, ty, tz);
  camera.lookAt(_mlCamLook);
}
const _mlCamLook = new THREE.Vector3();
const _mlPrevUpdateCamera = updateCamera;
updateCamera = function (dtv) {
  if (CAM.mode === 'follow' && mlInMothRoom()) { mlArenaCamera(dtv); return; }
  _mlPrevUpdateCamera(dtv);
};
</script>
<script>

/* the incomplete constellation — an authored sky prop for the reveal (and

let mlConstel = null, mlConstelGap = null;
(function mlBuildConstel() {
  const g = new THREE.Group();

  const pts = [[-0.9, 0.62], [-0.55, 0.78], [-0.15, 0.7], [0.2, 0.82], [0.55, 0.66], [0.35, 0.5]];

  const _q = new THREE.Quaternion(), _z = new THREE.Vector3(0, 0, 1), _n = new THREE.Vector3();

    const cx = Math.cos(el), sx = Math.sin(el);

DLG.mlTinker = { name: 'THE TINKER', lines: [

function mlGrantStarLantern() {

const ML_CINE = { p0: [0, 0, 0], l0: [0, 0, 0] };

function mlTickReveal(t) {

  }

<script>
/* ═══════════ p6l/8 — THE CURE: nothing dies ═══════════

  const now = performance.now();
  const dtv = Math.min(0.1, (now - mlClock) / 1000);
  mlClock = now;
  mlExtendDebugOnce();
  const M = MOTH;
  const nearRoom = (ML_C.x - ccx) * (ML_C.x - ccx) + (ML_C.z - ccz) * (ML_C.z - ccz) < 32 * 32;
  /* the moth lives only in its room (and its cure) */
  const mothVis = nearRoom && (M.active || M.defeated || mlInMothRoom() || CINE.id === 'mlCure');
  M.c.root.visible = mothVis;
  if (mothVis && !SIM_FREEZE) {
    const c = M.c;
    c.root.position.set(M.x, M.y, M.z);
    c.root.rotation.y = M.ang;
    /* the flap: sim decides wingK targets; the render breathes them */
    M.wingT += dtv * (M.st === 'hover' || M.st === 'wake' ? 5.2 : M.st === 'gust' || M.st === 'dive' ? 11 : 2.6);
    const flap = Math.sin(M.wingT) * (M.st === 'low' || M.st === 'tired' || M.st === 'stoop' || M.st === 'roost' ? 0.06 : 0.5);
    const spread = clamp(M.wingK, 0.05, 1.4);
    c.parts.wingR.rotation.z = -(1.35 - spread) - flap * spread * 0.55;
    c.parts.wingL.rotation.z = (1.35 - spread) + flap * spread * 0.55;
    c.parts.bodyN.rotation.x = (M.st === 'dive') ? 0.5 : Math.sin(M.wingT * 0.5) * 0.05;
    c.parts.rim.rotation.z = c.parts.wingR.rotation.z * 0.5 + c.parts.wingL.rotation.z * 0.5;
    if (M.flash > 0) {
      M.flash -= dtv;
      /* hit feedback without a material swap: a tight scale pulse */
      c.root.scale.setScalar(1 + (M.flash > 0 ? Math.sin(now / 18) * 0.03 : 0));
    } else c.root.scale.setScalar(1);
    /* her sprint pose, laid over the idle the NPC pass already applied */
    if (CINE.id === 'mlReveal' && CINE.t < 3.2 && !SIM_FREEZE) {
      poseHumanoid(pearl.char, 'walk', dtv, 1, { sprint: true });
    }
  }
  /* fight furniture */
  const inFight = mothVis && M.active && !M.defeated;
  mlRing.visible = inFight && (M.st === 'gustTele' || M.st === 'gust');
  if (mlRing.visible) {
    mlRing.position.set(M.x, ML_FLOOR_Y + 0.06, M.z);
    mlRing.scale.set(M.gustR, 1, M.gustR);
    mlRing.material.opacity = M.st === 'gustTele' ? 0.35 + Math.sin(now / 90) * 0.15 : 0.55;
  }
  mlMark.visible = inFight && (M.st === 'diveTele');
  if (mlMark.visible) {
    mlMark.position.set(M.dive.tx, ML_FLOOR_Y + 0.05, M.dive.tz);
    const lk = M.dive.lock;
    mlMark.scale.setScalar(lk ? 1.35 : 1.0 + Math.sin(now / 80) * 0.1);
    mlMark.material.opacity = lk ? 0.75 : 0.35;
  }
  mlPoolMesh.visible = inFight && ML_POOL.live && !!(SAVE && SAVE.starLantern);
  if (mlPoolMesh.visible) {
    mlPoolMesh.position.set(ML_POOL.x, ML_FLOOR_Y, ML_POOL.z);
    mlPoolMesh.scale.set(mlPoolR(), 1, mlPoolR());
    mlPoolMesh.material.opacity = 0.2 + Math.sin(now / 300) * 0.05 + (M.st === 'wave' ? 0.14 : 0);
  }
  mlWaveMesh.visible = inFight && M.wave.on;
  if (mlWaveMesh.visible) {
    const W2 = M.wave;
    mlWaveMesh.position.set(ML_C.x + W2.ax * W2.s, ML_FLOOR_Y, ML_C.z + W2.az * W2.s);
    mlWaveMesh.rotation.y = -Math.atan2(W2.az, W2.ax) + Math.PI / 2;
  }
  mlSpiralMesh.visible = inFight && M.spiral.on;
  if (mlSpiralMesh.visible) {
    const W2 = M.spiral;
    mlSpiralMesh.position.set(ML_C.x + W2.ax * W2.s, ML_FLOOR_Y, ML_C.z + W2.az * W2.s);
    mlSpiralMesh.rotation.y = -Math.atan2(W2.az, W2.ax) + Math.PI / 2;
    mlSpiralMesh.material.opacity = 0.8 + Math.sin(now / 60) * 0.2;
  }
  /* the relic: wrapped, carried, or seated */
  if (SAVE) {
    if (!SAVE.mothDone) {
      if (CINE.id !== 'mlCure' && CINE.id !== 'mlWheel6') {
        mlRelic.visible = nearRoom;
        if (nearRoom) { mlRelicHome(); mlRelicGlow.material.opacity = 0.35 + Math.sin(now / 400) * 0.12; }
      }
    } else if (mlCarry6() && state === 'play') {
      mlRelic.visible = true;
      mlRelic.scale.setScalar(1.1);
      mlRelicGlow.material.opacity = 0.5;
      if (P.skiffing && typeof SKF !== 'undefined') {
        mlRelic.position.set(SKF.x - Math.sin(SKF.ang) * 0.9, skiffGrp.position.y + 1.05, SKF.z - Math.cos(SKF.ang) * 0.9);
        mlRelic.rotation.set(0, SKF.ang, 0);
      } else {
        mlRelic.position.set(P.x - Math.sin(P.heading) * 0.32, groundH(P.x, P.z) + 1.1, P.z - Math.cos(P.heading) * 0.32);
        mlRelic.rotation.set(0, P.heading, 0);
      }
    } else if (SAVE.sky >= 6) {
      /* the wheel keeps six once it has six (the p6j correction, advanced) */
      const nw = (WHEEL_POS.x - ccx) * (WHEEL_POS.x - ccx) + (WHEEL_POS.z - ccz) * (WHEEL_POS.z - ccz) < 150 * 150;
      if (CINE.id !== 'mlWheel6') {
        if (nw && (!mlSeat6Shown || (simTick % 90) === 0)) mlSeat6(1);
        if (!nw && mlSeat6Shown) mlRelic.visible = false;
        mlSeat6Shown = nw;
      } else if (mlSeatK >= 0) mlSeat6(mlSeatK);
    } else if (state === 'play' && !mlCarry6() && SAVE.sky < 6 && CINE.id !== 'mlCure') {
      if (!nearRoom) mlRelic.visible = false;
    }
  }
};

/* ═══ THE ONE DERIVATION — phase six, from the save, both ways ═══ */
let mlHookErr = null, mlHookRuns = 0;
function mlDeriveWorld(S) {
  /* the guardian */
  MOTH.defeated = !!S.mothDone;
  if (S.mothDone) {
    mlPerchMoth();
  } else {
    MOTH.silverShown = -1;
    mlMothAshK(0);
    mlMothReset(false);
  }
  MOTH.c.root.visible = false;
  mlVeilEl.style.opacity = '0';
  ML_POOL.live = false;
  mlRing.visible = false; mlMark.visible = false;
  mlWaveMesh.visible = false; mlSpiralMesh.visible = false; mlPoolMesh.visible = false;
  mothRoom.glow.material.opacity = S.mothDone ? 0.5 : 0.22;
  /* the relic */
  mlRelic.visible = false;
  if (!S.mothDone) mlRelicHome();
  mlSeat6Shown = false;
  mlSeatK = -1;
  /* the reveal props */
  mlChart.visible = false;
  mlConstel.visible = false;
  mlConstel.userData.starMat.opacity = 0;
  mlConstelGap.material.opacity = 0;
  /* the ext teleport follows the sibling's door wherever it lands */
  mlSeatExt();
  /* the end card belongs to its moment */
  if (S.sky >= 6 && !S.tbc6Seen) { S.tbc6Seen = true; storeSave(); }
}
window.__worldStateHooks.push(function (S) {
  mlHookRuns++;
  try { mlDeriveWorld(S); mlHookErr = null; }
  catch (e) { mlHookErr = String(e && e.message || e); throw e; }
});

/* ═══ telemetry ═══ */
window.__telemetryHooks.push(function (T) {
  T.starsSeen = !!(SAVE && SAVE.starsSeen);
  T.starLantern = !!(SAVE && SAVE.starLantern);
  T.beaconLitN = mlLitCount();
  T.beaconLitList = mlBeaconLitArr().map(b => b ? 1 : 0).join('');
  T.mothDone = !!(SAVE && SAVE.mothDone);
  T.lantern6 = !!(SAVE && SAVE.lantern6);
  T.carry6 = mlCarry6();
  T.tbc6Seen = !!(SAVE && SAVE.tbc6Seen);
  T.inMothRoom = mlInMothRoom();
  T.mothActive = MOTH.active;
  T.mothDefeated = MOTH.defeated;
  T.mothHp = MOTH.hp;
  T.mothPhase = MOTH.phase;
  T.mothSt = MOTH.st;
  T.mothX = +MOTH.x.toFixed(1);
  T.mothZ = +MOTH.z.toFixed(1);
  T.mothBody = MOTH.bodyHits;
  T.mothWaveN = MOTH.waveN;
  T.mothSpiralN = MOTH.spiralN;
  T.mothDiveN = MOTH.diveN;
  T.poolLive = ML_POOL.live;
  T.poolX = +ML_POOL.x.toFixed(1);
  T.poolZ = +ML_POOL.z.toFixed(1);
  T.poolR6 = mlPoolR();
  T.p6kSeen = !!mlK();
  T.farDoorX = +mlFarDoor().x.toFixed(1);
  T.farDoorZ = +mlFarDoor().z.toFixed(1);
  T.mlHookErr = mlHookErr; T.mlHookRuns = mlHookRuns;
});

/* ═══ debug ═══ */
let mlDbgDone = false;
function mlExtendDebugOnce() {
  if (mlDbgDone || !window.__fmDebug) return;
  mlDbgDone = true;
  Object.assign(window.__fmDebug, {
    warpMothroom() {
      window.__fmDebug.warp(mothRoom.spawn.x, mothRoom.spawn.z);
      P.heading = Math.PI;
      return { x: P.x, z: P.z, floor: +ML_FLOOR_Y.toFixed(2) };
    },
    warpFarStar() {
      const d = mlFarDoor();
      const ox = (typeof d.outX === 'number') ? d.outX : d.x;
      const oz = (typeof d.outZ === 'number') ? d.outZ : d.z + 2.2;
      window.__fmDebug.warp(ox, oz);
      return { x: P.x, z: P.z, door: [d.x, d.z] };
    },
    mothInfo() {
      return {
        st: MOTH.st, hp: MOTH.hp, phase: MOTH.phase, active: MOTH.active,
        defeated: MOTH.defeated, x: +MOTH.x.toFixed(1), z: +MOTH.z.toFixed(1),
        y: +MOTH.y.toFixed(1), body: MOTH.bodyHits,
        waves: MOTH.waveN, spirals: MOTH.spiralN, dives: MOTH.diveN,
        pool: [+ML_POOL.x.toFixed(1), +ML_POOL.z.toFixed(1), ML_POOL.live],
      };
    },
    arcInfo() {
      return {
        q: SAVE ? SAVE.q : -1, starsSeen: !!(SAVE && SAVE.starsSeen),
        starLantern: !!(SAVE && SAVE.starLantern), lit: mlBeaconLitArr(),
        mothDone: !!(SAVE && SAVE.mothDone), lantern6: !!(SAVE && SAVE.lantern6),
        sky: SAVE ? SAVE.sky : -1, tbc6: !!(SAVE && SAVE.tbc6Seen),
        p6k: !!mlK(),
      };
    },
  });
}
</script>
