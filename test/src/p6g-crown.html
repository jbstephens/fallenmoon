  burst(psSpark, S.x, groundH(S.x, S.z) + 2.0, S.z, 18, 2.5, 2.0, 0.5);
  burst(psSparkle, S.x, groundH(S.x, S.z) + 2.4, S.z, 12, 1.4, 1.2, 0.85);
  S.t = Math.min(S.t, 1.6);
  dealStagDamage(12);
}
function stagSwingHits() {
  const S = STAG;
  if (!S.active || S.defeated || S.st === 'gone') return false;
  if (!inSwingArc(S.x, S.z, 4.0, 1.45)) return false;
  if (S.st === 'stagger') { hitStagStunned(); return true; }
  hitStagBody();                                   // body chips ALWAYS land
  return true;
}
function stagEmberDrop() {
  const S = STAG;
  for (const e of S.embers) {
    if (e.t >= 0) continue;
    const a = Math.random() * TAU, d = Math.random() * (K_ARENA.r - 8);
    e.x = clamp(P.x + (Math.random() - 0.5) * 16, K_ARENA.x - K_ARENA.r + 6, K_ARENA.x + K_ARENA.r - 6);
    e.z = clamp(P.z + (Math.random() - 0.5) * 16, K_ARENA.z - K_ARENA.r + 6, K_ARENA.z + K_ARENA.r - 6);
    if (Math.random() < 0.3) { e.x = K_ARENA.x + Math.cos(a) * d; e.z = K_ARENA.z + Math.sin(a) * d; }
    e.t = 0; e.hit = false;
    return;
  }
}
function underBough(x, z) {
  for (let i = 0; i < K_BOUGHS.length; i++) {
    const b = K_BOUGHS[i];
    if (Math.hypot(x - b.x, z - b.z) < b.r) return true;
  }
  return false;
}
function tickStag() {
  const S = STAG;
  if (!S.c || S.defeated) return;
  const inArena = Math.hypot(P.x - K_ARENA.x, P.z - K_ARENA.z) < K_ARENA.r + 2;
  if (!S.active) {
    if (inArena) {
      /* proximity ALWAYS wakes a reachable guardian — the v4 law */
      S.active = true;
      if (S.phase === 0) S.phase = 1;
      S.hp = stagPhaseHp(S.phase);
      S.st = 'wake'; S.t = 0; S.wokeAt = simTick;
      SFX.stagCry(); SFX.stagHuff();
      CAM.shake = 0.32;
      rumble({ duration: 420, strong: 0.7, weak: 0.7 });
      refreshStagBar(false);
    }
    return;
  }
  if (!inArena && Math.hypot(P.x - K_ARENA.x, P.z - K_ARENA.z) > K_ARENA.r + 26) {
    S.active = false; S.st = 'sleep'; S.t = 0;
    S.hp = stagPhaseHp(S.phase);
    S.x = K_PLINTH.x + 6; S.z = K_PLINTH.z - 6;
    for (const e of S.embers) e.t = -1;
    for (const r of STAMPEDE) r.on = false;
    refreshStagBar(false);
    return;
  }
  S.t += DT;
  if (S.flash > 0) S.flash -= DT;
  const d2p = Math.hypot(P.x - S.x, P.z - S.z);
  const faceP = () => { S.ang = angLerp(S.ang, Math.atan2(P.x - S.x, P.z - S.z), 0.07); };
  switch (S.st) {
    case 'wake':
      if (S.t > 1.5) { S.st = 'track'; S.t = 0; }
      break;
    case 'track': {
      faceP();
      const d = d2p || 1;
      const sp = S.phase === 3 ? 3.8 : 3.2;   /* it comes back to you quickly */
      S.x += (P.x - S.x) / d * sp * DT; S.z += (P.z - S.z) / d * sp * DT;
      keepStagIn(S, 3.0);
      if (S.t > (S.phase === 3 ? 1.3 : 1.7)) {
        if (S.phase === 3 && !S.stampDone && d2p < 26) { S.st = 'stampTele'; S.t = 0; SFX.stagCry(); }
        else if (S.phase >= 2 && (S.altT++ & 1) === 0) { S.st = 'leapTele'; S.t = 0; SFX.stagHuff(); }
        else { S.st = 'paw'; S.t = 0; SFX.stagHuff(); }
      }
      break;
    }
    case 'paw':
      /* THE TELEGRAPH: it plants, it paws, it huffs ember smoke, and the
         line it will run down is drawn in the dust before it moves */
      faceP();
      if ((simTick % 4) === 0) {
        psDust.spawn(S.x + Math.sin(S.ang) * 1.6, groundH(S.x, S.z) + 0.2, S.z + Math.cos(S.ang) * 1.6,
          Math.sin(S.ang) * 1.2, 0.7, Math.cos(S.ang) * 1.2, 0.5);
      }
      if ((simTick % 7) === 0) {
        psSpark.spawn(S.x + Math.sin(S.ang) * 2.2, groundH(S.x, S.z) + 1.4, S.z + Math.cos(S.ang) * 2.2,
          Math.sin(S.ang) * 2.0, 0.5, Math.cos(S.ang) * 2.0, 0.45);
      }
      if (S.t > 1.05) {
        S.st = 'charge'; S.t = 0; S.chargeT = 0;
        S.chargeDir = [Math.sin(S.ang), Math.cos(S.ang)];
        SFX.stagCharge();
        rumble({ duration: 260, strong: 0.65, weak: 0.7 });
      }
      break;
    case 'charge': {
      const sp = S.phase === 3 ? 13.5 : 11.5;
      const nx = S.x + S.chargeDir[0] * sp * DT, nz = S.z + S.chargeDir[1] * sp * DT;
      const wall = stagWallHit(nx, nz);
      /* THE END OF A CHARGE IS ALWAYS STONE. A retaining wall, the crag at
         the garden's edge — or, and this is what makes a terraced arena a
         terraced arena, the LIP of a terrace: it comes over the edge at
         eleven metres a second and goes down in a heap. Without this a
         charge straight up the garden's long axis ran out of clock in open
         ground and the player never got the window at all (measured: zero
         stagger in seventy seconds of phase one). */
      const ahead = groundH(nx + S.chargeDir[0] * 2.6, nz + S.chargeDir[1] * 2.6);
      const step = groundH(nx, nz) - ahead;
      const bound = Math.hypot(nx - K_ARENA.x, nz - K_ARENA.z) > K_ARENA.r - 2.5 ||
        crownDG(nx, nz) > K_WALK - 1.5 || Math.abs(step) > 1.0;
      if (!wall && !bound) { S.x = nx; S.z = nz; }
      if ((simTick % 3) === 0) {
        psDust.spawn(S.x, groundH(S.x, S.z) + 0.3, S.z, (Math.random() - 0.5) * 2, 1.0, (Math.random() - 0.5) * 2, 0.5);
      }
      if (Math.hypot(P.x - S.x, P.z - S.z) < 2.2 && P.fy - groundH(P.x, P.z) < 1.2) {
        hurtPlayer(1, S.x, S.z, S.c.root);
      }
      if (wall || bound) {
        /* THE WINDOW: it brains itself on the order's stonework */
        S.wallHits++;
        S.st = 'stagger'; S.t = 0;
        SFX.thump(true); SFX.stagCry();
        CAM.shake = 0.5;
        rumble({ duration: 320, strong: 0.95, weak: 0.55 });
        burst(psDust, S.x, groundH(S.x, S.z) + 0.8, S.z, 28, 3.0, 2.4, 0.9);
        burst(psSpark, S.x, groundH(S.x, S.z) + 2.2, S.z, 14, 2.2, 1.8, 0.5);
      } else if (S.t > 2.8) { S.st = 'track'; S.t = 0; }
      break;
    }
    case 'stagger':
      /* head down, ash pouring off it — the big-damage window */
      if (S.t > 3.0) { S.st = 'track'; S.t = 0; }
      break;
    case 'leapTele':
      faceP();
      if (S.t > 0.7) {
        S.st = 'leap'; S.t = 0; S.leapT = 0;
        S.leapFrom = [S.x, S.z];
        /* it leaps a terrace level: pick the pad the player is NOT on */
        const cand = [[K_PAD.t1.x, K_PAD.t1.z], [K_PAD.t2.x, K_PAD.t2.z], [K_PAD.t3.x, K_PAD.t3.z]];
        let best = cand[0], bd = -1;
        for (const c of cand) {
          const d = Math.hypot(P.x - c[0], P.z - c[1]);
          if (d > bd && d > 6) { bd = d; best = c; }
        }
        S.leapTo = [lerp(best[0], P.x, 0.45), lerp(best[1], P.z, 0.45)];
        SFX.stagCharge();
      }
      break;
    case 'leap': {
      S.leapT += DT / 1.05;
      const k = clamp(S.leapT, 0, 1);
      S.x = lerp(S.leapFrom[0], S.leapTo[0], k);
      S.z = lerp(S.leapFrom[1], S.leapTo[1], k);
      S.ang = Math.atan2(S.leapTo[0] - S.leapFrom[0], S.leapTo[1] - S.leapFrom[1]);
      if (S.leapT >= 1) {
        S.st = 'ember'; S.t = 0; S.emberT = 0;
        SFX.thump(true); SFX.emberFall();
        CAM.shake = 0.3;
        rumble({ duration: 240, strong: 0.7, weak: 0.5 });
        burst(psDust, S.x, groundH(S.x, S.z) + 0.5, S.z, 22, 2.6, 2.0, 0.8);
      }
      break;
    }
    case 'ember':
      /* it rains embers across the terrace; the dead boughs are the roof */
      S.emberT += DT;
      if (S.emberT > 0.55) { S.emberT = 0; stagEmberDrop(); }
      if (S.t > 3.4) { S.st = 'track'; S.t = 0; }
      break;
    case 'stampTele':
      faceP();
      if ((simTick % 5) === 0) SFX.fawnCry();
      if (S.t > 1.1) {
        S.st = 'stampede'; S.t = 0; S.stampT = 0; S.stampDone = true;
        /* the line comes across the arena, square-on: JUMP it */
        S.stampA = Math.atan2(P.x - K_ARENA.x, P.z - K_ARENA.z) + Math.PI;
        for (let i = 0; i < STAMPEDE.length; i++) {
          const r = STAMPEDE[i];
          r.on = true;
          r.ph = (i - (STAMPEDE.length - 1) / 2) * 5.2;
        }
        SFX.stagCry();
        rumble({ duration: 400, strong: 0.5, weak: 0.8 });
      }
      break;
    case 'stampede': {
      S.stampT += DT;
      const ux = Math.sin(S.stampA), uz = Math.cos(S.stampA);
      const px = -uz, pz = ux;
      const travel = -K_ARENA.r - 6 + S.stampT * 24;
      let hitLine = false;
      for (const r of STAMPEDE) {
        if (!r.on) continue;
        r.x = K_ARENA.x + ux * travel + px * r.ph;
        r.z = K_ARENA.z + uz * travel + pz * r.ph;
      }
      /* one line, one jump: the wyrm's tail sweep, on hooves */
      const rel = (P.x - K_ARENA.x) * ux + (P.z - K_ARENA.z) * uz;
      if (Math.abs(rel - travel) < 1.5 && P.fy - groundH(P.x, P.z) < 0.62) hitLine = true;
      if (hitLine) hurtPlayer(1, K_ARENA.x + ux * travel, K_ARENA.z + uz * travel, STAMPEDE[0].c.root);
      if ((simTick % 4) === 0) {
        psDust.spawn(K_ARENA.x + ux * travel + px * (Math.random() - 0.5) * 24,
          groundH(K_ARENA.x + ux * travel, K_ARENA.z + uz * travel) + 0.3,
          K_ARENA.z + uz * travel + pz * (Math.random() - 0.5) * 24, 0, 1.2, 0, 0.6);
      }
      if (travel > K_ARENA.r + 8) {
        for (const r of STAMPEDE) r.on = false;
        S.st = 'track'; S.t = 0;
        S.stampDone = false;
      }
      break;
    }
    case 'roar':
      if (S.t > 1.4) {
        S.phase++;
        S.hp = stagPhaseHp(S.phase);
        refreshStagBar(false);
        S.st = 'track'; S.t = 0;
        if (S.phase === 3) SFX.stagCry();
      }
      break;
  }
  /* the ember rain lives on its own clock, whatever it is doing */
  for (const e of S.embers) {
    if (e.t < 0) continue;
    e.t += DT;
    if (e.t < 0.85) {
      if ((simTick % 5) === 0) {
        psSpark.spawn(e.x + (Math.random() - 0.5) * 1.6, groundH(e.x, e.z) + 3.5 + Math.random() * 2,
          e.z + (Math.random() - 0.5) * 1.6, 0, -2.4, 0, 0.5);
      }
    } else if (!e.hit) {
      e.hit = true;
      burst(psSpark, e.x, groundH(e.x, e.z) + 0.5, e.z, 16, 2.4, 1.4, 0.5);
      SFX.emberFall();
      if (Math.hypot(P.x - e.x, P.z - e.z) < 2.0 && !underBough(P.x, P.z)) {
        hurtPlayer(1, e.x, e.z, STAG.c.root);
      }
    } else if (e.t > 1.5) e.t = -1;
  }
}

<script>
/* ═══════════ p6g/6 — THE CURE, THE GLINT, AND ALL THE WIRING ═══════════ */

/* ── THE CURE: the ash blows off grey-to-warm-brown, the fawns come to
   it, it bows, and it dips the Sliver out of its antlers onto the order's
   own plinth. Nothing dies on the Crown. ── */
function stagAshK(k) {
  /* the material tint carries the cure: cold ash → living warm brown */
  const c = STAG.c.mat.color;
  c.setRGB(lerp(1, 1.22, k), lerp(1, 0.92, k), lerp(1, 0.72, k));
  STAG.c.coalGlow.material.opacity = 0.85 * (1 - k);
}
function finishStagCure() {
  const S = STAG;
  S.defeated = true; S.active = false; S.st = 'gone';
  S.c.root.visible = false;
  S.c.phase.visible = false;
  for (const e of S.embers) e.t = -1;
  for (const r of STAMPEDE) { r.on = false; r.c.root.visible = false; }
  calmStagEyes(1);
  stagAshK(1);
  refreshStagBar(false);
  if (SAVE && !SAVE.stagDone) { SAVE.stagDone = true; storeSave(); }
  /* the Sliver waits on the plinth — the pickup is the player's beat, not
     a gift handed out by a cutscene (the tortoise lesson) */
  sliverItem.visible = !S.sliverTaken;
  sliverItem.scale.setScalar(1.15);
  sliverItem.position.set(plinthSocket[0], plinthSocket[1] + 0.5, plinthSocket[2]);
  sliverItem.rotation.set(-0.4, 0.6, 0.2);
  markCineSeen('stagCure');
}
function tickStagCure(t) {
  const S = STAG, c = S.c;
  /* RULE 5: ALWAYS skippable — but the cure follows a button-mash fight,
     so the window opens at 2 s or a leftover mash skips it unseen */
  if (t > 2.0 && IN.confirm && t < 11.0) { CINE.t = t = 11.0; }
  if (CINE.step === 0) {
    CINE.step = 1;
    S.defeated = true;
    if (SAVE) { SAVE.stagDone = true; storeSave(); }
    for (const e of S.embers) e.t = -1;
    for (const r of STAMPEDE) { r.on = false; r.c.root.visible = false; }
    refreshStagBar(false);
    SFX.stagCry();
  }
  const gy = groundH(S.x, S.z);
  calmStagEyes(clamp(t / 2.2, 0, 1));
  stagAshK(clamp((t - 0.6) / 3.0, 0, 1));
  /* the ash actually leaves it: a year of it, blowing away downwind */
  if (t < 4.2 && (simTick % 2) === 0) {
    psDust.spawn(S.x + (Math.random() - 0.5) * 2.6, gy + 1.4 + Math.random() * 2.4, S.z + (Math.random() - 0.5) * 2.6,
      1.6 + Math.random(), 0.9, 0.7, 1.1);
  }
  if (t > 1.4 && CINE.step === 1) {
    CINE.step = 2;
    /* the fawns come in — cured or not, they were always its herd */
    for (const f of FAWNS) { if (!f.dead) { f.st = 'gather'; f.t = 0; f.cd = 99; } }
  }
  if (CINE.step >= 2) {
    for (const f of FAWNS) {
      if (f.dead || f.st !== 'gather') continue;
      const d = Math.hypot(S.x - f.x, S.z - f.z) || 1;
      if (d > 4.5) {
        f.x += (S.x - f.x) / d * 3.4 * DT; f.z += (S.z - f.z) / d * 3.4 * DT;
      }
      f.ang = Math.atan2(S.x - f.x, S.z - f.z);
      f.y = groundH(f.x, f.z);
    }
  }
  /* the bow, and the dip */
  if (t > 4.4 && t < 7.6) {
    const k = smoothstep(clamp((t - 4.4) / 1.6, 0, 1));
    c.bodyN.rotation.x = k * 0.34;
    c.neckN.rotation.x = k * 0.85;
    if (CINE.step === 2) { CINE.step = 3; SFX.stagBow(); rumble({ duration: 900, strong: 0.3, weak: 0.7 }); }
  }
  if (t >= 6.2 && CINE.step === 3) {
    CINE.step = 4;
    c.phase.visible = false;
    sliverItem.visible = true;
    sliverItem.scale.setScalar(1.15);
    SFX.chime(1.4);
    burst(psSparkle, plinthSocket[0], plinthSocket[1] + 0.6, plinthSocket[2], 22, 1.6, 1.3, 1.2);
  }
  if (CINE.step >= 4) {
    const k = smoothstep(clamp((t - 6.2) / 1.6, 0, 1));
    const hx = S.x + Math.sin(S.ang) * 1.9, hz = S.z + Math.cos(S.ang) * 1.9;
    sliverItem.position.set(lerp(hx, plinthSocket[0], k), lerp(gy + 2.6, plinthSocket[1] + 0.5, k) + Math.sin(k * Math.PI) * 0.8,
      lerp(hz, plinthSocket[2], k));
    sliverItem.rotation.set(-0.4, 0.6 + k * 1.2, 0.2);
  }
  /* and it walks away up the terrace, its herd with it */
  if (t > 8.0) {
    const k = clamp((t - 8.0) / 3.2, 0, 1);
    c.bodyN.rotation.x = lerp(0.34, 0, k);
    c.neckN.rotation.x = lerp(0.85, 0, k);
    const tx = K_PAD.east.x, tz = K_PAD.east.z;
    S.ang = angLerp(S.ang, Math.atan2(tx - S.x, tz - S.z), 0.05);
    S.x += Math.sin(S.ang) * 3.6 * DT; S.z += Math.cos(S.ang) * 3.6 * DT;
    for (const f of FAWNS) {
      if (f.dead || f.st !== 'gather') continue;
      const d = Math.hypot(S.x - f.x, S.z - f.z) || 1;
      if (d > 3.2) { f.x += (S.x - f.x) / d * 4.2 * DT; f.z += (S.z - f.z) / d * 4.2 * DT; }
      f.y = groundH(f.x, f.z);
    }
  }
  c.root.position.set(S.x, groundH(S.x, S.z), S.z);
  c.root.rotation.y = S.ang;
  c.root.visible = true;
  /* ONE slow arc: the plinth in frame, the Stag leaving through it — then
     the last 0.9 s lerps home to the player's own follow pose (CAM.x/y/z,
     untouched through the cine), so endCine has nothing to snap (Rule 5:
     the one-frame cut this ending used to make) */
  const k2 = smoothstep(clamp(Math.min(t, 11.0) / 11.0, 0, 1));
  const aa = lerp(S.ang + Math.PI + 0.6, S.ang + Math.PI - 0.9, k2);
  const rr = lerp(10.5, 8.5, k2);
  const ax = plinthSocket[0] + Math.sin(aa) * rr, ay = plinthSocket[1] + lerp(3.4, 2.4, k2),
    az = plinthSocket[2] + Math.cos(aa) * rr;
  const lx = plinthSocket[0], ly = plinthSocket[1] + lerp(1.0, 0.4, k2), lz = plinthSocket[2];
  if (t <= 11.0) {
    cineCam(ax, ay, az, lx, ly, lz);
  } else {
    const r = smoothstep(clamp((t - 11.0) / 0.9, 0, 1));
    const tx = P.x + Math.sin(P.heading) * 0.35, tz = P.z + Math.cos(P.heading) * 0.35;
    const ty = P.fy + 1.25;
    let cx = lerp(ax, CAM.x, r), cy = lerp(ay, CAM.y, r), cz = lerp(az, CAM.z, r);
    cy = Math.max(cy, groundH(cx, cz) + 0.5);
    cineCam(cx, cy, cz, lerp(lx, tx, r), lerp(ly, ty, r), lerp(lz, tz, r));
  }
  if (t > 11.9) { finishStagCure(); endCine(); }
}

/* ── THE GLINT: the sun you freed shows you the way ── */
function crownGoldBand() {
  try { return (typeof fSunLive !== 'undefined' && fSunLive) && (typeof fSunK === 'number') && fSunK > 0.55; }
  catch (e) { return false; }
}
let glintSeenT = 0, glintPulse = 0;
function onTowerDeck() {
  return typeof TOWER !== 'undefined' &&
    Math.hypot(P.x - TOWER.x, P.z - TOWER.z) < 6.5 && P.fy > _preCrownGroundH(TOWER.x, TOWER.z) + 13;
}
function tickGlint() {
  const live = crownGoldBand();
  if (!live || !SAVE) { glintSeenT = 0; return; }
  if (SAVE.crownGlint) return;
  if (!onTowerDeck() || state !== 'play') { glintSeenT = 0; return; }
  glintSeenT += DT;
  if (glintSeenT < 1.1) return;
  SAVE.crownGlint = true; storeSave();
  SFX.chime(1.6);
  rumble({ duration: 420, strong: 0.25, weak: 0.7 });
  const gy = crownY(K_GLINT.x, K_GLINT.z);
  /* no caption: the camera turns and LOOKS at it, and the quest line
     changes. That is the whole explanation anybody gets. */
  /* the camera stands on the deck's EAST rail — the lookout roof sits in
     the middle of that platform, and a beat that frames the roof instead
     of the light is worse than no beat */
  const gdx = K_GLINT.x - TOWER.x, gdz = K_GLINT.z - TOWER.z;
  const gl = Math.hypot(gdx, gdz) || 1;
  startMicro({
    cam: [TOWER.x + gdx / gl * 4.0, _preCrownGroundH(TOWER.x, TOWER.z) + TOWER.deckY + 1.5,
          TOWER.z + gdz / gl * 4.0],
    look: [K_GLINT.x, gy + 6.8, K_GLINT.z],
    dur: 3.0, at: 0.5,
    onFire() { if (QUEST.q < 13) setQuest(13); },
  });
}

DLG.warden4 = { name: 'THE FIRE WARDEN', lines: [
  'That light’s off the old watch-garden, up on the Crown.',
  'Nothing has caught the sun up there since the wind died.',
], onDone: () => { SAVE.wardenTalked = 4; storeSave(); } };

/* ── interactions ── */
const _preCrownInteract = currentInteract;

        mode: { stair: stairMode, garden: inGardenWalkQ(P.x, P.z) },
      };
    },
  });
}
</script>
