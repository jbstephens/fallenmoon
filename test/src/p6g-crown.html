<script>
/* ═══════════════════════════════════════════════════════════════════════
   PHASE 4, PART ONE — THE FALLS STAIR, THE WIND ORGAN & THE CROWN

   Owns: the gold-hour glint reveal, the Falls Stair dungeon segment, the
   WIND ORGAN puzzle (the rev's heart), the Crown summit region, ember
   fawns, the ASH STAG, and the Sliver pickup.

   Does NOT own: the payoff (re-green, swelter retirement, the living
   Silverrun, the skiff, sky step 4, the end card) — that is
   p6h-green.html, concatenated after this file.

   ARCHITECTURE: extends by wrapping (the p6b/p6c/p6e pattern) — groundH,
   the forest solid authority, inShadeAt, nearestShadeSpot, areaAt,
   collide (the world clamp predates the Crown), currentInteract,
   doInteract, tickPlayer, swingHits, cullChunks, objectivePoint,
   updateCamera, startCine, tickCine, respawnLeftBehind. TWO ground
   authorities, each rendered == physics by construction (makeMeshField):
   the CROWN sheet (always live in its own field) and the FALLS STAIR
   floor (live only while the player is inside the stair volume, because
   the stair climbs over the top of the Falls Hollow and one x,z can only
   answer one height). ONE save derivation pushed into
   window.__worldStateHooks — both ways. ONE telemetry hook.

   WHAT p6h INHERITS (page scope, and none of it is private):
     KROWN · STAIR_IN/L1/L2/L3/OUT · K_TERRACES · K_BEACON · K_SHRINE ·
     K_PLINTH · K_SHADE   — the pinned geography, unchanged
     K_PADS / K_RAMPS / crownY(x,z) / inGardenWalkQ(x,z)  — the garden
     window.__crownPinwheels  — six shrine wheels; spin their rotation.z
       when the wind comes home (this part resets them to 0 on derive, and
       p6h's world hook runs AFTER this one, so it wins)
     sliverItem / buildSliverItem()  — the fourth phase, and its halo in
       userData.halo. While P.carrySliver is true this part rides it on
       Wick's back in state play/dialog/pause ONLY, so a p6h cinematic can
       drive it freely; P.carrySliver derives here from q === 16 &&
       stagDone && sky < 4, so setting sky 4 puts it down for good.
     STAG.sliverTaken  — true from q ≥ 16 or sky ≥ 4
   ═══════════════════════════════════════════════════════════════════════ */
window.__worldStateHooks = window.__worldStateHooks || [];
window.__telemetryHooks = window.__telemetryHooks || [];

/* ── PINNED GEOGRAPHY (authoritative; p6h reads these) ───────────────── */
/* the Crown sits on the plateau above the Dried Falls (CROWN, BASIN and
   the falls face are p6b's). Stair climbs inside the falls rock. */
const KROWN = { x0: 1950, x1: 2350, z0: 1250, z1: 1560 };   // summit bounds
const STAIR_IN  = { x: 1978, z: 1243 };    // the Hollow's upper-gallery crack
const STAIR_L1  = { x: 2002, z: 1268, y: 40 };
const STAIR_L2  = { x: 2024, z: 1294, y: 58 };
const STAIR_L3  = { x: 2046, z: 1320, y: 76 };
const STAIR_OUT = { x: 2066, z: 1342 };    // opens onto the Crown
const K_TERRACES = { x: 2160, z: 1420, r: 60 };   // orchard terraces + arena
const K_BEACON   = { x: 2060, z: 1490, r: 18 };   // beacon ruin (heart)
const K_SHRINE   = { x: 2260, z: 1330, r: 14 };   // pinwheel wind shrine
const K_PLINTH   = { x: 2160, z: 1470 };          // the Sliver plinth (arena crown)
const K_SHADE = [ { x: 2060, z: 1490, r: 6 }, { x: 2160, z: 1420, r: 6 },
                  { x: 2260, z: 1330, r: 5 }, { x: 2070, z: 1345, r: 5 } ];

/* ═══════════════════ THE CROWN'S SHAPE ═══════════════════
   The watch-garden is a set of flat PADS joined by RAMPS, sitting on top
   of the mountain the Parched Forest already models. Everything outside
   the pads is crag: solid by construction, so the only way onto the Crown
   is the stair, and there is no edge to fall off.

   The heightfield rule that keeps this honest: the Crown surface is never
   allowed BELOW the forest's own surface, so p6b's mountain can never
   poke through the garden floor. Verified point-by-point by the probe. */
const K_PADS = [
  { id: 'ledge',  x: 2066, z: 1342, r: 16, y: 141 },   // the stair mouth court
  { id: 'saddle', x: 2112, z: 1370, r: 13, y: 136 },   // the gate through the rim
  /* the three terraces are deliberately NOT touching: the gap between two
     pads IS the terrace face, and a face the Stag can trip over is the
     whole reason a terraced arena is worth building */
  { id: 't1',     x: 2160, z: 1390, r: 16, y: 122 },   // upper orchard terrace
  { id: 't2',     x: 2160, z: 1428, r: 16, y: 117 },   // middle terrace
  { id: 't3',     x: 2158, z: 1470, r: 20, y: 112 },   // lower terrace + the plinth
  { id: 'beacon', x: 2060, z: 1490, r: 18, y: 112 },   // the beacon ruin spur
  { id: 'east',   x: 2232, z: 1384, r: 16, y: 120 },   // the east walk
  { id: 'shrine', x: 2260, z: 1330, r: 16, y: 124 },   // the pinwheel shrine
  { id: 'gate',   x: 2080, z: 1366, r: 7,  y: 135 },   // the notch the stair opens into
];
const K_PAD = {};
for (const p of K_PADS) K_PAD[p.id] = p;
const K_RAMPS = [
  { a: 'gate', b: 'ledge', hw: 6 },
  { a: 'ledge', b: 'saddle', hw: 7 },
  { a: 'saddle', b: 't1', hw: 7 },
  { a: 't1', b: 't2', hw: 8 },
  { a: 't2', b: 't3', hw: 9 },
  { a: 't3', b: 'beacon', hw: 8 },
  { a: 't1', b: 'east', hw: 6.5 },
  { a: 'east', b: 'shrine', hw: 6.5 },
];
for (const r of K_RAMPS) {
  const A = K_PAD[r.a], B = K_PAD[r.b];
  r.ax = A.x; r.az = A.z; r.ay = A.y; r.bx = B.x; r.bz = B.z; r.by = B.y;
}
/* THE VIEW: where the rim is deliberately absent and the ground falls
   away, so from the parapet you see the whole world you healed. */
/* Only the ledge gets windows: it is the one lip of the Crown with a
   thousand metres of real world in front of it. Everywhere else the rim
   stays shut — a window with nothing behind it is a hole in the world. */
const K_WINDOWS = [
  { x: 2046, z: 1302, r: 22 },      // north, straight down the falls face
  { x: 2032, z: 1320, r: 20 },      // north-west, over the plateau and the forest
  { x: 2040, z: 1340, r: 16 },      // west
];
const K_GATE = { x: 2076, z: 1362 };   // the stair's threshold onto the Crown
/* crag knobs: the rock the stair's last flight climbs UNDER. Without them
   the top of the stair would surface on the mountainside. */
const K_KNOBS = [
  { x: 2035, z: 1367, r: 22, h: 15 },
  { x: 2010, z: 1382, r: 18, h: 12 },
  { x: 1992, z: 1352, r: 16, h: 10 },
];
const KBOX = { x0: 2000, z0: 1270, x1: 2320, z1: 1540 };
const K_WALK = 8;        // the walkable fringe past every pad/ramp edge
const K_SKIRT = 30;      // how far the crag skirt runs before it is mountain again

const K_ARENA = { x: 2160, z: 1428, r: 46 };      // the Ash Stag's ground
/* the orchard's dead boughs — cover from the ember rain (and the shade
   they still throw). Their trunks are colliders; standing under one is
   what keeps embers off you. */
/* THE ORCHARD, in the order's own rows. Dead as it is, it still throws
   shade — which makes the terraces survivable in the swelter AND is the
   cover the ember rain cannot reach through. One thing, two jobs, and the
   plinth court left deliberately bare: the Stag's own patch of open sun. */
const K_BOUGHS = [
  [2144, 1380], [2160, 1377], [2176, 1380], [2140, 1398], [2180, 1398],
  [2142, 1418], [2160, 1414], [2178, 1418], [2142, 1440], [2178, 1440],
  [2140, 1458], [2178, 1460], [2138, 1484], [2180, 1484],
].map(([x, z]) => ({ x, z, r: 6.4 }));
/* retaining walls along the terrace lips: what the Stag brains itself on */
const K_WALLS = [
  { ax: 2136, az: 1409, bx: 2152, bz: 1409, y: 122 },
  { ax: 2170, az: 1409, bx: 2186, bz: 1409, y: 122 },
  { ax: 2136, az: 1449, bx: 2150, bz: 1449, y: 117 },
  { ax: 2172, az: 1449, bx: 2186, bz: 1449, y: 117 },
];

const _preCrownGroundH = groundH;
const _preCrownFSolid = window.__forestSolid;
const _preCrownInShade = inShadeAt;
const _preCrownNearShade = nearestShadeSpot;
const _preCrownAreaAt = areaAt;

/* ── distances into the garden ── */
function kPadD(p, x, z) { return Math.hypot(x - p.x, z - p.z) - p.r; }
const _kseg = [0, 0];
function kRampD(r, x, z) {
  const dx = r.bx - r.ax, dz = r.bz - r.az;
  const L2 = dx * dx + dz * dz || 1;
  const t = clamp(((x - r.ax) * dx + (z - r.az) * dz) / L2, 0, 1);
  _kseg[0] = t;
  _kseg[1] = Math.hypot(x - (r.ax + dx * t), z - (r.az + dz * t));
  return _kseg[1] - r.hw;
}
/* distance OUTSIDE the garden footprint: 0 anywhere on a pad or a ramp */
function crownDG(x, z) {
  let best = 1e9;
  for (let i = 0; i < K_PADS.length; i++) best = Math.min(best, kPadD(K_PADS[i], x, z));
  for (let i = 0; i < K_RAMPS.length; i++) best = Math.min(best, kRampD(K_RAMPS[i], x, z));
  return Math.max(0, best);
}
/* the garden height: inverse-square blend of pads and ramps. Flat on a pad
   (the nearest source outweighs everything else by three orders), a clean
   ramp between two, and continuous everywhere — one function, so the
   rendered sheet and the ground the player walks are the same surface. */
function crownBlend(x, z) {
  let ws = 0, hs = 0;
  for (let i = 0; i < K_PADS.length; i++) {
    const p = K_PADS[i];
    const d = Math.max(0.7, kPadD(p, x, z));
    const w = 1 / (d * d);
    ws += w; hs += w * p.y;
  }
  for (let i = 0; i < K_RAMPS.length; i++) {
    const r = K_RAMPS[i];
    const d = Math.max(0.7, kRampD(r, x, z));
    const w = 1 / (d * d);
    ws += w; hs += w * lerp(r.ay, r.by, smoothstep(_kseg[0]));
  }
  return hs / ws;
}
function crownRimK(x, z) {
  let k = 1;
  for (let i = 0; i < K_WINDOWS.length; i++) {
    const w = K_WINDOWS[i];
    const d = Math.hypot(x - w.x, z - w.z);
    if (d < w.r) k = Math.min(k, smoothstep(clamp((d - w.r * 0.55) / (w.r * 0.45), 0, 1)));
  }
  return k;
}
function crownRaw(x, z) {
  const g = crownBlend(x, z);
  const f = _forestSheetH(x, z) + 0.25;
  const dG = crownDG(x, z);
  let y;
  if (dG <= K_WALK) y = g;
  else {
    /* THE RIM. It is not decoration: the world simply ENDS south and east
       of here, and a garden on a mountain top with a low wall shows the
       player the sky where the ground should be. High enough that from
       anywhere inside, the crag — not the void — is what the eye falls on. */
    const t = smoothstep(clamp((dG - K_WALK) / K_SKIRT, 0, 1));
    const rise = 27 * crownRimK(x, z) * Math.sin(Math.PI * clamp((dG - K_WALK) / (K_SKIRT * 0.92), 0, 1));
    y = lerp(g, f, t) + rise;
  }
  for (let i = 0; i < K_KNOBS.length; i++) {
    const k = K_KNOBS[i];
    const d = Math.hypot(x - k.x, z - k.z);
    if (d < k.r * 2.2) y = Math.max(y, f + k.h * Math.exp(-(d * d) / (k.r * k.r)));
  }
  /* worn stone and dry grass: gentle, so a 3 m lattice can carry it — and
     ironed flat at the threshold, where the stair's floor has to meet the
     Crown's without a step under the doorway */
  const nAmp = smoothstep(clamp((Math.hypot(x - K_GATE.x, z - K_GATE.z) - 3) / 7, 0, 1));
  y += (vnoise(x * 0.07, z * 0.07) * 0.42 + vnoise(x * 0.23 + 4, z * 0.23) * 0.12) * nAmp;
  return Math.max(y, f);
}
/* the forest's own sheet, read straight (never through the wrapped chain —
   the Falls Hollow lives under part of this box and must not answer for
   the mountain's outside surface) */
function _forestSheetH(x, z) { return forestHMesh(x, z); }

/* 2 m triangles across the garden, 4 m across the crag: the sheet carries
   its own colour per vertex, so the lattice IS the texture resolution —
   at 6 m the terraces read as one poured plane no matter what is painted
   on them. */
const K_FINE = (x, z) => crownDG(x, z) < 18;
const crownHMesh = makeMeshField(crownRaw, KBOX.x0, KBOX.z0, KBOX.x1, KBOX.z1, 4, K_FINE);
function inKBox(x, z) { return x > KBOX.x0 && x < KBOX.x1 && z > KBOX.z0 && z < KBOX.z1; }
function inCrownFieldQ(x, z) { return inKBox(x, z) && crownDG(x, z) < K_SKIRT + 8; }
function inGardenWalkQ(x, z) { return inKBox(x, z) && crownDG(x, z) <= K_WALK; }
function crownY(x, z) { return crownHMesh(x, z); }

/* ═══════════════════ THE FALLS STAIR ═══════════════════
   Six nodes, five flights, climbing 110 m inside the rock the water used
   to pour over. The pinned landings carry the wind organ; the last two
   turns are the order's old rope-lift shafts. */
const S_NODES = [
  { id: 'mouth', x: 1982.5, z: 1248.5, y: 0, r: 3.6 },     // y set from the hollow floor
  { id: 'l1', x: STAIR_L1.x, z: STAIR_L1.z, y: STAIR_L1.y, r: 7.5 },
  { id: 'l2', x: STAIR_L2.x, z: STAIR_L2.z, y: STAIR_L2.y, r: 9.0 },
  { id: 'l3', x: STAIR_L3.x, z: STAIR_L3.z, y: STAIR_L3.y, r: 10.0 },
  { id: 'a', x: 1988, z: 1348, y: 100, r: 5.0 },
  { id: 'b', x: 2012, z: 1382, y: 120, r: 5.0 },
  { id: 'out', x: K_GATE.x, z: K_GATE.z, y: 135, r: 4.0 },
];
const S_NODE = {};
for (const n of S_NODES) S_NODE[n.id] = n;
S_NODE.mouth.y = _preCrownGroundH(S_NODE.mouth.x, S_NODE.mouth.z) + 0.05;
S_NODE.out.y = crownY(S_NODE.out.x, S_NODE.out.z);
const S_LEGS = [];
for (const [a, b] of [['mouth', 'l1'], ['l1', 'l2'], ['l2', 'l3'], ['l3', 'a'], ['a', 'b'], ['b', 'out']]) {
  const A = S_NODE[a], B = S_NODE[b];
  S_LEGS.push({ a, b, ax: A.x, az: A.z, ay: A.y, bx: B.x, bz: B.z, by: B.y, hw: 3.0 });
}
const SBOX = { x0: 1972, z0: 1236, x1: 2076, z1: 1396 };
const S_LAND_H = 9.2;      // a landing's headroom (tall: the pipes live there)
const S_LEG_H = 6.4;       // a flight's headroom
/* the two doorways duck: a low throat is what makes a doorway read as one,
   and it keeps the stair's cap under the mountain's own skin at the top */
function sHead(id) { return id === 'mouth' ? 3.6 : id === 'out' ? 3.4 : S_LAND_H; }

function sLegT(l, x, z) {
  const dx = l.bx - l.ax, dz = l.bz - l.az;
  const L2 = dx * dx + dz * dz || 1;
  const t = clamp(((x - l.ax) * dx + (z - l.az) * dz) / L2, 0, 1);
  _kseg[0] = t;
  _kseg[1] = Math.hypot(x - (l.ax + dx * t), z - (l.az + dz * t));
  return _kseg[1];
}
/* the two throats: the last stretch at either doorway, where the stair is
   within touching distance of the open air. Nothing is capped there — the
   portal frame is the lintel, and a cap would be a black slab lying on
   the mountainside (measured: 4.3 m of it, at the exit). */
function stairThroatQ(x, z) {
  return Math.hypot(x - S_NODES[0].x, z - S_NODES[0].z) < S_NODES[0].r + 4.0 ||
    Math.hypot(x - S_NODES[6].x, z - S_NODES[6].z) < S_NODES[6].r + 7.5;
}
function stairOpenCore(x, z) {
  for (let i = 0; i < S_NODES.length; i++) {
    const n = S_NODES[i];
    if (Math.hypot(x - n.x, z - n.z) < n.r + 0.6) return true;
  }
  for (let i = 0; i < S_LEGS.length; i++) {
    if (sLegT(S_LEGS[i], x, z) < S_LEGS[i].hw) return true;
  }
  return false;
}
function inStairFieldQ(x, z) {
  if (!(x > SBOX.x0 && x < SBOX.x1 && z > SBOX.z0 && z < SBOX.z1)) return false;
  for (let i = 0; i < S_NODES.length; i++) {
    const n = S_NODES[i];
    if (Math.hypot(x - n.x, z - n.z) < n.r + 3.0) return true;
  }
  for (let i = 0; i < S_LEGS.length; i++) {
    if (sLegT(S_LEGS[i], x, z) < S_LEGS[i].hw + 2.6) return true;
  }
  return false;
}
/* the floor: the same inverse-square blend, so flights and landings meet
   without a step and the mesh is the physics */
function stairFloorRaw(x, z) {
  let ws = 0, hs = 0;
  for (let i = 0; i < S_NODES.length; i++) {
    const n = S_NODES[i];
    const d = Math.max(0.6, Math.hypot(x - n.x, z - n.z) - n.r);
    const w = 1 / (d * d);
    ws += w; hs += w * n.y;
  }
  for (let i = 0; i < S_LEGS.length; i++) {
    const l = S_LEGS[i];
    const d = Math.max(0.6, sLegT(l, x, z) - l.hw);
    const w = 1 / (d * d);
    ws += w; hs += w * lerp(l.ay, l.by, smoothstep(_kseg[0]));
  }
  let h = hs / ws;
  h += vnoise(x * 0.35, z * 0.35) * 0.06;
  return h;
}
const stairHMesh = makeMeshField(stairFloorRaw, SBOX.x0, SBOX.z0, SBOX.x1, SBOX.z1, 4, () => true);
function stairY(x, z) { return stairHMesh(x, z); }
function legHead(l, t) {
  /* a flight is as tall as a flight in the middle and as tall as its
     doorways at the ends */
  const ha = Math.min(S_LEG_H, sHead(l.a)), hb = Math.min(S_LEG_H, sHead(l.b));
  const mid = Math.sin(Math.PI * clamp(t, 0, 1));
  return lerp(lerp(ha, hb, t), S_LEG_H, mid * 0.85);
}
/* the skin of the mountain over the stair: the forest's own surface, or
   the Crown's where the Crown has taken it over */
function stairSkinY(x, z) {
  const f = forestHMesh(x, z);
  return inCrownFieldQ(x, z) ? Math.max(f, crownHMesh(x, z)) : f;
}
function stairCeilY(x, z) {
  /* headroom follows the same blend, taller over the landings — and NEVER
     breaks the surface: at the top the stair runs within a few metres of
     the open air, and a ceiling that surfaces is a black slab lying on the
     mountainside (measured at the exit: 4.3 m of it) */
  let ws = 0, hs = 0;
  for (let i = 0; i < S_NODES.length; i++) {
    const n = S_NODES[i];
    const d = Math.max(0.6, Math.hypot(x - n.x, z - n.z) - n.r);
    const w = 1 / (d * d);
    ws += w; hs += w * (n.y + sHead(n.id));
  }
  for (let i = 0; i < S_LEGS.length; i++) {
    const l = S_LEGS[i];
    const d = Math.max(0.6, sLegT(l, x, z) - l.hw);
    const w = 1 / (d * d);
    const t = _kseg[0];
    ws += w; hs += w * (lerp(l.ay, l.by, smoothstep(t)) + legHead(l, t));
  }
  const h = hs / ws;
  return Math.max(stairY(x, z) + 2.2, Math.min(h, stairSkinY(x, z) - 0.7));
}

/* ── THE DOORS: one per landing, shut until that landing sings ── */
const S_DOORS = [
  { key: 'organ1', from: 'l1', to: 'l2', t: 0.20, r: 3.2 },
  { key: 'organ2', from: 'l2', to: 'l3', t: 0.20, r: 3.2 },
  { key: 'organ3', from: 'l3', to: 'a', t: 0.16, r: 3.4 },
];
for (const d of S_DOORS) {
  const A = S_NODE[d.from], B = S_NODE[d.to];
  d.x = lerp(A.x, B.x, d.t); d.z = lerp(A.z, B.z, d.t);
  d.y = lerp(A.y, B.y, d.t);
  /* _rot's yaw maps a box's width axis to (cos ry, −sin ry): a slab that
     CROSSES a leg at angle θ needs ry = π/2 − θ. The old θ + π/2 is only
     right for axis-aligned legs — on these diagonal flights every slab lay
     ALONG the corridor (7.1 m along, 2.3 m across, measured in-engine) with
     the invisible plug barring the way beside it. */
  d.ry = Math.PI / 2 - Math.atan2(B.z - A.z, B.x - A.x);
}
let organOpen = [false, false, false];      // derived from SAVE in the world hook
const S_DOOR_H = 5.2;                       // the slab's carved height
const S_DOOR_SINK = 6.0;                    // fully below the tread when open
/* RULE 6: the plug follows the VISIBLE slab, not the flag. organOpen is
   the door's INTENT (it drives the slab's animation target); the collider
   asks where the rendered slab actually IS this frame — solid while its
   top still stands above the knee, passable the moment it looks passable.
   Before this the flag opened the way while the slab still stood
   chest-high, and a shut door was an invisible wall under a slab floating
   near the ceiling (the slab's authored y was the leg's LINEAR lerp,
   ~3.5 m above the inverse-square floor — the owner's "walls and doors…
   like I'm on acid", live review 8/18). */
function stairDoorShut(d) {
  const base = d.group ? d.group.position.y
    : (d.baseY !== undefined ? d.baseY : d.y);
  return base + S_DOOR_H > (d.floorY !== undefined ? d.floorY : d.y) + 0.9;
}
function stairPlugAt(x, z) {
  for (let i = 0; i < S_DOORS.length; i++) {
    const d = S_DOORS[i];
    if (!stairDoorShut(d)) continue;
    if (Math.hypot(x - d.x, z - d.z) < d.r) return true;
  }
  return false;
}
/* the crack in the Hollow's upper gallery: shut stone until the gold light
   has been seen from the tower */
let stairInOpen = false;
function stairMouthPlugAt(x, z) {
  if (stairInOpen) return false;
  /* the plug fills the mouth's whole carved disc — a plug even a hand's
     breadth smaller leaves a ring of air that belongs to the stair while
     the crack is still shut, and a player brushing it flips worlds */
  return Math.hypot(x - S_NODE.mouth.x, z - S_NODE.mouth.z) < S_NODE.mouth.r + 0.6;
}

/* ── which world the player is standing in ──

    latheW(md, [[1.05, 1.9], [0.85, 1.7], [0, 1.72]], { seg: 10, x: px, y, z: pz, flat: true, col: C_KDARK });
    plinthSocket = [px, y + 2.0, pz];
    addColl(px, pz, 1.5);
    /* the socket's own cold light */
    lathe(mdG, [[0, 0.02], [1.5, 0]], { seg: 10, x: px, y: y + 1.95, z: pz, col: [0.62, 0.72, 0.95] });
  }

  /* ── THE WIND SHRINE: eight posts, eight carved pinwheels, all frozen ── */
  {
    const sx = K_SHRINE.x, sz = K_SHRINE.z;
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU;
      const px = sx + Math.cos(a) * 8.5, pz = sz + Math.sin(a) * 8.5;
      const y = crownY(px, pz);
      boxW(md, { x: px, y, z: pz, w: 0.22, d: 0.22, h: 2.6 + (i % 3) * 0.3, tw: 0.17, td: 0.17, warm: true,
        ry: a, col: i % 2 ? C_KSTONE : C_KSTONE2, colB: C_KDARK });
      addColl(px, pz, 0.34);
      /* the pinwheel itself, on its own node so the wind can turn it */
      const wheel = new THREE.Group();
      const mdW = MD();
      for (let k = 0; k < 6; k++) {
        const wa = k / 6 * TAU;
        box(mdW, { x: Math.cos(wa) * 0.42, y: Math.sin(wa) * 0.42, z: 0,
          w: 0.34, d: 0.05, h: 0.16, rz: wa + 0.5,
          col: k % 2 ? [0.72, 0.66, 0.5] : [0.58, 0.53, 0.4] });
      }
      lathe(mdW, [[0.16, 0], [0.12, 0.06], [0, 0.09]], { seg: 8, col: C_KBRASS });
      const wm = mdMesh(mdW, TOON);
      wm.frustumCulled = false;
      wheel.add(wm);
      wheel.position.set(px, y + 2.6 + (i % 3) * 0.3 + 0.5, pz);
      wheel.rotation.y = a + Math.PI / 2;
      wheel.visible = false;
      scene.add(wheel);
      K_PINWHEELS.push(wheel);
    }
    /* the shrine stone in the middle: a cupped bowl the wind used to sing in */
    const y = crownY(sx, sz);
    latheW(md, [[2.2, 0], [2.0, 0.6], [1.4, 0.9]], { seg: 12, x: sx, y: y - 0.1, z: sz, flat: true, warm: true,
      col: C_KSTONE, cols: [C_KSTONE2, C_KSTONE] });
    latheW(md, [[1.3, 0.9], [1.0, 0.55], [0, 0.6]], { seg: 12, x: sx, y, z: sz, flat: true, col: C_KDARK });
    addColl(sx, sz, 2.0);
  }

  /* ── the order's small things: benches, a fallen ladder, a rain barrel ── */
  for (const [bx, bz, ba] of [[2078, 1348, 0.6], [2150, 1400, 1.2], [2168, 1452, -0.5], [2246, 1338, 2.1]]) {
    const y = crownY(bx, bz);
    boxW(md, { x: bx, y, z: bz, w: 1.2, d: 0.32, h: 0.46, ry: ba, col: C_KBARK, colB: C_KBARK2 });
    boxW(md, { x: bx - Math.cos(ba) * 1.0, y, z: bz + Math.sin(ba) * 1.0, w: 0.12, d: 0.28, h: 0.42, ry: ba, col: C_KBARK2 });
    boxW(md, { x: bx + Math.cos(ba) * 1.0, y, z: bz - Math.sin(ba) * 1.0, w: 0.12, d: 0.28, h: 0.42, ry: ba, col: C_KBARK2 });
  }
  /* ── THE GROUND'S OWN DETAIL ──
     A watch-garden with nothing on its floor reads as one pale plane from
     every angle — the failure mode this repo keeps rediscovering. Dry
     tufts, kerb stones along every terrace lip, fallen orchard wood and
     loose scree, all baked into the same buffer. */
  {
    const C_TUFT = col(0x8a7440), C_TUFT2 = col(0x6b5a30), C_DEAD = col(0x6d5a3a);
    let placed = 0;
    for (let i = 0; i < 9000 && placed < 1150; i++) {
      const x = KBOX.x0 + rnd() * (KBOX.x1 - KBOX.x0);
      const z = KBOX.z0 + rnd() * (KBOX.z1 - KBOX.z0);
      if (crownDG(x, z) > K_WALK - 1) continue;
      if (Math.hypot(x - K_PLINTH.x, z - K_PLINTH.z) < 4.2) continue;
      const y = crownY(x, z);
      const r = rnd();
      placed++;
      if (r < 0.52) {
        /* a tuft of dry grass: three crossed blades, no two alike */
        const c = rnd() > 0.5 ? C_TUFT : C_TUFT2;
        const s2 = 0.75 + rnd() * 0.7;
        for (let k = 0; k < 3; k++) {
          const a = rnd() * TAU;
          boxW(md, { x: x + Math.cos(a) * 0.12, y: y - 0.05, z: z + Math.sin(a) * 0.12,
            w: 0.035 * s2, d: 0.05 * s2, h: (0.22 + rnd() * 0.26) * s2,
            tw: 0.008, td: 0.008, shx: Math.cos(a) * 0.14, shz: Math.sin(a) * 0.14,
            ry: a, noBottom: true, warm: true, col: k % 2 ? c : C_TUFT2 });
        }
      } else if (r < 0.8) {
        /* a loose stone */
        const R = 0.18 + rnd() * 0.42;
        latheW(md, [[R, 0], [R * 0.8, R * 0.9], [0, R * 1.2]],
          { seg: 5, x, y: y - R * 0.3, z, ry: rnd() * TAU, flat: true, warm: true,
            col: rnd() > 0.5 ? C_KSTONE : C_KSTONE2 });
      } else {
        /* fallen orchard wood */
        boxW(md, { x, y: y + 0.03, z, w: 0.5 + rnd() * 0.7, d: 0.07, h: 0.07,
          ry: rnd() * TAU, rz: (rnd() - 0.5) * 0.2, warm: true, col: C_DEAD });
      }
    }
    /* the terrace lips: a kerb of set stones, broken where the ramps run */
    for (const [z0, y0] of [[1409, 122], [1449, 117]]) {
      for (let x = 2112; x <= 2210; x += 2.4) {
        if (x > 2149 && x < 2171) continue;                 // the ramp's own gap
        if (crownDG(x, z0) > K_WALK) continue;
        const y = crownY(x, z0);
        boxW(md, { x, y: y - 0.35, z: z0, w: 1.1, d: 0.42, h: 0.5 + ((x | 0) % 3) * 0.06,
          ry: 0, warm: true, col: ((x | 0) % 2) ? C_KSTONE : C_KSTONE2, colB: C_KDARK });
      }
    }
  }
  /* ── THE WALK LIMIT (census #16): a low kerb of weathered stones set
     exactly on the crownDG == K_WALK contour — placement DERIVED from the
     same function the collider answers with (Rule 1), so wall and kerb
     cannot drift apart. Rendered ground used to run smoothly on to
     dG≈38 as invisible-wall apron; now the line the world stops at is a
     line on the ground. Baked into this same static mesh: zero extra
     draw calls. ── */
  {
    const kerbSeen = [];
    let ks = 0;
    const tryKerb = (x, z) => {
      const dG = crownDG(x, z);
      if (dG < K_WALK - 0.3 || dG > K_WALK + 0.3) return;      // ON the line only
      if (Math.hypot(x - K_GATE.x, z - K_GATE.z) < 6) return;  // the doorway stays clear
      if (Math.hypot(x - S_NODE.out.x, z - S_NODE.out.z) < 6) return;
      /* the ledge's parapet already draws this line where the view is shut */
      if (kPadD(K_PAD.ledge, x, z) < K_WALK + 1.4 && crownRimK(x, z) <= 0.55) return;
      for (let q = 0; q < kerbSeen.length; q++) {
        const pq = kerbSeen[q];
        const ddx = pq[0] - x, ddz = pq[1] - z;
        if (ddx * ddx + ddz * ddz < 2.4) return;               // ~1.55 m spacing
      }
      kerbSeen.push([x, z]);
      ks++;
      const y = crownY(x, z);
      boxW(md, { x, y: y - 0.28, z, w: 0.6, d: 0.28, h: 0.36 + (ks % 3) * 0.07,
        ry: ks * 1.7, rz: hash2(ks, 5) * 0.06, warm: true,
        col: (ks % 2) ? C_KSTONE2 : C_KSTONE, colB: C_KDARK });
    };
    for (const pp of K_PADS) {
      const n2 = Math.ceil(TAU * (pp.r + K_WALK) / 0.8);
      for (let i = 0; i < n2; i++) {
        const a = i / n2 * TAU;
        tryKerb(pp.x + Math.cos(a) * (pp.r + K_WALK), pp.z + Math.sin(a) * (pp.r + K_WALK));
      }
    }
    for (const rr of K_RAMPS) {
      const len = Math.hypot(rr.bx - rr.ax, rr.bz - rr.az);
      const ux = (rr.bx - rr.ax) / len, uz = (rr.bz - rr.az) / len;
      const n2 = Math.ceil(len / 0.8);
      for (let i = 0; i <= n2; i++) {
        for (const sg of [-1, 1]) {
          tryKerb(rr.ax + ux * len * i / n2 - uz * (rr.hw + K_WALK) * sg,
                  rr.az + uz * len * i / n2 + ux * (rr.hw + K_WALK) * sg);
        }
      }
    }
  }
  crownPropMesh = mdMesh(md, WORLD_MAT, false);
  crownPropMesh.matrixAutoUpdate = false; crownPropMesh.updateMatrix();
  crownPropMesh.visible = false;
  scene.add(crownPropMesh);

  crownGlowMesh = mdMesh(mdG, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.3,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false,
  }), false);
  crownGlowMesh.matrixAutoUpdate = false; crownGlowMesh.updateMatrix();
  crownGlowMesh.visible = false;
  scene.add(crownGlowMesh);
})();

/* ── THE VIEW ──
   From the parapet the whole healed world should be in one frame, but the
   bay is 2.4 km away — past the fog wall and nearly past the far plane.
   So the horizon is AUTHORED: a pale silhouette band ringing the Crown at
   1.6 km, drawn without fog (the sea-line's trick, grown up), carrying the
   sea, the isles, the headland and Finn's lighthouse. Real geometry fades
   into the haze in front of it and the two read as one distance.        */
let crownVista = null;
(function buildCrownVista() {
  const md = MD();
  const R = 1580;
  const cx = 2080, cz = 1360;                 // centred on the ledge
  const y0 = 138;         // eye height on the ledge: the band sits ON the horizon
  const band = (a0, a1, h0, h1, c) => {
    const p0 = [cx + Math.cos(a0) * R, cz + Math.sin(a0) * R];
    const p1 = [cx + Math.cos(a1) * R, cz + Math.sin(a1) * R];
    pushQuad(md, [p0[0], y0 - 70, p0[1]], [p1[0], y0 - 70, p1[1]],
      [p1[0], y0 + h1, p1[1]], [p0[0], y0 + h0, p0[1]], c);
  };
  /* the sea: a pale silver floor under everything, west and south-west */
  const A0 = Math.PI * 0.62, A1 = Math.PI * 1.42;
  const N = 40;
  for (let i = 0; i < N; i++) {
    const a0 = A0 + (A1 - A0) * i / N, a1 = A0 + (A1 - A0) * (i + 1) / N;
    band(a0, a1, 1.2, 1.2, [0.74, 0.79, 0.82]);
  }
  /* the far hills of the Parched Forest, nearer the north */
  for (let i = 0; i < 22; i++) {
    const a0 = Math.PI * 1.10 + i * 0.026, a1 = a0 + 0.028;
    const h = 16 + Math.sin(i * 0.9) * 8 + Math.sin(i * 0.31 + 1.2) * 6;
    const h1 = 16 + Math.sin((i + 1) * 0.9) * 8 + Math.sin((i + 1) * 0.31 + 1.2) * 6;
    band(a0, a1, h, h1, [0.60, 0.58, 0.51]);
  }
  /* the drowned isles, low on the water */
  for (const [aa, w, h] of [[3.02, 0.035, 3.2], [3.20, 0.025, 2.2], [3.44, 0.045, 4.0],
                            [3.70, 0.02, 1.8], [3.92, 0.03, 2.8]]) {
    band(aa, aa + w * 0.5, h * 0.5, h, [0.56, 0.57, 0.55]);
    band(aa + w * 0.5, aa + w, h, h * 0.4, [0.56, 0.57, 0.55]);
  }
  /* Brightharbor's headland, and Finn's lighthouse standing on it */
  band(3.30, 3.36, 5, 8, [0.60, 0.58, 0.50]);
  band(3.36, 3.42, 8, 5, [0.60, 0.58, 0.50]);
  band(3.364, 3.372, 20, 20, [0.82, 0.80, 0.72]);      // Finn's lighthouse, from 2.4 km
  crownVista = mdMesh(md, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.5, fog: false,
    depthWrite: false, side: THREE.DoubleSide,
  }), false);
  crownVista.renderOrder = -5;
  crownVista.frustumCulled = false;
  crownVista.visible = false;
  scene.add(crownVista);
})();

/* ── THE GLINT: what the low sun catches on the summit ──
   The order's SIGHTING MAST: a watch-mirror on a six-metre brass mast,
   still standing at the parapet. The height is not decoration — from the
   fire-watch tower the Dried Falls' own cliff face stands in the way, and
   the mirror has to clear it by a metre to be a star on the mountain
   instead of a light behind a rock (measured: it needs six metres). */
const K_GLINT = { x: 2054, z: 1330 };
let glintMesh = null, glintCoreMat = null, glintFlareMat = null, glintMount = null;
(function buildGlint() {
  const gy = crownY(K_GLINT.x, K_GLINT.z);
  /* the thing itself */
  const md = MD();
  /* the plinth it stands on, the mast, and the guys the wind used to sing in */
  latheW(md, [[1.1, 0], [1.0, 0.4], [0.7, 0.55]], { seg: 10, x: 0, y: 0, z: 0, flat: true, warm: true,
    col: C_KSTONE, cols: [C_KSTONE2, C_KSTONE] });
  boxW(md, { x: 0, y: 0.5, z: 0, w: 0.22, d: 0.22, h: 5.6, tw: 0.13, td: 0.13, warm: true,
    col: C_KBRASS2, colB: C_KDARK });
  for (let i = 0; i < 3; i++) {
    boxW(md, { x: 0, y: 1.2 + i * 1.5, z: 0, w: 0.3, d: 0.3, h: 0.12, warm: true, col: C_KBRASS });
  }
  for (let i = 0; i < 3; i++) {
    const a = i / 3 * TAU + 0.4;
    boxW(md, { x: Math.cos(a) * 0.55, y: 0.5, z: Math.sin(a) * 0.55, w: 0.05, d: 0.05, h: 4.4,
      rx: Math.sin(a) * 0.12, rz: -Math.cos(a) * 0.12, warm: true, col: C_KBRASS2 });
  }
  latheW(md, [[0.55, 6.1], [0.46, 6.24], [0.22, 6.3]], { seg: 10, x: 0, y: 0, z: 0, flat: true, warm: true, col: C_KBRASS });
  for (let i = 0; i < 3; i++) {
    boxW(md, { x: 0, y: 6.2 + i * 0.02, z: 0, w: 0.66 - i * 0.06, d: 0.06, h: 0.66 - i * 0.06,
      rx: -0.9, ry: 0.6, warm: true, col: i === 2 ? C_KPALE : C_KBRASS2 });
  }
  glintMount = mdMesh(md, WORLD_MAT, false);
  glintMount.frustumCulled = false;
  glintMount.position.set(K_GLINT.x, gy, K_GLINT.z);
  glintMount.visible = false;
  scene.add(glintMount);
  addColl(K_GLINT.x, K_GLINT.z, 0.9);
  /* the star it throws */
  glintMesh = new THREE.Group();
  glintCoreMat = new THREE.MeshBasicMaterial({
    map: DOT_TEX, transparent: true, opacity: 0, fog: false,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const core = new THREE.Mesh(new THREE.PlaneGeometry(11, 11), glintCoreMat);
  core.frustumCulled = false;
  glintMesh.add(core);
  glintFlareMat = new THREE.MeshBasicMaterial({
    map: DOT_TEX, transparent: true, opacity: 0, fog: false,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const flare = new THREE.Mesh(new THREE.PlaneGeometry(30, 3.2), glintFlareMat);
  flare.frustumCulled = false;
  glintMesh.add(flare);
  glintMesh.position.set(K_GLINT.x, gy + 6.8, K_GLINT.z);
  glintMesh.visible = false;
  scene.add(glintMesh);
})();

/* ── the chests, the heart, and the salt the seams give up ── */
const crownChest1 = { x: 2186, z: 1398, opened: false, lid: null, group: null };
const crownChest2 = { x: 2252, z: 1318, opened: false, lid: null, group: null };
{

}
FCHESTS.push({ ch: crownChest1, key: 'crownChest1', salt: 5, big: 'SALT CACHE',

FCHESTS.push({ ch: crownChest2, key: 'crownChest2', salt: 6, big: 'THE SHRINE HOARD',

const beaconChest = { x: K_BEACON.x + 1.6, z: K_BEACON.z + 1.2, opened: false, lid: null, group: null, heart: null };
{
  const m = buildChestMesh(beaconChest.x, beaconChest.z, 2.4);

}
const K_SALT_SPOTS = [
  [2148, 1398], [2154, 1404], [2143, 1409],           // the upper terrace seam
  [2170, 1462], [2176, 1468],                          // by the plinth

  [2070, 1352], [2058, 1360],                          // the ledge
];
for (const p of K_SALT_SPOTS) {
  const m = new THREE.Mesh(SALT_GEO, SALT_MAT);
  m.frustumCulled = false;
  m.visible = false;
  const y = crownY(p[0], p[1]) + 0.16;
  m.position.set(p[0], y, p[1]);

  fSalt.push({ x: p[0], z: p[1], got: false, mesh: m, baseY: y, ph: p[0] * 0.31, chimed: false });
}

<script>
/* ═══════════ p6g/3 — BUILDING THE FALLS STAIR ═══════════
   Carved inside the rock the water used to pour over: five flights, three
   tall landings, the bones of the order's rope-lifts, and the AEOLIAN
   PIPES the whole mountain was built to play. Capped over its entire
   footprint — the foundry lesson: no sky from inside a hill, ever.      */
const C_SROCK = col(0x5d5449), C_SROCK2 = col(0x463f37), C_SDARK = col(0x24211d);
const C_SCUT = col(0x7d7466), C_SPALE = col(0x9a927f), C_SMOSS = col(0x4a5340);
const C_SPIPE = col(0x6f6754), C_SROPE = col(0x6b5a3c);
/* PER-LANDING IDENTITY: each landing keeps its own colour temperature —
   L1 lamplight amber, L2 moss green, L3 wind-pale blue — carried by the
   landing's paved floor, its drum liner and its pipe collars, all baked
   into the meshes that already exist (zero extra draw calls). Three
   identical stone rooms up a dark spiral is how a climb stops being a
   place ("disorienting sameness between flights", the 8/18 audit). */
const S_ACCENT = {
  l1: [0.92, 0.72, 0.4], l2: [0.55, 0.74, 0.52], l3: [0.66, 0.78, 0.94],
};

const _sgc = [0, 0, 0];
function stairColor(x, z, y) {
  const n = vnoise(x * 0.3, z * 0.3), f = vnoise(x * 0.9 + 5, z * 0.9);
  mix3(C_SROCK, C_SROCK2, clamp(0.5 + n * 0.7 + f * 0.2, 0, 1), _sgc);
  /* the treads: the order cut steps, and a thousand feet polished them */
  for (let i = 0; i < S_LEGS.length; i++) {
    const l = S_LEGS[i];
    const lat = sLegT(l, x, z);
    if (lat < l.hw + 0.4) {
      const step = (y * 1.6) % 1;
      mix3(_sgc, step < 0.18 ? C_SDARK : C_SCUT, lat < l.hw * 0.7 ? 0.55 : 0.3, _sgc);
    }
  }
  /* the landings are laid floors, pale and swept — each in its own light */
  for (let i = 1; i <= 3; i++) {
    const n2 = S_NODES[i];
    const d = Math.hypot(x - n2.x, z - n2.z);
    if (d < n2.r + 0.5) {
      const k = smoothstep((n2.r + 0.5 - d) / 2.5);
      mix3(_sgc, C_SPALE, 0.55 * k, _sgc);
      const acc = S_ACCENT[n2.id];
      if (acc) mix3(_sgc, acc, 0.18 * k, _sgc);
      if (((x * 0.5) % 1) < 0.08 || ((z * 0.5) % 1) < 0.08) mix3(_sgc, C_SDARK, 0.4, _sgc);
    }
  }
  /* damp where the water still finds its way in */
  if (f < -0.42) mix3(_sgc, C_SMOSS, 0.5, _sgc);
  return _sgc;
}

let stairFloorMesh = null, stairWallMesh = null, stairCapMesh = null;
let stairPropMesh = null, stairDressMesh = null, stairMouthGlow = null;
(function buildStairFloor() {
  const md = MD();
  const gc = (x, z) => {
    const y = stairHMesh(x, z);
    const c = stairColor(x, z, y);
    return [c[0], c[1], c[2], y];
  };
  const cell = (x, z, s) => {
    const c00 = gc(x, z), c10 = gc(x + s, z), c01 = gc(x, z + s), c11 = gc(x + s, z + s);
    pushTriWV(md, x, c00[3], z, x, c01[3], z + s, x + s, c11[3], z + s, c00, c01, c11);
    pushTriWV(md, x, c00[3], z, x + s, c11[3], z + s, x + s, c10[3], z, c00, c11, c10);
  };
  for (let x = SBOX.x0; x < SBOX.x1; x += 4) {
    for (let z = SBOX.z0; z < SBOX.z1; z += 4) {
      if (!(inStairFieldQ(x, z) || inStairFieldQ(x + 4, z) ||
            inStairFieldQ(x, z + 4) || inStairFieldQ(x + 4, z + 4))) continue;
      const h = 2;
      cell(x, z, h); cell(x + h, z, h); cell(x, z + h, h); cell(x + h, z + h, h);
    }
  }
  stairFloorMesh = mdMesh(md, WORLD_MAT, false);
  stairFloorMesh.matrixAutoUpdate = false; stairFloorMesh.updateMatrix();
  stairFloorMesh.visible = false;
  scene.add(stairFloorMesh);
})();

/* ── walls marched along the SAME boundary collision answers (the v4 law),
   inward liners so the flights read as cut passages, and ONE cap over the
   whole footprint so a gap between rocks shows stone shadow, never sky ── */
(function buildStairShell() {
  const md = MD();
  /* the foundry's descent-darkening curve, not its inverse: LIGHT at the
     floor where the eye walks, darkening as the rock rises into the cap.
     The old bands ran dark-at-base → bright-at-top, so every rock's crown
     flared against the black lid and the walls read as strobing noise. */
  const wallRock = (x, z, R0, seedv, base) => {
    latheW(md, [[R0, 0], [R0 * 1.1, 3.0], [R0 * 0.55, 7.0], [0, 9.2]],
      { seg: 6, ex: 0.88, x, y: base - 1.4, z, ry: seedv * 2.13, flat: true, segJitter: 0.09,
        col: C_SROCK2, cols: [C_SROCK, C_SROCK2, C_SDARK] });
  };
  const intrudes = (x, z, R0) => {
    if (stairOpenCore(x, z)) return true;
    for (let p = 0; p < 6; p++) {
      const a = p / 6 * TAU;
      if (stairOpenCore(x + Math.cos(a) * R0 * 0.6, z + Math.sin(a) * R0 * 0.6)) return true;
    }
    return false;
  };
  const tryRock = (x, z, R0, seedv) => {
    if (intrudes(x, z, R0)) return;
    if (Math.hypot(x - S_NODE.mouth.x, z - S_NODE.mouth.z) < S_NODE.mouth.r + 2.2) return;
    if (Math.hypot(x - S_NODE.out.x, z - S_NODE.out.z) < S_NODE.out.r + 2.6) return;
    wallRock(x, z, R0, seedv, stairY(x, z));
  };
  for (let i = 0; i < S_NODES.length; i++) {
    const n = S_NODES[i];
    const cnt = Math.ceil((TAU * (n.r + 2)) / 2.1);
    for (let k = 0; k < cnt; k++) {
      const a = k / cnt * TAU;
      const R0 = 1.3 + (hash2((n.x * 7 + k) | 0, (n.z + k * 3) | 0) * 0.5 + 0.5) * 0.6;
      tryRock(n.x + Math.cos(a) * (n.r + 0.6 + R0), n.z + Math.sin(a) * (n.r + 0.6 + R0), R0, k + a);
    }
  }
  for (let i = 0; i < S_LEGS.length; i++) {
    const l = S_LEGS[i];
    const len = Math.hypot(l.bx - l.ax, l.bz - l.az);
    const ux = (l.bx - l.ax) / len, uz = (l.bz - l.az) / len;
    const px = -uz, pz = ux;
    const cnt = Math.ceil(len / 1.9);
    for (let k = 0; k <= cnt; k++) {
      const t = k / cnt;
      for (const sg of [-1, 1]) {
        const R0 = 1.25 + (hash2((k * 7 + sg * 3) | 0, (l.ax + l.bz) | 0) * 0.5 + 0.5) * 0.55;
        const off = l.hw + R0;
        tryRock(l.ax + ux * len * t + px * off * sg, l.az + uz * len * t + pz * off * sg, R0, k * 2 + sg);
      }
    }
  }
  stairWallMesh = mdMesh(md, WORLD_MAT, false);
  stairWallMesh.matrixAutoUpdate = false; stairWallMesh.updateMatrix();
  stairWallMesh.visible = false;
  scene.add(stairWallMesh);

  /* the liners + the cap, one double-sided dark mesh */
  const mdD = MD();
  /* cc paints the first two corners (the floor pair as called below), ct
     the last two (the ceiling pair): every liner wall carries the same
     light-at-the-tread, dark-at-the-cap gradient the rocks do */
  const quad = (a, b, c, d, cc, ct) => {
    ct = ct || cc;
    mdD.p.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2],
               a[0], a[1], a[2], c[0], c[1], c[2], d[0], d[1], d[2]);
    mdD.c.push(cc[0], cc[1], cc[2], cc[0], cc[1], cc[2], ct[0], ct[1], ct[2],
               cc[0], cc[1], cc[2], ct[0], ct[1], ct[2], ct[0], ct[1], ct[2]);
  };
  /* landings: an inward drum, so a tall room reads as a ROOM — grounded
     light, rising dark, the landing's own accent in the mid band */
  for (let i = 0; i < S_NODES.length; i++) {
    const n = S_NODES[i];
    const H = sHead(n.id);
    const acc = S_ACCENT[n.id];
    const midBand = acc ? mix3(C_SROCK2, acc, 0.24) : C_SROCK2;
    latheW(mdD, [[n.r + 1.4, -0.5], [n.r + 0.9, H * 0.4], [n.r * 0.55, H * 0.86], [0, H + 0.6]], {
      seg: 12, x: n.x, y: n.y, z: n.z, inward: true, flat: true, segJitter: 0.09,
      col: C_SROCK2, cols: [C_SROCK, midBand, C_SDARK],
      skip: (t0) => {
        for (let k = 0; k < S_LEGS.length; k++) {
          const l = S_LEGS[k];
          if (l.a !== n.id && l.b !== n.id) continue;
          const oa = l.a === n.id ? Math.atan2(l.bz - l.az, l.bx - l.ax) : Math.atan2(l.az - l.bz, l.ax - l.bx);
          let d = Math.abs(((t0 - oa) % TAU + TAU) % TAU);
          if (d > Math.PI) d = TAU - d;
          if (d < 0.42) return true;
        }
        return false;
      },
    });
  }
  /* flights: side walls and a ceiling that climbs with the treads */
  for (let i = 0; i < S_LEGS.length; i++) {
    const l = S_LEGS[i];
    const len = Math.hypot(l.bx - l.ax, l.bz - l.az);
    const ux = (l.bx - l.ax) / len, uz = (l.bz - l.az) / len;
    const px = -uz, pz = ux;
    const segs = Math.max(3, Math.ceil(len / 9));
    for (let k = 0; k < segs; k++) {
      const t0 = k / segs, t1 = (k + 1) / segs;
      const y0 = lerp(l.ay, l.by, smoothstep(t0)), y1 = lerp(l.ay, l.by, smoothstep(t1));
      const p0x = l.ax + ux * len * t0, p0z = l.az + uz * len * t0;
      const p1x = l.ax + ux * len * t1, p1z = l.az + uz * len * t1;
      const h0 = stairCeilY(p0x, p0z) - y0, h1 = stairCeilY(p1x, p1z) - y1;
      const throat = stairThroatQ((p0x + p1x) / 2, (p0z + p1z) / 2);
      const lat = l.hw + 1.9;
      for (const side of [-1, 1]) {
        /* one continuous wall, light at the tread and dark at the cap —
           the old per-9m alternation of light/dark panels striped every
           flight ("wall-march density reading as noise", the 8/18 audit) */
        const j = 0.92 + hash2(k * 5 + side + 1, (l.ax + l.bz) | 0) * 0.08;
        const cc = mix3(C_SROCK, C_SROCK2, 0.4);
        cc[0] *= j; cc[1] *= j; cc[2] *= j;
        const ct = mix3(C_SROCK2, C_SDARK, 0.72);
        quad([l.ax + ux * len * t0 + px * lat * side, y0 - 0.6, l.az + uz * len * t0 + pz * lat * side],
             [l.ax + ux * len * t1 + px * lat * side, y1 - 0.6, l.az + uz * len * t1 + pz * lat * side],
             [l.ax + ux * len * t1 + px * lat * side, y1 + h1, l.az + uz * len * t1 + pz * lat * side],
             [l.ax + ux * len * t0 + px * lat * side, y0 + h0, l.az + uz * len * t0 + pz * lat * side], cc, ct);
      }
      /* the ceiling of the flight */
      if (throat) continue;
      const w = l.hw + 3.2;
      quad([l.ax + ux * len * t0 - px * w, y0 + h0, l.az + uz * len * t0 - pz * w],
           [l.ax + ux * len * t1 - px * w, y1 + h1, l.az + uz * len * t1 - pz * w],
           [l.ax + ux * len * t1 + px * w, y1 + h1, l.az + uz * len * t1 + pz * w],
           [l.ax + ux * len * t0 + px * w, y0 + h0, l.az + uz * len * t0 + pz * w],
           mix3(C_SROCK2, C_SDARK, 0.5));
    }
  }
  /* THE CAP. The marched rocks and the liners leave gaps; through every one
     of them, on the foundry's evidence, pours blue sky. One dark lid over
     the whole footprint — held clear of BOTH doorways so their daylight
     stays daylight. */
  {
    /* dark WARM stone, not a black hole: at half of C_SDARK the lid read
       as a void that swallowed the walls under it (every up-shot of the
       8/18 look pass was half pitch black). Still the darkest thing in
       the stair — a gap in the rocks shows stone shadow, never sky — but
       with hue and a little per-block life, it reads as the underside of
       a mountain. */
    const capBlock = (x, z, s) => {
      const y = stairCeilY(x + s / 2, z + s / 2) + 0.5;
      const j = 0.78 + (hash2((x * 0.25) | 0, (z * 0.25) | 0) * 0.5 + 0.5) * 0.3;
      const CAPC = [C_SDARK[0] * j, C_SDARK[1] * j, C_SDARK[2] * j * 0.92];
      quad([x, y, z], [x, y, z + s], [x + s, y, z + s], [x + s, y, z], CAPC);
      quad([x, y, z], [x + s, y, z], [x + s, y, z + s], [x, y, z + s], CAPC);
      const d = 2.6;
      quad([x, y, z], [x + s, y, z], [x + s, y - d, z], [x, y - d, z], CAPC);
      quad([x, y, z + s], [x, y - d, z + s], [x + s, y - d, z + s], [x + s, y, z + s], CAPC);
      quad([x, y, z], [x, y - d, z], [x, y - d, z + s], [x, y, z + s], CAPC);
      quad([x + s, y, z], [x + s, y, z + s], [x + s, y - d, z + s], [x + s, y - d, z], CAPC);
    };
    for (let x = SBOX.x0; x < SBOX.x1; x += 4) {
      for (let z = SBOX.z0; z < SBOX.z1; z += 4) {
        const cx = x + 2, cz = z + 2;
        if (!inStairFieldQ(cx, cz)) continue;
        if (stairThroatQ(cx, cz)) continue;
        capBlock(x, z, 4);
      }
    }
  }
  stairCapMesh = mdMesh(mdD, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }), false);
  stairCapMesh.matrixAutoUpdate = false; stairCapMesh.updateMatrix();
  stairCapMesh.visible = false;
  scene.add(stairCapMesh);
})();

/* ── the portals: a door has to READ as a door from both sides, and what
   you see through it has to be framed light and never a bare hole ── */
(function buildStairPortals() {
  const md = MD();
  const mdG = MD();
  const frame = (x, z, y, th, w, h, warm) => {
    /* th = the leg's own angle, INTO the stair. The jambs stand on the
       ACROSS axis p = (−sin th, cos th) and every box turns ry = π/2 − th
       so its width lies across the doorway (_rot maps width to
       (cos ry, −sin ry); the old code was only right at 45° — the exit's
       lintel lay ALONG the walk direction, the navy slab on the rocks of
       the 8/18 look pass). Stone colours, warm-baked: the un-warmed
       deep-shade bake is what made the frame navy. */
    const px = -Math.sin(th), pz = Math.cos(th);
    const ry = Math.PI / 2 - th;
    for (const s of [-1, 1]) {
      boxW(md, { x: x + px * s * (w + 0.55), y: y - 0.4, z: z + pz * s * (w + 0.55),
        w: 0.9, d: 1.3, h: h + 0.6, ry, warm: true, col: C_SROCK2, colB: C_SDARK });
      boxW(md, { x: x + px * s * (w - 0.05), y: y - 0.4, z: z + pz * s * (w - 0.05),
        w: 0.4, d: 0.9, h: h, ry, warm: true, col: C_SCUT });
    }
    boxW(md, { x, y: y + h, z, w: w + 1.5, d: 1.4, h: 0.9, ry, warm: true, col: C_SROCK2, colB: C_SDARK });
    boxW(md, { x, y: y + h - 0.35, z, w: w + 0.3, d: 0.9, h: 0.45, ry, warm: true, col: C_SCUT });
    /* the light that stands in the doorway — a soft gradient, never a slab */
    const c0 = warm ? [1.0, 0.86, 0.58] : [0.85, 0.90, 1.0];
    for (let i = 0; i < 4; i++) {
      const k = i / 4;
      pushQuad(mdG,
        [x - px * w * (1 - k * 0.2), y + h * k * 0.9, z - pz * w * (1 - k * 0.2)],
        [x + px * w * (1 - k * 0.2), y + h * k * 0.9, z + pz * w * (1 - k * 0.2)],
        [x + px * w * (1 - (k + 0.25) * 0.2), y + h * (k + 0.25) * 0.9, z + pz * w * (1 - (k + 0.25) * 0.2)],
        [x - px * w * (1 - (k + 0.25) * 0.2), y + h * (k + 0.25) * 0.9, z - pz * w * (1 - (k + 0.25) * 0.2)],
        [c0[0] * (1 - k * 0.5), c0[1] * (1 - k * 0.5), c0[2] * (1 - k * 0.5)]);
    }
  };
  const m = S_NODE.mouth, o = S_NODE.out;
  const mAng = Math.atan2(S_NODE.l1.z - m.z, S_NODE.l1.x - m.x);
  frame(m.x, m.z, m.y, mAng, 2.5, 3.4, true);
  const oAng = Math.atan2(o.z - S_NODE.b.z, o.x - S_NODE.b.x);
  frame(o.x - Math.cos(oAng) * 2.2, o.z - Math.sin(oAng) * 2.2, o.y, oAng, 2.5, 3.4, false);
  /* the order's mark over the inner door: eight phases, the fourth cut deep */
  {
    const pmx = -Math.sin(mAng), pmz = Math.cos(mAng);
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU;
      latheW(md, [[i === 3 ? 0.22 : 0.14, 0], [0, 0.1]],
        { seg: 6, x: m.x + pmx * Math.cos(a) * 1.1,
          y: m.y + 3.9 + Math.sin(a) * 1.1, z: m.z + pmz * Math.cos(a) * 1.1,
          flat: true, col: i === 3 ? C_SPALE : C_SCUT });
    }
  }
  stairPropMesh = mdMesh(md, WORLD_MAT, false);
  stairPropMesh.matrixAutoUpdate = false; stairPropMesh.updateMatrix();
  stairPropMesh.visible = false;
  scene.add(stairPropMesh);
  stairMouthGlow = mdMesh(mdG, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.24,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false,
  }), false);
  stairMouthGlow.matrixAutoUpdate = false; stairMouthGlow.updateMatrix();
  stairMouthGlow.visible = false;
  scene.add(stairMouthGlow);
})();
</script>
<script>
/* ═══════════ p6g/4 — THE WIND ORGAN ═══════════
   The mountain is an instrument and it has been silent for a year. A
   chord hums from somewhere above you, always, never explained. Each
   landing has stone vents with shutters you HOLD ✕ to turn; turning bends
   the note, continuously, like tuning a radio. When a note comes true its
   pipe warms; when a landing's notes are all true the landing SINGS and
   its door grinds open. There is no text anywhere in it — the only
   teacher is your ear, and it teaches on the first landing with one vent.

   Tuned for a fumbling seven-year-old (the 15-second-tone law): a window
   about a semitone wide, a note that latches after half a second inside
   it, and a latch that holds whether or not the button is still down. */
const ORG_LO = 165, ORG_SPAN = 4;          // the shutter's full turn = two octaves
const ORG_TOL = 0.30;                      // ≈ a semitone either side
const ORG_LOCK = 0.45;                     // seconds inside the window to latch
const ORG_RATE = 0.62;                     // radians per second while ✕ is held
const ORG_CHORD = [110, 220, 330];         // the hum from above: the dawn call's root
function organFreq(a) {
  let t = (a % TAU + TAU) % TAU;
  return ORG_LO * Math.pow(ORG_SPAN, t / TAU);
}
function organAngFor(f) { return TAU * Math.log(f / ORG_LO) / Math.log(ORG_SPAN); }

const ORGAN = {
  landings: [
    { key: 'organ1', node: 'l1', door: 0, vents: [], sang: false },
    { key: 'organ2', node: 'l2', door: 1, vents: [], sang: false },
    { key: 'organ3', node: 'l3', door: 2, vents: [], sang: false },
  ],
  gust: 0, gustOn: false, grace: 0, near: -1, dawnFired: false,
};
const ORG_VENTS = [];
(function layOutVents() {
  const spec = [
    ['organ1', [[2005.4, 1271.2, 330]]],
    ['organ2', [[2020.6, 1297.6, 275], [2027.8, 1296.6, 440]]],
    ['organ3', [[2041.6, 1324.8, 220], [2047.6, 1326.4, 275], [2051.6, 1321.0, 330]]],
  ];
  for (const [key, list] of spec) {
    const L = ORGAN.landings.find(l => l.key === key);
    for (const [x, z, f] of list) {
      const v = {
        x, z, y: stairY(x, z), freq: f, tAng: organAngFor(f),
        ang: 0, locked: false, lockT: 0, da: 9, wob: 0,
        land: L, group: null, capN: null, glowM: null, ang0: 0, idx: ORG_VENTS.length,
      };
      /* every shutter starts BELOW its note, so holding ✕ walks the pitch
         UP toward true: the distance shrinks the whole way and a child
         hears it closing in. Different offsets, so a landing's vents never
         come true on the same beat. */
      v.ang = (v.tAng - (2.1 + 0.5 * ORG_VENTS.length % 3) + TAU * 2) % TAU;
      v.ang0 = v.ang;
      L.vents.push(v);
      ORG_VENTS.push(v);
    }
  }
})();

/* ── the vents and their pipes ──
   THEIR COLLIDERS ARE MODE-GATED. p4's collider list is flat and has no
   idea about height: a stone drum on the first landing is also a stone
   drum in the Chandelier Vault fifteen metres below it, and one in the
   Wyrm's own basin. They exist only while the player is inside the stair. */
const ORG_COLL = [];
(function buildVents() {
  for (const v of ORG_VENTS) {
    const g = new THREE.Group();
    /* the drum, sunk in the landing floor */
    const md = MD();
    latheW(md, [[1.05, 0], [1.15, 0.35], [1.0, 0.75]],
      { seg: 10, x: 0, y: 0, z: 0, flat: true, col: C_SROCK, cols: [C_SROCK2, C_SROCK] });

    /* the shutter cap: four cut vanes that turn over the mouth */
    const capN = new THREE.Group();
    const mdC = MD();
    latheW(mdC, [[0.98, 0.75], [0.9, 0.9]], { seg: 10, flat: true, col: C_SPALE, cols: [C_SPALE, C_SROCK] });
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * TAU;
      boxW(mdC, { x: Math.cos(a) * 0.5, y: 0.86, z: Math.sin(a) * 0.5, w: 0.42, d: 0.14, h: 0.16,
        ry: a, warm: true, col: i % 2 ? C_SCUT : C_SROCK2 });
    }
    boxW(mdC, { x: 0, y: 0.9, z: 0, w: 0.14, d: 0.14, h: 0.5, tw: 0.09, td: 0.09, warm: true, col: C_SCUT });
    const cap = mdMesh(mdC, WORLD_MAT, false);
    cap.frustumCulled = false;
    capN.add(cap);
    capN.position.y = 0;
    g.add(capN);
    /* the pipe: a carved stone throat climbing into the dark above. Baked
       into the SAME buffer as the drum — only the shutter cap turns, so the
       vent costs two draw calls and not four. */
    const mdP = md;
    latheW(mdP, [[0.55, 1.4], [0.48, 4.2], [0.52, 6.6], [0.44, S_LAND_H + 0.4]],
      { seg: 8, x: 0, y: 0, z: 0, flat: true, segJitter: 0.08,
        col: C_SPIPE, cols: [C_SROCK2, C_SPIPE, C_SPIPE] });
    /* the collars carry the landing's own colour — the climb's wayfinding */
    const vAcc = S_ACCENT[v.land.node];
    const collarC = vAcc ? mix3(C_SCUT, vAcc, 0.45) : C_SCUT;
    for (let i = 0; i < 3; i++) {
      latheW(mdP, [[0.62, 2.0 + i * 2.2], [0.58, 2.25 + i * 2.2]],
        { seg: 8, x: 0, y: 0, z: 0, flat: true, col: collarC });
    }
    const stone = mdMesh(md, WORLD_MAT, false);
    stone.frustumCulled = false;
    g.add(stone);
    /* the warm glow that answers a true note */
    const mdG = MD();
    lathe(mdG, [[0.74, 0.8], [0.66, 1.5]], { seg: 10, col: [1.0, 0.78, 0.36] });
    lathe(mdG, [[0.7, 1.6], [0.62, S_LAND_H]], { seg: 8, col: [0.9, 0.6, 0.24] });
    const glow = mdMesh(mdG, new THREE.MeshBasicMaterial({
      vertexColors: true, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false,
    }), false);
    glow.frustumCulled = false;
    g.add(glow);
    g.position.set(v.x, v.y, v.z);
    g.visible = false;
    scene.add(g);
    v.group = g; v.capN = capN; v.glowM = glow;
    const cl = addColl(v.x, v.z, 0.95);
    cl.off = true;
    ORG_COLL.push(cl);
  }
})();

/* ── the doors: carved slabs that grind down into the tread ──
   The slab STANDS ON THE TREAD it blocks (stairY, the rendered floor) —
   its authored d.y was the leg's linear lerp, which near a landing sits
   ~3.5 m above the real inverse-square floor: door 2 hung in the AIR by
   the ceiling with an invisible wall underneath it. Pale carved stone,
   warm-baked — the standard bake's deep-shade branch cools to navy blue,
   which is what made every slab read as an alien monolith in the dark. */
(function buildStairDoors() {
  for (let i = 0; i < S_DOORS.length; i++) {
    const d = S_DOORS[i];
    d.floorY = stairY(d.x, d.z);
    const md = MD();
    boxW(md, { x: 0, y: 0, z: 0, w: 3.5, d: 0.5, h: S_DOOR_H, tw: 3.2, ry: d.ry, warm: true,
      col: C_SCUT, colB: C_SDARK });
    for (let k = 0; k < 4; k++) {
      boxW(md, { x: 0, y: 0.7 + k * 1.15, z: 0, w: 3.3, d: 0.6, h: 0.16, ry: d.ry, warm: true,
        col: C_SDARK });
    }
    /* how many notes this door is waiting for — carved, not written.
       On BOTH faces, proud of the stone: at depth 0 they sat buried
       inside the half-metre slab and nobody ever saw them. */
    const n = ORGAN.landings[i].vents.length;
    const ux = Math.sin(d.ry), uz = Math.cos(d.ry);      // the slab's normal
    for (const side of [-1, 1]) {
      for (let k = 0; k < n; k++) {
        latheW(md, [[0.34, 0], [0.26, 0.16], [0, 0.22]],
          { seg: 8, x: Math.cos(d.ry) * ((k - (n - 1) / 2) * 0.9) + ux * side * 0.62,
            y: 3.4, z: -Math.sin(d.ry) * ((k - (n - 1) / 2) * 0.9) + uz * side * 0.62,
            flat: true, col: C_SPALE });
      }
    }
    const slab = mdMesh(md, WORLD_MAT, false);
    slab.frustumCulled = false;
    const g = new THREE.Group();
    g.add(slab);
    g.position.set(d.x, d.floorY - 0.25, d.z);
    g.visible = false;
    scene.add(g);
    d.group = g; d.baseY = d.floorY - 0.25; d.k = 0;
  }
})();

/* ── the rope-lift bones and the dry plunge shafts (dressing that says the
   order worked here, and that water once fell down this rock) ── */
(function buildStairDressing() {
  const md = MD();
  const rnd = mulberry32(6041);
  for (let i = 1; i <= 3; i++) {
    const n = S_NODES[i];
    /* a windlass, its rope long since rotted to a stub */
    const a0 = i * 1.7;
    const wx = n.x + Math.cos(a0) * (n.r - 1.8), wz = n.z + Math.sin(a0) * (n.r - 1.8);
    const wy = stairY(wx, wz);
    for (const s of [-1, 1]) {
      boxW(md, { x: wx + Math.cos(a0 + Math.PI / 2) * s * 0.7, y: wy,
        z: wz - Math.sin(a0 + Math.PI / 2) * s * 0.7, w: 0.16, d: 0.16, h: 1.3, warm: true, col: C_SROPE });
    }
    latheW(md, [[0.34, 0.9], [0.34, 1.3]], { seg: 8, x: wx, y: wy, z: wz, ry: a0 + Math.PI / 2,
      ex: 1, flat: true, col: C_SROPE });
    boxW(md, { x: wx, y: wy + 1.1, z: wz, w: 0.06, d: 0.06, h: 0.9, rz: 0.5, warm: true, col: C_SROPE });
    /* coiled rope on the floor */
    for (let k = 0; k < 3; k++) {
      latheW(md, [[0.5 - k * 0.1, k * 0.1], [0.42 - k * 0.1, k * 0.1 + 0.09]],
        { seg: 9, x: wx + 1.4, y: wy, z: wz + 0.6, flat: true, col: C_SROPE });
    }
    /* the dry plunge shaft: a scoured chimney in the ceiling, capped above */
    const sx = n.x + Math.cos(a0 + 2.4) * (n.r - 2.6), sz = n.z + Math.sin(a0 + 2.4) * (n.r - 2.6);
    latheW(md, [[1.6, S_LAND_H - 1.4], [1.5, S_LAND_H + 1.6], [1.7, S_LAND_H + 3.0]],
      { seg: 9, x: sx, y: n.y, z: sz, inward: true, flat: true, segJitter: 0.12, col: C_SROCK2 });
    latheW(md, [[1.75, S_LAND_H + 3.0], [0, S_LAND_H + 3.4]],
      { seg: 9, x: sx, y: n.y, z: sz, inward: true, flat: true, col: C_SDARK });
    /* fallen scree under it */
    for (let k = 0; k < 5; k++) {
      const a = rnd() * TAU, d = rnd() * 2.2;
      const px = sx + Math.cos(a) * d, pz = sz + Math.sin(a) * d;
      latheW(md, [[0.3 + rnd() * 0.3, 0], [0, 0.35 + rnd() * 0.3]],
        { seg: 5, x: px, y: stairY(px, pz), z: pz, flat: true, col: C_SROCK2 });
    }
  }
  /* ── THE TREADS: real nosings, one pale-lipped step per ~1.15 m of rise.
     The floor's colour lattice is 2 m; a 40 cm step cannot live in it, so
     every flight read as a smooth mud ramp (look pass, 8/18). Geometry is
     what makes a stair read as a stair — baked into this same mesh, so it
     costs zero extra draw calls. ── */
  for (let li = 0; li < S_LEGS.length; li++) {
    const l = S_LEGS[li];
    const len = Math.hypot(l.bx - l.ax, l.bz - l.az);
    const ux = (l.bx - l.ax) / len, uz = (l.bz - l.az) / len;
    const ry = Math.PI / 2 - Math.atan2(l.bz - l.az, l.bx - l.ax);   // ACROSS the flight
    const rise = Math.abs(l.by - l.ay);
    const steps = Math.max(2, Math.round(rise / 1.15));
    for (let s = 1; s < steps; s++) {
      /* the altitude this tread sits at, inverted through the smoothstep
         the floor itself uses, so tread and floor can never drift */
      const want = s / steps;
      let lo = 0, hi = 1;
      for (let it = 0; it < 18; it++) {
        const mid2 = (lo + hi) / 2;
        if (smoothstep(mid2) < want) lo = mid2; else hi = mid2;
      }
      const t = (lo + hi) / 2;
      const x = l.ax + ux * len * t, z = l.az + uz * len * t;
      const A = S_NODE[l.a], B = S_NODE[l.b];
      if (Math.hypot(x - A.x, z - A.z) < A.r + 0.6) continue;   // landings stay swept
      if (Math.hypot(x - B.x, z - B.z) < B.r + 0.6) continue;
      let nearDoor = false;
      for (const d of S_DOORS) if (Math.hypot(x - d.x, z - d.z) < 1.4) nearDoor = true;
      if (nearDoor) continue;                                    // no z-fight with a slab
      const y = stairY(x, z);
      boxW(md, { x, y: y - 0.36, z, w: l.hw + 0.7, d: 0.30, h: 0.44, ry, warm: true,
        col: (s % 2) ? C_SCUT : C_SPALE, colB: C_SDARK });
    }
  }
  const m = mdMesh(md, WORLD_MAT, false);
  m.matrixAutoUpdate = false; m.updateMatrix();
  m.frustumCulled = false;
  m.visible = false;
  scene.add(m);
  stairDressMesh = m;
})();

/* ══ the organ's VOICE — continuous, spatialised by the climb ══
   Every other sound in this game is a one-shot. This one has to be there
   the whole time you are inside the mountain, or the puzzle has no
   target: six shutter voices, a three-note hum from above, and the wind
   itself. All lazily built the first time the player is in the stair with
   an audio context alive, and silenced the instant they leave.          */
const ORG_AUD = { built: false, master: null, drone: [], droneG: null, voices: [], gustG: null };
function organAudioBuild() {
  if (ORG_AUD.built || !AC || !master) return;
  ORG_AUD.built = true;
  const out = AC.createGain(); out.gain.value = 0; out.connect(master);
  ORG_AUD.master = out;
  const dg = AC.createGain(); dg.gain.value = 0.55; dg.connect(out);
  ORG_AUD.droneG = dg;
  for (let i = 0; i < ORG_CHORD.length; i++) {
    const o = AC.createOscillator();
    o.type = 'sine'; o.frequency.value = ORG_CHORD[i];
    const g = AC.createGain(); g.gain.value = [0.5, 0.3, 0.2][i];
    o.connect(g); g.connect(dg); o.start();
    ORG_AUD.drone.push(o);
  }
  for (let i = 0; i < ORG_VENTS.length; i++) {
    const o = AC.createOscillator();
    o.type = 'triangle'; o.frequency.value = ORG_VENTS[i].freq;
    const bp = AC.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.7;
    const g = AC.createGain(); g.gain.value = 0;
    o.connect(bp); bp.connect(g); g.connect(out); o.start();
    ORG_AUD.voices.push({ o, g });
  }
  /* the wind through the shafts */
  const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.03 * w) / 1.03; d[i] = last * 3.2; }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = 'bandpass'; lp.frequency.value = 620; lp.Q.value = 0.6;
  const gg = AC.createGain(); gg.gain.value = 0;
  src.connect(lp); lp.connect(gg); gg.connect(out); src.start();
  ORG_AUD.gustG = gg;
}
function organAudioUpdate(inside) {
  if (!ORG_AUD.built) { if (inside) organAudioBuild(); if (!ORG_AUD.built) return; }
  const live = inside && state === 'play';
  /* the hum comes from ABOVE: it swells the higher you climb */
  const climb = clamp((P.fy - S_NODE.mouth.y) / (S_NODE.out.y - S_NODE.mouth.y || 1), 0, 1);
  const want = live ? 0.55 + 0.45 * climb : 0;
  const m = ORG_AUD.master.gain;
  m.value += (want - m.value) * 0.06;
  ORG_AUD.droneG.gain.value = 0.035 + 0.05 * climb;
  for (let i = 0; i < ORG_VENTS.length; i++) {
    const v = ORG_VENTS[i], V = ORG_AUD.voices[i];
    const d = Math.hypot(P.x - v.x, P.z - v.z);
    const near = clamp(1 - (d - 3) / 22, 0, 1);
    V.o.frequency.value = organFreq(v.ang + v.wob);
    const g = live ? 0.055 * near * (v.locked ? 0.85 : 1) : 0;
    V.g.gain.value += (g - V.g.gain.value) * 0.12;
  }
  const gw = (live && ORGAN.gustOn) ? 0.09 : 0;
  ORG_AUD.gustG.gain.value += (gw - ORG_AUD.gustG.gain.value) * 0.05;
}

SFX.ventLock = function () {
  if (!AC) return; const t = AC.currentTime;
  tone(660, t, 0.9, 0.07, 'sine'); tone(990, t + 0.05, 0.7, 0.035, 'sine');
  tone(1320, t + 0.1, 0.5, 0.018, 'sine');
  noiseBurst(t, 0.1, 0.04, 2400, 1400, 2.0);
};
SFX.ventSing = function () {
  if (!AC) return; const t = AC.currentTime;
  [220, 275, 330, 440].forEach((f, i) => tone(f, t + i * 0.06, 2.6 - i * 0.3, 0.06, 'sine'));
  noiseBurst(t, 0.3, 0.05, 700, 1800, 0.7, 'lowpass');
};
SFX.stoneGrind = function () {
  if (!AC) return; const t = AC.currentTime;
  for (let i = 0; i < 10; i++) noiseBurst(t + i * 0.14, 0.2, 0.11, 200 + hash2(i, 7) * 70, 130, 1.8, 'lowpass');
  tone(62, t, 1.5, 0.14, 'sine', null, 44);
};
SFX.dawnCall = function () {
  if (!AC) return; const t = AC.currentTime;
  /* the order's dawn call: the chord opening out, twice, over the drone */
  [110, 220, 275, 330, 440, 550].forEach((f, i) => {
    tone(f, t + i * 0.34, 7.5 - i * 0.5, 0.075 - i * 0.007, 'sine');
    tone(f * 2, t + i * 0.34 + 0.02, 3.5, 0.02, 'sine');
  });
  [330, 440, 550, 660].forEach((f, i) => tone(f, t + 4.2 + i * 0.28, 4.0, 0.045, 'sine'));
  noiseBurst(t + 0.1, 3.4, 0.03, 400, 1600, 0.6, 'lowpass');
};
SFX.windGust = function () {
  if (!AC) return; const t = AC.currentTime;
  noiseBurst(t, 2.2, 0.07, 300, 900, 0.6, 'lowpass');
  noiseBurst(t + 0.4, 1.8, 0.04, 1200, 500, 0.8);
};

/* ── the verb, and what listening to it earns ── */
function organLandingOf(x, z) {
  for (let i = 0; i < ORGAN.landings.length; i++) {
    const n = S_NODE[ORGAN.landings[i].node];
    if (Math.hypot(x - n.x, z - n.z) < n.r + 4) return i;
  }
  return -1;
}
function organVentNear(x, z) {
  let best = null, bd = 3.1;
  for (const v of ORG_VENTS) {
    if (v.locked) continue;
    const d = Math.hypot(x - v.x, z - v.z);
    if (d < bd) { bd = d; best = v; }
  }
  return best;
}
function organSing(L) {
  L.sang = true;
  if (SAVE) { SAVE[L.key] = true; storeSave(); }
  organOpen[L.door] = true;
  SFX.ventSing();
  SFX.stoneGrind();
  CAM.shake = 0.22;
  rumble({ duration: 520, strong: 0.45, weak: 0.8 });
  const n = S_NODE[L.node];
  burst(psSparkle, n.x, n.y + 3.0, n.z, 26, 2.2, 1.6, 1.3);
  if (L.key === 'organ3') startCine('dawnCall');
}
function tickOrgan(ctx) {
  const inside = stairMode;
  ORGAN.near = inside ? organLandingOf(P.x, P.z) : -1;
  /* THE GUSTS, third landing only. Long calms, short gusts, and a grace
     window the moment you arrive: a seven-year-old gets to hear the vents
     before the wind ever touches them. */
  if (ORGAN.near === 2 && !ORGAN.landings[2].sang) {
    if (ORGAN.grace > 0) { ORGAN.grace -= DT; ORGAN.gustOn = false; }
    else {
      ORGAN.gust += DT;
      if (!ORGAN.gustOn && ORGAN.gust > 15) { ORGAN.gustOn = true; ORGAN.gust = 0; SFX.windGust(); }
      else if (ORGAN.gustOn && ORGAN.gust > 6.5) { ORGAN.gustOn = false; ORGAN.gust = 0; }
    }
  } else { ORGAN.gustOn = false; ORGAN.gust = 0; ORGAN.grace = 10; }

  const held = ctx && ctx.id === 'organVent' && IN.atkHeld && state === 'play';
  for (let i = 0; i < ORG_VENTS.length; i++) {
    const v = ORG_VENTS[i];
    if (v.locked) { v.wob = 0; v.da = 0; continue; }
    if (held && ctx.vent === v) {
      v.ang += ORG_RATE * DT;
      if (v.ang > TAU) v.ang -= TAU;
    }
    /* the wind bends what is not yet fixed — audibly, and well past the
       window, so a gust cannot be mistaken for a near miss */
    v.wob = (ORGAN.gustOn && v.land.key === 'organ3')
      ? Math.sin(simTick * 0.021 + i) * 0.42 + Math.sin(simTick * 0.0092 + i * 2) * 0.3 : 0;
    let da = (v.ang + v.wob) - v.tAng;
    da = ((da % TAU) + TAU) % TAU; if (da > Math.PI) da -= TAU;
    v.da = da;
    if (Math.abs(da) < ORG_TOL) {
      v.lockT += DT;
      if (v.lockT >= ORG_LOCK) {
        v.locked = true; v.lockT = 0; v.ang = v.tAng; v.da = 0; v.wob = 0;
        SFX.ventLock();
        rumble({ duration: 140, strong: 0.2, weak: 0.55 });
        burst(psSparkle, v.x, v.y + 1.4, v.z, 14, 1.2, 1.4, 1.1);
      }
    } else v.lockT = Math.max(0, v.lockT - DT * 1.6);
  }
  for (let i = 0; i < ORGAN.landings.length; i++) {
    const L = ORGAN.landings[i];
    if (L.sang) continue;
    let all = true;
    for (const v of L.vents) if (!v.locked) all = false;
    if (all) organSing(L);
  }
  organAudioUpdate(inside);
}

/* ── THE DAWN CALL: when the last landing sings, the whole stair plays ──
   Rebuilt per RULE 5 after the owner's "absolutely incomprehensible":
   the ride DEPARTS FROM THE PLAYER'S OWN SHOT (the follow cam, captured
   at startCine), flies forward-and-up only — l3 → a → b → out, no
   down-then-up doubling back — looks a FULL NODE AHEAD so each place
   reads as it arrives, and comes home by retracing the carved air to the
   exact follow pose before endCine, so there is never a one-frame snap.
   Skippable from 0.9 s ALWAYS, first view included: a skip simply enters
   the homeward leg early. */
const DAWN = {
  ride: 5.4, ret: 0.9,                 // seconds: the climb, the way home
  pts: null, cum: null, total: 1,      // the polyline, arc-length mapped
  backK: 1,                            // where the homeward leg starts
};
function dawnBuildPath() {
  const l3 = S_NODE.l3, na = S_NODE.a, nb = S_NODE.b, out = S_NODE.out;
  /* p0 is the player's own shot — CAM.x/y/z, the live follow camera */
  DAWN.pts = [
    [CAM.x, CAM.y, CAM.z],
    [l3.x, l3.y + 2.8, l3.z],
    [na.x, na.y + 2.6, na.z],
    [nb.x, nb.y + 2.6, nb.z],
    [out.x, out.y + 1.8, out.z],
    /* one more, past the doorway: what the last look is FOR — the garden */
    [K_PAD.gate.x + (K_PAD.saddle.x - K_PAD.gate.x) * 0.5, out.y + 2.2,
     K_PAD.gate.z + (K_PAD.saddle.z - K_PAD.gate.z) * 0.5],
  ];
  DAWN.cum = [0];
  let tot = 0;
  for (let i = 1; i < 5; i++) {         // the camera rides pts 0..4 only
    const A = DAWN.pts[i - 1], B = DAWN.pts[i];
    tot += Math.hypot(B[0] - A[0], B[1] - A[1], B[2] - A[2]);
    DAWN.cum.push(tot);
  }
  DAWN.total = tot || 1;
  DAWN.backK = 1;
}
const _dp = [0, 0, 0], _dl = [0, 0, 0];
function dawnAt(k, out) {
  /* arc-length position on pts 0..4, and the look: a full node ahead */
  const s = clamp(k, 0, 1) * DAWN.total;
  let i = 1;
  while (i < 4 && DAWN.cum[i] < s) i++;
  const f = clamp((s - DAWN.cum[i - 1]) / ((DAWN.cum[i] - DAWN.cum[i - 1]) || 1), 0, 1);
  const A = DAWN.pts[i - 1], B = DAWN.pts[i];
  out[0] = lerp(A[0], B[0], f); out[1] = lerp(A[1], B[1], f); out[2] = lerp(A[2], B[2], f);
  /* look target: the node being approached, easing to the one after it —
     each landing, turn and doorway is READ before the camera gets there */
  const L0 = DAWN.pts[i], L1 = DAWN.pts[Math.min(i + 1, 5)];
  _dl[0] = lerp(L0[0], L1[0], f); _dl[1] = lerp(L0[1], L1[1], f) + 0.8; _dl[2] = lerp(L0[2], L1[2], f);
  return out;
}
function tickDawnCall(t) {
  if (!DAWN.pts) dawnBuildPath();      // safety: a probe can start the cine cold
  if (CINE.step === 0) {
    CINE.step = 1;
    SFX.dawnCall();
    rumble({ duration: 1400, strong: 0.35, weak: 0.7 });
  }
  /* ALWAYS skippable once it has said what it is: skip = go home early */
  if (t > 0.9 && IN.confirm && t < DAWN.ride) {
    DAWN.backK = smoothstep(clamp(t / DAWN.ride, 0, 1));
    CINE.t = t = DAWN.ride;
  }
  if (t <= DAWN.ride) {
    const k = smoothstep(clamp(t / DAWN.ride, 0, 1));
    DAWN.backK = k;
    dawnAt(k, _dp);
    /* the first beat TURNS the shot from the player to the way up — no cut */
    const lb = smoothstep(clamp(t / 0.7, 0, 1));
    const ty = P.fy + 1.25;
    const tx = P.x + Math.sin(P.heading) * 0.35, tz = P.z + Math.cos(P.heading) * 0.35;
    cineCam(_dp[0], _dp[1], _dp[2],
      lerp(tx, _dl[0], lb), lerp(ty, _dl[1], lb), lerp(tz, _dl[2], lb));
  } else {
    /* the way home: back down the same carved air to the player's shot —
       the song returning to the one who played it. Ends EXACTLY on the
       follow pose, so endCine's snap has nothing to snap. */
    const r = smoothstep(clamp((t - DAWN.ride) / DAWN.ret, 0, 1));
    dawnAt(DAWN.backK * (1 - r), _dp);
    const ty = P.fy + 1.25;
    const tx = P.x + Math.sin(P.heading) * 0.35, tz = P.z + Math.cos(P.heading) * 0.35;
    cineCam(_dp[0], _dp[1], _dp[2],
      lerp(_dl[0], tx, r), lerp(_dl[1], ty, r), lerp(_dl[2], tz, r));
  }
  /* THE SONG RUNNING UP THE STAIR: motes streaming past the camera, so a
     dark ride through a mountain reads as a mountain playing */
  if ((simTick % 2) === 0) {
    psSparkle.spawn(_dl[0] + (Math.random() - 0.5) * 4, _dl[1] - 1.6 + Math.random() * 3.4,
      _dl[2] + (Math.random() - 0.5) * 4, 0, 2.4 + Math.random() * 2, 0, 1.3);
  }
  /* the audio beats, re-timed to the forward ride */
  if (CINE.step === 1 && t > 1.5) { CINE.step = 2; SFX.chime(0.8); }        // leaving L3
  if (CINE.step === 2 && t > 3.2) { CINE.step = 3; SFX.chime(1.4); }        // the top turn
  if (CINE.step === 3 && t > 4.5) {
    CINE.step = 4;                                                          // daylight
    SFX.windGust();
    CAM.shake = 0.22;
    rumble({ duration: 700, strong: 0.5, weak: 0.8 });
  }
  if (t > DAWN.ride + DAWN.ret) finishDawnCall();
}
function finishDawnCall() {
  markCineSeen('dawnCall');
  organOpen[2] = true;
  DAWN.pts = null;
  endCine();
  showCaption('The mountain remembers the song.', 3400);
}
</script>
<script>

function buildSliverItem() {
  const g = new THREE.Group();

  /* a crescent so thin it is nearly a line — the moon four nights old */

    const a0 = -1.15 + i / n * 2.3, a1 = -1.15 + (i + 1) / n * 2.3;
    const in0 = R * 0.86 - Math.cos(a0) * 0.1, in1 = R * 0.86 - Math.cos(a1) * 0.1;
    pushQuad(md, [Math.cos(a0) * in0, Math.sin(a0) * in0, 0], [Math.cos(a1) * in1, Math.sin(a1) * in1, 0],
      [Math.cos(a1) * R, Math.sin(a1) * R, 0], [Math.cos(a0) * R, Math.sin(a0) * R, 0],
      i % 2 ? C_SL : C_SL2);
    pushQuad(md, [Math.cos(a0) * in0, Math.sin(a0) * in0, -0.05], [Math.cos(a0) * R, Math.sin(a0) * R, -0.05],
      [Math.cos(a1) * R, Math.sin(a1) * R, -0.05], [Math.cos(a1) * in1, Math.sin(a1) * in1, -0.05],
      i % 2 ? C_SL2 : C_SL);
