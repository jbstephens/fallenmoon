<script>
/* ═══════════════════ p4 — the world: Brightharbor & the Dry Bay ═══════════════════
   Merged BufferGeometry chunks, MeshBasicMaterial + baked vertex colors.
   Hard noon light with colored teal shade, painterly toon-stepped bake.       */

/* ── renderer / scene / lights ── */
const canvas = el('gl');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: false, powerPreference: 'high-performance', stencil: false,
});
renderer.setPixelRatio(1);
renderer.setSize(VW, VH, false);

const scene = new THREE.Scene();
const FOG0 = { col: col(0xf3e6cf), near: 68, far: 185 };
const FOG_GROTTO = { col: col(0x2c3038), near: 10, far: 46 };
scene.fog = new THREE.Fog(0xf3e6cf, FOG0.near, FOG0.far);
scene.background = null;   // sky dome covers

const camera = new THREE.PerspectiveCamera(55, VW / VH, 0.2, 700);

/* only characters are lit; the world is baked (Powder Peak lesson) */
const sunLight = new THREE.DirectionalLight(0xfff0d8, 0.92);
sunLight.position.set(18, 60, 10);
scene.add(sunLight);
const hemiLight = new THREE.HemisphereLight(0xcfdcec, 0xdec49e, 0.42);
scene.add(hemiLight);

/* ── noon bake (world geometry only) ── */
const SUNDIR = (() => { const v = [0.24, 0.94, 0.14]; const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; })();
const SHADOW_DIR = [0.94, 0.34];   // ground direction shadows stretch toward at dusk (normalized-ish)
function bakeCol(nx, ny, nz, c, out) {
  const d = nx * SUNDIR[0] + ny * SUNDIR[1] + nz * SUNDIR[2];
  if (d > 0.55) { out[0] = Math.min(1, c[0] * 1.08 + 0.02); out[1] = Math.min(1, c[1] * 1.04 + 0.01); out[2] = c[2] * 0.98; }
  else if (d > 0.1) { out[0] = Math.min(1, c[0] * 1.0 + 0.01); out[1] = c[1] * 0.97; out[2] = c[2] * 0.95; }
  else if (d > -0.15) { out[0] = c[0] * 0.8; out[1] = c[1] * 0.81; out[2] = c[2] * 0.9; }
  else { out[0] = c[0] * 0.56; out[1] = c[1] * 0.62; out[2] = Math.min(1, c[2] * 0.78 + 0.06); }
}
const _bc = [0, 0, 0];
function pushTriW(md, ax, ay, az, bx, by, bz, cx, cy, cz, c, flip) {
  if (flip) { const t1 = bx, t2 = by, t3 = bz; bx = cx; by = cy; bz = cz; cx = t1; cy = t2; cz = t3; }
  let ux = bx - ax, uy = by - ay, uz = bz - az;
  let vx = cx - ax, vy = cy - ay, vz = cz - az;
  let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const l = Math.hypot(nx, ny, nz) || 1;
  bakeCol(nx / l, ny / l, nz / l, c, _bc);
  md.p.push(ax, ay, az, bx, by, bz, cx, cy, cz);

}
function boxW(md, o) {   // baked-light version of box()

  const sx = o.shx || 0, sz = o.shz || 0;
  const cs = [
    [-w, 0, -d], [w, 0, -d], [w, 0, d], [-w, 0, d],
    [-tw + sx, h, -td + sz], [tw + sx, h, -td + sz], [tw + sx, h, td + sz], [-tw + sx, h, td + sz],

  for (let i = 0; i < 8; i++) {
    const p = _rot(cs[i][0], cs[i][1], cs[i][2], o.rx || 0, o.ry || 0, o.rz || 0);
    cs[i] = [p[0] + o.x, p[1] + o.y, p[2] + o.z];
  }
  const qd = (a, b, c2, dd, cc) => {
    pushTriW(md, a[0], a[1], a[2], b[0], b[1], b[2], c2[0], c2[1], c2[2], cc);
    pushTriW(md, a[0], a[1], a[2], c2[0], c2[1], c2[2], dd[0], dd[1], dd[2], cc);
  };

  if (!o.noBottom) qd(cs[3], cs[2], cs[1], cs[0], o.colB || o.col);
  qd(cs[0], cs[1], cs[5], cs[4], o.col);
  qd(cs[2], cs[3], cs[7], cs[6], o.col);
  qd(cs[1], cs[2], cs[6], cs[5], o.col);
  qd(cs[3], cs[0], cs[4], cs[7], o.col);
}
function latheW(md, prof, o) {
  const seg = o.seg || 8, ex = o.ex || 1;
  const a0 = o.a0 !== undefined ? o.a0 : 0, a1 = o.a1 !== undefined ? o.a1 : TAU;
  const inward = !!o.inward;
  let pyMin = 1e9, pyMax = -1e9;
  for (const p of prof) { pyMin = Math.min(pyMin, p[1]); pyMax = Math.max(pyMax, p[1]); }
  const pyMid = (pyMin + pyMax) / 2 + (o.y || 0);
  const flatPush = (m, ax, ay, az, bx, by, bz, cx, cy, cz, c) => {
    m.p.push(ax, ay, az, bx, by, bz, cx, cy, cz);
    m.c.push(c[0], c[1], c[2], c[0], c[1], c[2], c[0], c[1], c[2]);
  };
  const base = o.flat ? flatPush : (m, ax, ay, az, bx, by, bz, cx, cy, cz, c) =>
    pushTriW(m, ax, ay, az, bx, by, bz, cx, cy, cz, c, false);

  const tri = (A, B, C, c) => {
    const nx = (B[1] - A[1]) * (C[2] - A[2]) - (B[2] - A[2]) * (C[1] - A[1]);
    const ny = (B[2] - A[2]) * (C[0] - A[0]) - (B[0] - A[0]) * (C[2] - A[2]);
    const nz = (B[0] - A[0]) * (C[1] - A[1]) - (B[1] - A[1]) * (C[0] - A[0]);
    const mx = (A[0] + B[0] + C[0]) / 3 - (o.x || 0), mz = (A[2] + B[2] + C[2]) / 3 - (o.z || 0);
    const my = (A[1] + B[1] + C[1]) / 3 - pyMid;

    if (Math.abs(hint) < 1e-8) hint = ny * my;
    const flip = inward ? hint > 0 : hint < 0;
    if (flip) base(md, A[0], A[1], A[2], C[0], C[1], C[2], B[0], B[1], B[2], c);
    else base(md, A[0], A[1], A[2], B[0], B[1], B[2], C[0], C[1], C[2], c);
  };
  for (let i = 0; i < prof.length - 1; i++) {
    const [r0, y0] = prof[i], [r1, y1] = prof[i + 1];
    let c = (o.cols && (o.cols[i] || o.cols[o.cols.length - 1])) || o.col;
    for (let s = 0; s < seg; s++) {
      const t0 = a0 + (a1 - a0) * s / seg, t1 = a0 + (a1 - a0) * (s + 1) / seg;
      if (o.skip && o.skip(t0, t1, i)) continue;

      }
      const p00 = _pt(r0, y0, t0, ex, o), p01 = _pt(r0, y0, t1, ex, o);
      const p10 = _pt(r1, y1, t0, ex, o), p11 = _pt(r1, y1, t1, ex, o);
      if (r0 < 0.0001) tri(p00, p11, p10, c);
      else if (r1 < 0.0001) tri(p00, p01, p10, c);

/* ── key world places ── */
const WHEEL_POS = { x: -38, z: -78 };
const GROTTO_A = { x: 30, z: 150, r: 14 };     // puzzle chamber
const GROTTO_B = { x: 62, z: 166, r: 13 };     // boss arena
const GROTTO_ENT = { x: 30, z: 133 };
const MIRROR_POS = { x: 26, z: 146 };
const KELPWALL = { x: 46.5, z: 158 };
const WRECK = { x: -45, z: 95 };
const REFILL_POOL = { x: 16, z: 26, r: 4.2 };
const FINN_POS = { x: 41.4, z: -16 };
const TOCK_POS = { x: -6.6, z: -29 };
const PEARL_BOAT = { x: -24, z: -10 };
const WAKE_BOAT = { x: 8, z: 5 };

/* ── terrain ── */
const POOLS = [
  REFILL_POOL,
  { x: -26, z: 48, r: 3.4 }, { x: 36, z: 60, r: 3.8 }, { x: -44, z: 80, r: 3.6 },
];
function gauss(d2, s2) { return Math.exp(-d2 / s2); }
function groundH(x, z) {
  if (x > 300) return 0;                          // portrait stage plane
  // land ↔ seabed blend
  const landT = smoothstep((14 - z) / 26);        // 1 on land (z < -12), 0 in bay (z > 14)
  const land = 1.7 + Math.max(0, -z - 12) * 0.045 + vnoise(x * 0.05, z * 0.05) * 0.5;
  const sea = -2.6 + vnoise(x * 0.11, z * 0.11) * 0.35;
  let h = lerp(sea, land, landT);
  // moonwheel hill
  const dwx = x - WHEEL_POS.x, dwz = z - WHEEL_POS.z;
  h += 6.5 * gauss(dwx * dwx + dwz * dwz, 640);
  // tidepool depressions
  for (let i = 0; i < POOLS.length; i++) {
    const p = POOLS[i], dx = x - p.x, dz = z - p.z;
    h -= 1.0 * gauss(dx * dx + dz * dz, p.r * p.r * 1.6);
  }
  // grotto interior floor flattens
  const da = Math.hypot(x - GROTTO_A.x, z - GROTTO_A.z);
  const db = Math.hypot(x - GROTTO_B.x, z - GROTTO_B.z);
  if (da < GROTTO_A.r + 4 || db < GROTTO_B.r + 4) {
    const t = smoothstep(1 - (Math.min(da - GROTTO_A.r, db - GROTTO_B.r)) / 4);
    h = lerp(h, -3.1, clamp(t, 0, 1));
  }
  // rim rises wall the world — smooth dunes/headland, not spikes
  const ex = Math.max(0, Math.abs(x) - 90) + Math.max(0, -z - 90) + Math.max(0, z - 176);
  h += Math.min(26, ex * ex * 0.045) * (0.85 + vnoise(x * 0.04, z * 0.04) * 0.15);
  return h;
}
/* ── grotto interior tests ── */
function distSeg(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az;
  const t = clamp(((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz || 1), 0, 1);
  return Math.hypot(px - (ax + dx * t), pz - (az + dz * t));
}
function inGrottoAt(x, z) {
  if (Math.hypot(x - GROTTO_A.x, z - GROTTO_A.z) < GROTTO_A.r + 1) return true;
  if (Math.hypot(x - GROTTO_B.x, z - GROTTO_B.z) < GROTTO_B.r + 1) return true;
  if (distSeg(x, z, 41, 155.5, 53, 161.5) < 3.4) return true;
  if (distSeg(x, z, GROTTO_ENT.x, GROTTO_ENT.z, GROTTO_A.x, GROTTO_A.z - GROTTO_A.r + 3) < 3.2) return true;
  return false;
}

/* ── shade zones (sanctuary mechanic; capsules that stretch at dusk) ── */
let shadeGrow = 0;      // 0 noon → 1 after the first phase is restored
const SHADE = [
  { x: WAKE_BOAT.x - 1.2, z: WAKE_BOAT.z + 0.5, r: 2.6, tag: 'wakeboat' },
  { x: -24, z: -11.5, r: 2.4, tag: 'pearlboat' },
  { x: 44.5, z: -13.4, r: 2.6, tag: 'lighthouse' },
  { x: -8.3, z: -31.5, r: 1.9, tag: 'well' },
  { x: -37, z: -34.5, r: 2.8, tag: 'house0' }, { x: -21, z: -42.5, r: 2.5, tag: 'house1' },
  { x: 7, z: -40.5, r: 2.5, tag: 'house2' }, { x: 23, z: -30.5, r: 2.4, tag: 'house3' },
  { x: 12, z: 52, r: 2.3, tag: 'rockA' }, { x: -28, z: 72, r: 2.5, tag: 'rockB' },
  { x: 48, z: 84, r: 2.1, tag: 'rockC' },
  { x: WRECK.x + 1.5, z: WRECK.z - 2, r: 3.0, tag: 'wreck' },
  { x: 25, z: 128, r: 2.4, tag: 'grottomouth' },
];
function shadeCapsule(s) {
  const st = s.r * 1.15 * shadeGrow;    // stretched length at full dusk (+~30% area)
  return { ax: s.x, az: s.z, bx: s.x + SHADOW_DIR[0] * st, bz: s.z + SHADOW_DIR[1] * st, r: s.r };
}
function inShadeAt(x, z) {
  if (inGrottoAt(x, z)) return true;
  for (let i = 0; i < SHADE.length; i++) {
    const c = shadeCapsule(SHADE[i]);
    if (distSeg(x, z, c.ax, c.az, c.bx, c.bz) < c.r) return true;
  }
  return false;
}
function nearestShadeSpot(x, z) {
  let best = SHADE[0], bd = Infinity;
  for (const s of SHADE) {
    const d = Math.hypot(x - s.x, z - s.z);
    if (d < bd) { bd = d; best = s; }
  }
  // inside grotto → wake at the grotto mouth pool
  if (inGrottoAt(x, z)) return { x: 25, z: 128 };

/* ── colliders (circles) ── */
const COLL = [];
function addColl(x, z, r) { COLL.push({ x, z, r }); return COLL[COLL.length - 1]; }
function collide(px, pz, pr) {
  let x = px, z = pz;
  for (let i = 0; i < COLL.length; i++) {
    const c = COLL[i];
    if (c.off) continue;
    const dx = x - c.x, dz = z - c.z;
    const d2 = dx * dx + dz * dz, rr = c.r + pr;
    if (d2 < rr * rr && d2 > 0.0001) {
      const d = Math.sqrt(d2);
      x = c.x + dx / d * rr; z = c.z + dz / d * rr;
    }
  }
  return [clamp(x, -98, 98), clamp(z, -98, 184)];
}

/* ── ground colors ── */
const C_GRASS = col(0xaaa464), C_GRASS2 = col(0x8f9155), C_PATH = col(0xd8c8a0),
      C_SAND = col(0xe0d2ae), C_MUD = col(0xc9b593), C_MUD2 = col(0xb5a17f),
      C_CRACK = col(0x94805f), C_POOLBED = col(0x8fb2a2), C_SALT = col(0xefe9dd),
      C_GROTTOFLOOR = col(0x746c60), C_STONE = col(0x9d9689), C_STONE2 = col(0x837c6e),
      C_BRUSH = col(0x857a48);
const PATHS = [
  [[0, -24], [20, -20], [36, -17], [FINN_POS.x - 2, FINN_POS.z]],
  [[0, -24], [-8, -29]],
  [[0, -24], [-14, -44], [-30, -62], [WHEEL_POS.x, WHEEL_POS.z + 4]],
  [[0, -24], [4, -6], [8, 10], [12, 24]],
];
function pathDist(x, z) {
  let d = 1e9;
  for (const path of PATHS) {
    for (let i = 0; i < path.length - 1; i++) {
      d = Math.min(d, distSeg(x, z, path[i][0], path[i][1], path[i + 1][0], path[i + 1][1]));
    }
  }
  return d;
}
const _gc = [0, 0, 0];
function groundColor(x, z, y) {
  if (x > 300) { _gc[0] = 0.58; _gc[1] = 0.56; _gc[2] = 0.53; return _gc; }   // portrait
  if (inGrottoAt(x, z)) {
    mix3(col(0x565048), C_POOLBED, 0.12 + vnoise(x * 0.3, z * 0.3) * 0.1, _gc);
    return _gc;
  }
  const n = vnoise(x * 0.16, z * 0.16);
  const fine = vnoise(x * 0.85 + 3, z * 0.85) * 0.5;
  if (y > 1.1) {          // bleached grass-gold headland
    mix3(C_GRASS, C_GRASS2, clamp(0.5 + 0.6 * vnoise(x * 0.3 + 9, z * 0.3) + fine * 0.4, 0, 1), _gc);
    // dry-brush flecks
    if (vnoise(x * 1.3, z * 1.3 + 7) > 0.55) mix3(_gc, C_BRUSH, 0.45, _gc);
    const pd = pathDist(x, z);
    if (pd < 1.5) mix3(_gc, C_PATH, 0.9, _gc);
    else if (pd < 2.6) mix3(_gc, C_PATH, 0.45 * (1 - (pd - 1.5) / 1.1), _gc);
    return _gc;
  }
  if (y > -1.0) {         // the old tide line — pale sand, salt streaks, tide rings
    mix3(C_SAND, C_MUD, smoothstep((1.0 - y) / 2.0) * 0.5 + fine * 0.2, _gc);
    if (vnoise(x * 0.5 + 11, z * 0.5) > 0.5) mix3(_gc, C_SALT, 0.35, _gc);
    // the sea left its marks: dark rings at old water heights
    for (const ty of [0.55, 0.05, -0.45]) {
      if (Math.abs(y - ty + vnoise(x * 0.4, z * 0.4) * 0.08) < 0.05) mix3(_gc, C_CRACK, 0.5, _gc);
    }
    if (vnoise(x * 1.6 + 5, z * 1.6) > 0.72) mix3(_gc, C_MUD2, 0.5, _gc);  // pebble specks
    return _gc;
  }
  // dry seabed: cracked mud
  mix3(C_MUD, C_MUD2, clamp(0.5 + 0.5 * n + fine * 0.5, 0, 1), _gc);
  const crack = vnoise(x * 0.55, z * 0.55);
  if (Math.abs(crack) < 0.085) mix3(_gc, C_CRACK, 0.9, _gc);
  const crack2 = vnoise(x * 1.1 + 31, z * 1.1 - 8);
  if (Math.abs(crack2) < 0.05) mix3(_gc, C_CRACK, 0.6, _gc);
  for (const p of POOLS) {
    const d = Math.hypot(x - p.x, z - p.z);
    if (d < p.r * 0.75) mix3(_gc, C_POOLBED, 0.85, _gc);
    else if (d < p.r * 1.5) mix3(_gc, C_SALT, 0.7 * (1 - (d - p.r * 0.75) / (p.r * 0.75)), _gc);
  }
  return _gc;
}

/* ── chunked world build ── */
const WORLD_MAT = new THREE.MeshBasicMaterial({ vertexColors: true });
const CHUNK = 80;
const chunkMap = new Map();
const chunks = [];
function chunkFor(x, z) {
  const cx = Math.floor((x + 110) / CHUNK), cz = Math.floor((z + 110) / CHUNK);
  const key = cx + '_' + cz;
  let c = chunkMap.get(key);
  if (!c) {
    c = { md: MD(), cx: cx * CHUNK - 110 + CHUNK / 2, cz: cz * CHUNK - 110 + CHUNK / 2, mesh: null };
    chunkMap.set(key, c); chunks.push(c);
  }
  return c.md;
}
/* ground sheet — per-vertex painterly colors */
function pushTriWV(md, ax, ay, az, bx, by, bz, cx, cy, cz, cA, cB, cC) {
  let ux = bx - ax, uy = by - ay, uz = bz - az;
  let vx = cx - ax, vy = cy - ay, vz = cz - az;
  let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const l = Math.hypot(nx, ny, nz) || 1;
  nx /= l; ny /= l; nz /= l;
  md.p.push(ax, ay, az, bx, by, bz, cx, cy, cz);
  for (const c of [cA, cB, cC]) {
    bakeCol(nx, ny, nz, c, _bc);
    md.c.push(_bc[0], _bc[1], _bc[2]);
  }
}
(function buildGround() {
  const STEP = 2.2;
  const gc = (x, z) => {
    const y = groundH(x, z);
    const c = groundColor(x, z, y);
    return [c[0], c[1], c[2], y];
  };
  for (let x = -110; x < 110; x += STEP) {
    for (let z = -110; z < 186; z += STEP) {
      const md = chunkFor(x + STEP / 2, z + STEP / 2);
      const c00 = gc(x, z), c10 = gc(x + STEP, z), c01 = gc(x, z + STEP), c11 = gc(x + STEP, z + STEP);
      pushTriWV(md, x, c00[3], z, x, c01[3], z + STEP, x + STEP, c11[3], z + STEP, c00, c01, c11);
      pushTriWV(md, x, c00[3], z, x + STEP, c11[3], z + STEP, x + STEP, c10[3], z, c00, c11, c10);
    }
  }
})();

/* ═══════════ props (all baked into chunks) ═══════════ */
const C_WOOD = col(0x8a6f52), C_WOOD2 = col(0x6e5740), C_WOODW = col(0xa9927a),
      C_WHITE = col(0xe8ddc8), C_ROOF = col(0xb26243), C_ROOF2 = col(0x8f4a34),
      C_KELP = col(0x9a8f5a), C_KELP2 = col(0x857a48), C_ROCK = col(0x9a9280),
      C_ROCK2 = col(0x7f786a), C_NET = col(0xb0a184), C_MOON = col(0xd9e2de);

function propHouse(x, z, ry, big) {
  const md = chunkFor(x, z);
  const s = big ? 1.25 : 1, y = groundH(x, z) - 0.25;
  const w = 3.2 * s, d = 2.6 * s, h = 2.5 * s;
  boxW(md, { x, y, z, w, d, h, ry, col: C_WHITE, noBottom: true });
  // plinth of stone at the base
  boxW(md, { x, y: y - 0.05, z, w: w + 0.08, d: d + 0.08, h: 0.4, ry, col: C_STONE2 });
  // door (front face) + two small shuttered windows

let wheelRing = null, wheelSocketNodes = [];
function buildWheelRing() {
  const g = new THREE.Group();

  const NSEG = 24;
  for (let s = 0; s < NSEG; s++) {
    const a0 = s / NSEG * TAU, a1 = (s + 1) / NSEG * TAU;
    const mkring = (rr, tt, c) => {
      const p00 = [Math.cos(a0) * (rr + tt), Math.sin(a0) * (rr + tt), T * 0.55];
      const p01 = [Math.cos(a0) * (rr + tt), Math.sin(a0) * (rr + tt), -T * 0.55];
      const p10 = [Math.cos(a1) * (rr + tt), Math.sin(a1) * (rr + tt), T * 0.55];
      const p11 = [Math.cos(a1) * (rr + tt), Math.sin(a1) * (rr + tt), -T * 0.55];
      const q00 = [Math.cos(a0) * (rr - tt), Math.sin(a0) * (rr - tt), T * 0.55];
      const q01 = [Math.cos(a0) * (rr - tt), Math.sin(a0) * (rr - tt), -T * 0.55];
      const q10 = [Math.cos(a1) * (rr - tt), Math.sin(a1) * (rr - tt), T * 0.55];
      const q11 = [Math.cos(a1) * (rr - tt), Math.sin(a1) * (rr - tt), -T * 0.55];
      pushTriW(md, p00[0], p00[1], p00[2], p10[0], p10[1], p10[2], q10[0], q10[1], q10[2], c);
      pushTriW(md, p00[0], p00[1], p00[2], q10[0], q10[1], q10[2], q00[0], q00[1], q00[2], c);
      pushTriW(md, q01[0], q01[1], q01[2], q11[0], q11[1], q11[2], p11[0], p11[1], p11[2], c);
      pushTriW(md, q01[0], q01[1], q01[2], p11[0], p11[1], p11[2], p01[0], p01[1], p01[2], c);
      pushTriW(md, p00[0], p00[1], p00[2], p01[0], p01[1], p01[2], p11[0], p11[1], p11[2], c);
      pushTriW(md, p00[0], p00[1], p00[2], p11[0], p11[1], p11[2], p10[0], p10[1], p10[2], c);
    };
    mkring(R, T, s % 3 ? C_STONE : C_STONE2);
  }
  // 8 sockets: carved recesses with pale moonglass rims — MERGED into the
  // ring geometry (they turn with it; one draw call for the whole wheel)
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU + Math.PI / 2;
    const sx = Math.cos(a) * R, sy = Math.sin(a) * R;
    const mdS = MD();
    latheW(mdS, [[0.5, 0], [0.42, 0.1], [0.0, 0.12]], { seg: 8, flat: true, col: col(0x30373a) });
    latheW(mdS, [[0.56, -0.02], [0.5, 0.06]], { seg: 8, flat: true, col: C_MOON });
    // rotate socket axis (+y) onto +z, then translate onto the rim
    for (let v = 0; v < mdS.p.length; v += 3) {
      const px2 = mdS.p[v], py2 = mdS.p[v + 1], pz2 = mdS.p[v + 2];
      md.p.push(px2 + sx, -pz2 + sy, py2 + T * 0.56);
    }
    for (let v = 0; v < mdS.c.length; v++) md.c.push(mdS.c[v]);
  }
  const ring = mdMesh(md, WORLD_MAT, false);
  ring.frustumCulled = false;
  g.add(ring);
  const y = groundH(WHEEL_POS.x, WHEEL_POS.z);
  g.position.set(WHEEL_POS.x, y + 4.6, WHEEL_POS.z);
  g.rotation.y = 0.25;          // faces the bay, slightly turned
  scene.add(g);
  return g;
}

/* dry tussocks scattered over the headland grass — texture for the land */
(function tussocks() {
  const rnd = mulberry32(4242);
  let placed = 0;
  for (let i = 0; i < 400 && placed < 90; i++) {
    const x = (rnd() * 2 - 1) * 85, z = -8 - rnd() * 80;
    const y = groundH(x, z);
    if (y < 1.3 || y > 11) continue;
    if (pathDist(x, z) < 2.8) continue;
    let clear = true;
    for (const c of COLL) { if (Math.hypot(x - c.x, z - c.z) < c.r + 0.8) { clear = false; break; } }
    if (!clear) continue;
    const md = chunkFor(x, z);
    const s = 0.5 + rnd() * 0.6;
    const cc = rnd() > 0.5 ? C_BRUSH : C_GRASS2;
    for (let b = 0; b < 3; b++) {
      boxW(md, { x: x + (rnd() - 0.5) * 0.3, y, z: z + (rnd() - 0.5) * 0.3, w: 0.05 * s, d: 0.02, h: (0.35 + rnd() * 0.3) * s, tw: 0.004, td: 0.004, rx: (rnd() - 0.5) * 0.6, ry: rnd() * TAU, col: cc });
    }
    placed++;
  }
})();

  for (let i = 0; i < 5; i++) {
    const a = rnd() * TAU, d = p.r * (0.8 + rnd() * 0.5);
    const sx = p.x + Math.cos(a) * d, sz = p.z + Math.sin(a) * d;
    latheW(md, [[0, 0], [0.22, 0.14], [0.12, 0.5 + rnd() * 0.3], [0, 0.7 + rnd() * 0.3]],
      { seg: 5, x: sx, y: groundH(sx, sz) - 0.05, z: sz, ry: rnd() * TAU, col: C_SALT });
  }
}

  c.mesh = mdMesh(c.md, WORLD_MAT, false);

}
function cullChunks(cx, cz) {
  for (let i = 0; i < chunks.length; i++) {
    const c = chunks[i];
    if (!c.mesh) continue;
    const dx = c.cx - cx, dz = c.cz - cz;
    c.mesh.visible = (dx * dx + dz * dz) < 36100;    // 190 m
  }
}
