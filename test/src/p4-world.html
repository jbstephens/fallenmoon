const SUNDIR = (() => { const v = [0.24, 0.94, 0.14]; const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; })();

/* ── key world places ── */
const WHEEL_POS = { x: -38, z: -78 };
const GROTTO_A = { x: 30, z: 150, r: 14 };     // puzzle chamber
const GROTTO_B = { x: 62, z: 166, r: 13 };     // boss arena
const GROTTO_ENT = { x: 30, z: 133 };
const MIRROR_POS = { x: 26, z: 146 };
const KELPWALL = { x: 46.5, z: 158 };
const WRECK = { x: -45, z: 95 };
const REFILL_POOL = { x: 16, z: 26, r: 4.2 };
const FINN_POS = { x: 39.2, z: -13.6 };   // v2: clear of the kelp door (✕ there must CUT)
const TOCK_POS = { x: -6.6, z: -29 };
const PEARL_BOAT = { x: -24, z: -10 };
const WAKE_BOAT = { x: 8, z: 5 };

/* ── terrain ── */
const POOLS = [
  REFILL_POOL,
  { x: -26, z: 48, r: 3.4 }, { x: 36, z: 60, r: 3.8 }, { x: -44, z: 80, r: 3.6 },

  const landT = smoothstep((14 - z) / 26);        // 1 on land (z < -12), 0 in bay (z > 14)
  const land = 1.7 + Math.max(0, -z - 12) * 0.045 + vnoise(x * 0.05, z * 0.05) * 0.5;
  const sea = -2.6 + vnoise(x * 0.11, z * 0.11) * 0.35;

  const dwx = x - WHEEL_POS.x, dwz = z - WHEEL_POS.z;
  h += 6.5 * gauss(dwx * dwx + dwz * dwz, 640);

  for (let i = 0; i < POOLS.length; i++) {
    const p = POOLS[i], dx = x - p.x, dz = z - p.z;
    h -= 1.0 * gauss(dx * dx + dz * dz, p.r * p.r * 1.6);

let wheelRing = null, wheelSocketNodes = [];
function buildWheelRing() {
  const g = new THREE.Group();

    const a0 = s / NSEG * TAU, a1 = (s + 1) / NSEG * TAU;
    const mkring = (rr, tt, c) => {
      const p00 = [Math.cos(a0) * (rr + tt), Math.sin(a0) * (rr + tt), T * 0.55];
      const p01 = [Math.cos(a0) * (rr + tt), Math.sin(a0) * (rr + tt), -T * 0.55];
      const p10 = [Math.cos(a1) * (rr + tt), Math.sin(a1) * (rr + tt), T * 0.55];
      const p11 = [Math.cos(a1) * (rr + tt), Math.sin(a1) * (rr + tt), -T * 0.55];
      const q00 = [Math.cos(a0) * (rr - tt), Math.sin(a0) * (rr - tt), T * 0.55];
      const q01 = [Math.cos(a0) * (rr - tt), Math.sin(a0) * (rr - tt), -T * 0.55];
      const q10 = [Math.cos(a1) * (rr - tt), Math.sin(a1) * (rr - tt), T * 0.55];
      const q11 = [Math.cos(a1) * (rr - tt), Math.sin(a1) * (rr - tt), -T * 0.55];
      pushTriW(md, p00[0], p00[1], p00[2], p10[0], p10[1], p10[2], q10[0], q10[1], q10[2], c);
      pushTriW(md, p00[0], p00[1], p00[2], q10[0], q10[1], q10[2], q00[0], q00[1], q00[2], c);
      pushTriW(md, q01[0], q01[1], q01[2], q11[0], q11[1], q11[2], p11[0], p11[1], p11[2], c);
      pushTriW(md, q01[0], q01[1], q01[2], p11[0], p11[1], p11[2], p01[0], p01[1], p01[2], c);
      pushTriW(md, p00[0], p00[1], p00[2], p01[0], p01[1], p01[2], p11[0], p11[1], p11[2], c);
      pushTriW(md, p00[0], p00[1], p00[2], p11[0], p11[1], p11[2], p10[0], p10[1], p10[2], c);
    };
    mkring(R, T, s % 3 ? C_STONE : C_STONE2);
  }
  // 8 sockets: carved recesses with pale moonglass rims — MERGED into the
  // ring geometry (they turn with it; one draw call for the whole wheel)
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU + Math.PI / 2;
    const sx = Math.cos(a) * R, sy = Math.sin(a) * R;
    const mdS = MD();
    latheW(mdS, [[0.5, 0], [0.42, 0.1], [0.0, 0.12]], { seg: 8, flat: true, col: col(0x30373a) });
    latheW(mdS, [[0.56, -0.02], [0.5, 0.06]], { seg: 8, flat: true, col: C_MOON });
    // rotate socket axis (+y) onto +z, then translate onto the rim
    for (let v = 0; v < mdS.p.length; v += 3) {
      const px2 = mdS.p[v], py2 = mdS.p[v + 1], pz2 = mdS.p[v + 2];
      md.p.push(px2 + sx, -pz2 + sy, py2 + T * 0.56);
    }
    for (let v = 0; v < mdS.c.length; v++) md.c.push(mdS.c[v]);
  }
  const ring = mdMesh(md, WORLD_MAT, false);
  ring.frustumCulled = false;
  g.add(ring);
  const y = groundH(WHEEL_POS.x, WHEEL_POS.z);
  g.position.set(WHEEL_POS.x, y + 4.6, WHEEL_POS.z);
  g.rotation.y = 0.25;          // faces the bay, slightly turned
  scene.add(g);
  return g;
}

/* ═══════════ v4.5: INTERIORS — EVERY DOOR OPENS ═══════════
   v4 proved the pattern on the harbor house; v4.5 makes it a registry.
   Each room is its own culled chunk far off-world (x > 300 → groundH = 0);
   the door cine teleports the player between ext.out and the room spawn.
   Collision authority per room = ONE clamp (rect or circle) + furniture
   circles — solid by construction, no hand-kept second copy. */
const ROOMS = [];
function roomAt(x, z) {
  for (let i = 0; i < ROOMS.length; i++) {
    const R = ROOMS[i];
    if (R.r) { if (Math.hypot(x - R.x, z - R.z) < R.r + 1.5) return R; }
    else if (Math.abs(x - R.x) < R.w + 1.5 && Math.abs(z - R.z) < R.d + 1.5) return R;

    ? (x, z) => {
        const dx = x - R.x, dz = z - R.z, d = Math.hypot(dx, dz), mx = R.r - m;
        return d > mx ? [R.x + dx / d * mx, R.z + dz / d * mx] : [x, z];
      }
    : (x, z) => [clamp(x, R.x - R.w + m, R.x + R.w - m),
                 clamp(z, R.z - R.d + m, R.z + R.d - m)];
  let [x, z] = cl(nx, nz);
  for (let i = 0; i < R.coll.length; i++) {
    const c = R.coll[i];
    const dx = x - c[0], dz = z - c[1];
    const d2 = dx * dx + dz * dz, rr = c[2] + 0.34;
    if (d2 < rr * rr && d2 > 0.0001) {
      const d = Math.sqrt(d2);
      x = c[0] + dx / d * rr; z = c[1] + dz / d * rr;
    }
  }
  return cl(x, z);
}

  const dxr = Math.sin(ry), dzr = Math.cos(ry);
  return {
    x: hx - dxr * d, z: hz - dzr * d,                    // the door face
    outX: hx - dxr * outD, outZ: hz - dzr * outD,        // spawn-out spot
    heading: Math.PI + ry, ry,                           // facing away

function cullChunks(cx, cz) {
  for (let i = 0; i < chunks.length; i++) {
    const c = chunks[i];
    if (!c.mesh) continue;
    const dx = c.cx - cx, dz = c.cz - cz;
    c.mesh.visible = (dx * dx + dz * dz) < 27225;    // 165 m (fog owns the rest)
  }
}

(function buildMirror() {

const BEAM_MAT = new THREE.MeshBasicMaterial({

let beamDown = null, beamOut = null;
(function buildBeams() {
  const md = MD();
  const c = [1, 1, 1];
  // slanted shaft from the crack (high south-west) down to the mirror
  const top = [MIRROR_POS.x - 2.2, 7.6, MIRROR_POS.z - 1.4], bot = [MIRROR_POS.x, 0.6, MIRROR_POS.z];
  for (const off of [[-0.32, 0], [0, 0.32], [0.32, 0], [0, -0.32]]) {
    pushQuad(md, [top[0] - off[0], top[1], top[2] - off[1]], [top[0] + off[0], top[1], top[2] + off[1]],
      [bot[0] + off[0] * 0.6, bot[1], bot[2] + off[1] * 0.6], [bot[0] - off[0] * 0.6, bot[1], bot[2] - off[1] * 0.6], c);
  }
  beamDown = mdMesh(md, BEAM_MAT, false);
  beamDown.position.y = groundH(MIRROR_POS.x, MIRROR_POS.z);

  // reflected beam — child of a pivot at the mirror, aimed by mirror.angle
  const md2 = MD();
  const L = Math.hypot(KELPWALL.x - MIRROR_POS.x, KELPWALL.z - MIRROR_POS.z) + 1.5;
  for (const off of [[0, 0.4], [0.4, 0]]) {

      [L, 0.9 + off[1], off[0] * 2], [L, 0.9 - off[1], -off[0] * 2], c);
  }
  beamOut = mdMesh(md2, BEAM_MAT.clone(), false);
  beamOut.material.opacity = 0;
  beamOut.frustumCulled = false;
  beamOut.position.set(MIRROR_POS.x, groundH(MIRROR_POS.x, MIRROR_POS.z) + 0.15, MIRROR_POS.z);

})();
/* v6: light READS through the openings.

let entGlow = null, corridorGlow = null;
(function buildGrottoGlows() {
  const gy = -3.05;

    const md = MD();

      vertexColors: true, transparent: true, opacity: 0.26,

    }), false);

  }
  {
    const md = MD();

    for (const [ex, ez] of [[COR_WALK.ax, COR_WALK.az], [COR_WALK.bx, COR_WALK.bz]]) {

    }
    // a faint runner of light down the corridor itself
    lathe(md, [[0, gy + 0.07], [2.2, gy + 0.02]], { seg: 7, x: (COR_WALK.ax + COR_WALK.bx) / 2, y: 0, z: (COR_WALK.az + COR_WALK.bz) / 2, col: c });
    corridorGlow = mdMesh(md, new THREE.MeshBasicMaterial({
      vertexColors: true, transparent: true, opacity: 0.2,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false,
    }), false);
    corridorGlow.frustumCulled = false;

})();

function buildChestMesh(x, z, ry) {
  const g = new THREE.Group();

  const wood = col(0x7c5a3a), band = col(0x54432e);
  box(mdB, { x: 0, y: 0, z: 0, w: 0.42, d: 0.3, h: 0.34, col: wood });
  box(mdB, { x: 0, y: 0.0, z: 0, w: 0.44, d: 0.31, h: 0.09, col: band });
  const base = mdMesh(mdB, TOON); base.frustumCulled = false;
  g.add(base);
  const lidN = new THREE.Group();
  lidN.position.set(0, 0.34, -0.3);
  const mdL = MD();
  lathe(mdL, [[0.3, 0], [0.3, 0.001]], { seg: 8, a0: 0, a1: Math.PI, ex: 1, col: wood });
  box(mdL, { x: 0, y: 0, z: 0.3, w: 0.42, d: 0.02, h: 0.2, rx: -1.35, col: wood });
  box(mdL, { x: 0, y: 0.02, z: 0.3, w: 0.44, d: 0.025, h: 0.08, rx: -1.35, col: band });
  const lid = mdMesh(mdL, TOON); lid.frustumCulled = false;
  lidN.add(lid);
  g.add(lidN);
  g.position.set(x, groundH(x, z) + 0.05, z);
  g.rotation.y = ry;
  scene.add(g);
  addColl(x, z, 0.55);
  return { group: g, lid: lidN };
}
