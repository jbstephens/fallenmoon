<script>
/* ═══════════════════ p6b — PHASE 2 night one: THE PARCHED FOREST ═══════════════════
   The game's second region, east over Cinder Pass. ≥2.0km x 1.4km of
   heat-stressed pine forest: the dry SILVERRUN riverbed spine walking up
   to the DRIED FALLS, the fire-watch tower, the Great Cedar, six shade
   springs, cinder boars, ember hornets, and the Fire Warden.
   Sealed behind the rockfall: the plunge-pool basin (night two).

   ARCHITECTURE: this block EXTENDS the Brightharbor world by wrapping the
   handful of world-authority functions (groundH, groundColor, inShadeAt,
   nearestShadeSpot, areaAt, currentInteract, doInteract, swingHits,
   respawnLeftBehind, tickPlayer, animateNPCs, cullChunks, setQuest).
   Single-source-of-truth rule everywhere: the SAME functions that place
   geometry also answer collision/shade queries (v4 grotto lesson).      */

/* ───────────────────────── geography (all locked here) ───────────────────────── */
const FW = { x0: 170, x1: 2178, z0: -38, z1: 1398, passZ: 38 };   // solid-bounded playable rect
const FOREST_EXTENT = { w: FW.x1 - FW.x0, h: FW.z1 - FW.z0 };      // 2008 x 1436 m

/* the SILVERRUN — a dead river you walk UP, pass → crown (~2.4 km) */
const RIVER = [
  [235, 55], [380, 110], [500, 270], [650, 380], [820, 300], [980, 380],
  [1080, 560], [1220, 660], [1340, 560], [1480, 660], [1580, 840],
  [1700, 930], [1800, 1050], [1900, 1160], [1972, 1228],
];
const RIVER_CUM = (() => {   // cumulative segment lengths for the walk-up param
  const c = [0];
  for (let i = 1; i < RIVER.length; i++) {
    c.push(c[i - 1] + Math.hypot(RIVER[i][0] - RIVER[i - 1][0], RIVER[i][1] - RIVER[i - 1][1]));
  }
  return c;
})();
const RIVER_LEN = RIVER_CUM[RIVER_CUM.length - 1];

/* the crown: the plateau the falls pour from (poured from), and the basin */
const CROWN = { x: 2030, z: 1290 };            // plateau center (solid — unclimbable)
const BASIN = { x: 1938, z: 1192, r: 17 };     // the plunge pool — SEALED by rockfall
const HUM_SPOT = { x: 1921, z: 1176 };         // where the hum line fires

/* ridgelines & knolls — the sightline discipline */
const RIDGES = [   // [ax, az, bx, bz, width, height]
  [400, 520, 900, 640, 90, 16],
  [1150, 900, 1650, 1050, 100, 18],
  [1000, 190, 1650, 260, 85, 15],      // the south ridge (the Great Cedar's)
  [600, 900, 900, 1200, 90, 14],
  [1550, 350, 1900, 480, 80, 13],
];
const KNOLLS = [   // [x, z, height, radius]
  [1100, 810, 13, 55],    // the fire-watch tower's knoll
  [870, 640, 8, 32],      // vista knoll west
  [1400, 950, 8, 32],     // vista knoll east
];

/* content clusters (~17): clearings, cracked-clay floors, flattened pads */
const FCLUSTERS = [
  { id: 'camp',      x: 250,  z: 60,   r: 20, flat: 1 },
  { id: 'mill',      x: 650,  z: 392,  r: 18, flat: 1 },
  { id: 'wheel2',    x: 983,  z: 392,  r: 14, flat: 1 },
  { id: 'ferry',     x: 1338, z: 568,  r: 16, flat: 1 },
  { id: 'hamlet',    x: 1580, z: 848,  r: 24, flat: 1 },
  { id: 'tower',     x: 1100, z: 810,  r: 26, flat: 1 },
  { id: 'cedar',     x: 1300, z: 210,  r: 18, flat: 1 },
  { id: 'glade1',    x: 520,  z: 200,  r: 26, flat: 1 },
  { id: 'glade2',    x: 900,  z: 560,  r: 26, flat: 1 },
  { id: 'glade3',    x: 1520, z: 1100, r: 26, flat: 1 },
  { id: 'hollow',    x: 1830, z: 1080, r: 20, flat: 1 },
  { id: 'grotA',     x: 700,  z: 720,  r: 12, flat: 1 },
  { id: 'grotB',     x: 1750, z: 380,  r: 12, flat: 1 },
  { id: 'vista1',    x: 870,  z: 640,  r: 10 },
  { id: 'vista2',    x: 1400, z: 950,  r: 10 },
  { id: 'seam',      x: 1180, z: 645,  r: 10, flat: 1 },
  { id: 'forecourt', x: 1900, z: 1165, r: 22, flat: 1 },
];
/* six SHADE SPRINGS — sanctuary, respawn anchors, save checkpoints */
const FSPRINGS = [
  { x: 390,  z: 130,  r: 5.5 }, { x: 700,  z: 340,  r: 5.5 },
  { x: 1050, z: 600,  r: 5.5 }, { x: 1400, z: 690,  r: 5.5 },
  { x: 1650, z: 900,  r: 5.5 }, { x: 1868, z: 1122, r: 5.5 },
];
/* the Great Cedar — hollow; ring solid + door gap share these numbers */
const CEDAR = { x: 1300, z: 210, r0: 2.7, r1: 4.4, doorA: -2.25, doorHalf: 0.6 };
const TOWER = { x: 1100, z: 810, deckY: 15.2 };
const WARDEN_POS = { x: 1095.5, z: 803.5 };
/* extra authored shade (rock shadows, tower roof, grotto alcoves, seal) */
const FSHADE = [
  { x: TOWER.x, z: TOWER.z, r: 4.6 },            // the tower's roof shadow column
  { x: 1095.5, z: 804, r: 3.6 },                 // the warden's porch — her lesson is safe to hear
  { x: 700, z: 720, r: 7 },                      // secret grotto A alcove
  { x: 1750, z: 380, r: 7 },                     // secret grotto B alcove
  { x: 1921, z: 1180, r: 6 },                    // the rockfall's own shadow
  { x: 250, z: 68, r: 4 },                       // the camp's leaning rock
  { x: 1180, z: 651, r: 4 },                     // the salt seam's overhang
  { x: 870, z: 646, r: 3.4 }, { x: 1400, z: 956, r: 3.4 },   // vista cairn stones
];

/* ───────────────────────── the heightfield ───────────────────────── */
const _bhGroundH = groundH;          // Brightharbor's own terrain (with the pass carve)
function riverAt(x, z) {
  // distance to the polyline + normalized walk-up parameter t (0 pass → 1 falls)
  let bd = 1e9, bt = 0;
  for (let i = 0; i < RIVER.length - 1; i++) {
    const ax = RIVER[i][0], az = RIVER[i][1], bx = RIVER[i + 1][0], bz = RIVER[i + 1][1];
    const dx = bx - ax, dz = bz - az;
    const tt = clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz || 1), 0, 1);
    const d = Math.hypot(x - (ax + dx * tt), z - (az + dz * tt));
    if (d < bd) { bd = d; bt = (RIVER_CUM[i] + tt * (RIVER_CUM[i + 1] - RIVER_CUM[i])) / RIVER_LEN; }
  }
  return [bd, bt];
}
const _riv = { d: 0, t: 0 };
function forestRaw(x, z) {
  // base: a long climb toward the crown, rolling under noise
  let h = 5 + (x - 170) / 2010 * 17 + Math.max(0, z) / 1400 * 14;
  h += vnoise(x * 0.008, z * 0.008) * 7 + vnoise(x * 0.021 + 5, z * 0.021) * 3
     + vnoise(x * 0.06, z * 0.06 + 3) * 0.9;
  // ridgelines
  for (let i = 0; i < RIDGES.length; i++) {
    const r = RIDGES[i];
    const d = distSeg(x, z, r[0], r[1], r[2], r[3]);
    if (d < r[4] * 2.4) h += r[5] * Math.exp(-(d * d) / (r[4] * r[4]));
  }
  // knolls
  for (let i = 0; i < KNOLLS.length; i++) {
    const k = KNOLLS[i], dx = x - k[0], dz = z - k[1];
    h += k[2] * Math.exp(-(dx * dx + dz * dz) / (k[3] * k[3]));
  }
  // the SILVERRUN carves through everything — bed, banks, a levee lip
  const rv = riverAt(x, z);
  _riv.d = rv[0]; _riv.t = rv[1];
  if (rv[0] < 26) {
    const m = smoothstep((14 - rv[0]) / 7);
    h -= m * 2.8;
    const lev = rv[0] - 11;
    h += 0.7 * Math.exp(-(lev * lev) / 9);
  }
  // the crown plateau — the wall the falls hang from (solid, unclimbable)
  const dC = Math.hypot(x - CROWN.x, z - CROWN.z);
  if (dC < 220) h += 58 * smoothstep((150 - dC) / 60);
  // the plunge-pool bowl at the wall's foot
  const dB = Math.hypot(x - BASIN.x, z - BASIN.z);
  if (dB < 40) h -= 5 * Math.exp(-(dB * dB) / 225);
  // region walls: the world ends in real mountains
  const edge = Math.max(0, x - 2090) + Math.max(0, 10 - z) + Math.max(0, z - 1310);
  if (edge > 0) h += Math.min(42, edge * edge * 0.03) * (0.85 + vnoise(x * 0.03, z * 0.03) * 0.15);
  return h;
}
function forestH(x, z) {
  let h = forestRaw(x, z);
  // clearing pads flatten toward their center height (self-referential — no
  // hand-kept constants to drift out of sync)
  for (let i = 0; i < FCLUSTERS.length; i++) {
    const c = FCLUSTERS[i];
    if (!c.flat) continue;
    const d = Math.hypot(x - c.x, z - c.z);
    if (d < c.r + 9) {
      const m = smoothstep((c.r + 9 - d) / 9) * 0.85;
      h = lerp(h, forestRaw(c.x, c.z), m);
    }
  }
  // spring bowls: a soft dish holding the seep
  for (let i = 0; i < FSPRINGS.length; i++) {
    const s = FSPRINGS[i];
    const d = Math.hypot(x - s.x, z - s.z);
    if (d < s.r + 8) {
      const m = smoothstep((s.r + 8 - d) / 8);
      h = lerp(h, forestRaw(s.x, s.z) - 0.7, m * 0.9);
    }
  }
  // west blend: hand the terrain back to Brightharbor's saddle
  if (x < 230) {
    const w = smoothstep((230 - x) / 120);
    h = lerp(h, _bhGroundH(110, clamp(z, 14, 62)) + 1.5, w * w);
  }
  return h;
}
const inForestQ = (x, z) => x > 110 && !(x > 300 && z < -30);
/* v7 ONE-GROUND-AUTHORITY (see p4 makeMeshField): forest physics ground ==
   the rendered sheet's exact triangulation. FOREST_FINE is shared with
   buildForestGround below — one predicate, one lattice, one truth. The
   analytic forestH stays the SOURCE the lattice samples; nothing else may
   read it for heights. */
const FOREST_FINE = (x, z) => {
  const rv = riverAt(x + 4, z + 4);
  if (rv[0] < 24) return true;
  for (let i = 0; i < FCLUSTERS.length; i++) {
    const c = FCLUSTERS[i];
    if (Math.hypot(x - c.x, z - c.z) < c.r + 8) return true;
  }
  for (let i = 0; i < FSPRINGS.length; i++) {
    const s = FSPRINGS[i];
    if (Math.hypot(x - s.x, z - s.z) < s.r + 10) return true;
  }
  return false;
};
const forestHMesh = makeMeshField(forestH, 110, -38, 2182, 1402, 8, FOREST_FINE);
groundH = function (x, z) {
  if (inForestQ(x, z)) return forestHMesh(x, z);
  return _bhGroundH(x, z);
};

/* ───────────────────────── the tree grid (single source of truth) ─────────────────────────
   Every pine in the forest comes from this deterministic per-cell function.
   The mesh builder, the trunk collision, the boar tree-stun, AND the canopy
   shade all read the same answers.                                          */
const TCELL = 9;
function clearingAt(x, z) {
  for (let i = 0; i < FCLUSTERS.length; i++) {
    const c = FCLUSTERS[i];
    if (Math.hypot(x - c.x, z - c.z) < c.r) return true;
  }
  for (let i = 0; i < FSPRINGS.length; i++) {
    const s = FSPRINGS[i];
    if (Math.hypot(x - s.x, z - s.z) < s.r + 1.5) return true;
  }
  return false;
}
function treeInfo(ix, iz) {
  const j1 = hash2(ix * 3 + 11, iz * 7 - 4);       // occupancy roll
  const px = ix * TCELL + 4.5 + hash2(ix, iz) * 3.2;
  const pz = iz * TCELL + 4.5 + hash2(ix + 7, iz + 3) * 3.2;
  if (px > 2140 || pz < 16 || pz > 1330) return null;
  if (px < 176) {
    // the pass corridor: a sparse picket of trees along its edges — the
    // threshold reads FOREST AHEAD, and the walkway center stays open
    if (px < 126) return null;
    const lat = Math.abs(pz - FW.passZ);
    if (lat < 6.5 || lat > 13 + Math.max(0, px - 120) * 0.12) return null;
    if (j1 * 0.5 + 0.5 > 0.4) return null;
    const s2 = 0.75 + (hash2(ix + 13, iz + 29) * 0.5 + 0.5) * 0.5;
    const bare2 = hash2(ix - 5, iz + 17) > 0.1;    // mostly dead sentinels
    return { x: px, z: pz, s: s2, bare: bare2, r: 0.3 * s2 + 0.24, cr: bare2 ? 0 : 2.1 * s2 + 0.8, h: 7 * s2 + 2.5 };
  }
  if (Math.hypot(px - CROWN.x, pz - CROWN.z) < 165) return null;
  if (clearingAt(px, pz)) return null;
  const rv = riverAt(px, pz);
  if (rv[0] < 10) return null;                     // the bed stays open sky
  const g = vnoise(px * 0.006, pz * 0.006);        // grove noise: dense / sparse bands
  const p = g > 0.12 ? 0.72 : g > -0.15 ? 0.3 : 0.07;
  if (j1 * 0.5 + 0.5 > p) return null;
  const s = 0.8 + (hash2(ix + 13, iz + 29) * 0.5 + 0.5) * 0.7;
  const bare = hash2(ix - 5, iz + 17) > 0.5;       // dead snags: trunk + bones, no canopy
  return { x: px, z: pz, s, bare, r: 0.3 * s + 0.26, cr: bare ? 0 : 2.4 * s + 0.9, h: 7.5 * s + 3 };
}
function eachTreeNear(x, z, fn) {
  const ix0 = Math.floor(x / TCELL), iz0 = Math.floor(z / TCELL);
  for (let ix = ix0 - 1; ix <= ix0 + 1; ix++) {
    for (let iz = iz0 - 1; iz <= iz0 + 1; iz++) {
      const t = treeInfo(ix, iz);
      if (t && fn(t)) return true;
    }
  }
  return false;
}
function treeTrunkAt(x, z, pad) {
  return eachTreeNear(x, z, t => Math.hypot(x - t.x, z - t.z) < t.r + pad);
}
function canopyAt(x, z) {
  return eachTreeNear(x, z, t => !t.bare && Math.hypot(x - t.x, z - t.z) < t.cr);
}

/* ───────────────────────── SOLID authority for the region ───────────────────────── */
window.__forestSolid = function (x, z) {
  if (x <= 98) return false;
  if (x > 300 && z < -30) return false;                      // off-world strip
  // Cinder Pass: the only gate through the west wall
  if (x < FW.x0) {
    const hw = 15 + Math.max(0, x - 120) * 0.12;             // flares open eastward
    if (Math.abs(z - FW.passZ) > hw) return true;
    // v7: the corridor's picket pines are REAL too — the early return here
    // used to skip the trunk test, so pass trees rendered but never collided
    // (John's "trees that don't collide"), exactly at the transition photos
    return treeTrunkAt(x, z, 0.3);
  }
  if (x > FW.x1 || z < FW.z0 || z > FW.z1) return true;      // region walls
  if (Math.hypot(x - CROWN.x, z - CROWN.z) < 150) return true;   // plateau: unclimbable
  if (Math.hypot(x - BASIN.x, z - BASIN.z) < BASIN.r) return true;   // THE SEAL (night two opens it)
  // the Great Cedar's hollow ring (door gap shared with the mesh)
  {
    const dx = x - CEDAR.x, dz = z - CEDAR.z;
    const d = Math.hypot(dx, dz);
    if (d > CEDAR.r0 && d < CEDAR.r1) {
      let da = Math.atan2(dz, dx) - CEDAR.doorA;
      da = ((da % TAU) + TAU) % TAU; if (da > Math.PI) da -= TAU;
      if (Math.abs(da) > CEDAR.doorHalf) return true;
    }
  }
  if (Math.hypot(x - TOWER.x, z - TOWER.z) < 3.0) return true;   // under-deck braces
  if (treeTrunkAt(x, z, 0.3)) return true;                   // every pine trunk is real
  return false;
};

/* ───────────────────────── shade & respawn wraps ───────────────────────── */
const _bhInShadeAt = inShadeAt;
function forestShadeAt(x, z) {
  for (let i = 0; i < FSPRINGS.length; i++) {
    const s = FSPRINGS[i];
    if (Math.hypot(x - s.x, z - s.z) < s.r) return true;
  }
  const dCed = Math.hypot(x - CEDAR.x, z - CEDAR.z);
  if (dCed < CEDAR.r1) return true;                          // inside the hollow
  for (let i = 0; i < FSHADE.length; i++) {
    const s = FSHADE[i];
    if (Math.hypot(x - s.x, z - s.z) < s.r) return true;
  }
  return canopyAt(x, z);                                     // under the pines
}
inShadeAt = function (x, z) {
  if (inForestQ(x, z)) return forestShadeAt(x, z);
  return _bhInShadeAt(x, z);
};
const _bhNearestShade = nearestShadeSpot;
let lastSpringIdx = (SAVE && typeof SAVE.lastSpring === 'number') ? SAVE.lastSpring : -1;
nearestShadeSpot = function (x, z) {
  if (inForestQ(x, z)) {
    if (lastSpringIdx >= 0 && lastSpringIdx < FSPRINGS.length) {
      const s = FSPRINGS[lastSpringIdx];
      return { x: s.x, z: s.z };
    }
    let best = FSPRINGS[0], bd = 1e9;
    for (const s of FSPRINGS) {
      const d = Math.hypot(x - s.x, z - s.z);
      if (d < bd) { bd = d; best = s; }
    }
    return { x: best.x, z: best.z };
  }
  return _bhNearestShade(x, z);
};

/* ───────────────────────── forest ground colors ───────────────────────── */
const C_NEEDLE = col(0x96603c), C_NEEDLE2 = col(0x7a4a30), C_BLEACH = col(0xbfa878),
      C_CLAY = col(0xc9a97c), C_CLAY2 = col(0xb08e60), C_FCRACK = col(0x8a6a48),
      C_SILT = col(0xcfc2a4), C_SILT2 = col(0xb2a586), C_RIVERDARK = col(0x8f7f66),
      C_LUSH = col(0x5c7a44), C_LUSH2 = col(0x486338),
      C_SHADEF = col(0x4a4a46), C_TRUNK = col(0x9c8a72), C_TRUNK2 = col(0x7a6a55),
      C_RUST = col(0x8f5434), C_RUST2 = col(0x6e3f28), C_OLIVE = col(0x7d6b3d),
      C_FROCK = col(0x9a917f), C_FROCK2 = col(0x7c7364);
const _bhGroundColor = groundColor;
function forestColor(x, z, y) {
  const n = vnoise(x * 0.13, z * 0.13), f = vnoise(x * 0.5 + 9, z * 0.5);
  // rust needle-carpet base
  mix3(C_NEEDLE, C_NEEDLE2, clamp(0.5 + n * 0.55 + f * 0.3, 0, 1), _gc);
  // bleached grass on the high open ground
  const big = vnoise(x * 0.008, z * 0.008);
  if (big > 0.18) mix3(_gc, C_BLEACH, clamp((big - 0.18) * 3.2, 0, 0.75), _gc);
  // cracked clay clearings
  for (let i = 0; i < FCLUSTERS.length; i++) {
    const c = FCLUSTERS[i];
    const d = Math.hypot(x - c.x, z - c.z);
    if (d < c.r + 4) {
      const m = smoothstep((c.r + 4 - d) / 5);
      mix3(_gc, f > 0.15 ? C_CLAY2 : C_CLAY, m * 0.9, _gc);
      const crack = vnoise(x * 0.55 + 17, z * 0.55);
      if (Math.abs(crack) < 0.07 && m > 0.4) mix3(_gc, C_FCRACK, 0.85, _gc);
    }
  }
  // the Silverrun: pale silt and river stones, a dark memory-line down the middle
  const rv = riverAt(x, z);
  if (rv[0] < 16) {
    const m = smoothstep((13 - rv[0]) / 6);
    mix3(_gc, f > 0.2 ? [0.68, 0.66, 0.58] : [0.75, 0.73, 0.65], m * 0.94, _gc);
    if (rv[0] < 3.0) mix3(_gc, C_RIVERDARK, 0.6 * (1 - rv[0] / 3.0), _gc);
    if (vnoise(x * 0.9 + 3, z * 0.9) > 0.5 && m > 0.5) mix3(_gc, C_SALT, 0.45, _gc);
    if (vnoise(x * 2.1 + 8, z * 2.1) > 0.5 && m > 0.5) mix3(_gc, C_FROCK2, 0.55, _gc);
    // old waterline ribbons on the banks
    if (m > 0.1 && m < 0.85 && Math.abs(vnoise(x * 0.4 + 6, z * 0.4)) < 0.08) mix3(_gc, C_FCRACK, 0.6, _gc);
  }
  // the crown ramp is stone, not dune — strata bands climbing to the lip
  {
    const dC = Math.hypot(x - CROWN.x, z - CROWN.z);
    if (dC < 170) {
      const t = smoothstep((158 - dC) / 45);
      mix3(_gc, f > 0.15 ? C_FROCK2 : C_FROCK, t * 0.92, _gc);
      if (t > 0.25 && Math.sin(y * 0.55 + vnoise(x * 0.09, z * 0.09) * 2.4) > 0.45) {
        mix3(_gc, [0.44, 0.38, 0.31], 0.55 * t, _gc);
      }
    }
  }
  // spring oases: the only living green in the region
  for (let i = 0; i < FSPRINGS.length; i++) {
    const s = FSPRINGS[i];
    const d = Math.hypot(x - s.x, z - s.z);
    if (d < s.r + 4) {
      mix3(_gc, d < s.r * 0.7 ? C_LUSH : C_LUSH2, smoothstep((s.r + 4 - d) / 4) * 0.85, _gc);
    }
  }
  // canopy shade pools baked under the pines — hard-edged, colored, painterly
  if (canopyAt(x, z)) mix3(_gc, C_SHADEF, 0.44, _gc);
  return _gc;
}
groundColor = function (x, z, y) {
  if (inForestQ(x, z)) return forestColor(x, z, y);
  return _bhGroundColor(x, z, y);
};
</script>
<script>
/* ═══════════ p6b/2 — building the region ═══════════ */

/* forest chunks: bigger tiles than Brightharbor (200 m), same cull loop */
const FCH = 200, FCH_R2 = 150000;   // visible flag ~387 m; frustum trims the rest
const fchunkMap = new Map();
function fchunkFor(x, z) {
  const cx = Math.floor(x / FCH), cz = Math.floor(z / FCH);
  const key = cx + 'f' + cz;
  let c = fchunkMap.get(key);
  if (!c) {
    c = { md: MD(), cx: cx * FCH + FCH / 2, cz: cz * FCH + FCH / 2, mesh: null, r2: FCH_R2, forest: true };
    fchunkMap.set(key, c); chunks.push(c);
  }
  return c.md;
}
/* baked-light prop helpers routed into forest chunks */
function fboxW(o) { boxW(fchunkFor(o.x, o.z), o); }
function flatheW(prof, o) { latheW(fchunkFor(o.x, o.z), prof, o); }

/* ── the ground sheet ── */
(function buildForestGround() {
  const gc = (x, z) => {
    // corners sampled through the MESH-FIELD: at lattice corners it returns

  for (let x = 110; x < 2180; x += STEP) {

/* ── river dressing: stones, dry pot-hole pools, salt rings — the dead

      return [lerp(RIVER[i - 1][0], RIVER[i][0], t), lerp(RIVER[i - 1][1], RIVER[i][1], t)];
    }

}

/* ── far tier v7: TILED impressions, paired 1:1 with near chunks.
   FIELD LESSON (four of John's TV photos): an impression drawn while its
   ground is ALSO near-rendered is not "0.6 m under" it — a 40 m quad
   bridges every concave feature (riverbed, spring bowls, the pass blend,
   bay shore dips), closing over the real ground as a pale walk-through
   shell, up to 3.3 m over the player's head at the pass mouth. Measured
   live before this rewrite.
   THE RULE (region-agnostic, both tiers): each far tile pairs with exactly
   one near chunk, built on the near grid so no face straddles a pair
   boundary, and draws ONLY when its paired near chunk is culled. Inside
   the near ring there is never impression geometry; beyond it the far tier
   still carries the horizon. The Brightharbor impression additionally
   draws only for cameras east of the pass (its one job is the forest's
   look-home — it must never appear inside the bay it impersonates). ── */
/* TWO SCALES (draw-call budget, measured): from a region corner most 200 m
   tiles legitimately share one frustum (~80 draw calls — 128 total vs the
   80 budget). So the ring of 200 m paired tiles only serves the near-to-mid
   band; beyond its activation ring a 400 m MEGA merge takes over
   (activation = 387 near ring + the mega's real bounding radius — a
   visible mega can never reach inside any near ring). The three layers are exactly complementary: near ∨ ring ∨ mega,
   never two at once over the same ground. */
const farTier = [];    // all far meshes (perf census + sweep gates)

  const tileMap = new Map();

  const tileFor = (key, bh, megaKey) => {

            cx: bh ? 0 : Math.floor(x / 400) * 400 + 200,
            cz: bh ? 38 : Math.floor(z / 400) * 400 + 200,

    }

  };
  const megaKeyOf = (x, z, bh) => bh ? 'bay' : Math.floor(x / 400) + 'm' + Math.floor(z / 400);
  /* forest impression: coarse ground + canopy blobs, tiled on the 200 m
     fchunk grid (cells 40 m — five per tile side, zero straddle) */
  const S = 40;
  for (let x = 160; x < 2200; x += S) {           // 40 m cells, 200-grid aligned — zero straddle
    for (let z = -40; z < 1400; z += S) {
      const key = Math.floor((x + S / 2) / FCH) + 'f' + Math.floor((z + S / 2) / FCH);
      const p = [[x, z], [x, z + S], [x + S, z + S], [x + S, z]].map(([px, pz]) => {
        const y = forestH(px, pz) - 0.6;

      const cc = [c[0], c[1], c[2]];

      const c = _bhGroundColor(x + w / 2, z + d / 2, p[0][1]);
      const cc = [c[0], c[1], c[2]];
      for (const md of [tileFor(bhKey(x + 1, z + 1), true, 'bay'), megaFor(x, z, true)]) {
        pushTriWV(md, p[0][0], p[0][1], p[0][2], p[1][0], p[1][1], p[1][2], p[2][0], p[2][1], p[2][2], cc, cc, cc);
        pushTriWV(md, p[0][0], p[0][1], p[0][2], p[2][0], p[2][1], p[2][2], p[3][0], p[3][1], p[3][2], cc, cc, cc);
      }
    }
  }
  // the lighthouse & the moonwheel pylons read even as silhouettes
  for (const md of [tileFor(bhKey(44, -16), true, 'bay'), megaFor(44, -16, true)]) {

  }

let rockfallMesh = null, rockfallOpenMesh = null;
(function buildRockfall() {
  const C_CLIFF3 = [0.72, 0.65, 0.53], C_CHUTE = [0.93, 0.9, 0.81];
  const toFore = Math.atan2(1165 - BASIN.z, 1900 - BASIN.x);
  const build = (parted) => {
    const md = MD();
    for (let i = -5; i <= 5; i++) {
      let a = toFore + i * 0.21;
      let r = BASIN.r - 1 + Math.abs(hash2(i, 11)) * 2.5;
      let sink = 0;
      if (parted) {
        // the gap: the middle stones stand ASIDE — shoved outward along the
        // ring and half-sunk, leaving a walkable mouth into the basin
        if (Math.abs(i) <= 1) { a += (i >= 0 ? 1 : -1) * 0.62; r += 2.8; sink = 1.6; }
        else if (Math.abs(i) === 2) { a += (i > 0 ? 1 : -1) * 0.24; r += 1.2; sink = 0.5; }
      }
      const bx = BASIN.x + Math.cos(a) * r, bz = BASIN.z + Math.sin(a) * r;
      const gy = groundH(bx, bz) - 1.2 - sink;
      const s = 3.3 + Math.abs(hash2(i, 7)) * 2.0 - Math.abs(i) * 0.14;
      latheW(md, [[s, 0], [s * 0.85, s * 1.1], [s * 0.4, s * 1.9], [0, s * 2.3]],
        { seg: 6, ex: 0.85, x: bx, y: gy, z: bz, ry: i * 1.7, flat: true, segJitter: 0.13,
          col: i % 2 ? C_FROCK : C_FROCK2, cols: [C_FROCK2, C_FROCK, C_CLIFF3] });
      if (i % 2 === 0) {
        boxW(md, { x: bx, y: gy + s * 0.8, z: bz, w: s * 0.5, d: s * 0.4, h: s * 0.7, ry: i, rx: 0.4, col: C_CHUTE });
      }
    }
    for (let i = -6; i <= 6; i += 2) {
      const a = toFore + i * 0.18;
      if (parted && Math.abs(i) <= 2) continue;   // rubble cleared from the mouth
      const bx = BASIN.x + Math.cos(a) * (BASIN.r + 2.5), bz = BASIN.z + Math.sin(a) * (BASIN.r + 2.5);
      const gy = groundH(bx, bz) - 0.6;
      latheW(md, [[1.3, 0], [0.9, 1.1], [0, 1.7]], { seg: 5, x: bx, y: gy, z: bz, ry: i * 2.3, flat: true, segJitter: 0.1, col: C_FROCK2 });
    }
    const m = mdMesh(md, WORLD_MAT, false);
    m.matrixAutoUpdate = false; m.updateMatrix();
    m.visible = false;
    scene.add(m);
    return m;
  };
  rockfallMesh = build(false);
  rockfallOpenMesh = build(true);
})();

/* THE FIRE-WATCH TOWER — climbable by real stairs (collider tops) */
let towerMesh = null;
(function buildTower() {
  const md = MD();
  const tx = TOWER.x, tz = TOWER.z;
  const gy = groundH(tx, tz) - 0.2;
  const TIMB = col(0x8a6a48), TIMB2 = col(0x6b5138), PLANK = col(0xa08258), PLANK2 = col(0x87693f);
  // legs + cross braces
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    boxW(md, { x: tx + sx * 3.2, y: gy, z: tz + sz * 3.2, w: 0.34, d: 0.34, h: TOWER.deckY + 0.4, tw: 0.26, td: 0.26, shx: -sx * 0.9, shz: -sz * 0.9, col: TIMB, colB: TIMB2 });
  }
  for (let lvl = 0; lvl < 3; lvl++) {
    const y = gy + 2.2 + lvl * 4.4, k = 1 - (y - gy) / (TOWER.deckY + 1) * 0.28;
    for (const s of [-1, 1]) {
      boxW(md, { x: tx, y, z: tz + s * 3.15 * k, w: 3.4 * k, d: 0.09, h: 0.22, rz: 0.62, col: TIMB2 });
      boxW(md, { x: tx, y, z: tz + s * 3.15 * k, w: 3.4 * k, d: 0.09, h: 0.22, rz: -0.62, col: TIMB2 });
      boxW(md, { x: tx + s * 3.15 * k, y, z: tz, w: 0.09, d: 3.4 * k, h: 0.22, rx: 0.62, col: TIMB2 });
      boxW(md, { x: tx + s * 3.15 * k, y, z: tz, w: 0.09, d: 3.4 * k, h: 0.22, rx: -0.62, col: TIMB2 });
    }
  }
  // stacked crates & braces under the deck (the solid base reads solid)
  boxW(md, { x: tx, y: gy, z: tz, w: 2.0, d: 2.0, h: 2.6, tw: 1.7, td: 1.7, col: TIMB2 });
  boxW(md, { x: tx + 1.1, y: gy, z: tz - 1.4, w: 0.6, d: 0.6, h: 1.2, ry: 0.4, col: PLANK2 });
  boxW(md, { x: tx - 1.3, y: gy, z: tz + 1.2, w: 0.55, d: 0.55, h: 1.0, ry: 0.9, col: PLANK });
  // the deck
  boxW(md, { x: tx, y: gy + TOWER.deckY - 0.3, z: tz, w: 4.5, d: 4.5, h: 0.34, col: PLANK, colB: TIMB2 });
  for (let i = 0; i < 6; i++) {
    boxW(md, { x: tx - 3.75 + i * 1.5, y: gy + TOWER.deckY + 0.04, z: tz, w: 0.72, d: 4.45, h: 0.05, col: i % 2 ? PLANK2 : PLANK });
  }
  // railing (visual only — falling off the tower is allowed and funny)
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    boxW(md, { x: tx + sx * 4.3, y: gy + TOWER.deckY, z: tz + sz * 4.3, w: 0.09, d: 0.09, h: 1.1, col: TIMB2 });
  }
  for (const s of [-1, 1]) {
    boxW(md, { x: tx, y: gy + TOWER.deckY + 1.0, z: tz + s * 4.3, w: 4.36, d: 0.06, h: 0.09, col: TIMB });
    boxW(md, { x: tx + s * 4.3, y: gy + TOWER.deckY + 1.0, z: tz, w: 0.06, d: 4.36, h: 0.09, col: TIMB });
  }
  // lookout roof on four posts + the warden's brazier and bell
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    boxW(md, { x: tx + sx * 2.6, y: gy + TOWER.deckY, z: tz + sz * 2.6, w: 0.14, d: 0.14, h: 2.6, col: TIMB });
  }
  boxW(md, { x: tx, y: gy + TOWER.deckY + 2.6, z: tz, w: 3.6, d: 3.6, h: 1.5, tw: 0.1, td: 0.1, col: C_ROOF2, colB: C_ROOF });
  latheW(md, [[0.5, 0], [0.62, 0.3], [0.4, 0.55], [0.5, 0.62]], { seg: 7, x: tx + 1.4, y: gy + TOWER.deckY + 0.05, z: tz + 1.3, col: col(0x4a4440) });
  latheW(md, [[0.24, 0], [0.3, 0.28], [0, 0.4]], { seg: 6, x: tx - 1.6, y: gy + TOWER.deckY + 1.9, z: tz - 1.5, col: col(0x6a5a3a) });
  // the warden's porch: a bench and a rain barrel at the base, in the shade
  boxW(md, { x: tx - 4.6, y: gy, z: tz - 5.2, w: 1.1, d: 0.4, h: 0.5, col: PLANK2 });
  latheW(md, [[0.42, 0], [0.5, 0.55], [0.42, 1.0], [0, 1.0]], { seg: 7, x: tx - 6.1, y: gy, z: tz - 4.6, col: TIMB2 });
  /* THE STAIRS — four switchback flights; every tread is a collider top.
     The same numbers place the boards and the physics. */
  const FL = [
    { fx: -4.2, fz: 4.35, dx: 1, dz: 0 },     // south flight, walks +x
    { fx: 4.35, fz: 4.2, dx: 0, dz: -1 },     // east flight, walks -z
    { fx: 4.2, fz: -4.35, dx: -1, dz: 0 },    // north flight, walks -x
    { fx: -4.35, fz: -4.2, dx: 0, dz: 1 },    // west flight, walks +z
  ];
  const STEPS = 12, RISE = TOWER.deckY / (4 * STEPS);
  for (let fl = 0; fl < 4; fl++) {
    const F = FL[fl];
    for (let i = 0; i < STEPS; i++) {
      const t = (i + 0.5) / STEPS;
      const x = tx + F.fx + F.dx * (8.4 * t - 0);
      const z = tz + F.fz + F.dz * (8.4 * t - 0);
      const y = gy + (fl * STEPS + i + 1) * RISE;
      boxW(md, { x, y: y - 0.14, z, w: F.dx ? 0.42 : 0.6, d: F.dx ? 0.6 : 0.42, h: 0.14, col: i % 2 ? PLANK : PLANK2 });
      // stringer post every 3rd step
      if (i % 3 === 0) boxW(md, { x, y: gy, z, w: 0.09, d: 0.09, h: y - gy - 0.1, col: TIMB2 });
      addColl(x, z, 0.72, y).plat = true;
    }
    // corner landing
    const lx = tx + F.fx + F.dx * 8.7, lz = tz + F.fz + F.dz * 8.7;
    const ly = gy + (fl + 1) * STEPS * RISE;
    boxW(md, { x: lx, y: ly - 0.16, z: lz, w: 0.75, d: 0.75, h: 0.16, col: PLANK });
    addColl(lx, lz, 1.0, ly).plat = true;
  }
  // deck walk surface: a grid of platform tops
  for (const ox of [-2.8, 0, 2.8]) {
    for (const oz of [-2.8, 0, 2.8]) {
      addColl(tx + ox, tz + oz, 1.9, gy + TOWER.deckY).plat = true;
    }
  }
  towerMesh = mdMesh(md, WORLD_MAT, false);
  towerMesh.matrixAutoUpdate = false; towerMesh.updateMatrix();
  towerMesh.visible = false;
  scene.add(towerMesh);
})();

/* THE GREAT CEDAR — a colossal dead tree, hollow, with a secret inside */
let cedarMesh = null, cedarGlow = null;
(function buildCedar() {
  const md = MD();
  const gy = groundH(CEDAR.x, CEDAR.z) - 0.6;
  // v6 art pass: warm FLAT bark strata (the noon bake read slate-blue on the
  // shade side — an obelisk, not a tree)
  const BARK = [0.52, 0.42, 0.31], BARK2 = [0.41, 0.32, 0.24], BONE = [0.79, 0.72, 0.59];
  const doorSkip = (t0, t1, band) => {
    if (band > 1) return false;
    let da = ((t0 + 0.14 - CEDAR.doorA) % TAU + TAU) % TAU;
    if (da > Math.PI) da -= TAU;
    return Math.abs(da) < CEDAR.doorHalf;
  };
  // outer trunk: buttressed base, broken crown (open to the sky — the light shaft)
  latheW(md, [[CEDAR.r1 + 1.6, 0], [CEDAR.r1, 3.2], [CEDAR.r1 - 0.5, 10], [3.0, 18], [2.2, 23], [1.9, 26]],
    { seg: 12, ex: 0.96, x: CEDAR.x, y: gy, z: CEDAR.z, flat: true, segJitter: 0.14,
      col: BARK, cols: [BARK2, BARK, BARK, mix3(BARK, BONE, 0.45), BONE], skip: doorSkip });
  // root flares: the colossus grips its ridge (never crowding the door)
  for (let i = 0; i < 7; i++) {
    const a = CEDAR.doorA + 0.95 + i * (TAU - 1.9) / 6;
    const rx2 = CEDAR.x + Math.cos(a) * (CEDAR.r1 + 0.7), rz2 = CEDAR.z + Math.sin(a) * (CEDAR.r1 + 0.7);
    latheW(md, [[1.7 + hash2(i, 4) * 0.4, -0.4], [0.9, 2.4], [0, 5.2 + hash2(i, 8)]],
      { seg: 5, ex: 0.6, x: rx2, y: groundH(rx2, rz2) - 0.4, z: rz2, ry: a, flat: true, segJitter: 0.12,
        col: i % 2 ? BARK : BARK2 });
    addColl(rx2, rz2, 0.9);
  }
  // the crown broke, not sawed: three jagged splinters ring the opening
  for (const [sa, sh] of [[0.4, 3.4], [2.5, 2.6], [4.6, 4.1]]) {
    latheW(md, [[0.55, 25.2], [0.28, 25.2 + sh * 0.6], [0, 25.2 + sh]],
      { seg: 4, x: CEDAR.x + Math.cos(sa) * 1.5, y: gy, z: CEDAR.z + Math.sin(sa) * 1.5, flat: true,
        col: BONE });
  }
  // inner liner — flat cave-dark, facing inward (the hollow feels like a room)
  latheW(md, [[CEDAR.r0 + 0.5, 0], [CEDAR.r0 + 0.7, 6], [1.9, 14], [1.6, 20]],
    { seg: 12, ex: 0.96, x: CEDAR.x, y: gy, z: CEDAR.z, inward: true, flat: true, segJitter: 0.12,
      col: [0.32, 0.26, 0.2], cols: [[0.4, 0.32, 0.24], [0.32, 0.26, 0.2], [0.24, 0.2, 0.16]], skip: doorSkip });
  // bone limbs
  for (let i = 0; i < 5; i++) {
    const a = i * 1.35 + 0.4;
    boxW(md, { x: CEDAR.x + Math.cos(a) * 2.4, y: gy + 15 + i * 1.8, z: CEDAR.z + Math.sin(a) * 2.4, w: 0.35, d: 0.35, h: 4.5 - i * 0.4, tw: 0.1, td: 0.1, rx: 1.05, ry: a + 1.6, col: i % 2 ? BONE : mix3(BARK, BONE, 0.5) });
  }
  // doorposts: two worn bark shoulders framing the way in
  for (const s of [-1, 1]) {
    const a = CEDAR.doorA + s * (CEDAR.doorHalf + 0.22);
    const px2 = CEDAR.x + Math.cos(a) * (CEDAR.r1 - 0.1), pz2 = CEDAR.z + Math.sin(a) * (CEDAR.r1 - 0.1);
    latheW(md, [[0.9, -0.3], [0.55, 2.6], [0, 4.6]],
      { seg: 5, ex: 0.7, x: px2, y: gy, z: pz2, ry: a, flat: true, col: mix3(BARK2, [0, 0, 0], 0.12) });
  }
  cedarMesh = mdMesh(md, WORLD_MAT, false);
  cedarMesh.matrixAutoUpdate = false; cedarMesh.updateMatrix();
  cedarMesh.visible = false;
  scene.add(cedarMesh);
  // the light shaft through the broken crown + a bright pool on the floor
  const mdG = MD();
  const c = [1, 0.95, 0.78];
  for (const off of [[-1.1, 0], [0, 1.1]]) {
    pushQuad(mdG, [CEDAR.x - off[0], gy + 19, CEDAR.z - off[1]], [CEDAR.x + off[0], gy + 19, CEDAR.z + off[1]],
      [CEDAR.x + off[0] * 0.5 + 0.6, gy + 0.1, CEDAR.z + off[1] * 0.5 + 0.4], [CEDAR.x - off[0] * 0.5 + 0.6, gy + 0.1, CEDAR.z - off[1] * 0.5 + 0.4], c);
  }
  lathe(mdG, [[0, 0.12], [1.5, 0.1]], { seg: 8, x: CEDAR.x + 0.6, y: gy, z: CEDAR.z + 0.4, col: c });
  cedarGlow = mdMesh(mdG, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.3,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  }), false);
  cedarGlow.matrixAutoUpdate = false; cedarGlow.updateMatrix();
  cedarGlow.visible = false;
  scene.add(cedarGlow);
})();

<script>
/* ═══════════ p6b/3 — clusters, springs, pickups, chests ═══════════ */

/* ── shared small prop kit (baked into forest chunks) ── */
function fRock(x, z, s, tall) {
  const y = groundH(x, z) - 0.4;
  const h = tall ? 3.4 * s : 1.2 * s;
  flatheW([[1.0 * s, 0], [0.85 * s, h * 0.45], [0.6 * s, h * 0.82], [0.2 * s, h]],
    { seg: 6, ex: 0.7 + vnoise(x, z) * 0.2, x, y, z, ry: x * 0.7, segJitter: 0.1,
      col: C_FROCK, cols: [C_FROCK2, C_FROCK, C_FROCK] });
  addColl(x, z, 0.9 * s);
}
function fCrate(x, z, ry, s2) {
  s2 = s2 || 1;
  const y = groundH(x, z);
  fboxW({ x, y, z, w: 0.32 * s2, d: 0.32 * s2, h: 0.6 * s2, ry, col: C_WOOD, colB: C_WOOD2 });
  fboxW({ x, y: y + 0.28 * s2, z, w: 0.34 * s2, d: 0.05 * s2, h: 0.06 * s2, ry, col: C_WOOD2 });
  addColl(x, z, 0.45 * s2, y + 0.6 * s2);
}
function fStump(x, z, s) {
  const y = groundH(x, z) - 0.15;
  flatheW([[0.55 * s, 0], [0.48 * s, 0.55 * s], [0.52 * s, 0.6 * s]],

}

    { seg: 6, ex: 0.85, x, y, z, ry: x, segJitter: 0.14, col: C_FROCK, cols: [C_FROCK2, C_FROCK, C_FROCK2, C_FROCK] });
  addColl(x, z, 0.7);
}

/* ── the six shade springs — one merged mesh: seep pool, ferns, and the
   single LIVE green tree each one keeps alive ── */
(function buildSprings() {
  const md = MD();
  const WATER = col(0x3d7d86), WATER2 = col(0x5ba3a8), FERN = col(0x4e7a3c), FERN2 = col(0x3d6330);
  for (let si = 0; si < FSPRINGS.length; si++) {
    const s = FSPRINGS[si];
    const gy = groundH(s.x, s.z);
    // the seep pool: a low water disc in the dish
    const n = 10;
    for (let k = 0; k < n; k++) {
      const a0 = k / n * TAU, a1 = (k + 1) / n * TAU;
      const r = s.r * 0.52;
      const cc = k % 2 ? WATER : WATER2;
      md.p.push(s.x, gy + 0.1, s.z,
        s.x + Math.cos(a1) * r, gy + 0.1, s.z + Math.sin(a1) * r,
        s.x + Math.cos(a0) * r, gy + 0.1, s.z + Math.sin(a0) * r);
      md.c.push(cc[0], cc[1], cc[2], WATER[0], WATER[1], WATER[2], WATER[0], WATER[1], WATER[2]);
    }
    // seep stones
    for (let k = 0; k < 5; k++) {
      const a = k * 1.31 + si;
      const rx = s.x + Math.cos(a) * s.r * 0.62, rz = s.z + Math.sin(a) * s.r * 0.62;
      latheW(md, [[0.4, -0.1], [0.3, 0.25], [0, 0.4]], { seg: 5, x: rx, y: groundH(rx, rz), z: rz, ry: a * 2, col: k % 2 ? C_FROCK : C_FROCK2 });
    }
    // ferns: little green blade fans
    for (let k = 0; k < 7; k++) {
      const a = k * 0.93 + si * 2;
      const fx = s.x + Math.cos(a) * s.r * (0.68 + hash2(k, si) * 0.15);
      const fz = s.z + Math.sin(a) * s.r * (0.68 + hash2(k + 3, si) * 0.15);
      const fy = groundH(fx, fz);
      for (let b = 0; b < 3; b++) {
        boxW(md, { x: fx, y: fy, z: fz, w: 0.05, d: 0.02, h: 0.55 + hash2(b, k) * 0.15, tw: 0.01, td: 0.01, rx: 0.5 + b * 0.25, ry: a + b * 2.1, col: b % 2 ? FERN : FERN2 });
      }

    // THE LIVE TREE — the one point of green canopy in the whole region
    const ta = si * 1.1 + 0.6;
    const tx = s.x + Math.cos(ta) * s.r * 0.85, tz = s.z + Math.sin(ta) * s.r * 0.85;
    const ty = groundH(tx, tz) - 0.2;
    boxW(md, { x: tx, y: ty, z: tz, w: 0.3, d: 0.3, h: 3.4, tw: 0.18, td: 0.18, noBottom: true, warm: true, col: mix3(C_TRUNK2, [0, 0, 0], 0.15) });
    latheW(md, [[2.5, 2.6], [1.5, 4.6], [0, 6.2]], { seg: 6, ex: 0.95, x: tx, y: ty, z: tz, warm: true, col: FERN, cols: [FERN2, FERN] });
    latheW(md, [[1.7, 4.4], [0, 6.9]], { seg: 5, ex: 0.95, x: tx, y: ty, z: tz, ry: 0.5, warm: true, col: mix3(FERN, [1, 1, 0.7], 0.15) });
    addColl(tx, tz, 0.55);
  }
  const m = mdMesh(md, WORLD_MAT, false);
  m.matrixAutoUpdate = false; m.updateMatrix();
  m.visible = false;
  scene.add(m);
  window.__springsMesh = m;
})();

/* ── CINDER PASS CAMP (abandoned) + the one signpost ── */
const SIGNPOST = { x: 205, z: 46 };
(function buildCamp() {
  const c = FCLUSTERS[0];
  const gy = groundH(c.x, c.z);
  // cold firepit
  flatheW([[0.8, -0.05], [0.9, 0.12], [0.75, 0.2]], { seg: 8, x: c.x, y: gy, z: c.z, col: C_FROCK2 });
  flatheW([[0.35, 0], [0.4, 0.1], [0.1, 0.16]], { seg: 6, x: c.x, y: gy + 0.05, z: c.z, col: [0.2, 0.19, 0.18] });
  // two bedrolls, left in a hurry
  fboxW({ x: c.x - 2.6, y: gy, z: c.z + 1.4, w: 0.45, d: 1.0, h: 0.18, ry: 0.4, col: col(0x8a9bab), colB: C_WOOD2 });
  fboxW({ x: c.x + 2.2, y: gy, z: c.z + 2.0, w: 0.45, d: 1.0, h: 0.18, ry: -0.6, col: col(0xad6a5c), colB: C_WOOD2 });
  fCrate(c.x + 3.1, c.z - 1.8, 0.5); fCrate(c.x + 3.8, c.z - 1.2, 1.1, 0.8);
  // the leaning rock that shades the camp (in FSHADE)
  fRock(250, 70, 1.6, true);
  // a dead cart — they left with less than they came with
  fboxW({ x: c.x - 4.2, y: gy + 0.4, z: c.z - 2.5, w: 0.55, d: 0.85, h: 0.3, ry: 0.9, col: C_WOOD, colB: C_WOOD2 });

    box(mdG, { x: s * 0.3, y: -0.1, z: -0.4, w: 0.02, d: 0.26, h: 0.05, rx: -0.2, col: ember });
    box(mdG, { x: s * 0.34, y: -0.42, z: -0.15, w: 0.016, d: 0.2, h: 0.045, rx: 0.05, col: emberHi });
    box(mdG, { x: s * 0.1, y: 0.14, z: -0.75, w: 0.014, d: 0.14, h: 0.04, rx: -0.4, col: ember });              // haunch embers
  }
  box(mdG, { x: 0, y: -0.2, z: 0.85, w: 0.03, d: 0.012, h: 0.03, col: emberHi });                               // nostril coal
  const glow = mdMesh(mdG, new THREE.MeshBasicMaterial({

  }), false);

}

/* ── EMBER HORNET — fast imp-family fliers, dive in pairs ── */
function buildEmberHornet() {
  const root = new THREE.Group();
  const body = node(root, 0, 0, 0);
  const amber = [1.0, 0.62, 0.16], charC = [0.22, 0.14, 0.1], eyeC = [0.1, 0.05, 0.04];
  const md = MD();
  // head + big dark eyes
  lathe(md, [[0, -0.02], [0.07, 0.03], [0.05, 0.1], [0, 0.12]], { seg: 6, x: 0, y: 0, z: 0.16, col: charC });
  for (const s of [-1, 1]) {
    box(md, { x: s * 0.05, y: 0.03, z: 0.2, w: 0.028, d: 0.02, h: 0.05, ry: s * 0.4, col: eyeC });
  }
  // thorax
  lathe(md, [[0, -0.05], [0.09, 0.02], [0.08, 0.12], [0, 0.16]], { seg: 6, col: amber });
  // banded abdomen sweeping back-down + stinger
  const segs = [[0.085, amber], [0.09, charC], [0.075, amber], [0.05, charC]];
  let az = -0.1, ay = -0.02;
  for (let i = 0; i < segs.length; i++) {
    box(md, { x: 0, y: ay, z: az, w: segs[i][0], d: 0.09, h: 0.11, tw: segs[i][0] * 0.8, td: 0.07, rx: 2.05, col: segs[i][1] });
    az -= 0.09; ay -= 0.045;
  }
  box(md, { x: 0, y: ay + 0.02, z: az + 0.02, w: 0.02, d: 0.02, h: 0.1, tw: 0.002, td: 0.002, rx: 2.5, col: eyeC });
  // dangling legs
  for (const s of [-1, 1]) {
    box(md, { x: s * 0.06, y: -0.1, z: 0.06, w: 0.01, d: 0.01, h: 0.09, rx: 0.6, rz: s * 0.5, col: charC });
    box(md, { x: s * 0.07, y: -0.1, z: -0.01, w: 0.01, d: 0.01, h: 0.08, rx: 0.9, rz: s * 0.6, col: charC });
  }
  const torso = mdMesh(md, new THREE.MeshBasicMaterial({ vertexColors: true }));
  torso.frustumCulled = false;
  body.add(torso);
  // two big wing pairs — the blur that reads "hornet" at distance
  const mdW = MD();
  const wingC = [1.0, 0.85, 0.6], wingC2 = [0.9, 0.95, 1.0];
  for (const s of [-1, 1]) {
    pushQuad(mdW, [s * 0.05, 0.12, 0.06], [s * 0.42, 0.2, -0.04], [s * 0.48, 0.16, -0.14], [s * 0.07, 0.08, -0.03], wingC2);
    pushQuad(mdW, [s * 0.05, 0.1, -0.02], [s * 0.34, 0.14, -0.16], [s * 0.38, 0.1, -0.24], [s * 0.06, 0.05, -0.07], wingC);
  }
  const wings = mdMesh(mdW, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.42,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  }), false);
  wings.frustumCulled = false;
  body.add(wings);
  const shadow = blobShadow(0.17);
  root.add(shadow);
  return { root, body, torso, wings, shadow };
}

/* ── MOB POCKETS IN THE TREES (John, 8/16) ──────────────────────────────
   The forest's two safety systems become a real TRADE. The Silverrun
   riverbed is the road, and the road is SUN; the trees are shade, and
   shade was free. Now the canopy holds pockets of hostiles, so taking
   the safe route costs you a fight and taking the fast route costs you
   hearts. Zelda-sparse on purpose — six pockets across 2km, never a wall
   of enemies. Every spot is >100m off the riverbed, clear of every
   FCLUSTER and spring, and under real canopy. */
(function placeMobPockets() {
  /* canopy shade here is per-tree and only a few metres across, so a fixed
     spawn offset lands most of a pocket back out in the sun — which would
     mean fighting AND burning, and that is not the trade. Snap each spawn to
     the nearest genuinely shaded spot instead. */
  const snapTo = (x, z, wantShade) => {
    if (inShadeAt(x, z) === wantShade) return [x, z];
    for (let r = 1.5; r <= 9; r += 1.5) {
      for (let i = 0; i < 12; i++) {
        const a = i * TAU / 12;
        const sx = x + Math.cos(a) * r, sz = z + Math.sin(a) * r;
        if (inShadeAt(sx, sz) === wantShade) return [sx, sz];
      }
    }
    return [x, z];
  };
  /* WHO GOES WHERE, and why it is not interchangeable: hornets are the imp
     family and SHADE FIZZLES THEM (tickHornet pops any non-hollow hornet
     standing in shade). Snapping them into the canopy killed all twelve at
     spawn — the same failure that once made the King-Crab's phase-3 adds
     vanish. So the shady tree pockets are BOARS, and the hornet pockets sit
     in off-road SUN. The trade still holds and gets richer: duck into the
     trees and beasts are waiting; cut across open ground and it is hornets
     plus the swelter. */
  /* each centre verified in canopy shade (inShadeAt true), >90m off the
     riverbed, clear of every cluster and spring */
  const BOAR_POCKETS = [[378, 296], [1088, 326], [1438, 784]];
  const HORNET_POCKETS = [[760, 182], [882, 864], [1700, 1226]];
  for (const [cx, cz] of BOAR_POCKETS) {
    for (const [ox, oz] of [[-3.5, -2], [3.5, 2.5], [0, 4.5]]) {
      const [x, z] = snapTo(cx + ox, cz + oz, true);    // boars: canopy shade
      const b = {
        c: buildCinderBoar(), sx: x, sz: z, x, z,
        hp: 3, st: 'graze', t: Math.random() * 3, ang: Math.random() * TAU,
        dir: [0, 1], dead: false, cured: false, flash: 0, cd: 0,
        area: areaOfForest(x),
      };
      b.c.root.position.set(b.x, groundH(b.x, b.z), b.z);
      scene.add(b.c.root);
      BOARS.push(b);
    }
  }
  let pairSeed = 10;
  for (const [cx, cz] of HORNET_POCKETS) {
    const pair = pairSeed++;
    for (const [ox, oz] of [[-2.5, -1.5], [2, 2], [3.5, -2.5], [-1.5, 3.5]]) {
      const [x, z] = snapTo(cx + ox, cz + oz, false);   // hornets: open sun
      const h = {
        m: buildEmberHornet(), sx: x, sz: z, x, z, y: groundH(x, z) + 2.2, face: 0,
        st: 'drift', t: Math.random() * 2, dir: [0, 0, 0], dead: false, pair,
        area: areaOfForest(x),
      };
      h.m.root.position.set(h.x, h.y, h.z);
      scene.add(h.m.root);
      HORNETS.push(h);
    }
  }
})();

/* ── boar brain ── */
let boarsCured = 0, boarChargesDodged = 0;
function tickBoarF(b) {
  if (b.dead) return;
  b.t += DT;
  if (b.flash > 0) b.flash -= DT;
  if (b.cd > 0) b.cd -= DT;
  const gy = groundH(b.x, b.z);
  const d2p = Math.hypot(P.x - b.x, P.z - b.z);
  const faceP = () => { b.ang = angLerp(b.ang, Math.atan2(P.x - b.x, P.z - b.z), 0.08); };
  if (b.st === 'leave') {
    // cured: it shakes off the madness and trots away. nothing dies here either.
    b.x += Math.sin(b.ang) * 3.4 * DT; b.z += Math.cos(b.ang) * 3.4 * DT;
    const c = collide(b.x, b.z, 0.7);
    const r = resolveSolid(b.x, b.z, c[0], c[1]);
    b.x = r[0]; b.z = r[1];
    if (b.t > 6) { b.dead = true; b.c.root.visible = false; }
    return;
  }
  if (b.st === 'graze') {
    const a = Math.sin(b.t * 0.4 + b.sx) * 2.4;
    moveBoar(b, b.sx + Math.cos(a) * 4, b.sz + Math.sin(a * 1.2) * 4, 0.8);
    if (d2p < 15 && P.x > 130) { b.st = 'alert'; b.t = 0; SFX.huff(); }
  } else if (b.st === 'alert') {
    faceP();
    if (d2p > 21) { b.st = 'graze'; b.t = 0; }
    else if (b.t > 0.55 && b.cd <= 0 && d2p < 17) { b.st = 'paw'; b.t = 0; SFX.huff(); }
  } else if (b.st === 'paw') {
    // THE TELEGRAPH: head down, forehoof scraping, ember smoke huffing
    faceP();
    if ((simTick % 9) === 0) {
      const hx = b.x + Math.sin(b.ang) * 1.0, hz = b.z + Math.cos(b.ang) * 1.0;
      burst(psDust, hx, gy + 0.35, hz, 3, 1.1, 0.9, 0.5);
      psSpark.spawn(hx, gy + 0.5, hz, (Math.random() - 0.5), 0.8, (Math.random() - 0.5), 0.4);
    }
    if (b.t > 1.05) {
      b.st = 'charge'; b.t = 0;
      const d = d2p || 1;
      b.dir = [(P.x - b.x) / d, (P.z - b.z) / d];
      b.ang = Math.atan2(b.dir[0], b.dir[1]);
      b.hitDone = false;
      SFX.boarGo();
      rumble({ duration: 200, strong: 0.4, weak: 0.6 });
    }
  } else if (b.st === 'charge') {
    // a straight locked rush — jump it, sidestep it, or eat 2 hearts
    const hx = b.x + Math.sin(b.ang) * 1.05, hz = b.z + Math.cos(b.ang) * 1.05;
    if (treeTrunkAt(hx, hz, 0.55) || chargeProp(hx, hz) || window.__forestSolid(hx, hz)) {
      // CRASH — tree wins. dizzy and vulnerable (kid-discoverable)
      b.st = 'stun'; b.t = 0;
      SFX.thump(true);
      if (d2p < 26) CAM.shake = Math.max(CAM.shake, 0.24);
      burst(psDust, hx, gy + 0.6, hz, 18, 2.4, 1.8, 0.8);
      burst(psSpark, hx, gy + 1.0, hz, 8, 1.8, 1.4, 0.5);
      rumble({ duration: 260, strong: 0.7, weak: 0.5 });
      return;
    }
    b.x += b.dir[0] * 9.6 * DT; b.z += b.dir[1] * 9.6 * DT;
    if ((simTick % 4) === 0) psDust.spawn(b.x, gy + 0.2, b.z, -b.dir[0] * 1.4, 0.8, -b.dir[1] * 1.4, 0.5);
    if (!b.hitDone && Math.hypot(P.x - b.x, P.z - b.z) < 1.3) {
      if (P.fy - groundH(P.x, P.z) < 0.7) {
        b.hitDone = true;
        hurtPlayer(2, b.x - b.dir[0], b.z - b.dir[1], b.c.root);   // 2 HEARTS — it hits hard
      } else if (!b.jumpCredit) {
        b.jumpCredit = true;                              // sailed clean over the rush
        boarChargesDodged++;
      }
    }
    if (b.t > 2.0) { b.st = 'skid'; b.t = 0; }
  } else if (b.st === 'skid') {
    b.x += b.dir[0] * (2.4 - b.t * 3) * DT; b.z += b.dir[1] * (2.4 - b.t * 3) * DT;
    if (b.t > 0.7) { b.st = 'alert'; b.t = 0; b.cd = 1.1; b.jumpCredit = false; }
  } else if (b.st === 'stun') {
    if (b.t > 2.6) { b.st = 'alert'; b.t = 0; b.cd = 0.8; b.jumpCredit = false; }
  } else if (b.st === 'stagger') {
    b.x += b.dir[0] * 3.5 * DT; b.z += b.dir[1] * 3.5 * DT;
    if (b.t > 0.35) { b.st = 'alert'; b.t = 0; }
  }
  // soft push so it never overlaps a standing player
  if (d2p < 1.5 && b.st !== 'charge') {
    const d = d2p || 1;
    b.x -= (P.x - b.x) / d * 1.4 * DT; b.z -= (P.z - b.z) / d * 1.4 * DT;
  }
}
function moveBoar(b, tx, tz, sp) {
  const dx = tx - b.x, dz = tz - b.z, d = Math.hypot(dx, dz);
  if (d > 0.5) {
    const c = collide(b.x + dx / d * sp * DT, b.z + dz / d * sp * DT, 0.6);
    const r = resolveSolid(b.x, b.z, c[0], c[1]);
    b.x = r[0]; b.z = r[1];
    b.ang = angLerp(b.ang, Math.atan2(dx, dz), 0.06);
  }
}
function chargeProp(x, z) {
  for (let i = 0; i < COLL.length; i++) {
    const c = COLL[i];
    if (c.off || c.r < 0.4) continue;
    if (c.top !== undefined && c.top - groundH(c.x, c.z) < 0.9) continue;   // low steps don't stop a boar
    const dx = x - c.x, dz = z - c.z;
    if (dx * dx + dz * dz < (c.r + 0.4) * (c.r + 0.4)) return true;
  }
  return false;
}
function hitBoar(b) {
  b.hp--;
  b.flash = 0.22;
  SFX.hit();
  P.hitstop = 4;
  rumble({ duration: 90, strong: 0.55, weak: 0.35 });
  const gy = groundH(b.x, b.z);
  burst(psSpark, b.x, gy + 0.7, b.z, 15, 2.3, 1.8, 0.45);
  const d = Math.hypot(b.x - P.x, b.z - P.z) || 1;
  b.dir = [(b.x - P.x) / d, (b.z - P.z) / d];
  if (b.hp <= 0) {
    // CURED — the madness lifts. it shakes, dims, and trots home to the trees.
    b.cured = true;
    boarsCured++;
    b.st = 'leave'; b.t = 0;
    b.ang = Math.atan2(b.dir[0], b.dir[1]);
    b.c.glow.visible = false;
    b.c.mat.color.setRGB(0.78, 0.72, 0.66);        // the char cools to plain hide
    SFX.chime(0.6);
    burst(psSparkle, b.x, gy + 0.9, b.z, 16, 1.4, 1.4, 1.0);
    rumble({ duration: 200, strong: 0.3, weak: 0.5 });
  } else if (b.st !== 'charge') {
    b.st = 'stagger'; b.t = 0;
  }
}

/* ── hornet brain: paired divers ── */
let hornetsPopped = 0;
function tickHornet(h) {
  if (h.dead) return;
  h.t += DT;
  const gy = groundH(h.x, h.z);
  // imp family: shade fizzles them — except the FALLS HOLLOW nests, whose
  // own ember glow sustains them in the dark (the boss-arena imp precedent)
  if (h.area !== 'hollow' && inShadeAt(h.x, h.z) && h.st !== 'pop') { popHornet(h); return; }
  const d2p = Math.hypot(P.x - h.x, P.z - h.z);
  const faceP = () => { h.face = Math.atan2(P.x - h.x, P.z - h.z); };
  if (h.st === 'drift') {
    h.y = gy + 1.85 + Math.sin(h.t * 3.1 + h.sx) * 0.25;
    const dHome = Math.hypot(h.x - h.sx, h.z - h.sz);
    if (dHome > 24) {
      h.x += (h.sx - h.x) / dHome * 3.2 * DT;
      h.z += (h.sz - h.z) / dHome * 3.2 * DT;
      return;
    }
    if (d2p > 1.5 && d2p < 19) {
      const d = d2p || 1;
      h.x += (P.x - h.x) / d * 2.1 * DT;
      h.z += (P.z - h.z) / d * 2.1 * DT;
      faceP();
    }
    if (d2p < 6.5) {
      h.st = 'tele'; h.t = 0; SFX.buzz();
      // THE PAIR: its partner rears up with it and they dive together
      for (const o of HORNETS) {
        if (o !== h && !o.dead && o.pair === h.pair && o.st === 'drift') { o.st = 'tele'; o.t = -0.12; }
      }
    }
  } else if (h.st === 'tele') {
    faceP();
    h.y = gy + 2.2 + Math.sin(h.t * 22) * 0.07;
    if (h.t > 0.38) {
      h.st = 'dive'; h.t = 0;
      const ty = groundH(P.x, P.z) + 0.8;
      const dx = P.x - h.x, dy = ty - h.y, dz = P.z - h.z;
      const l = Math.hypot(dx, dy, dz) || 1;
      h.dir = [dx / l * 11.5, dy / l * 11.5, dz / l * 11.5];
      SFX.pop();
    }
  } else if (h.st === 'dive') {
    h.x += h.dir[0] * DT; h.y += h.dir[1] * DT; h.z += h.dir[2] * DT;
    if (Math.hypot(P.x - h.x, P.z - h.z) < 0.85 && Math.abs(h.y - (groundH(P.x, P.z) + 1.0)) < 1.0) {
      hurtPlayer(1, h.x, h.z, h.m.root);
      h.st = 'drift'; h.t = 0;
    }
    if (h.y < gy + 0.25 || h.t > 0.9) { h.st = 'drift'; h.t = 0; }
  }
}
function popHornet(h) {
  h.dead = true;
  hornetsPopped++;
  impPops.push({ m: h.m, t: 0 });
  burst(psSpark, h.x, h.y, h.z, 16, 2.0, 1.0, 0.7);
  burst(psSparkle, h.x, h.y, h.z, 10, 1.4, 0.7, 0.8);
  SFX.pop();
  rumble({ duration: 60, strong: 0.25, weak: 0.35 });

  if (sig !== _iconSig) {
    _iconSig = sig;
    sunstatCv.style.left = (26 + 8 + P.maxHearts * 34) + 'px';
    drawSunStat(mode, fill, leafA);
  }
  window.__swIconMode = mode; window.__swIconFill = fill;
}
function drawSunStat(mode, fill, leafA) {
  const g = sunstatCx;
  g.clearRect(0, 0, 46, 46);
  if (mode === 'off') return;
  g.save();
  g.translate(23, 23);
  if (mode === 'sun') {
    // rays + disc, dim → bright as the next tick approaches
    const glow = 0.35 + 0.65 * fill;
    g.strokeStyle = `rgba(255,${Math.round(190 - 60 * fill)},60,${0.5 + 0.5 * fill})`;
    g.lineWidth = 2.4;
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU + fill * 0.6;
      g.beginPath();
      g.moveTo(Math.cos(a) * 12, Math.sin(a) * 12);
      g.lineTo(Math.cos(a) * (15 + 3 * fill), Math.sin(a) * (15 + 3 * fill));
      g.stroke();
    }
    g.beginPath(); g.arc(0, 0, 9.5, 0, TAU);
    g.fillStyle = `rgba(80,50,20,0.55)`; g.fill();
    // the FILL: the disc floods amber bottom-up toward the tick
    g.beginPath(); g.arc(0, 0, 9.5, 0, TAU); g.clip();
    g.fillStyle = `rgba(255,${Math.round(200 - 80 * fill)},50,${glow})`;
    g.fillRect(-10, 9.5 - fill * 19, 20, fill * 19 + 0.5);
    g.restore(); g.save(); g.translate(23, 23);
    g.beginPath(); g.arc(0, 0, 9.5, 0, TAU);
    g.strokeStyle = 'rgba(60,30,10,0.9)'; g.lineWidth = 1.6; g.stroke();
  } else {
    // leaf: cool green, fading out — safety acknowledged
    g.globalAlpha = leafA;
    g.rotate(-0.5);
    g.fillStyle = '#69a35a';
    g.strokeStyle = 'rgba(30,60,28,0.9)';
    g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(0, 13);
    g.bezierCurveTo(-11, 4, -8, -9, 0, -13);
    g.bezierCurveTo(8, -9, 11, 4, 0, 13);
    g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(0, 11); g.lineTo(0, -10);
    g.strokeStyle = 'rgba(36,72,34,0.8)'; g.lineWidth = 1.2; g.stroke();
  }
  g.restore();
}

function animateForest(dtv, now, ccx, ccz) {
  const w = now / 1000;
  const near2 = (x, z, r) => { const dx = x - ccx, dz = z - ccz; return dx * dx + dz * dz < r * r; };
  // THE FIRE WARDEN — scanning the treeline, one hand shading her eyes
  const wv = near2(warden.x, warden.z, 42);
  warden.char.root.visible = wv;
  if (wv) {
    const dx = P.x - warden.x, dz = P.z - warden.z, d = Math.hypot(dx, dz);
    let look;
    if (d < 6) {
      let rel = Math.atan2(dx, dz) - warden.char.root.rotation.y;
      rel = ((rel % TAU) + TAU) % TAU; if (rel > Math.PI) rel -= TAU;
      look = clamp(rel, -0.85, 0.85);
    }
    poseHumanoid(warden.char, 'idle', dtv, 0, { lookAt: look, stoop: 0.08 });
    const c = warden.char;
    c.shR.rotation.x = -2.45 - Math.sin(c.anim.t * 0.7) * 0.05;
    c.shR.rotation.z = -0.3;
    c.elR.rotation.x = -1.85;
    c.shL.rotation.x = 0.18;
  }
  // CINDER BOARS
  for (const b of BOARS) {
    if (b.dead) { b.c.root.visible = false; continue; }
    const vis = near2(b.x, b.z, 46);
    b.c.root.visible = vis;
    if (!vis) continue;
    const gy = groundH(b.x, b.z);
    b.c.root.position.set(b.x, gy, b.z);
    b.c.root.rotation.y = b.ang;
    const moving = b.st === 'charge' || b.st === 'leave' || b.st === 'graze' || b.st === 'stagger';
    const rate = b.st === 'charge' ? 30 : b.st === 'leave' ? 16 : 7;
    b.c.legsM.rotation.x = moving ? Math.sin(w * rate + b.sx) * 0.22 : 0;
    if (b.st === 'paw') {
      b.c.body.rotation.x = 0.09 + Math.sin(w * 26) * 0.02;       // head dipped, hoof scraping
      b.c.body.position.y = 0.58;
    } else if (b.st === 'charge') {
      b.c.body.rotation.x = -0.06;
      b.c.body.position.y = 0.62 + Math.abs(Math.sin(w * 22)) * 0.05;
    } else if (b.st === 'stun') {
      b.c.body.rotation.z = Math.sin(w * 7) * 0.14;
      b.c.body.rotation.x = -0.08;
      b.c.body.position.y = 0.56;
    } else {
      b.c.body.rotation.x *= 0.86;
      b.c.body.rotation.z *= 0.86;
      b.c.body.position.y = 0.62 + (b.st === 'graze' ? Math.sin(w * 1.1 + b.sx) * 0.02 : 0);
    }
    b.c.flashM.visible = b.flash > 0;
    if (b.flash > 0) b.c.flashM.material.opacity = 0.4 + Math.sin(now / 24) * 0.3;
    if (b.c.glow.visible) b.c.glow.material.opacity = 0.65 + Math.sin(now / 110 + b.sx) * 0.25;
  }
  // EMBER HORNETS
  for (const h of HORNETS) {
    if (h.dead) continue;
    const vis = near2(h.x, h.z, 42);
    h.m.root.visible = vis;
    if (!vis) continue;
    h.m.root.position.set(h.x, h.y, h.z);
    h.m.root.rotation.y = h.face || 0;
    /* v8.1 draw-call hygiene: the ground blob is a DODGING cue — it only has
       to exist while the dive is readable. Past 22 m it is a couple of pixels
       under a bug you cannot fight yet, and the falls hollow parks four
       hornets in one vista (4 extra calls for nothing). */
    h.m.shadow.visible = near2(h.x, h.z, 22);
    h.m.shadow.position.y = groundH(h.x, h.z) - h.y + 0.04;
    h.m.wings.rotation.x = -0.05 + Math.sin(now / 1000 * 95 + h.sx) * 0.5;
    if (h.st === 'tele') {
      h.m.body.rotation.x = -0.6 - Math.sin(w * 24) * 0.06;
      h.m.torso.material.color.setRGB(1.4, 1.2, 1.0);
    } else if (h.st === 'dive') {
      h.m.body.rotation.x = 0.9;
      h.m.torso.material.color.setRGB(1.25, 1.1, 1.0);
    } else {
      h.m.body.rotation.x = 0.1 + Math.sin(w * 3 + h.sx) * 0.08;
      h.m.torso.material.color.setRGB(1, 1, 1);
    }
    if (!LOWFX && Math.random() < 0.08) {
      psSpark.spawn(h.x, h.y - 0.12, h.z, (Math.random() - 0.5) * 0.4, -0.5, (Math.random() - 0.5) * 0.4, 0.4);
    }
  }
  // forest salt sparkle
  for (const s of fSalt) {
    if (s.got) { s.mesh.visible = false; continue; }
    const sv = near2(s.x, s.z, 36);
    s.mesh.visible = sv;
    if (sv) {
      s.mesh.position.y = s.baseY + 0.15 + Math.sin(now / 420 + s.ph * 4) * 0.09;
      s.mesh.rotation.y += dtv * 1.7;
      if (!LOWFX && Math.random() < 0.05) {
        psSparkle.spawn(s.x + (Math.random() - 0.5) * 0.5, s.mesh.position.y + 0.25 + Math.random() * 0.35,
          s.z + (Math.random() - 0.5) * 0.5, 0, 0.45, 0, 0.7);
      }
    }
  }
  // the cedar's light shaft breathes
  if (cedarGlow.visible) cedarGlow.material.opacity = 0.26 + Math.sin(now / 700) * 0.05;
}

/* ── telemetry (__fm gains the region) ── */
function syncForestTelemetry() {
  const T = window.__fm;
  if (!T) return;
  T.region = regionNow;
  T.swelterOn = regionNow === 'forest' && P.x > 320 && !P.shade && state === 'play';
  T.swelterT = swelterT / 60;
  T.springIdx = springNear;
  T.lastSpring = lastSpringIdx;
  T.springsSaved = springsSaved;
  T.forestShade = inForestQ(P.x, P.z) ? forestShadeAt(P.x, P.z) : false;
  T.boarsAlive = BOARS.filter(b => !b.dead && !b.cured).length;
  T.boarsCured = boarsCured;
  T.boarDodges = boarChargesDodged;
  let bd = 999, bx = 0, bz = 0, bst = '';
  for (const b of BOARS) {
    if (b.dead || b.cured) continue;
    const d = Math.hypot(P.x - b.x, P.z - b.z);
    if (d < bd) { bd = d; bx = b.x; bz = b.z; bst = b.st; }
  }
  T.nearBoarDist = bd; T.nearBoarX = bx; T.nearBoarZ = bz; T.nearBoarState = bst;
  T.hornetsAlive = HORNETS.filter(h => !h.dead).length;
  T.hornetsPopped = hornetsPopped;
  let hd = 999, hx = 0, hz = 0;
  for (const h of HORNETS) {
    if (h.dead) continue;
    const d = Math.hypot(P.x - h.x, P.z - h.z);
    if (d < hd) { hd = d; hx = h.x; hz = h.z; }
  }
  T.nearHornetDist = hd; T.nearHornetX = hx; T.nearHornetZ = hz;
  T.fMillChest = millChest.opened; T.fFerryChest = ferryChest.opened;
  T.fGrottoChest = fgrottoChest.opened; T.cedarHeartT = cedarChest.opened;
  T.wardenTalked = SAVE ? (SAVE.wardenTalked || 0) : 0;
  T.fallsHum = SAVE ? !!SAVE.fallsHum : false;
  T.humNear = Math.hypot(P.x - HUM_SPOT.x, P.z - HUM_SPOT.z) < 13;
  T.fSaltGot = fSalt.filter(s => s.got).length;
  T.fExtentW = FOREST_EXTENT.w; T.fExtentH = FOREST_EXTENT.h;
  T.riverLen = RIVER_LEN;
  T.fSolidHere = window.__forestSolid(P.x, P.z);
  T.onTowerDeck = Math.hypot(P.x - TOWER.x, P.z - TOWER.z) < 6 &&
    P.fy > groundH(TOWER.x, TOWER.z) + 13;
  T.saveRegion = SAVE ? (SAVE.region || 'bay') : 'bay';
  /* v7 gates: swelter feedback package + damage-visibility invariant */
  T.swVign = swVignA;
  T.swVignOn = sunveilEl.classList.contains('on');
  T.swAudio = (typeof szGain !== 'undefined' && szGain) ? szGain.gain.value : 0;
  T.swAudioLevel = window.__swAudioLevel || 0;
  T.swGlyphT = swGlyphT;
  T.swTicks = swTickCount;
  T.swLineCount = swLineCount;
  T.swLineIdx = swLineIdx;
  T.swReliefs = swReliefCount;
  T.swReliefT = swReliefT;
  T.swIconMode = window.__swIconMode || 'off';
  T.swIconFill = window.__swIconFill || 0;
  T.swWilt = !!window.__swWilt;
  T.lastRumble = window.__lastRumble ? window.__lastRumble.tag : null;
  T.dmgSuppressed = dmgSuppressed;
  T.lastDmgVis = lastDmgCheck.vis; T.lastDmgFrus = lastDmgCheck.frus;
  T.farVisCount = 0;
  for (let i = 0; i < farTiles.length; i++) if (farTiles[i].mesh.visible) T.farVisCount++;
}

/* ── debug additions (installed on the first frame after p7 boots) ── */
let swWipePh = -1, swWipeNext = 0;   // Wick's brow-wipe scheduling (render time)
function extendDebugOnce() {
  if (dbgDone || !window.__fmDebug || window.__fmDebug.overhead) { dbgDone = true; return; }
  dbgDone = true;
  /* swelter tick glyph: a small sun flashed over the just-lost heart —
     visually distinct from combat damage (glare flash, no glyph) */
  const _drawHearts = drawHearts;
  drawHearts = function () {
    if (swGlyphT > 0) hudLastHearts = -1;      // live redraw beneath the flash
    _drawHearts();
    if (swGlyphT > 0) {
      const g = heartsCx;
      const x = 24 + Math.min(P.hearts, P.maxHearts - 1) * 34, y = 22;
      const a = clamp(swGlyphT / 1.15, 0, 1);
      const pulse = 0.65 + 0.35 * Math.sin(swGlyphT * 18);
      g.save();
      g.globalAlpha = a * pulse;
      g.strokeStyle = '#ffb632'; g.lineWidth = 2.2;
      for (let i = 0; i < 8; i++) {
        const t = i / 8 * TAU;
        g.beginPath();
        g.moveTo(x + Math.cos(t) * 10, y + Math.sin(t) * 10);
        g.lineTo(x + Math.cos(t) * 14, y + Math.sin(t) * 14);
        g.stroke();
      }
      g.beginPath(); g.arc(x, y, 7.5, 0, TAU);
      g.fillStyle = '#ffcf5e'; g.fill();
      g.strokeStyle = '#8a4d10'; g.lineWidth = 1.5; g.stroke();
      g.restore();
    }
  };
  /* swelter wilt: Wick suffers visibly in open sun — light stoop always,
     a brow wipe on the idle every few seconds */
  const _animateWick = animateWick;
  animateWick = function (dtv, now) {
    _animateWick(dtv, now);
    const c = wick;
    const suffering = swelterExposed() && swelterT > 240 && !P.air && P.st !== 'atk' && P.st !== 'hit' && state === 'play';
    window.__swWilt = suffering;
    if (!suffering) { swWipePh = -1; return; }
    const k = clamp((swelterT - 240) / 700, 0, 1);
    c.torso.rotation.x += 0.07 * k;            // wilting under the weight
    c.head.rotation.x += 0.06 * k;
    c.shL.rotation.z += 0.05 * k; c.shR.rotation.z -= 0.05 * k;
    if (P.st === 'idle') {
      if (swWipePh < 0 && now > swWipeNext) swWipePh = 0;
      if (swWipePh >= 0) {
        swWipePh += dtv / 1.5;                 // a 1.5 s brow wipe
        if (swWipePh >= 1) { swWipePh = -1; swWipeNext = now + 4200 + Math.random() * 2400; }
        else {
          const e = Math.sin(Math.PI * clamp(swWipePh, 0, 1));   // up and back down
          c.shR.rotation.x = c.shR.rotation.x * (1 - e) + (-2.1) * e;
          c.shR.rotation.z = c.shR.rotation.z * (1 - e) + (-0.28) * e;
          c.elR.rotation.x = c.elR.rotation.x * (1 - e) + (-2.3) * e;
          c.head.rotation.x += 0.1 * e;        // ducks into the wipe
          c.head.rotation.z += 0.05 * e;
        }
      }
    } else swWipePh = -1;
    window.__swWipePh = swWipePh;
  };
  Object.assign(window.__fmDebug, {
    /* layout-review overhead: reveal everything, kill fog and sky */
    overhead(on) {
      FDBG.reveal = FDBG.overhead = !!on;
      skyDome.visible = !on;
      sunDisc.visible = !on;
      if (starMesh) starMesh.visible = !on && starOp > 0.01;
      if (!on) { scene.fog.near = FOG0.near; scene.fog.far = FOG0.far; }
    },
    /* sightline audit: from a vantage, how many content clusters can be seen? */
    sightline(vx, vz) {
      const eyeY = groundH(vx, vz) + 1.7;
      const out = { total: 0, vis: 0, ids: [] };
      for (const c of FCLUSTERS) {
        if (Math.hypot(c.x - vx, c.z - vz) < 25) continue;
        out.total++;
        const ty = groundH(c.x, c.z) + 2.5;
        const dist = Math.hypot(c.x - vx, c.z - vz);
        if (dist > 1200) continue;                     // lost to the haze
        let clear = true;
        const steps = Math.ceil(dist / 7);
        for (let s = 1; s < steps; s++) {
          const t = s / steps;
          const sx = vx + (c.x - vx) * t, sz = vz + (c.z - vz) * t;
          const ly = eyeY + (ty - eyeY) * t;
          if (groundH(sx, sz) > ly + 0.4) { clear = false; break; }
          // canopy occlusion: a live pine straddling the ray blocks it
          if (t > 0.06 && t < 0.94 && inForestQ(sx, sz) &&
              eachTreeNear(sx, sz, tr => !tr.bare &&
                Math.hypot(sx - tr.x, sz - tr.z) < tr.cr + 2.2 &&
                forestH(tr.x, tr.z) + tr.h > ly + 1.2)) { clear = false; break; }
        }
        if (clear) { out.vis++; out.ids.push(c.id); }
      }
      return out;
    },
    forestInfo() {
      return { extent: FOREST_EXTENT, riverLen: Math.round(RIVER_LEN), clusters: FCLUSTERS.length, springs: FSPRINGS.length };
    },
    warpSpring(i) {
      const s = FSPRINGS[clamp(i, 0, FSPRINGS.length - 1)];
      window.__fmDebug.warp(s.x, s.z);
    },
  });
}

/* ── finalize every forest chunk (Brightharbor's were finalized in p4) ── */
for (const c of chunks) {
  if (!c.md || c.mesh) continue;
  if (!c.md.p.length) { c.md = null; continue; }
  c.mesh = mdMesh(c.md, WORLD_MAT, false);
  c.mesh.matrixAutoUpdate = false; c.mesh.updateMatrix();
  c.mesh.visible = false;
  scene.add(c.mesh);
  c.md = null;
}
